carry as many people as aircraft and that, without financial support from governments, many routes would struggle to cover their costs. Supporters reply that aviation has itself enjoyed favourable treatment for decades, for example through fuel that in many places is taxed lightly or not at all. What seems clear is that, for a growing number of travellers, the slower journey has become part of the appeal. As one passenger waiting on the Esterholm platform put it, 'I give up a little speed, but I gain a whole day.'"}],"groups":[{"type":"matching_info","instructions":"The reading passage has seven paragraphs, A-G. Which paragraph contains the following information? Write the correct letter, A-G. You may use any letter more than once.","options":[{"key":"A","text":"Paragraph A"},{"key":"B","text":"Paragraph B"},{"key":"C","text":"Paragraph C"},{"key":"D","text":"Paragraph D"},{"key":"E","text":"Paragraph E"},{"key":"F","text":"Paragraph F"},{"key":"G","text":"Paragraph G"}],"questions":[{"n":1,"prompt":"an explanation of why flying short distances is especially inefficient","answer":"C","explanation":"Paragraph C says that a large proportion of an aircraft's fuel is used during take-off and the climb, so 'flights covering short distances are particularly wasteful'. Paragraph B also mentions flights, but only their low price and speed."},{"n":2,"prompt":"a reference to a conflict over the use of railway lines at night","answer":"E","explanation":"Paragraph E explains that repair work on the lines is done at night, so 'maintenance engineers and sleeper operators are often competing for the same hours'."},{"n":3,"prompt":"a response to the claim that night trains depend on public money","answer":"G","explanation":"In paragraph G critics say many routes need financial support from governments, and supporters reply that aviation has also enjoyed favourable treatment, such as lightly taxed fuel."},{"n":4,"prompt":"a description of how a fall in quality led to a loss of passengers","answer":"B","explanation":"Paragraph B states that ageing carriages were not replaced, and 'as standards of comfort fell, so did passenger numbers'. This is a cause-and-effect link between quality and passenger numbers."}]},{"type":"tfng","instructions":"Do the following statements agree with the information given in the reading passage? Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this.","questions":[{"n":5,"prompt":"Sleeper services disappeared within a very short period of time.","answer":"FALSE","explanation":"Paragraph B opens with 'The decline of the sleeper was gradual rather than sudden', and then describes a process lasting from the 1990s into this century. This contradicts the idea of a very short period."},{"n":6,"prompt":"Having to employ crew for the entire night was one factor that made sleeper trains costly to operate.","answer":"TRUE","explanation":"Paragraph B says sleeper trains 'need staff on board throughout the night' and were therefore 'expensive to run'. 'Crew for the entire night' paraphrases 'staff on board throughout the night'."},{"n":7,"prompt":"Business travellers now make up the largest group of night-train passengers.","answer":"NOT GIVEN","explanation":"Paragraph D only says that business travellers 'in particular have begun to recognise' that a compartment can be used for work. The passage gives no information about what proportion of passengers they represent."},{"n":8,"prompt":"On certain routes, the fees for using the rail network represent a substantial share of the fare.","answer":"TRUE","explanation":"Paragraph E defines track-access charges as the fees for using the railway infrastructure and says that 'on some routes, these charges account for a considerable part of the ticket price'."},{"n":9,"prompt":"Buying a ticket for a night train that crosses several borders is usually a simple process.","answer":"FALSE","explanation":"Paragraph F calls booking 'a weak point' and says passengers frequently complain that such tickets require 'visiting more than one website'. This contradicts the statement."},{"n":10,"prompt":"Nordline's capsule compartments are more expensive than a place in a couchette.","answer":"NOT GIVEN","explanation":"Paragraph F compares the capsules' price only with a traditional cabin (they cost less) and compares them with a couchette only in terms of privacy. The price of a couchette is never mentioned, so we cannot know."}]},{"type":"gap","instructions":"Complete the notes below. Choose ONE WORD ONLY from the passage for each answer.","title":"Night trains: advantages and difficulties","wordLimit":"ONE WORD ONLY","questions":[{"n":11,"prompt":"Advantage: travellers save the cost of a night in a ____ and reach the city centre early in the day.","answer":["hotel"],"explanation":"Paragraph D: an evening flight passenger 'usually has to pay for a hotel', whereas a sleeper passenger 'arrives in the city centre at breakfast time'."},{"n":12,"prompt":"Difficulty: night-time track ____ reduces the hours available for sleeper services.","answer":["maintenance","repair","repairs"],"explanation":"Paragraph E explains that repair work is done at night, so 'maintenance engineers and sleeper operators are often competing for the same hours'."},{"n":13,"prompt":"Response: some operators focus on food and service so that the journey feels like part of the ____ itself.","answer":["holiday"],"explanation":"Paragraph F: some operators have 'concentrated on food and service, presenting the journey as part of the holiday rather than simply a means of reaching it'."}]}]},{"id":"r06","title":"Designing for Everyone","level":2,"topic":"technology","placement":false,"paragraphs":[{"label":"A","text":"When Tomas Reyner, a web developer in the town of Lindqvist, broke his right wrist in a cycling accident, he expected a few inconvenient weeks. What he did not expect was to discover how many of the websites he used every day, including several he had helped to build, were difficult or impossible to operate without a mouse. 'I had always thought of accessibility as something for a small group of users,' he admits. 'Suddenly I was one of them.' His experience illustrates a point campaigners have long made: disability is not a fixed category affecting a separate minority, but something almost everyone encounters at some stage, whether permanently, temporarily or simply because of circumstances such as bright sunlight or a noisy room. As banking, healthcare and job applications move online, an inaccessible website is no longer a minor nuisance; it can shut people out of essential services."},{"label":"B","text":"Disabled people use a wide range of tools, known collectively as assistive technology, to interact with digital devices. Blind users and many people with low vision rely on screen readers, programs that convert the content of a page into synthesised speech or braille. Others enlarge the screen with magnification software, while people with limited movement may navigate using only a keyboard, a single switch or voice commands. Deaf users depend on captions and transcripts for audio and video content, and people with cognitive or learning disabilities may benefit from simple layouts, predictable navigation and plain language. None of these tools can work properly, however, unless the website or app has been built in a way that allows them to."},{"label":"C","text":"Many of the most common barriers result from small technical decisions. An image without a text description is invisible to a screen reader user, who will hear nothing at all or, worse, a meaningless file name. Pale grey text on a white background may look elegant on a designer's expensive monitor but be unreadable for someone with weak eyesight. Forms that can only be completed with a mouse exclude keyboard users entirely. Developers sometimes create custom buttons and menus from generic page elements because they are easier to style; to a sighted user these look identical to standard controls, but a screen reader cannot identify what they are or do. Each of these problems takes only minutes to prevent, yet together they can make a service unusable."},{"label":"D","text":"Why, then, are such barriers so widespread? Most specialists agree that the cause is rarely deliberate exclusion. One explanation is education: accessibility receives little attention on many design and computer science courses, so graduates often enter the industry without having learnt even the basics. Another is the way projects are organised. Accessibility is frequently treated as a final check, carried out just before launch, by which time fixing problems means rewriting work that has already been approved. Testing is also commonly done by people without disabilities, who may miss difficulties that would be obvious to a screen reader user. Automated checking tools help, but they can detect only certain kinds of fault; a program can confirm that an image has a description, for instance, but not whether that description is accurate."},{"label":"E","text":"Advocates of accessible design often point out that its benefits extend far beyond the people it was intended for. Captions, originally provided for deaf viewers, are now widely used by people watching videos on public transport or in shared offices where they cannot play sound. Clear, simple wording, which helps users with cognitive disabilities, also helps people reading in a second language and anyone using a service under stress. Strong colour contrast makes a screen easier to read outdoors, and a site that works well with a keyboard is often faster for experienced users. Designers sometimes call this the 'kerb-cut effect', after the lowered sections of pavement first designed for wheelchair users, which turned out to be just as useful for people pushing prams or pulling suitcases."},{"label":"F","text":"There are also financial and legal reasons to take accessibility seriously. In many countries public bodies are now required by law to make their websites accessible, and private companies have been taken to court by customers unable to use their services. Yet the strongest argument may be economic. A study by Quillmere Digital, a consultancy, compared projects in which accessibility was considered from the start with others in which problems were fixed after launch. It found that late repairs were consistently more expensive, sometimes several times so, because teams had to revisit work that could have been done correctly the first time. Building an accessible product, in other words, is rarely costly; rebuilding an inaccessible one often is."},{"label":"G","text":"Recently, several firms have begun selling automatic 'overlay' tools, which add a small piece of code to a website and claim to make it accessible instantly. Many disabled users and specialists are critical of these products. They argue that the tools cannot repair the underlying structure of a page, that they sometimes interfere with the assistive technology people already use, and that they encourage organisations to believe the problem has been solved. Artificial intelligence may yet improve matters, since software that writes descriptions of images is becoming more reliable, but most experts believe there is no substitute for involving disabled people directly in design and testing. As Reyner puts it, 'You cannot know whether something works for someone without asking them.'"}],"groups":[{"type":"headings","instructions":"The reading passage has seven paragraphs, A-G. Choose the correct heading for paragraphs B-G from the list of headings below. Write the correct number, i-x.","options":[{"key":"i","text":"Why delay is more expensive"},{"key":"ii","text":"A lack of disabled people in the technology industry"},{"key":"iii","text":"Assistance that depends on how products are built"},{"key":"iv","text":"The limits of quick fixes"},{"key":"v","text":"Legal action as the main driver of change"},{"key":"vi","text":"Small oversights with serious results"},{"key":"vii","text":"How a familiar term got its name"},{"key":"viii","text":"Advantages for people who were not the original target"},{"key":"ix","text":"Falling prices for specialist equipment"},{"key":"x","text":"Explaining a persistent failure"}],"questions":[{"n":1,"prompt":"Paragraph B","answer":"iii","explanation":"Paragraph B lists several kinds of assistive technology and ends with its main point: 'None of these tools can work properly, however, unless the website or app has been built in a way that allows them to.' No prices are mentioned, so ix is wrong."},{"n":2,"prompt":"Paragraph C","answer":"vi","explanation":"Paragraph C says barriers 'result from small technical decisions', each taking 'only minutes to prevent', yet together they 'can make a service unusable'."},{"n":3,"prompt":"Paragraph D","answer":"x","explanation":"Paragraph D asks 'Why, then, are such barriers so widespread?' and gives several explanations: poor education, late checks, testing by non-disabled people and limited automated tools."},{"n":4,"prompt":"Paragraph E","answer":"viii","explanation":"Paragraph E argues that accessible design benefits people 'far beyond the people it was intended for', such as commuters and second-language readers. The origin of the term 'kerb-cut effect' (vii) is only a supporting detail."},{"n":5,"prompt":"Paragraph F","answer":"i","explanation":"Paragraph F mentions the law but says 'the strongest argument may be economic': late repairs were 'consistently more expensive'. This is why v (legal action as the main driver) is wrong."},{"n":6,"prompt":"Paragraph G","answer":"iv","explanation":"Paragraph G explains why overlay tools that 'claim to make it accessible instantly' are criticised, and says there is 'no substitute' for involving disabled people. It does not discuss how many disabled people work in technology, so ii is wrong."}]},{"type":"mcq_multi","instructions":"Choose TWO letters, A-E.","questions":[{"n":7,"count":2,"prompt":"Which TWO of the following are given as reasons why accessibility problems are so common?","options":[{"key":"A","text":"Designers deliberately choose to exclude disabled users."},{"key":"B","text":"Accessibility is often considered only when a project is almost finished."},{"key":"C","text":"Assistive technology is too expensive for many people who need it."},{"key":"D","text":"Many university courses give the subject very little attention."},{"key":"E","text":"Automated testing tools often report faults that do not exist."}],"answers":["B","D"],"explanation":"Paragraph D says accessibility is 'treated as a final check, carried out just before launch' (B) and 'receives little attention on many design and computer science courses' (D). A is contradicted ('rarely deliberate exclusion'); the problem with automated tools is that they miss faults, not that they invent them (E); the cost of assistive technology is never discussed (C)."},{"n":9,"count":2,"prompt":"Which TWO groups of people, apart from disabled users, are mentioned as benefiting from accessible digital design?","options":[{"key":"A","text":"people who cannot play sound in a shared space"},{"key":"B","text":"people with slow internet connections"},{"key":"C","text":"people reading in a language that is not their first"},{"key":"D","text":"parents travelling with young children"},{"key":"E","text":"older people who are new to technology"}],"answers":["A","C"],"explanation":"Paragraph E says captions help people 'in shared offices where they cannot play sound' (A) and clear wording helps 'people reading in a second language' (C). Parents with prams (D) are mentioned only in connection with lowered pavements, not digital design; B and E are not mentioned."}]},{"type":"gap","instructions":"Complete the sentences below. Choose NO MORE THAN TWO WORDS from the passage for each answer.","wordLimit":"NO MORE THAN TWO WORDS","questions":[{"n":11,"prompt":"If a picture has no written description, a screen reader may read out an unhelpful ____ or nothing at all.","answer":["file name","filename"],"explanation":"Paragraph C: a screen reader user 'will hear nothing at all or, worse, a meaningless file name'. 'Unhelpful' paraphrases 'meaningless'."},{"n":12,"prompt":"Software that checks a website automatically is unable to tell whether the description of an image is ____.","answer":["accurate"],"explanation":"Paragraph D: a program 'can confirm that an image has a description, for instance, but not whether that description is accurate'."},{"n":13,"prompt":"Critics claim that overlay products may cause problems for the ____ on which disabled users already rely.","answer":["assistive technology"],"explanation":"Paragraph G: critics argue that overlay tools 'sometimes interfere with the assistive technology people already use'. 'Cause problems for' paraphrases 'interfere with'."}]}]},{"id":"r07","title":"The Psychology of the Performance Review","level":2,"topic":"work","placement":false,"paragraphs":[{"label":"A","text":"Few events in the working year generate as much anxiety as the annual performance review. Employees worry about what they will hear; managers, surveys suggest, often dread the meeting almost as much. In recent years a number of large organisations have redesigned the process or abandoned it altogether. Yet behind these changes lies a puzzle that psychologists have been trying to solve for decades. When asked, most workers say they would like more feedback on their performance. When they actually receive it, however, many react with defensiveness, disappointment or disbelief, and their work does not necessarily improve as a result."},{"label":"B","text":"Part of the explanation lies in how people respond to criticism. Annika Thorvald, a psychologist at the University of Hollinsbridge, has spent many years studying what employees remember after their reviews. In one series of studies, she interviewed staff a week after their annual meeting and again three months later. Critical comments were recalled in far greater detail than positive ones, and were remembered for longer, even when praise had made up most of the conversation. Thorvald argues that people experience criticism of their work as a threat to their sense of who they are. 'When we feel our status is under attack,' she says, 'our attention shifts from learning to self-protection. We spend the meeting preparing our defence rather than listening.'"},{"label":"C","text":"The format of the review can make matters worse. Many organisations require managers to give each employee a numerical rating, often on a five-point scale, alongside spoken or written comments. Samuel Okonjo-Reeve of Corvale Business School tested the effect of these ratings by giving two groups of employees identical written feedback. One group also received a score; the other did not. Those who were given a score could later recall it precisely but remembered little of the comments, while the group without scores discussed the comments in more depth and were more likely to make changes as a result. Okonjo-Reeve also found that employees who received the middle score were often more dissatisfied than their results justified, because they interpreted 'average' as a polite form of failure."},{"label":"D","text":"Timing is a further problem. An annual review may deal with events that took place many months earlier, when neither manager nor employee can remember them clearly and when it is too late to act on what has been learnt. The organisational researcher Priya Castellane followed a software company, Brightfold, as it replaced its yearly reviews with short conversations held every two weeks. Staff reported feeling less anxious about feedback, and some managers said they had a clearer picture of their team's progress. Others, however, complained that the meetings took up a great deal of time and soon became routine. Castellane's most striking conclusion was that how often the meetings took place mattered less than what they focused on: conversations about what an employee could do next proved far more useful than analyses of what had gone wrong in the past."},{"label":"E","text":"Some organisations have tried to reduce the influence of a single manager by collecting feedback from colleagues as well. In principle, this provides a fuller and fairer picture. Rhys Mabbott, who has advised several companies on their review systems, is cautious. In his experience, anonymous comments from peers can damage relationships within a team, partly because some people use anonymity to criticise colleagues they dislike, and partly because recipients spend time trying to guess who wrote each remark. Mabbott does not oppose peer feedback, but he recommends that it be signed and specific, and that it concentrate on observable behaviour rather than on personality."},{"label":"F","text":"A more recent line of research shifts attention from the person giving feedback to the person receiving it. In later work, Thorvald trained one group of employees to treat critical comments as information about a particular task rather than as a judgement on their ability, and to ask follow-up questions instead of defending themselves. A comparison group received no training. Six months later, the trained employees rated their reviews as more useful, and their managers reported greater improvements in their performance. Thorvald suggests that organisations have invested heavily in teaching managers to deliver feedback while largely ignoring the skills needed to receive it."},{"label":"G","text":"None of these findings points to a single ideal system. What they share, however, is an emphasis on trust. Employees will accept even severe criticism from a manager they believe is genuinely interested in their development, while the most carefully designed process is likely to fail if staff suspect it is being used mainly to justify decisions about pay or job cuts. The challenge for organisations may therefore lie less in perfecting the form that feedback takes than in building working relationships in which it can actually be heard."}],"groups":[{"type":"matching_features","instructions":"Look at the following statements (Questions 1-5) and the list of people below. Match each statement with the correct person, A-D. You may use any letter more than once.","options":[{"key":"A","text":"Annika Thorvald"},{"key":"B","text":"Samuel Okonjo-Reeve"},{"key":"C","text":"Priya Castellane"},{"key":"D","text":"Rhys Mabbott"}],"questions":[{"n":1,"prompt":"Employees tend to see a rating in the middle of a scale as a disguised criticism.","answer":"B","explanation":"Paragraph C: Okonjo-Reeve found that employees given the middle score were dissatisfied because they saw an average result as 'a polite form of failure'."},{"n":2,"prompt":"The direction a discussion takes is more important than how frequently it happens.","answer":"C","explanation":"Paragraph D: Castellane concluded that 'how often the meetings took place mattered less than what they focused on', with future-oriented conversations proving most useful."},{"n":3,"prompt":"Negative remarks leave a more lasting impression than positive ones, even when they form a small part of what is said.","answer":"A","explanation":"Paragraph B: in Thorvald's studies, critical comments were recalled in greater detail and for longer 'even when praise had made up most of the conversation'."},{"n":4,"prompt":"People who receive unsigned comments may waste effort working out who wrote them.","answer":"D","explanation":"Paragraph E: Mabbott says that with anonymous peer comments, 'recipients spend time trying to guess who wrote each remark'."},{"n":5,"prompt":"Developing the skills of the people who receive feedback can lead to better performance.","answer":"A","explanation":"Paragraph F: Thorvald trained employees to respond to criticism, and their managers later 'reported greater improvements in their performance'. Mabbott (D) also mentions focusing on behaviour, but his advice is aimed at those giving feedback."}]},{"type":"summary_bank","instructions":"Complete the summary using the list of words, A-K, below. Write the correct letter, A-K.","title":"Changing when and how feedback is given","options":[{"key":"A","text":"early"},{"key":"B","text":"time"},{"key":"C","text":"regularity"},{"key":"D","text":"nervous"},{"key":"E","text":"specific"},{"key":"F","text":"late"},{"key":"G","text":"money"},{"key":"H","text":"anonymous"},{"key":"I","text":"confident"},{"key":"J","text":"focus"},{"key":"K","text":"length"}],"questions":[{"n":6,"prompt":"Because annual reviews often deal with events from many months before, the feedback may arrive too ____ to be of practical use.","answer":"F","explanation":"Paragraph D says annual reviews cover events from months earlier, 'when it is too late to act on what has been learnt'."},{"n":7,"prompt":"When the software company Brightfold replaced its yearly reviews with brief fortnightly conversations, employees said they felt less ____ about receiving feedback.","answer":"D","explanation":"Paragraph D: 'Staff reported feeling less anxious about feedback'. 'Nervous' is a synonym of 'anxious'; 'confident' (I) would reverse the meaning."},{"n":8,"prompt":"Some managers, however, objected that the meetings demanded too much ____ and quickly became repetitive.","answer":"B","explanation":"Paragraph D: other managers 'complained that the meetings took up a great deal of time and soon became routine'. Cost (money) is not mentioned."},{"n":9,"prompt":"The researcher who observed the change concluded that the ____ of the conversations mattered more than how often they were held.","answer":"J","explanation":"Paragraph D: Castellane found that 'how often the meetings took place mattered less than what they focused on'. 'Regularity' (C) is the factor that mattered less, and length is not discussed."},{"n":10,"prompt":"Feedback from colleagues can give a fuller picture, but one adviser recommends that such comments should not be ____.","answer":"H","explanation":"Paragraph E: Mabbott warns that anonymous peer comments can damage relationships and recommends that feedback 'be signed'. He actually wants it to be specific, so E is wrong."}]},{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":11,"prompt":"What puzzle about feedback does the writer describe in the first paragraph?","options":[{"key":"A","text":"Managers find reviews more stressful than the employees being reviewed."},{"key":"B","text":"Employees say they want feedback but often respond badly when they get it."},{"key":"C","text":"Organisations keep annual reviews despite evidence that they do not work."},{"key":"D","text":"Feedback improves performance only when it is given frequently."}],"answer":"B","explanation":"Paragraph A: most workers 'would like more feedback', but when they receive it 'many react with defensiveness, disappointment or disbelief'. A is wrong because managers dread reviews 'almost as much', not more; C is wrong because many organisations have changed or abandoned reviews."},{"n":12,"prompt":"What did Okonjo-Reeve's experiment show about numerical ratings?","options":[{"key":"A","text":"They made employees more willing to change the way they worked."},{"key":"B","text":"They were remembered less accurately than the written feedback."},{"key":"C","text":"They were generally lower than employees had expected."},{"key":"D","text":"They drew attention away from the comments that came with them."}],"answer":"D","explanation":"Paragraph C: employees given a score 'could later recall it precisely but remembered little of the comments'. A is the opposite of the finding (it was the group without scores that made more changes), and B reverses it (the score was remembered precisely)."},{"n":13,"prompt":"Which of the following best summarises the writer's conclusion in the final paragraph?","options":[{"key":"A","text":"Feedback from colleagues is more reliable than feedback from managers."},{"key":"B","text":"Performance reviews should no longer be linked to decisions about pay."},{"key":"C","text":"The relationship between the people involved matters more than the design of the review."},{"key":"D","text":"Severe criticism should be avoided in performance reviews."}],"answer":"C","explanation":"Paragraph G says the challenge lies 'less in perfecting the form that feedback takes than in building working relationships in which it can actually be heard'. Pay (B) is mentioned only as a reason staff may distrust a process, and D is contradicted: employees 'will accept even severe criticism' from a trusted manager."}]}]},{"id":"r08","title":"Do We Still Need to Learn Languages?","level":3,"topic":"education","placement":false,"paragraphs":[{"label":"A","text":"A traveller points her phone at a restaurant menu and watches the unfamiliar words turn, almost instantly, into her own language. A businessman wears a small earpiece that whispers a translation of what his client is saying. Scenes like these, which would have seemed like science fiction a generation ago, have led some commentators to predict that learning a foreign language will soon be as unnecessary as learning to navigate by the stars. Why spend years memorising verb endings, they ask, when a device can do the work in seconds? The question deserves a serious answer, not least because it is already influencing decisions in schools and universities. My own view, however, is that it rests on a fundamental misunderstanding of what language learning is for."},{"label":"B","text":"Let me begin with a concession. Machine translation has improved remarkably over the past decade, largely because modern systems learn patterns from enormous collections of text rather than following rules written by programmers. For many routine purposes, such as grasping the gist of a news article, asking for directions or checking the terms of a hotel booking, the results are now perfectly adequate, and it would be dishonest to pretend otherwise. It is also true that enrolments on language courses have fallen in a number of countries. Those who blame translation apps for this, however, overlook the fact that the decline began well before such tools were widely available, and that it owes more to crowded timetables and the reputation of languages as subjects in which high grades are hard to achieve."},{"label":"C","text":"Defenders of language teaching often respond by listing the things machines still do badly. Translation software performs noticeably worse for languages with relatively little written material online. It struggles with humour, irony and regional dialects, and it can make errors that would be serious in a hospital or a courtroom. All of this is true, but I think it is a weak foundation on which to build an argument. Every one of these limitations is the kind of problem that engineers are working to solve, and I would be surprised if many of them were still obvious in ten years' time. If the only case for learning a language is that the machines are not yet good enough, then that case is already losing."},{"label":"D","text":"The stronger argument is that a language is not merely a code for transmitting information. To learn one is to gain access, gradually and imperfectly, to the ways of thinking, joking and relating to others that belong to the people who speak it. Conversations conducted through a device tend to be slower, more formal and less spontaneous; it is difficult to interrupt, to tease or to share a private joke through an intermediary, however efficient. The sociolinguist Oona Vasquez-Lindt of the University of Pellham interviewed several hundred people who had moved to a new country as adults. Many reported that neighbours and colleagues had treated them quite differently once they began to speak the local language, even hesitantly and with frequent mistakes. Their efforts were taken as a sign of commitment and respect, something no translation, however accurate, could convey. Trust, it seems, cannot be outsourced."},{"label":"E","text":"I am less persuaded by another argument often made in favour of language learning: that it brings significant cognitive benefits, sharpening the memory or delaying the effects of ageing on the brain. Popular articles repeat such claims with great confidence, but the research behind them is far more mixed than the headlines suggest, and some widely reported findings have proved difficult to repeat. Learning a language may well be good for the mind, as many demanding activities are, but I would not advise anyone to take up Portuguese purely to protect their memory. Overstating the case does teachers no favours; when exaggerated claims are questioned, the genuine reasons for learning risk being dismissed along with them."},{"label":"F","text":"None of this means that language teaching can continue unchanged. If machines can handle routine transactions, there is little point in devoting lessons mainly to rehearsing them. Teachers would do better to concentrate on what technology cannot easily provide: extended spoken interaction, cultural understanding and the ability to judge the quality of a translation. At Kestrelmoor Secondary School, for example, students regularly translate a short text themselves, compare their version with one produced by software and discuss the differences. Their teachers report that the exercise makes students more aware of how meaning depends on context, and more sceptical of machine output. This seems to me far more sensible than banning translation tools from classrooms, a policy that is both unenforceable and out of touch with how students will use languages outside school."},{"label":"G","text":"My greatest concern, however, is social rather than educational. If authorities conclude that machines have made language teaching unnecessary and cut it accordingly, languages will not disappear; they will simply become a privilege. Families who can afford private tutors, foreign travel and international schools will continue to give their children access to other languages and the opportunities that come with them, while everyone else relies on whatever their phone can provide. The real question raised by machine translation, then, is not whether computers can convert one language into another. It is what kind of relationships we want with people who speak differently from us, and who should be able to have them."}],"groups":[{"type":"ynng","instructions":"Do the following statements agree with the claims of the writer in the reading passage? Write YES if the statement agrees with the claims of the writer, NO if the statement contradicts the claims of the writer, NOT GIVEN if it is impossible to say what the writer thinks about this.","questions":[{"n":1,"prompt":"Present-day machine translation is good enough for a range of everyday tasks.","answer":"YES","explanation":"In paragraph B the writer concedes that for 'many routine purposes', such as asking for directions, 'the results are now perfectly adequate'."},{"n":2,"prompt":"Translation technology is the main reason why fewer people are studying languages.","answer":"NO","explanation":"Paragraph B says the decline 'began well before such tools were widely available' and 'owes more to crowded timetables' and the reputation of languages as difficult subjects."},{"n":3,"prompt":"The current weaknesses of translation software are unlikely to be overcome.","answer":"NO","explanation":"In paragraph C the writer says engineers are working on these limitations and 'I would be surprised if many of them were still obvious in ten years' time'."},{"n":4,"prompt":"More money should be spent on improving translation software for languages with little written material online.","answer":"NOT GIVEN","explanation":"Paragraph C mentions that software performs worse for such languages, but the writer never says whether more money should be spent on them."},{"n":5,"prompt":"The mental benefits of learning a language have been exaggerated in the popular media.","answer":"YES","explanation":"Paragraph E: popular articles repeat claims about cognitive benefits 'with great confidence', but the research is 'far more mixed than the headlines suggest', and the writer warns against 'overstating the case'."},{"n":6,"prompt":"Students at Kestrelmoor Secondary School achieve higher examination results than students at other schools.","answer":"NOT GIVEN","explanation":"Paragraph F says only that teachers report greater awareness of context and more scepticism about machine output. Examination results are not mentioned."}]},{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":7,"prompt":"The writer refers to navigating by the stars in the first paragraph in order to","options":[{"key":"A","text":"illustrate a view that the writer goes on to challenge."},{"key":"B","text":"show how quickly technology has changed daily life."},{"key":"C","text":"suggest that traditional skills are still worth learning."},{"key":"D","text":"compare language learning with other school subjects."}],"answer":"A","explanation":"In paragraph A the comparison belongs to 'some commentators' who predict that language learning will become unnecessary; the writer then says this view 'rests on a fundamental misunderstanding'. The writer does not argue about traditional skills in general (C)."},{"n":8,"prompt":"What does the writer say about the argument based on what machines still do badly?","options":[{"key":"A","text":"It relies on information that is inaccurate."},{"key":"B","text":"It is the most persuasive reason for learning a language."},{"key":"C","text":"It applies only to languages that are rarely written."},{"key":"D","text":"It is likely to become less convincing over time."}],"answer":"D","explanation":"Paragraph C: engineers are solving these limitations, so if this is 'the only case for learning a language', it 'is already losing'. A is wrong because the writer says 'All of this is true'; B is wrong because the writer calls it 'a weak foundation'."},{"n":9,"prompt":"Vasquez-Lindt's research suggests that","options":[{"key":"A","text":"adult migrants who make frequent mistakes are often misunderstood."},{"key":"B","text":"trying to speak the local language can change how newcomers are treated."},{"key":"C","text":"translation devices are rarely used by people who move abroad as adults."},{"key":"D","text":"adults find it harder than children to learn a new language."}],"answer":"B","explanation":"Paragraph D: many interviewees said neighbours and colleagues 'treated them quite differently once they began to speak the local language, even hesitantly'. Mistakes are mentioned, but they did not prevent this positive reaction (A); C and D are not discussed."},{"n":10,"prompt":"What is the writer's main concern in the final paragraph?","options":[{"key":"A","text":"Language teachers may lose their jobs to technology."},{"key":"B","text":"People will depend too heavily on their mobile phones."},{"key":"C","text":"The ability to learn languages may come to depend on wealth."},{"key":"D","text":"Private tutors offer a lower standard of teaching than schools."}],"answer":"C","explanation":"Paragraph G warns that if authorities cut language teaching, languages will 'become a privilege' for families who can afford tutors, travel and international schools. Phones (B) are mentioned only as what everyone else would be left with."}]},{"type":"sentence_endings","instructions":"Complete each sentence with the correct ending, A-G, below.","options":[{"key":"A","text":"are popular because they make high grades easier to achieve."},{"key":"B","text":"can make conversation slower and less natural."},{"key":"C","text":"has been proven to protect the memory in old age."},{"key":"D","text":"may be less valuable now that machines can handle such tasks."},{"key":"E","text":"can help learners to see how meaning depends on context."},{"key":"F","text":"may lead people to dismiss the genuine reasons for learning a language."},{"key":"G","text":"may be the quickest way to build trust with neighbours."}],"questions":[{"n":11,"prompt":"Lessons that mainly practise everyday transactions","answer":"D","explanation":"Paragraph F: 'If machines can handle routine transactions, there is little point in devoting lessons mainly to rehearsing them.' Grades (A) are mentioned only in paragraph B, as one reason why fewer students choose languages."},{"n":12,"prompt":"Exaggerating the mental benefits of language learning","answer":"F","explanation":"Paragraph E: 'when exaggerated claims are questioned, the genuine reasons for learning risk being dismissed along with them'. C is wrong because the writer says the research is 'far more mixed' than the headlines suggest."},{"n":13,"prompt":"Communicating through an electronic intermediary","answer":"B","explanation":"Paragraph D: 'Conversations conducted through a device tend to be slower, more formal and less spontaneous'. Building trust (G) is linked to speaking the language oneself, not to using a device."}]}]},{"id":"r09","title":"Water in the Ancient Drylands","level":1,"topic":"history","placement":false,"paragraphs":[{"label":"A","text":"For most of human history, settling in a dry region meant solving one problem before any other: how to obtain a dependable supply of water. Great rivers such as the Nile and the Euphrates allowed early farming communities to flourish along their banks, but vast areas of the Middle East, North Africa and South Asia had no permanent surface water at all. Rain, when it came, might fall in a few violent storms and then disappear for months. The societies that nevertheless built towns and cultivated fields in such places did so by developing ingenious methods of finding, moving and storing water, and several of those methods have proved remarkably durable."},{"label":"B","text":"Perhaps the best known is the qanat, a system that most historians believe first appeared on the Iranian plateau around three thousand years ago. A qanat is essentially a tunnel that taps groundwater beneath the foot of a hill or mountain and carries it, by gravity alone, to the surface many kilometres away. Builders began by digging a test well to locate the water table, then excavated a gently sloping channel from the settlement that needed the water back towards the source. The gradient had to be steep enough to keep the water flowing but shallow enough to prevent it from eroding the tunnel floor, so the work demanded considerable surveying skill. Along the route, vertical shafts were sunk at regular intervals, allowing workers to remove excavated soil and providing fresh air below ground. Seen from above, a qanat still looks like a long line of small craters stretching across the desert."},{"label":"C","text":"The advantages of this design are considerable. Because the water travels underground, very little is lost to evaporation, a crucial consideration where summer temperatures are extreme. No pumps or animals are needed to lift it, and since a qanat can deliver only as much water as the surrounding rock naturally releases, a well-managed system does not exhaust its source. The technique spread widely, appearing under different names across the Arabian Peninsula, where such channels are known as aflaj, and in the oases of the Sahara. In many communities the flow was shared among families according to strict timetables, with each household entitled to the water for an agreed length of time. Keeping the tunnels open, however, was hazardous work; collapses were a constant risk, and the specialist diggers who cleaned and repaired them belonged to a respected profession whose skills were usually passed down within families."},{"label":"D","text":"In western India, a very different solution emerged. Here the difficulty was not a complete absence of rain but its extreme seasonality: the monsoon brought heavy downpours for a few months, after which the land dried out and the level of groundwater fell steadily. The response was the stepwell, a deep shaft or trench lined with stone and reached by long flights of steps. As the water table dropped during the dry season, people simply walked further down to reach it. Many stepwells were plain and practical, but others became elaborate structures several storeys deep, decorated with carved columns and sculptures. Their shaded lower levels were noticeably cooler than the ground above, and they served as places to rest, meet and hold religious ceremonies as well as to collect water. A number of the grandest examples were paid for by wealthy patrons, including royal women, as acts of public generosity."},{"label":"E","text":"A third approach was to capture rainwater where it fell and keep it for later use. Cisterns, underground or partly underground tanks, were built in enormous numbers across the Mediterranean world and the Middle East. Their effectiveness depended on two things: a catchment surface, such as a roof, paved courtyard or rocky slope, from which water could be channelled, and a lining that would not leak. Builders in the Roman period, for instance, used a waterproof plaster containing crushed pottery or brick, which set hard even in damp conditions. In some desert cities, channels cut into the rock directed run-off from sudden storms into chains of cisterns, enabling populations to survive long dry seasons. Larger cities sometimes constructed vast covered reservoirs, their roofs supported by forests of columns, to store water delivered by aqueducts from distant hills."},{"label":"F","text":"Many of these systems fell out of use in the nineteenth and twentieth centuries. Mechanical pumps made it possible to extract groundwater quickly from deep boreholes, and piped supplies replaced communal sources in growing towns. In India, colonial administrators regarded some stepwells as unhygienic, and a number were filled in or left to decay. Yet in many regions the pumps that replaced older methods have lowered water tables faster than rainfall can replenish them, and some neglected qanats have run dry as a result. This has prompted renewed interest in traditional techniques. According to Dr Samira Velloran, a water historian at the Asterly Institute for Arid Lands, the older systems 'were designed around the limits of the landscape rather than in defiance of them'. Several restoration projects are now clearing out qanats and stepwells, although Velloran cautions that such systems cannot, on their own, meet the needs of modern cities."}],"groups":[{"type":"tfng","instructions":"Do the following statements agree with the information given in the passage? Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this.","questions":[{"n":1,"prompt":"The qanat was originally developed in North Africa and later adopted in Iran.","answer":"FALSE","explanation":"Paragraph B says most historians believe the qanat 'first appeared on the Iranian plateau', and paragraph C says it later spread to 'the oases of the Sahara'. The statement reverses this direction, so it contradicts the text."},{"n":2,"prompt":"Qanat builders had to judge the slope of the tunnel with great precision.","answer":"TRUE","explanation":"Paragraph B explains that the gradient had to be 'steep enough to keep the water flowing but shallow enough to prevent it from eroding the tunnel floor', so the work 'demanded considerable surveying skill'. Judging the slope precisely is a paraphrase of this."},{"n":3,"prompt":"In communities that relied on qanats, wealthier households were given access to the water for longer periods.","answer":"NOT GIVEN","explanation":"Paragraph C says the flow was shared 'according to strict timetables', with each household entitled to water 'for an agreed length of time'. It never says whether wealth affected the length of a household's share, so there is no information either way."},{"n":4,"prompt":"The people who maintained qanats generally learnt their skills from members of their own family.","answer":"TRUE","explanation":"Paragraph C says the specialist diggers who cleaned and repaired the tunnels belonged to a profession 'whose skills were usually passed down within families'. 'Generally' matches 'usually'."},{"n":5,"prompt":"Stepwells were developed in an area where rainfall was spread fairly evenly across the year.","answer":"FALSE","explanation":"Paragraph D says the problem in western India was the 'extreme seasonality' of rain: the monsoon brought heavy downpours 'for a few months', after which the land dried out. This contradicts the idea of evenly spread rainfall."},{"n":6,"prompt":"Religious ceremonies at stepwells usually took place at the start of the monsoon.","answer":"NOT GIVEN","explanation":"Paragraph D mentions both the monsoon and the fact that stepwells were used to 'hold religious ceremonies', but it says nothing about when these ceremonies were held. The statement links two separate pieces of information that the text does not connect."}]},{"type":"gap","instructions":"Complete the notes below. Choose ONE WORD ONLY from the passage for each answer.","title":"Rainwater cisterns","wordLimit":"ONE WORD ONLY","questions":[{"n":7,"prompt":"Requirement 1: a ____ surface (for example a roof or a paved yard) to gather the rain","answer":["catchment"],"explanation":"Paragraph E says effectiveness depended on 'a catchment surface, such as a roof, paved courtyard or rocky slope, from which water could be channelled'."},{"n":8,"prompt":"Requirement 2: a watertight lining, e.g. Roman plaster made with broken-up ____ or brick that hardened even when wet","answer":["pottery"],"explanation":"Paragraph E says Roman-period builders used 'a waterproof plaster containing crushed pottery or brick, which set hard even in damp conditions'. 'Brick' is already given in the note, so the missing word is 'pottery'."},{"n":9,"prompt":"Desert cities: channels cut into rock guided storm ____ into a series of cisterns","answer":["run-off","runoff"],"explanation":"Paragraph E says rock-cut channels 'directed run-off from sudden storms into chains of cisterns'. 'A series of cisterns' paraphrases 'chains of cisterns'."},{"n":10,"prompt":"Large cities: huge roofed reservoirs held water carried from far-off hills by ____","answer":["aqueducts"],"explanation":"Paragraph E ends by describing vast covered reservoirs built 'to store water delivered by aqueducts from distant hills'. 'Columns' is a distractor: they supported the roofs but did not carry water."}]},{"type":"short_answer","instructions":"Answer the questions below. Choose NO MORE THAN THREE WORDS from the passage for each answer.","wordLimit":"NO MORE THAN THREE WORDS","questions":[{"n":11,"prompt":"What technology made it possible to draw water rapidly from deep underground?","answer":["mechanical pumps","pumps"],"explanation":"Paragraph F says 'Mechanical pumps made it possible to extract groundwater quickly from deep boreholes'. 'Draw water rapidly from deep underground' paraphrases this."},{"n":12,"prompt":"Which officials considered certain stepwells to be a danger to health?","answer":["colonial administrators"],"explanation":"Paragraph F says 'colonial administrators regarded some stepwells as unhygienic'. 'A danger to health' paraphrases 'unhygienic'."},{"n":13,"prompt":"According to Dr Velloran, whose needs could restored traditional systems not meet by themselves?","answer":["modern cities","modern cities'"],"explanation":"At the end of paragraph F, Velloran 'cautions that such systems cannot, on their own, meet the needs of modern cities'. 'By themselves' paraphrases 'on their own'."}]}]},{"id":"r10","title":"Repairing the Reef","level":2,"topic":"environment","placement":false,"paragraphs":[{"label":"A","text":"Coral reefs cover only a tiny fraction of the ocean floor, yet they support an extraordinary proportion of marine life and shield many tropical coastlines from waves and storms. Over recent decades, however, reefs in every ocean have suffered serious decline. Pollution, destructive fishing and coastal construction have all played a part, but the greatest threat is rising sea temperature. When water becomes too warm for too long, corals expel the microscopic algae that live inside their tissues and supply most of their food. The corals turn white, a process known as bleaching, and if conditions do not improve quickly, many die."},{"label":"B","text":"In response, scientists and conservation groups have developed a range of techniques for repairing damaged reefs. The most widely used is known as coral gardening. Small fragments are taken from healthy colonies, or gathered after storms have broken them off, and grown in underwater nurseries, often suspended from ropes or tree-like frames. Once large enough, usually after many months, they are attached to degraded areas of reef with cement, epoxy or cable ties. The method is relatively simple and has been taken up by community groups and dive centres as well as research institutes, which partly explains its popularity. Hamid Qerani, who runs a volunteer nursery in the Pelorin Islands, believes this involvement brings a further benefit: 'Once people have planted corals with their own hands, they become the reef's strongest defenders.'"},{"label":"C","text":"A refinement of this approach exploits a curious feature of coral biology. Massive, boulder-shaped corals normally grow extremely slowly, in some cases adding only a few millimetres a year. Researchers found, however, that when such corals are cut into very small pieces, each piece grows far faster than an intact colony would. Fragments from the same parent placed close together also fuse, eventually forming a single larger colony. According to Dr Ilse Marrowby of the Kestrel Bay Reef Laboratory, this technique, known as micro-fragmentation, allows restorers to cover in a few years a surface that might otherwise take decades to fill. She adds, however, that it is labour-intensive and does nothing to increase genetic variety, since every fragment is a clone of the original colony."},{"label":"D","text":"Genetic diversity matters because a reef made up of a few cloned individuals may be badly exposed to the next heatwave or disease outbreak. For this reason, some teams are turning to sexual reproduction. Many corals release eggs and sperm on only a few nights each year, in synchronised spawning events. Researchers collect this spawn, fertilise it in tanks and rear the resulting larvae until they are ready to settle on a hard surface. The young corals are then released over damaged reefs or grown on small tiles before being planted out. Dr Kwame Asterholt, who leads a larval programme at the Merrow Isles Marine Centre, regards this as 'the only realistic way to restore reefs on anything like the scale required', since a single night's spawning can yield millions of larvae. The drawback is that very few of them survive their first year in the wild."},{"label":"E","text":"In some places the problem is not a lack of coral but the absence of a stable surface on which it can grow. Blast fishing and ship groundings can reduce a reef to a field of loose rubble that shifts with every storm, burying or crushing any young corals that settle there. Here restorers have installed networks of steel frames or concrete structures that hold the rubble in place and give corals something solid to attach to. Professor Celia Brannoch, an ecologist who has monitored several such sites, reports that fish often return to the frames within weeks, long before coral cover has recovered. She warns, however, that structures made from unsuitable materials can corrode or break apart, scattering debris across the very habitat they were meant to repair."},{"label":"F","text":"More ambitious still are efforts to help corals cope with the conditions that are killing them. Some laboratories are selectively breeding corals from parents that survived past heatwaves, in the hope of producing offspring with greater heat tolerance. Others are experimenting with beneficial bacteria or with exposing young corals to gradually rising temperatures. Supporters argue that, because ocean warming is expected to continue for decades, restoring reefs with ordinary corals is like replanting a forest with trees that are bound to burn. Critics, among them the marine policy researcher Dr Tomas Ferreira-Lund, doubt whether such interventions could ever be applied across thousands of square kilometres, and worry that releasing specially bred populations into the wild could have consequences that nobody can yet predict."},{"label":"G","text":"Even the most enthusiastic practitioners accept that restoration has serious limits. Successful projects typically cover areas measured in hectares, while the world's reefs extend over hundreds of thousands of square kilometres, and costs per hectare remain high. Many projects are monitored for only a year or two, so their long-term success is often unknown. Above all, no technique can protect a reef from water that is simply too hot: transplanted corals bleach just as readily as wild ones. For this reason, most scientists describe restoration not as a solution but as a way of buying time until the causes of decline, above all greenhouse gas emissions, are brought under control. As Marrowby puts it, 'We can mend the roof, but someone else has to put out the fire.'"}],"groups":[{"type":"headings","instructions":"The passage has seven paragraphs, A-G. Choose the correct heading for paragraphs B-G from the list of headings below.","title":"List of Headings","options":[{"key":"i","text":"A temporary measure rather than a permanent cure"},{"key":"ii","text":"Measures to reduce pollution and overfishing"},{"key":"iii","text":"Faster growth from smaller pieces"},{"key":"iv","text":"Giving young corals a firm foundation"},{"key":"v","text":"Comparing the costs of different restoration methods"},{"key":"vi","text":"Producing large numbers of genetically varied corals"},{"key":"vii","text":"The most common method and the reasons for its appeal"},{"key":"viii","text":"Attempts to make corals more resistant to rising temperatures"},{"key":"ix","text":"The unexpected return of fish to damaged sites"}],"questions":[{"n":1,"prompt":"Paragraph B","answer":"vii","explanation":"Paragraph B introduces coral gardening as 'the most widely used' technique, explains how it works, and says its simplicity and adoption by non-scientific groups 'partly explains its popularity'. Heading ii is a distractor: pollution and fishing are mentioned only in paragraph A, and Qerani's comment is about public support, not measures against them."},{"n":2,"prompt":"Paragraph C","answer":"iii","explanation":"Paragraph C explains that when slow-growing corals are 'cut into very small pieces, each piece grows far faster than an intact colony would'. That is the central idea; the limitations mentioned at the end are secondary."},{"n":3,"prompt":"Paragraph D","answer":"vi","explanation":"Paragraph D explains that sexual reproduction is used because 'genetic diversity matters', and that one spawning night 'can yield millions of larvae'. Heading vi combines both points: large numbers and genetic variety."},{"n":4,"prompt":"Paragraph E","answer":"iv","explanation":"Paragraph E is about reefs reduced to 'loose rubble' and the frames that 'hold the rubble in place and give corals something solid to attach to'. Heading ix is a trap: the return of fish is only a supporting detail reported by Brannoch, not the main idea."},{"n":5,"prompt":"Paragraph F","answer":"viii","explanation":"Paragraph F describes efforts 'to help corals cope with the conditions that are killing them', such as breeding for 'greater heat tolerance' and exposing corals to 'gradually rising temperatures'."},{"n":6,"prompt":"Paragraph G","answer":"i","explanation":"Paragraph G says scientists describe restoration 'not as a solution but as a way of buying time'. Heading v is a distractor: costs are mentioned ('costs per hectare remain high'), but different methods are never compared."}]},{"type":"matching_features","instructions":"Look at the following statements and the list of people below. Match each statement with the correct person, A-E. NB You may use any letter more than once.","title":"List of People","options":[{"key":"A","text":"Dr Ilse Marrowby"},{"key":"B","text":"Dr Kwame Asterholt"},{"key":"C","text":"Professor Celia Brannoch"},{"key":"D","text":"Dr Tomas Ferreira-Lund"},{"key":"E","text":"Hamid Qerani"}],"questions":[{"n":7,"prompt":"A technique can produce coral cover quickly but leaves the population genetically uniform.","answer":"A","explanation":"In paragraph C, Marrowby says micro-fragmentation lets restorers cover a surface 'in a few years' but 'does nothing to increase genetic variety, since every fragment is a clone of the original colony'."},{"n":8,"prompt":"Structures intended to help a reef may end up harming it.","answer":"C","explanation":"In paragraph E, Brannoch warns that structures 'made from unsuitable materials can corrode or break apart, scattering debris across the very habitat they were meant to repair'."},{"n":9,"prompt":"One method is the only practical means of restoring reefs over a sufficiently large area.","answer":"B","explanation":"In paragraph D, Asterholt calls larval propagation 'the only realistic way to restore reefs on anything like the scale required'. Ferreira-Lund (paragraph F) also discusses scale, but he doubts that heat-tolerance interventions can be applied widely, which is the opposite point."},{"n":10,"prompt":"Those who restore reefs must rely on others to deal with the underlying cause of the damage.","answer":"A","explanation":"In paragraph G, Marrowby says, 'We can mend the roof, but someone else has to put out the fire.' In context, the fire is the cause of decline (warming from emissions), which restorers themselves cannot stop."}]},{"type":"sentence_endings","instructions":"Complete each sentence with the correct ending, A-G, below.","options":[{"key":"A","text":"are no less likely to bleach than corals that grew there naturally."},{"key":"B","text":"are mostly collected from colonies damaged by storms."},{"key":"C","text":"it is simple enough to be carried out by non-specialists."},{"key":"D","text":"are usually monitored for several years after planting."},{"key":"E","text":"manage to live through their first year in the natural environment."},{"key":"F","text":"tend to attract fish to the site within a few weeks."},{"key":"G","text":"it produces corals that are more genetically varied."}],"questions":[{"n":11,"prompt":"Coral gardening has spread widely partly because","answer":"C","explanation":"Paragraph B says the method 'is relatively simple and has been taken up by community groups and dive centres as well as research institutes, which partly explains its popularity'. G is wrong: genetic variety is the advantage of sexual reproduction in paragraph D, not of gardening."},{"n":12,"prompt":"Only a small proportion of the larvae reared in spawning programmes","answer":"E","explanation":"Paragraph D ends: 'very few of them survive their first year in the wild'. 'Only a small proportion' paraphrases 'very few', and 'the natural environment' paraphrases 'the wild'."},{"n":13,"prompt":"Corals that are transplanted from nurseries onto a damaged reef","answer":"A","explanation":"Paragraph G states that 'transplanted corals bleach just as readily as wild ones'. D is wrong because paragraph G says many projects are monitored 'for only a year or two'; F is wrong because paragraph E says fish return to the steel frames, not to transplanted corals."}]}]},{"id":"r11","title":"The Price of Attention","level":3,"topic":"technology","placement":false,"paragraphs":[{"label":"A","text":"Economists have long recognised that whatever is scarce becomes valuable. In an age when information is plentiful and often free, the scarce resource is no longer content but the human capacity to attend to it. This simple observation lies behind what has come to be called the attention economy. Many of the most popular digital services charge their users nothing; instead, they earn their income by selling advertisers access to those users' time and focus. The longer a person stays, the more advertisements can be displayed and the more data can be gathered about their interests. It follows that, for such businesses, the key measure of success is not whether users are satisfied but how much of their attention has been captured."},{"label":"B","text":"The design techniques that serve this goal are by now familiar. Infinite scroll removes the natural stopping points once provided by the end of a page or a chapter. Autoplay starts the next video before the viewer has decided whether to watch it. Notifications arrive at unpredictable moments, and the uncertainty is itself part of their pull: psychologists have long observed that rewards delivered irregularly sustain behaviour more effectively than predictable ones. Streaks, badges and counters showing how many people have reacted to a post add a social dimension, so that time away from an app begins to feel like a loss. None of these features is sinister in isolation, and each can be defended as a convenience. Taken together, however, they create an environment engineered to make leaving difficult."},{"label":"C","text":"It would be a mistake, though, to imagine designers deliberately plotting to manipulate the public. The reality is more mundane and, in some ways, more troubling. Modern apps are refined through continuous experimentation, in which slightly different versions of a screen are shown to different groups of users and whichever version generates more engagement is kept. No one needs to intend harm for the result to be harmful; the process simply selects whatever holds attention most effectively. As Ruth Kalinowska, who spent six years designing features for a social media start-up, put it to me: 'Nobody in the room ever asked whether a change was good for people. We asked whether the numbers went up.'"},{"label":"D","text":"The industry's usual response has been to place responsibility on the individual. Users, the argument goes, are adults who are free to switch off, and many devices now include tools that report daily screen time or allow limits to be set on particular apps. I find this argument unpersuasive. It is not that people bear no responsibility for their habits; clearly they do. But it is unreasonable to expect individual willpower to compete on equal terms with systems shaped by thousands of experiments and some of the most sophisticated data analysis in the world. The screen-time tools themselves can usually be dismissed with a single tap, which suggests they were built to reassure users rather than to change their behaviour."},{"label":"E","text":"Critics of the industry, on the other hand, sometimes weaken their case by overstating it. It has become common to describe heavy use of social media or games as an addiction comparable to drug dependence. The evidence for such comparisons is, at best, mixed. Studies of the effects of screen use on wellbeing have produced conflicting findings, and many rely on people's own estimates of how long they spend online, which are known to be unreliable. Exaggerated claims also make it easier for companies to dismiss legitimate concerns as a moral panic, like those that once greeted novels, radio and television. The more modest claim, that many products are designed to encourage more use than people themselves would choose, is both better supported and quite sufficient to justify action."},{"label":"F","text":"What form should that action take? Some propose that designers adopt a professional code of ethics, similar to those that govern doctors or engineers. The idea has some merit, but codes of conduct carry little weight when an employee's performance is judged by engagement figures. Others favour regulation, and this, I believe, is the more promising path, provided that it targets specific practices rather than overall usage. Rules restricting how many hours people may spend online would be both unenforceable and paternalistic. By contrast, requiring autoplay to be switched off by default, or notifications to be grouped and delivered at times users have chosen, would leave adults free to decide for themselves while removing some of the pressure that currently shapes their decisions."},{"label":"G","text":"There are signs that change is possible. A number of smaller companies have begun to promote their products on the grounds that they respect users' time, and some have abandoned advertising in favour of subscriptions, a model that rewards a service for being genuinely useful rather than merely absorbing. Whether such businesses can compete with free alternatives remains to be seen. But the attention economy is not a law of nature; it is the product of particular commercial decisions, and decisions can be made differently. For developers and designers especially, the question is not only what can be built but what ought to be."}],"groups":[{"type":"matching_info","instructions":"The passage has seven paragraphs, A-G. Which paragraph contains the following information? NB You may use any letter more than once.","options":[{"key":"A","text":"Paragraph A"},{"key":"B","text":"Paragraph B"},{"key":"C","text":"Paragraph C"},{"key":"D","text":"Paragraph D"},{"key":"E","text":"Paragraph E"},{"key":"F","text":"Paragraph F"},{"key":"G","text":"Paragraph G"}],"questions":[{"n":1,"prompt":"a comparison between present-day concerns and reactions to earlier forms of media","answer":"E","explanation":"Paragraph E warns that exaggerated claims let companies dismiss concerns 'as a moral panic, like those that once greeted novels, radio and television'. Those are the earlier forms of media."},{"n":2,"prompt":"an explanation of how a damaging outcome can arise without anyone wanting it","answer":"C","explanation":"Paragraph C says 'No one needs to intend harm for the result to be harmful', because continuous testing 'simply selects whatever holds attention most effectively'."},{"n":3,"prompt":"a suggestion that certain features offered to users are largely for show","answer":"D","explanation":"Paragraph D says screen-time tools 'can usually be dismissed with a single tap', which suggests they 'were built to reassure users rather than to change their behaviour', meaning they are largely for appearance."},{"n":4,"prompt":"a reference to a source of income that rewards usefulness rather than time spent","answer":"G","explanation":"Paragraph G describes subscriptions as 'a model that rewards a service for being genuinely useful rather than merely absorbing'. Paragraph A describes the advertising model, which rewards time spent, so it is not the answer."}]},{"type":"ynng","instructions":"Do the following statements agree with the views of the writer in the passage? Write YES if the statement agrees with the views of the writer, NO if the statement contradicts the views of the writer, NOT GIVEN if it is impossible to say what the writer thinks about this.","questions":[{"n":5,"prompt":"Each of the design features mentioned is objectionable even when considered on its own.","answer":"NO","explanation":"In paragraph B the writer says 'None of these features is sinister in isolation, and each can be defended as a convenience'. The problem only arises when they are 'taken together', so the writer disagrees with the statement."},{"n":6,"prompt":"Individuals are partly to blame for the way they use technology.","answer":"YES","explanation":"In paragraph D the writer rejects the industry's argument but adds: 'It is not that people bear no responsibility for their habits; clearly they do.' The writer simply thinks individual willpower is not enough on its own."},{"n":7,"prompt":"Research into screen use and wellbeing has been held back by a shortage of funding.","answer":"NOT GIVEN","explanation":"Paragraph E criticises the research for 'conflicting findings' and for relying on people's own unreliable estimates of their screen time. Funding is never mentioned, so the writer's view on it cannot be known."},{"n":8,"prompt":"The claim that products are designed to make people use them more than they intend is strong enough to warrant a response.","answer":"YES","explanation":"At the end of paragraph E the writer says the 'more modest claim', that products encourage 'more use than people themselves would choose', is 'better supported and quite sufficient to justify action'."},{"n":9,"prompt":"A legal limit on the time people may spend online would be a sensible measure.","answer":"NO","explanation":"In paragraph F the writer supports regulation of specific practices but says 'Rules restricting how many hours people may spend online would be both unenforceable and paternalistic'."}]},{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":10,"prompt":"According to the writer, businesses in the attention economy judge their success mainly by","options":[{"key":"A","text":"the quality of the content they provide."},{"key":"B","text":"how satisfied their users are."},{"key":"C","text":"the amount of user attention they obtain."},{"key":"D","text":"the number of advertisers they attract."}],"answer":"C","explanation":"Paragraph A says 'the key measure of success is not whether users are satisfied but how much of their attention has been captured'. B is directly rejected. Advertisers are mentioned (D) as the source of income, but not as the measure of success."},{"n":11,"prompt":"What does the writer say about notifications?","options":[{"key":"A","text":"Their unpredictability makes them more compelling."},{"key":"B","text":"They are less effective than streaks and badges."},{"key":"C","text":"They were originally designed by psychologists."},{"key":"D","text":"Most users would prefer to receive them at fixed times."}],"answer":"A","explanation":"Paragraph B says notifications 'arrive at unpredictable moments, and the uncertainty is itself part of their pull'. Psychologists (C) are mentioned only as having studied irregular rewards, and paragraph F proposes delivery at chosen times (D) without claiming that most users want this."},{"n":12,"prompt":"What does Ruth Kalinowska's comment suggest about the company she worked for?","options":[{"key":"A","text":"Staff were instructed to mislead users."},{"key":"B","text":"Decisions were based on measurable results rather than users' wellbeing."},{"key":"C","text":"Designers were unaware that experiments were being carried out."},{"key":"D","text":"Its approach changed after users complained."}],"answer":"B","explanation":"In paragraph C, Kalinowska says nobody asked 'whether a change was good for people. We asked whether the numbers went up.' A is wrong because the writer says it would be 'a mistake' to imagine designers deliberately plotting to manipulate people."},{"n":13,"prompt":"What is the writer's opinion of a professional code of ethics for designers?","options":[{"key":"A","text":"It would make regulation unnecessary."},{"key":"B","text":"It should be closely modelled on the codes followed by doctors."},{"key":"C","text":"It has already been adopted by several smaller companies."},{"key":"D","text":"It would achieve little while staff are judged on engagement figures."}],"answer":"D","explanation":"Paragraph F says the idea 'has some merit, but codes of conduct carry little weight when an employee's performance is judged by engagement figures'. The writer prefers regulation, so A is wrong; the smaller companies in paragraph G (C) are linked to subscriptions, not ethics codes."}]}]},{"id":"r12","title":"The Measure of a Student","level":3,"topic":"education","placement":false,"paragraphs":[{"label":"A","text":"Few aspects of education provoke as much argument as the standardised test: an examination in which every candidate answers the same questions, under the same conditions, and is marked in the same way. To its supporters, such a test is the fairest available means of comparing large numbers of people; to its opponents, it reduces the rich and varied business of learning to a single number. Yet the debate is far older than most of its participants realise, and an understanding of how standardised testing arose helps to explain why it has proved so difficult either to defend wholeheartedly or to abandon."},{"label":"B","text":"The most celebrated early example comes from imperial China, where, for well over a thousand years, written examinations were a principal route into the state bureaucracy. Candidates were tested on their knowledge of classical texts and their ability to compose essays in a prescribed style. In some periods, elaborate precautions were taken against favouritism: candidates' names were concealed, and their answers were copied out by clerks so that examiners could not recognise the handwriting. The historian Dr Odile Varnham argues that the system's real innovation was not the testing of knowledge itself but 'the idea that an official post could be earned rather than inherited'. She notes, however, that preparation for the examinations demanded years of study that only relatively wealthy families could easily support."},{"label":"C","text":"In Europe and North America, written examinations gradually replaced oral ones during the nineteenth century. Reformers argued that setting every pupil the same questions on paper was more impartial than an oral interview, in which a teacher's opinion of a child might colour the result, and that it also allowed schools to be compared with one another. Governments, meanwhile, began to appoint civil servants by competitive examination rather than personal recommendation. In the early twentieth century, the development of intelligence tests and of the multiple-choice format made it possible to assess very large populations quickly, and by the middle of the century answer sheets could be marked by machine, so that the cost of marking each additional paper fell dramatically."},{"label":"D","text":"Today standardised tests serve several distinct purposes, and much confusion arises from treating them as one. Some tests select: they decide who is offered a university place or a scholarship. Some certify that a candidate has reached a required standard, as professional licensing examinations do. Others are diagnostic, intended to show teachers which skills a pupil has not yet mastered. And many are used for accountability, with schools' average results published or linked to funding and inspection. According to Professor Bernard Oyelaran-Fisk, an assessment specialist, the most serious problems arise when a test designed for one purpose is pressed into service for another, when, for instance, results from an examination meant to identify individual pupils' needs are used to rank schools."},{"label":"E","text":"It is accountability testing that has attracted the fiercest criticism. When a school's reputation or a teacher's pay depends on results, there is a strong incentive to devote lesson time to the material and question types that will appear on the test, at the expense of subjects and skills that are not assessed. Dr Hana Kirchwell, who has observed classroom practice in several countries, found that in the schools under greatest pressure, art, music and extended project work were the first activities to be reduced. She is careful to add that 'teaching to the test' is not always harmful: if a test is well designed, prepa
