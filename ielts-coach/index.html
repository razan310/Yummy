}

/* ---------- progress: band-over-time small multiple ---------- */
function bandTrend(points, { target = 7, minTarget = 6.5, label = '' } = {}) {
  const W = 320, H = 150, m = { l: 30, r: 34, t: 12, b: 22 };
  const lo = Math.min(4, ...points.map((p) => Math.floor(p.band)));
  const hi = 9;
  const y = (v) => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  const n = points.length;
  const x = (i) => m.l + (W - m.l - m.r) * (n <= 1 ? 0.5 : i / (n - 1));
  let s = '';
  for (let v = lo; v <= hi; v += 1) {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l - 6}" y="${y(v)}" text-anchor="end" dominant-baseline="middle" font-size="10">${v}</text>`;
  }
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink)" stroke-width="1.5"/><text x="${W - m.r + 4}" y="${y(target)}" dominant-baseline="middle" font-size="10" font-weight="700" style="fill:var(--ink)">${target.toFixed(1)}</text>`;
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(minTarget)}" y2="${y(minTarget)}" stroke="var(--ink-3)" stroke-width="1"/><text x="${W - m.r + 4}" y="${y(minTarget)}" dominant-baseline="middle" font-size="10">${minTarget.toFixed(1)}</text>`;
  if (n) {
    const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.band).toFixed(1)}`).join(' ');
    s += `<path d="${d} L${x(n - 1).toFixed(1)},${y(lo)} L${x(0).toFixed(1)},${y(lo)} Z" fill="var(--accent)" opacity=".08"/>`;
    s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
    points.forEach((p, i) => { s += `<circle cx="${x(i)}" cy="${y(p.band)}" r="${i === n - 1 ? 5 : 3.5}" fill="var(--accent)" stroke="var(--sheet)" stroke-width="2"><title>${esc(fmtDate(p.date))} · ${esc(p.label || '')}: ${fmtBand(p.band)}</title></circle>`; });
    s += `<text x="${x(0)}" y="${H - 6}" text-anchor="${n > 1 ? 'start' : 'middle'}" font-size="10">${esc(fmtDate(points[0].date, { day: 'numeric', month: 'short' }))}</text>`;
    if (n > 1) s += `<text x="${x(n - 1)}" y="${H - 6}" text-anchor="end" font-size="10">${esc(fmtDate(points[n - 1].date, { day: 'numeric', month: 'short' }))}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} band over time">${s}</svg>`;
}

function skillEstimate(skill) {

function planWeights(est) {

  const gap = (k) => clamp(p.target - b(k), 0, 2.5) + 0.35;

/* Builds one week of tasks from frozen estimates. Pure: same inputs give the same plan. */
function buildWeek(week, est) {
  const p = S.profile;
  const start = weekStart(week);
  const phase = phaseOf(week);
  const days = Array.from({ length: 7 }, (_, i) => ({ date: addDays(start, i), tasks: [], budget: p.dailyMinutes, kind: 'regular' }));
  const exam = p.examDate;
  days.forEach((d) => {
    const wd = dow(d.date);
    if (d.date === exam) { d.kind = 'exam'; d.tasks.push('exam'); return; }
    if (exam && d.date === addDays(exam, 1)) { d.kind = 'light'; d.tasks.push('vocab', 'result'); return; }
    if (exam && d.date === addDays(exam, -1)) { d.kind = 'light'; d.tasks.push('vocab', 'speak1'); return; }
    if (week >= 4 && wd === p.mockDay) { d.kind = 'mock'; d.tasks.push('vocab', 'mockLR'); return; }
    if (week >= 4 && wd === (p.mockDay + 1) % 7) { d.kind = 'mock'; d.tasks.push('vocab', 'mockWS'); return; }
    if (wd === p.lightDay) { d.kind = 'light'; d.tasks.push('vocab', 'speak1', 'review'); return; }
    d.tasks.push('vocab');
  });
  if (week === 1 && !S.placement?.done) { const d0 = days.find((d) => d.kind === 'regular'); if (d0) { d0.kind = 'placement'; d0.tasks = ['placement']; } }
  const regular = days.filter((d) => d.kind === 'regular');
  if (!regular.length) return days;
  const used = (d) => sum(d.tasks.map((t) => BLOCKS[t].min));

  const w = planWeights(est);
  const tot = w.W + w.S + w.R + w.L;
  const grammarCount = phase.name === 'Foundation' ? 3 : phase.name === 'Build' ? 2 : 1;
  const avail = sum(regular.map((d) => d.budget - used(d))) - grammarCount * BLOCKS.grammar.min;
  const share = (k) => (avail * w[k]) / tot;
  const counts = {
    t2: Math.max(2, Math.round((share('W') * 0.62) / 50)),
    t1: Math.max(1, Math.round((share('W') * 0.38) / 30)),
    speak: Math.max(2, Math.round(share('S') / 25)),
    read: Math.max(1, Math.round(share('R') / 25)),
    listen: Math.max(1, Math.round(share('L') / 20)),
    grammar: grammarCount,
  };
  const mins = { t2: 2, t1: 1, speak: 2, read: 1, listen: 1, grammar: 1 };
  const order = Object.keys(counts).sort((a, b) => (w[BLOCKS[a].skill] || 0) - (w[BLOCKS[b].skill] || 0));
  const totalMin = () => sum(Object.entries(counts).map(([k, n]) => n * BLOCKS[k].min));
  let guard = 0;
  while (totalMin() > avail + grammarCount * 15 + regular.length * 8 && guard++ < 40) {
    const k = order.find((kk) => counts[kk] > mins[kk]);
    if (!k) break;
    counts[k]--;
  }
  const queue = [];
  Object.entries(counts).forEach(([k, n]) => { for (let i = 0; i < n; i++) queue.push(k); });
  queue.sort((a, b) => BLOCKS[b].min - BLOCKS[a].min || (w[BLOCKS[b].skill] || 0) - (w[BLOCKS[a].skill] || 0));
  queue.forEach((k) => {
    const need = BLOCKS[k].min;
    const fits = (d, strict) => d.budget - used(d) >= need - (strict ? 0 : 10);
    const cands = regular.filter((d) => fits(d, false));
    const fresh = cands.filter((d) => !d.tasks.includes(k) && !(k === 't1' && d.tasks.includes('t2')) && !(k === 't2' && d.tasks.includes('t1')));
    const pool = fresh.length ? fresh : cands.filter((d) => !d.tasks.includes(k));
    if (!pool.length) return;
    pool.sort((a, b) => (b.budget - used(b)) - (a.budget - used(a)) || a.date.localeCompare(b.date));
    pool[0].tasks.push(k);
  });
  const rank = { placement: 0, vocab: 1, t2: 2, t1: 3, speak: 4, speak1: 5, read: 6, listen: 7, grammar: 8, review: 9 };
  regular.forEach((d) => d.tasks.sort((a, b) => (rank[a] ?? 5) - (rank[b] ?? 5)));
  return days;
}

/* Today's tasks are generated once and stored; future days are a preview. */
function frozenEst(week) {

function dayTasks(date, { create = false } = {}) {

/* ---------- streaks ---------- */

function bestStreak() {

const SRS_LABEL = ['Again', 'Hard', 'Good', 'Easy'];

function dueWords() { const t = today(); return Object.entries(SRS.cards).filter(([, c]) => c.due <= t).map(([w]) => w); }
function newWordsToday() {

/* A quiz is one or more items (passages or listening sections) answered together. */
function makeQuiz(items) {

    const p = { item, idx: i, offset };

      const r = res && res.perQ[key];
      const num = q.n + offset;
      const dis = quiz.submitted ? 'disabled' : '';
      let ctrl = '';
      switch (g.type) {

/* ---------- countdown timer (tap to pause; runs into overtime) ---------- */
class Countdown {
  constructor(seconds, { id, onEnd, onTick, elapsed = 0, autostart = false } = {}) {
    this.total = seconds; this.elapsed = elapsed; this.id = id; this.onEnd = onEnd; this.onTick = onTick;
    this.running = false; this.ended = false; this.int = null; this.last = 0;
    if (autostart) this.start();
  }
  get left() { return this.total - this.elapsed; }
  start() {
    if (this.running) return;
    this.running = true; this.last = Date.now();
    this.int = setInterval(() => this.tick(), 250);
    this.paint();
  }
  pause() { if (!this.running) return; this.tick(); this.running = false; clearInterval(this.int); this.paint(); }
  toggle() { this.running ? this.pause() : this.start(); }
  tick() {
    if (!this.running) return;
    const now = Date.now(); this.elapsed += (now - this.last) / 1000; this.last = now;
    if (!this.ended && this.left <= 0) { this.ended = true; if (this.onEnd) this.onEnd(); }
    if (this.onTick) this.onTick(this);
    this.paint();
  }
  stop() { this.pause(); clearInterval(this.int); }
  paint() {
    const el = this.id && document.getElementById(this.id);
    if (!el) return;
    const left = this.left;
    el.textContent = left >= 0 ? fmtClock(left) : `+${fmtClock(-left)}`;
    const wrap = el.closest('.timer');
    if (wrap) {
      wrap.classList.toggle('paused', !this.running);
      wrap.classList.toggle('warn', left > 0 && left <= Math.min(300, this.total * 0.15));
      wrap.classList.toggle('bad', left <= 60);
      wrap.title = this.running ? 'Tap to pause' : 'Tap to start';
    }
  }
}

function bandRuler(skill, est, { target = S.profile.target, minTarget = S.profile.minTarget } = {}) {
  const lo = 4, hi = 9;
  const pct = (v) => `${((clamp(v, lo, hi) - lo) / (hi - lo)) * 100}%`;
  const ticks = [];
  for (let v = lo; v <= hi; v += 0.5) ticks.push(`<i class="ruler-tick ${Number.isInteger(v) ? 'major' : ''}" style="left:${pct(v)}"></i>`);
  const labels = [4, 5, 6, 7, 8, 9].map((v) => `<span style="left:${pct(v)}">${v}</span>`).join('');
  const val = est == null ? null : roundHalf(est);
  const gap = val == null ? '' : val >= target ? '<span class="pill good">At target</span>' : `<span class="ruler-gap">${(target - val).toFixed(1)} below ${target.toFixed(1)}</span>`;
  return `<div class="ruler" aria-label="${SKILL_NAME[skill]} ${val == null ? 'no estimate yet' : 'estimated band ' + fmtBand(val)}">
    <div class="ruler-top"><span class="ruler-name">${skillDot(skill)} ${SKILL_NAME[skill]}</span><span class="row" style="gap:10px">${gap}<span class="ruler-val">${fmtBand(val)}</span></span></div>
    <div class="ruler-track"><div class="ruler-line"></div>${ticks.join('')}
      ${val != null ? `<div class="ruler-fill" style="width:${pct(val)}"></div>` : ''}
      <i class="ruler-target min" style="left:${pct(minTarget)}" title="Minimum ${minTarget}"></i>
      <i class="ruler-target" style="left:${pct(target)}" title="Target ${target}"></i>
      ${val != null ? `<i class="ruler-dot" style="left:${pct(val)}"></i>` : ''}</div>
    <div class="ruler-labels">${labels}</div></div>`;
}
function aiStatusNote() {
  if (AI.state === 'ready') return '';
  if (AI.state === 'loading') return '<div class="note">Connecting to Claude for grading…</div>';
  if (AI.state === 'denied') return '<div class="note warn">Claude access was declined for this page, so grading is off for this visit. Reload to be asked again.</div>';
  return '<div class="note warn">AI grading needs this page to be open inside Claude. Here you can still practise, see model answers and assess yourself.</div>';
}

/* ---------- Arabic explanation of selected text (reading passages, transcripts, feedback) ---------- */
let LAST_SEL = { text: '', context: '', range: null };
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const text = sel.toString().trim();
  if (!text || text.length > 80) return;
  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  const zone = node && node.closest && node.closest('[data-explain]');
  if (!zone) return;
  const para = node.closest('p, .para, .line, li, div');
  LAST_SEL = { text, context: para ? para.textContent.trim().slice(0, 400) : '', range: sel.getRangeAt(0).cloneRange() };
});
ACT.explainSel = async (el) => {
  const box = document.getElementById(el.dataset.out || 'explain-out');
  const term = LAST_SEL.text;
  if (!term) { toast('Select a word or phrase in the text first.'); return; }
  if (!aiReady()) { box.hidden = false; box.innerHTML = `<div class="note warn">${esc(aiErrorText({ code: 'absent' }))}</div>`; return; }
  box.hidden = false;
  box.innerHTML = `<div class="ai-wait"><span class="spinner"></span>Explaining “${esc(term)}” in Arabic…</div>`;
  try {
    const text = await aiText(explainArabicPrompt(term, LAST_SEL.context), {
      tier: 'quick',
      onText: ({ text: t }) => { box.innerHTML = `<div class="ar-box"><div class="xs faint" dir="ltr" style="text-align:left">${esc(term)}</div><div class="ar" lang="ar">${esc(t)}</div></div>`; },
    });
    box.innerHTML = `<div class="ar-box"><div class="row-between"><b dir="ltr">${esc(term)}</b><button class="btn quiet small" data-act="closeBox" data-box="${esc(box.id)}">Close</button></div><div class="ar" lang="ar">${esc(text)}</div></div>`;
  } catch (e) {
    box.innerHTML = `<div class="note warn">${esc(aiErrorText(e))}</div>`;
  }
};
ACT.closeBox = (el) => { const b = document.getElementById(el.dataset.box); if (b) { b.hidden = true; b.innerHTML = ''; } };
ACT.highlightSel = () => {
  const r = LAST_SEL.range;
  if (!r) { toast('Select some text in the passage first.'); return; }
  try {
    const m = document.createElement('mark');
    r.surroundContents(m);
    window.getSelection().removeAllRanges();
    LAST_SEL = { text: '', context: '', range: null };
  } catch { toast('Highlight within one paragraph at a time.'); }
};
const selTools = (out) => `<div class="sel-tools"><button class="btn ghost small" data-act="highlightSel">Highlight selection</button><button class="btn ghost small ar-btn" data-act="explainSel" data-out="${out}">Explain selection · شرح بالعربية</button></div><div id="${out}" hidden></div>`;
ACT.toggleAr = (el) => {

/* ---------- events ---------- */
function bindEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
    fn(el, e);
  });
  const onField = (e) => {
    const el = e.target;
    if (RUN && RUN.quiz && (el.dataset.q || el.dataset.multi)) {
      const textual = el.tagName === 'INPUT' && el.type === 'text';
      if (textual ? e.type === 'input' : e.type === 'change') quizInputHandler(RUN.quiz, el);
    }
    if (el.dataset.ch && CHG[el.dataset.ch]) CHG[el.dataset.ch](el, e);
  };
  document.addEventListener('input', onField);
  document.addEventListener('change', onField);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && MODAL) closeModal('dismiss'); });
  window.addEventListener('beforeunload', () => { save(); });
}

  if (['target', 'minTarget', 'ttsRate'].includes(k)) v = +v;
  if (['readQuestions', 'autoArabic'].includes(k)) v = v === '1';
  if (['examDate', 'finalDate', 'startDate'].includes(k) && !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  if (p[k] === v) return;

  if (['startDate', 'dailyMinutes', 'lightDay', 'mockDay', 'examDate', 'target'].includes(k)) {
    const t = today();
    S.days = Object.fromEntries(Object.entries(S.days).filter(([d]) => d < t));
    const wk = planPos(t).week;

/* ---------- AI-generated practice items ---------- */
function genCard(kind) {
  if (AI.state !== 'ready') return `<div class="card flat"><h2>Need more ${kind === 'reading' ? 'passages' : 'recordings'}?</h2>${aiStatusNote()}</div>`;
  const topics = ['technology', 'education', 'work', 'science', 'environment', 'health', 'society', 'history', 'business'];
  return `<div class="card flat"><h2>Make a new ${kind === 'reading' ? 'passage' : 'listening section'} with Claude</h2>
    <p class="small muted">Claude writes an original ${kind === 'reading' ? 'passage with 13 questions' : 'script with 10 questions'} in IELTS format. It takes about a minute. Answer keys are checked automatically for structure, but treat AI-made keys with a little more caution than the built-in set.</p>
    <div class="row">${kind === 'reading'
    ? `<select class="input" id="gen-level" style="width:auto"><option value="1">Passage 1 level</option><option value="2" selected>Passage 2 level</option><option value="3">Passage 3 level</option></select><select class="input" id="gen-topic" style="width:auto">${topics.map((t) => `<option>${t}</option>`).join('')}</select>`
    : `<select class="input" id="gen-section" style="width:auto">${[1, 2, 3, 4].map((s) => `<option value="${s}" ${s === 3 ? 'selected' : ''}>Section ${s}</option>`).join('')}</select>`}
    <button class="btn" data-act="genItem" data-kind="${kind}">Generate</button></div>
    <div id="gen-out"></div></div>`;
}
let GEN_CTL = null;
ACT.genItem = async (el) => {
  const kind = el.dataset.kind; const out = $('#gen-out');
  const args = kind === 'reading' ? { level: +$('#gen-level').value, topic: $('#gen-topic').value } : { section: +$('#gen-section').value };
  el.disabled = true;
  GEN_CTL = new AbortController();
  out.innerHTML = `<div class="ai-wait"><span class="spinner"></span>Claude is writing your ${kind === 'reading' ? 'passage' : 'script'}… <button class="btn quiet small" data-act="genStop">Stop</button></div><div class="stream-box" id="gen-stream"></div>`;
  try {
    const item = await aiJson(kind === 'reading' ? genReadingPrompt(args) : genListeningPrompt(args), {
      tier: 'default', cache: false, signal: GEN_CTL.signal,
      onText: ({ text }) => { const s = $('#gen-stream'); if (s) s.textContent = text.slice(-600); },
    });
    const problems = checkGenerated(item, kind);
    if (problems.length) throw { code: 'bad_item', problems };
    const id = `g${kind[0]}${uid()}`;
    item.id = id; item.generated = true;
    if (kind === 'reading') { item.level = args.level; item.topic = item.topic || args.topic; }
    else { item.section = args.section; item.speakers = item.speakers || { N: { role: 'Narrator', accent: 'en-GB', voice: 'female' } }; }
    saveDoc(id, { type: 'gen', kind, item, date: today() });
    S.gen.push({ id, kind, title: item.title, date: today() });
    save();
    toast('New practice item ready');
    go(kind === 'reading' ? 'readingRun' : 'listeningRun', { ids: [id] });
  } catch (e) {
    el.disabled = false;
    out.innerHTML = `<div class="note warn">${e?.code === 'bad_item' ? `The generated item failed the format check (${esc(e.problems.slice(0, 3).join('; '))}). Tap Generate to try again.` : esc(aiErrorText(e))}</div>`;
  }
};
ACT.genStop = () => { if (GEN_CTL) GEN_CTL.abort(); };

/* ---------- Reading run (1 passage, or 3 in a mock) ---------- */
VIEWS.readingRun = {
  study: true,
  html({ ids, placement, mockWeek }) {
    const items = ids.map(findReading).filter(Boolean);
    if (!items.length) return `<div class="empty">This passage is no longer available. ${backBtn('reading', 'Back to reading')}</div>`;
    const quiz = makeQuiz(items);
    const minutes = mockWeek ? 60 : placement ? 15 : 20;
    RUN = {
      kind: 'reading', items, quiz, placement, mockWeek, pi: 0, pane: 'passage',
      timer: new Countdown(minutes * 60, { id: 'run-timer', onEnd: () => toast('Time is up. Finish your answers and submit.') }),
      dirty: () => !quiz.submitted && answeredCount(quiz) > 0,
      cleanup() { this.timer.stop(); },
      keepAlive: () => RUN && RUN.timer && RUN.timer.running,
    };
    const back = mockWeek ? backBtn('mockRun', 'Mock exam', { week: mockWeek }) : placement ? backBtn('placement', 'Placement test') : backBtn('reading', 'Reading');
    return `${back}
      <div class="run-bar">${timerHtml('run-timer', 'Reading timer')}<span class="small muted" id="answered">0/${quiz.total} answered</span><div class="grow"></div><button class="btn small" data-act="submitReading" id="submit-btn">Submit answers</button></div>
      <div class="pane-tabs only-narrow" role="group" aria-label="Show"><div class="seg"><button data-act="readPane" data-p="passage" aria-pressed="true">Passage</button><button data-act="readPane" data-p="questions" aria-pressed="false">Questions 1–${quiz.total}</button></div></div>
      <div class="split wide">
        <div class="pane" id="pane-passage">${readingPassagesHtml()}</div>
        <div class="pane" id="pane-questions"><div id="read-result"></div><div class="stack-lg" id="qpane">${quiz.parts.map((p) => `${items.length > 1 ? `<h2>Passage ${p.idx + 1}</h2>` : ''}${renderQuizPart(quiz, p)}`).join('')}</div>
          <div class="btn-row" style="margin-top:16px"><button class="btn" data-act="submitReading">Submit answers</button></div></div>
      </div>`;
  },
  mount() {
    if (!RUN) return;
    RUN.timer.paint(); RUN.timer.start();
    paneLayout();
    window.addEventListener('resize', paneLayout);
    const prev = RUN.cleanup; RUN.cleanup = function () { prev.call(this); window.removeEventListener('resize', paneLayout); };
  },
};
function readingPassagesHtml() {
  const { items, pi } = RUN;
  const tabs = items.length > 1 ? `<div class="seg" role="group" aria-label="Passage">${items.map((_, i) => `<button data-act="readPassage" data-i="${i}" aria-pressed="${i === pi}">Passage ${i + 1}</button>`).join('')}</div>` : '';
  const it = items[pi];
  return `<div class="card"><div class="stack">${tabs}${selTools('explain-out')}</div>
    <article class="passage" data-explain="1"><div class="eyebrow">Reading passage${items.length > 1 ? ` ${pi + 1}` : ''} · Questions ${RUN.quiz.parts[pi].offset + 1}–${RUN.quiz.parts[pi].offset + countQuestions(it)}</div><h2>${esc(it.title)}</h2>

function paneLayout() {
  if (!RUN || !RUN.quiz) return;
  const wide = window.matchMedia('(min-width: 980px)').matches;
  const pp = $('#pane-passage'), pq = $('#pane-questions');
  if (!pp || !pq) return;
  pp.hidden = !wide && RUN.pane !== 'passage';
  pq.hidden = !wide && RUN.pane !== 'questions';
}
ACT.readPane = (el) => {
  RUN.pane = el.dataset.p;
  $$('[data-act="readPane"]').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
  paneLayout(); window.scrollTo(0, 0);
};
ACT.readPassage = (el) => { RUN.pi = +el.dataset.i; $('#pane-passage').innerHTML = readingPassagesHtml(); };
ACT.qpick = (el) => { if (RUN && RUN.quiz) quizPick(RUN.quiz, el); };

ACT.submitReading = () => {
  const R = RUN; if (!R || R.quiz.submitted) return;
  const unanswered = R.quiz.total - answeredCount(R.quiz);
  const doIt = () => finishReading(R);
  if (unanswered > 0) confirmModal({ title: 'Submit now?', body: `${plural(unanswered, 'question')} still unanswered. In the exam a blank scores zero, so guess if you can.`, ok: 'Submit', cancel: 'Keep working', onOk: doIt });
  else doIt();
};
function finishReading(R) {
  const quiz = R.quiz;
  quiz.submitted = true; R.timer.stop();
  quiz.result = scoreQuiz(quiz);
  const { correct, total, byType } = quiz.result;
  const full = R.items.length >= 3;
  const adj = full ? 0 : levelAdjust(R.items[0].level);
  const band = rawToBand('R', correct, total, adj);
  const repeat = !R.placement && !R.mockWeek && R.items.some((it) => isDone('reading', it.id));
  recordQTypeStats(byType);
  if (R.placement) placementRecord('R', band, `${correct}/${total}`);
  else if (R.mockWeek) mockRecord(R.mockWeek, 'R', { correct, total, band });
  else {
    addScore({ skill: 'R', band, ref: R.items[0].id, raw: `${correct}/${total}`, label: `Reading: ${R.items[0].title}${repeat ? ' (repeat)' : ''}`, weight: repeat ? 0.3 : 0.6 });
    completeTask('read', R.items[0].id);
  }
  R.items.forEach((it) => { if (!R.placement) S.done[`reading:${it.id}`] = { date: today(), score: correct, total, band }; });
  save();
  $('#qpane').innerHTML = quiz.parts.map((p) => `${R.items.length > 1 ? `<h2>Passage ${p.idx + 1}</h2>` : ''}${renderQuizPart(quiz, p)}`).join('');
  $$('#submit-btn, [data-act="submitReading"]').forEach((b) => { b.disabled = true; });
  const used = Math.round(R.timer.elapsed / 60);
  $('#read-result').innerHTML = `<div class="card hero" style="margin-bottom:16px">
    <div class="eyebrow">Result</div>
    <div class="score-hero"><div class="big-band">${correct}<small>/${total}</small></div><div><div class="mono" style="font-size:1.5rem">≈ ${fmtBand(band)}</div><div class="xs faint">estimated band${adj ? ' (−0.5 for an easier Passage 1 text)' : ''}</div></div></div>

    ${byTypeHtml(byType)}

async function gradeWriting(R) {
  R.status = 'grading'; R.timer.pause();
  R.ctl = new AbortController();
  const minutes = Math.round(R.timer.elapsed / 60);
  $('#wr-body').innerHTML = `<div class="card hero"><div class="ai-wait"><span class="spinner"></span><span>Claude is marking ${R.tasks.length > 1 ? 'both tasks' : 'your response'} on the four criteria. This usually takes 30–90 seconds.</span></div>
    ${R.tasks.map((t, i) => `<div class="stream-box" id="stream-${i}"></div>`).join('')}
    <div><button class="btn quiet small" data-act="stopGrading">Stop</button></div></div>`;
  try {
    const results = await Promise.all(R.tasks.map((t, i) => aiJson(writingGradePrompt({
      task: t.task, prompt: t.item.prompt, chart: t.task === 1 ? t.item.chart : null, text: t.text,
      words: wordCount(t.text), minutes: R.tasks.length > 1 ? null : minutes, essayType: t.item.essayType,
    }), { tier: 'complex', signal: R.ctl.signal, onText: ({ text }) => { const s = $(`#stream-${i}`); if (s) s.textContent = text.slice(-500); } })));
    const atts = R.tasks.map((t, i) => buildWritingAttempt(t, results[i], minutes));
    if (atts.some((a) => a == null)) throw { code: 'invalid_json' };
    finishWriting(R, atts);
  } catch (e) {
    R.status = 'writing';
    if (RUN !== R) return;
    $('#wr-body').innerHTML = `<div class="note warn">${esc(aiErrorText(e))}</div>${writingEditorHtml()}`;
    $('#wr-body .note').insertAdjacentHTML('beforeend', ' <button class="btn small" data-act="submitWriting">Try again</button>');
    R.timer.paint(); updateWordCount();
  }
}
ACT.stopGrading = () => { if (RUN && RUN.ctl) RUN.ctl.abort(); };

function buildWritingAttempt(t, fb, minutes) {
  if (!fb || !fb.criteria) return null;
  const keys = t.task === 1 ? ['TA', 'CC', 'LR', 'GRA'] : ['TR', 'CC', 'LR', 'GRA'];
  const crit = {};
  keys.forEach((k) => {
    const c = fb.criteria[k] || (k === 'TA' ? fb.criteria.TR : k === 'TR' ? fb.criteria.TA : null) || {};
    crit[k] = { band: clamp(Math.round(Number(c.band) || 0), 0, 9), comment: String(c.comment || ''), fix: String(c.fix || '') };
  });
  const band = floorHalf(sum(keys.map((k) => crit[k].band)) / 4);
  return {
    id: `att_${uid()}`, type: 'att', kind: t.task === 1 ? 'task1' : 'task2', ref: t.id, date: today(), ts: Date.now(),
    text: t.text, words: wordCount(t.text), minutes,
    feedback: {
      criteria: crit, summary: String(fb.summary || ''), strengths: (fb.strengths || []).map(String),
      mistakes: (fb.mistakes || []).filter((m) => m && m.quote).map((m) => ({ quote: String(m.quote), correction: String(m.correction || ''), type: String(m.type || ''), explanation: String(m.explanation || ''), ar: String(m.ar || '') })),
      improved: String(fb.improved || ''), nextSteps: (fb.nextSteps || []).map(String),
    },
    band,
  };
}
function weakestCrit(crit) { return Object.entries(crit).sort((a, b) => a[1].band - b[1].band)[0]?.[0]; }

function finishWriting(R, atts) {
  R.status = 'done';
  atts.forEach((a) => {
    saveDoc(a.id, a);
    const t = R.tasks.find((x) => x.id === a.ref);
    S.journal.unshift({ id: a.id, kind: a.kind, ref: a.ref, title: t.item.title || t.item.prompt.slice(0, 80), date: a.date, band: a.band, words: a.words, crit: Object.fromEntries(Object.entries(a.feedback.criteria).map(([k, v]) => [k, v.band])), top: a.feedback.mistakes.slice(0, 5).map((m) => ({ quote: m.quote, correction: m.correction })), mock: R.mockWeek || null });
    S.done[`${a.kind}:${a.ref}`] = { date: a.date, band: a.band };
    LS.del(draftKey(a.ref));
  });
  LS.del(R.timeKey);
  const t2 = atts.find((a) => a.kind === 'task2'); const t1 = atts.find((a) => a.kind === 'task1');
  S.lastCrit.W = weakestCrit((t2 || t1).feedback.criteria);
  if (R.placement) placementRecord('W', t2.band, `Task 2, ${t2.words} words`);
  else if (R.mockWeek) {
    const band = t1 && t2 ? floorHalf((t1.band + 2 * t2.band) / 3) : (t2 || t1).band;
    mockRecord(R.mockWeek, 'W', { band, t1: t1?.band ?? null, t2: t2?.band ?? null, atts: atts.map((a) => a.id) });
  } else {
    atts.forEach((a) => {
      addScore({ skill: 'W', band: a.band, ref: a.ref, raw: `${a.words} words`, label: `Writing Task ${a.kind === 'task1' ? 1 : 2}`, weight: a.kind === 'task1' ? 0.5 : 1 });
      completeTask(a.kind === 'task1' ? 't1' : 't2', a.ref);
    });

function markMistakes(text, mistakes) {
  const spans = [];
  mistakes.forEach((m, i) => {
    const q = (m.quote || '').trim(); if (q.length < 2) return;
    let from = 0, idx;
    while ((idx = text.indexOf(q, from)) !== -1) {
      if (!spans.some((s) => idx < s.end && idx + q.length > s.start)) { spans.push({ start: idx, end: idx + q.length, i }); break; }
      from = idx + 1;
    }
  });
  spans.sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  spans.forEach((s) => { out += esc(text.slice(pos, s.start)) + `<mark class="err" title="${esc(mistakes[s.i].correction)}">${esc(text.slice(s.start, s.end))}<sup class="mono">${s.i + 1}</sup></mark>`; pos = s.end; });
  out += esc(text.slice(pos));
  return out.split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
}

function buildSpeakSteps({ mode, topic, card, mockWeek }) {
  const unseen = (list, kind) => list.find((x) => !x.placement && !isDone(kind, x.id)) || pick(list.filter((x) => !x.placement));
  if (mode === 'placement') {
    const t = CONTENT.speaking.part1.find((x) => x.placement); const c = CONTENT.speaking.part2.find((x) => x.placement);
    return { steps: [...t.questions.slice(0, 3).map((q) => ({ part: 1, q })), { part: 2, card: c }], topic: t, card: c };
  }
  if (mode === 'p1') { const t = findTopic(topic) || unseen(CONTENT.speaking.part1, 'p1'); return { steps: t.questions.slice(0, 5).map((q) => ({ part: 1, q })), topic: t }; }
  if (mode === 'p23') { const c = findCard(card) || unseen(CONTENT.speaking.part2, 'p2'); return { steps: [{ part: 2, card: c }, ...c.part3.questions.slice(0, 4).map((q) => ({ part: 3, q }))], card: c }; }
  const t = (mockWeek && findTopic(S.mocks[mockWeek]?.content?.P1)) || unseen(CONTENT.speaking.part1, 'p1');
  const c = (mockWeek && findCard(S.mocks[mockWeek]?.content?.P2)) || unseen(CONTENT.speaking.part2, 'p2');
  return { steps: [...t.questions.slice(0, 4).map((q) => ({ part: 1, q })), { part: 2, card: c }, ...c.part3.questions.slice(0, 4).map((q) => ({ part: 3, q }))], topic: t, card: c };
}

  ans.sec = Math.max(ans.sec, (ans.last - ans.first) / 1000 + 2);
  const c = $('#sp-clock'); if (c) c.textContent = fmtClock(ans.sec);
  const n = $('#sp-next'); if (n) n.disabled = !el.value.trim();
  const st = R.steps[R.i];
  if (st.part === 2 && R.timer && !R.timer.running && !R.timer.ended) R.timer.start();
};
ACT.spPrep = () => {
  const R = RUN; R.phase = 'prep';
  R.timer = new Countdown(60, { id: 'sp-timer', onEnd: () => { toast('Preparation time is over. Start talking.'); ACT.spTalk(); } });
  paintSpeak(); R.timer.paint(); R.timer.start();
};
ACT.spTalk = () => {
  const R = RUN; if (!R) return;
  if (R.timer) R.timer.stop();
  R.phase = 'talk';
  R.timer = new Countdown(120, { id: 'sp-timer', onEnd: () => { toast('Two minutes. The examiner stops you here.'); if (R.recording) ACT.spStop(); R.phase = 'talk-done'; paintSpeak(); } });
  paintSpeak(); R.timer.paint();
  if (R.method === 'speech') ACT.spRecord();
};
ACT.spRecord = () => {
  const R = RUN; if (!R) return;
  TTS.stop();
  const ans = R.answers[R.i];
  const st = R.steps[R.i];
  ans.a = ''; ans.sec = 0;
  const ok = Rec.start({
    onText: (fin, interim) => { ans.a = fin.trim(); const l = $('#sp-live'); if (l) l.innerHTML = `${esc(fin)}<span class="interim">${esc(interim)}</span>`; },
    onFail: () => {
      R.recording = false; clearInterval(R.clock);
      R.method = isTouch() ? 'dictation' : 'typed';
      paintSpeak();
      $('#sp-body').insertAdjacentHTML('afterbegin', `<div class="note warn">The microphone is blocked in this view, so live transcription is off. ${R.method === 'dictation' ? 'Use your keyboard’s dictation key to speak your answer into the box.' : 'Type your answer, or open the page on your phone and use keyboard dictation.'}</div>`);
    },
  });
  if (!ok) return;
  R.recording = true; R.recStart = Date.now();
  clearInterval(R.clock);
  R.clock = setInterval(() => { const c = $('#sp-clock'); if (c) c.textContent = fmtClock((Date.now() - R.recStart) / 1000); }, 500);
  if (st.part === 2 && R.timer && !R.timer.running) R.timer.start();
  paintSpeak();
};
ACT.spStop = () => {
  const R = RUN; if (!R || !R.recording) return;
  const text = Rec.stop();
  R.recording = false; clearInterval(R.clock);
  const ans = R.answers[R.i];
  ans.a = text || ans.a; ans.sec = (Date.now() - R.recStart) / 1000;
  if (R.timer && R.steps[R.i].part === 2) R.timer.pause();
  if (!ans.a) toast('Nothing was heard. Check the microphone and try again.');
  paintSpeak();
};
ACT.spNext = () => {
  const R = RUN; if (!R) return;
  if (R.recording) ACT.spStop();
  if (R.timer) { R.timer.stop(); R.timer = null; }
  if (R.i < R.steps.length - 1) {
    R.i++; R.phase = R.steps[R.i].part === 2 ? 'cue' : 'q';
    paintSpeak(); askQuestion();
  } else { R.phase = 'review'; paintSpeak(); }
  window.scrollTo(0, 0);
};

/* Typed answers have no real speaking time, and a pasted or instantly-dictated answer gives an impossible
   rate; such timings are dropped so they never reach the examiner prompt. */
function validSec(R, a) {
  if (R.method === 'typed' || !a.sec) return 0;
  const w = wordCount(a.a);
  return w / (a.sec / 60) <= 260 ? a.sec : 0;
}
function speakStats(R) {
  const words = sum(R.answers.map((a) => wordCount(a.a)));
  const timed = R.answers.filter((a) => validSec(R, a) > 0);
  const secs = sum(timed.map((a) => validSec(R, a)));
  const timedWords = sum(timed.map((a) => wordCount(a.a)));
  return { words, secs, wpm: secs > 20 ? Math.round(timedWords / (secs / 60)) : null };
}
function speakReviewHtml() {
  const R = RUN; const st = speakStats(R);
  return `<div class="card hero"><h1>Check before grading</h1>
      <p class="muted">${st.words} words${st.secs ? ` in ${fmtClock(st.secs)} of timed speaking` : ''}${st.wpm ? `, about ${st.wpm} words per minute` : ''}. ${aiReady() ? 'Claude grades the transcript; pronunciation cannot be judged from text, so it is not scored.' : ''}</p>
      ${aiStatusNote()}
      <div class="btn-row">${aiReady() ? '<button class="btn" data-act="spGrade">Get feedback from Claude</button>' : '<button class="btn" data-act="spSelf">Assess myself</button>'}</div></div>
    <div class="card">${R.steps.map((s, i) => `<div class="mistake"><div class="xs faint">Part ${s.part} · ${R.answers[i].sec ? fmtClock(R.answers[i].sec) : 'time not measured'} · ${wordCount(R.answers[i].a)} words</div><b>${esc(s.part === 2 ? s.card.cue : s.q)}</b><div>${esc(R.answers[i].a) || '<span class="faint">(no answer)</span>'}</div></div>`).join('')}</div>`;
}

ACT.spGrade = async () => {
  const R = RUN; if (!R) return;
  R.phase = 'grading';
  R.ctl = new AbortController();
  const st = speakStats(R);
  $('#sp-body').innerHTML = `<div class="card hero"><div class="ai-wait"><span class="spinner"></span>Claude is assessing Fluency, Vocabulary and Grammar. This usually takes 30–60 seconds.</div><div class="stream-box" id="sp-stream"></div><div><button class="btn quiet small" data-act="spStopGrade">Stop</button></div></div>`;
  try {
    const parts = R.steps.map((s, i) => ({ part: s.part, q: s.part === 2 ? `${s.card.cue} You should say: ${s.card.bullets.join('; ')}; ${s.card.finalBullet}` : s.q, a: R.answers[i].a, sec: validSec(R, R.answers[i]) }));
    const fb = await aiJson(speakingGradePrompt({ parts, method: R.method, totalWords: st.words, totalSec: st.secs }), {
      tier: 'complex', signal: R.ctl.signal, onText: ({ text }) => { const s = $('#sp-stream'); if (s) s.textContent = text.slice(-500); },
    });
    if (!fb || !fb.criteria) throw { code: 'invalid_json' };
    finishSpeaking(R, fb, st);
  } catch (e) {
    if (RUN !== R) return;
    R.phase = 'review'; paintSpeak();
    $('#sp-body').insertAdjacentHTML('afterbegin', `<div class="note warn">${esc(aiErrorText(e))}</div>`);
  }
};
ACT.spStopGrade = () => { if (RUN && RUN.ctl) RUN.ctl.abort(); };

function finishSpeaking(R, fb, st) {
  R.phase = 'done';
  const crit = {};
  ['FC', 'LR', 'GRA'].forEach((k) => { const c = fb.criteria[k] || {}; crit[k] = { band: clamp(Math.round(Number(c.band) || 0), 0, 9), comment: String(c.comment || ''), fix: String(c.fix || '') }; });
  const band = floorHalf((crit.FC.band + crit.LR.band + crit.GRA.band) / 3);
  const a = {
    id: `att_${uid()}`, type: 'att', kind: 'speaking', mode: R.mode, date: today(), ts: Date.now(), method: R.method,
    answers: R.steps.map((s, i) => ({ part: s.part, q: s.part === 2 ? s.card.cue : s.q, a: R.answers[i].a, sec: Math.round(R.answers[i].sec || 0) })),
    stats: st, band,
    feedback: {
      criteria: crit, summary: String(fb.summary || ''), fluencyNotes: (fb.fluencyNotes || []).map(String),
      mistakes: (fb.mistakes || []).filter((m) => m && m.quote).map((m) => ({ quote: String(m.quote), correction: String(m.correction || ''), explanation: String(m.explanation || ''), ar: String(m.ar || '') })),
      betterAnswers: (fb.betterAnswers || []).map((b) => ({ q: String(b.q || ''), answer: String(b.answer || '') })),
      nextSteps: (fb.nextSteps || []).map(String),
    },
  };
  saveDoc(a.id, a);
  const title = R.mode === 'p1' ? R.topic.topic : R.card ? R.card.cue : 'Speaking';
  S.journal.unshift({ id: a.id, kind: 'speaking', ref: R.card?.id || R.topic?.id, title, date: a.date, band, crit: { FC: crit.FC.band, LR: crit.LR.band, GRA: crit.GRA.band }, top: a.feedback.mistakes.slice(0, 5).map((m) => ({ quote: m.quote, correction: m.correction })), mock: R.mockWeek || null });
  S.lastCrit.S = weakestCrit(crit);
  if (R.topic && !R.topic.placement) S.done[`p1:${R.topic.id}`] = { date: a.date, band };
  if (R.card && !R.card.placement) S.done[`p2:${R.card.id}`] = { date: a.date, band };
  const typed = R.method === 'typed';
  if (R.placement) placementRecord('S', band, `${st.words} words${typed ? ', typed' : ''}`);
  else if (R.mockWeek) mockRecord(R.mockWeek, 'S', { band, att: a.id, method: R.method });
  else {
    const w = (R.mode === 'p1' ? 0.5 : R.mode === 'p23' ? 0.8 : 1) * (typed ? 0.5 : 1);
    addScore({ skill: 'S', band, ref: a.id, raw: `${st.words} words`, label: `Speaking ${R.mode === 'p1' ? 'Part 1' : R.mode === 'p23' ? 'Parts 2–3' : 'full test'}${typed ? ' (typed)' : ''}`, weight: w });
    completeTask(R.mode === 'p1' ? 'speak1' : R.mode === 'p23' ? 'speak' : ['speak', 'speak1']);
  }
  save();
  $('#sp-body').innerHTML = speakingFeedbackHtml(a) + `<div class="btn-row">${R.placement ? '<button class="btn" data-act="nav" data-to="placement">Back to the placement test</button>' : R.mockWeek ? `<button class="btn" data-act="toMock" data-w="${R.mockWeek}">Back to the mock exam</button>` : '<button class="btn" data-act="nav" data-to="today">Back to today</button><button class="btn ghost" data-act="nav" data-to="speaking">More speaking</button>'}</div>`;
  window.scrollTo(0, 0);
}

  const methodNote = a.method === 'typed' ? 'You typed these answers, so this estimate is only indicative.' : a.method === 'dictation' ? 'Dictation removes hesitations, so fluency is judged from length, speed and development.' : 'Speech recognition can mishear words; obvious recognition errors were ignored.';

  </div>`;
}

ACT.flashStart = () => {
  const due = dueWords().map((w) => ({ w, isNew: false }));
  const fresh = newWordsToday().map((v) => ({ w: v.w, isNew: true }));
  // New words first (to learn), then reviews, interleaved a little.
  const queue = [...fresh, ...due].filter((x) => wordData(x.w));
  if (!queue.length) { toast('Nothing due right now.'); return; }
  RUN = {
    kind: 'vocab', queue, idx: 0, shown: false, reviewed: 0,
    dirty: () => false, cleanup() { if (this.reviewed) { completeTask('vocab'); save(); } }, keepAlive: () => true,
  };

};
function paintFlash() {
  const R = RUN; const root = $('#flash-root'); if (!root || !R || R.kind !== 'vocab') return;

ACT.flashShow = () => { RUN.shown = true; paintFlash(); };
ACT.flashGrade = (el) => {
  const R = RUN; if (!R || R.kind !== 'vocab') return;
  const q = +el.dataset.q; const item = R.queue[R.idx];
  if (item.isNew) {
    const pos = VOCAB_ORDER.findIndex((v) => v.w === item.w);
    if (S.vocab.newDate !== today()) { S.vocab.newDate = today(); S.vocab.newCount = 0; }

  srsGrade(item.w, q);
  R.reviewed++;
  if (q === 0) R.queue.splice(Math.min(R.idx + 4, R.queue.length), 0, { w: item.w, isNew: false });
  R.idx++; R.shown = false;
  saveSrs(); save({ cloud: false });
  paintFlash();
};

CHG.gpick = (el) => {
  const R = RUN; if (!R || R.kind !== 'grammar' || el.type !== 'radio' || !el.checked) return;
  const i = +el.dataset.i; if (R.picks[i] != null) return;
  R.picks[i] = +el.value;
  const g = R.g;
  if (Object.keys(R.picks).length === g.exercise.length) {
    const score = Object.entries(R.picks).filter(([k, p]) => g.exercise[k].answer === p).length;
    S.grammar[g.id] = { score, total: g.exercise.length, date: today() };
    completeTask('grammar', g.id);
    save();
  }
  $('#g-ex').innerHTML = grammarExerciseHtml();
};

/* ---------- Mock exams ---------- */
function mockDate(week) {
  const days = buildWeek(week, S.weekEst[week] || estimates());
  return days.find((d) => d.tasks.includes('mockLR'))?.date || weekStart(week);
}
function ensureMock(week) {
  if (S.mocks[week]) return S.mocks[week];
  const used = new Set(Object.values(S.mocks).flatMap((m) => [...m.content.L, ...m.content.R, m.content.T1, m.content.T2, m.content.P1, m.content.P2]));
  const best = (list, kind) => list.find((x) => !used.has(x.id) && !isDone(kind, x.id)) || list.find((x) => !used.has(x.id)) || list[0];
  const L = [1, 2, 3, 4].map((s) => best([...CONTENT.listening, ...genItems('listening')].filter((x) => !x.placement && x.section === s), 'listening')?.id).filter(Boolean);
  const R = [1, 2, 3].map((lv) => best([...CONTENT.reading, ...genItems('reading')].filter((x) => !x.placement && x.level === lv), 'reading')?.id).filter(Boolean);
  const content = {
    L, R,
    T1: best(CONTENT.task1, 'task1').id,
    T2: best(CONTENT.task2.filter((x) => !x.placement), 'task2').id,
    P1: best(CONTENT.speaking.part1.filter((x) => !x.placement), 'p1').id,
    P2: best(CONTENT.speaking.part2.filter((x) => !x.placement), 'p2').id,
  };
  S.mocks[week] = { week, created: today(), content, parts: {}, overall: null };
  save();
  return S.mocks[week];
}
function mockRecord(week, skill, data) {
  const m = ensureMock(week);
  m.parts[skill] = { ...data, date: today() };
  const raw = data.correct != null ? `${data.correct}/${data.total}` : skill === 'W' && data.t1 != null ? `T1 ${fmtBand(data.t1)} · T2 ${fmtBand(data.t2)}` : '';
  S.scores = S.scores.filter((s) => !(s.kind === 'mock' && s.ref === `mock${week}` && s.skill === skill));
  addScore({ skill, band: data.band, kind: 'mock', ref: `mock${week}`, raw, label: `Week ${week} mock${data.self ? ' (self-assessed)' : ''}`, weight: data.self ? 0.4 : data.method === 'typed' ? 0.5 : 1 });
  if (m.parts.L && m.parts.R) completeTask('mockLR', String(week));
  if (m.parts.W && m.parts.S) completeTask('mockWS', String(week));
  if (SKILLS.every((k) => m.parts[k])) {
    const b = {}; SKILLS.forEach((k) => { b[k] = m.parts[k].band; });
    m.overall = overallBand(b);
  }
}

          <div class="field"><label for="acc-pass">Password</label><input class="input" id="acc-pass" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" minlength="8" required>${signup ? '<span class="xs faint">At least 8 characters.</span>' : ''}</div>
          <div id="acc-msg" aria-live="polite"></div>
          <div class="btn-row"><button class="btn" type="submit" id="acc-submit">${signup ? 'Create account' : 'Sign in'}</button></div>
        </form>
      </div>
      <p class="xs faint">Your password is stored only as a salted hash. Progress is stored privately and is visible only to you when signed in.</p>`;
  },
  mount({ mode = 'signup' }) {
    const form = $('#acc-form');
    if (!form) return;
    form.addEventListener('submit', (e) => { e.preventDefault(); submitAccount(mode === 'signup' ? 'register' : 'login'); });
  },
};
ACT.accMode = (el) => go('account', { mode: el.dataset.m });
async function submitAccount(action) {
  const msg = $('#acc-msg'); const btn = $('#acc-submit');
  const email = $('#acc-email').value.trim();
  const password = $('#acc-pass').value;
  const name = $('#acc-name') ? $('#acc-name').value.trim() : '';
  if (!/^\S+@\S+\.\S+$/.test(email)) { msg.innerHTML = '<div class="note bad">Enter a valid email address.</div>'; return; }
  if (password.length < 8) { msg.innerHTML = '<div class="note bad">Use a password of at least 8 characters.</div>'; return; }
  btn.disabled = true; msg.innerHTML = '<div class="ai-wait"><span class="spinner"></span>One moment…</div>';
  try {
    const r = await api('/api/auth', { method: 'POST', body: JSON.stringify({ action, email, password, name }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.user) { msg.innerHTML = `<div class="note bad">${esc(data.error || 'Something went wrong. Try again.')}</div>`; btn.disabled = false; return; }
    msg.innerHTML = '';
    await connectAccount(data.user, { interactive: true });
    toast(action === 'register' ? 'Account created. Your progress is saved.' : 'Signed in');
    go('today', {}, { force: true });
  } catch {
    msg.innerHTML = '<div class="note bad">Could not reach the server. Check your connection and try again.</div>';
    btn.disabled = false;
  }
}
ACT.signOut = () => {
  confirmModal({
    title: 'Sign out?', body: 'Your progress stays saved in your account. This device forgets it until you sign in again.', ok: 'Sign out',
    onOk: async () => { await signOut(); toast('Signed out'); go('account', { mode: 'signin' }, { force: true }); },
  });
};
function accountBanner() {
  if (Cloud.kind !== 'server' || Cloud.user) return '';
  return `<div class="card tint"><div class="row-between"><div style="min-width:0"><b>Save your progress</b><div class="small muted">Create a free account so your plan, scores and flashcards are kept on every device.</div></div>
    <div class="btn-row"><button class="btn small" data-act="nav" data-to="account">Create account</button><button class="btn small ghost" data-act="accMode" data-m="signin">Sign in</button></div></div></div>`;
}

/* ---------- start ---------- */
function buildContentIndex() {
  CONTENT.vocab.forEach((v) => { WORD_INDEX[v.w.toLowerCase()] = v; });
  buildVocabOrder();
}
function main() {
  applyTheme(getTheme());
  loadLocal();
  $('#app').innerHTML = shellHtml();
  TTS.init();
  bindEvents();
  initStudyTimer();
  buildContentIndex();
  const h = (location.hash || '').slice(1);
  if (['today', 'plan', 'practice', 'words', 'progress'].includes(h)) ROUTE = { name: h, params: {} };
  render();
  cloudInit();
  aiInit();
}
main();

</script>
