"explanation":"\"Under a microscope its surface is covered in tiny bumps, and those bumps are coated in wax.\" The leaf is not smooth, as people might assume."},{"n":6,"prompt":"Best-known product: a ____ for outside walls that is cleaned by rain","answer":["paint"],"explanation":"\"You might expect this idea to be used mainly for windows, but in fact the best-known product is a paint for outside walls.\""},{"n":7,"prompt":"Namib Desert beetle: collects water from ____ on its back","answer":["fog"],"explanation":"\"There's almost no rain there\", so the beetle survives by \"letting fog collect on its back\"."},{"n":8,"prompt":"Mesh nets based on the beetle are most useful in ____ areas","answer":["coastal"],"explanation":"\"Inland deserts rarely get fog, so they're most useful in coastal areas, where fog regularly comes in from the sea.\""},{"n":9,"prompt":"Pine cone: scales open and close in response to ____","answer":["humidity"],"explanation":"\"People often assume this is a reaction to temperature, but it's actually humidity.\""},{"n":10,"prompt":"Self-opening building panels are made from thin layers of ____","answer":["wood"],"explanation":"\"You might expect them to be made of plastic or metal, but they're made from thin layers of wood.\""}]}]},{"id":"l09","section":1,"title":"Booking a venue for a tech meetup","topic":"technology","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"A":{"role":"Tamsin, events coordinator","accent":"en-AU","voice":"female"},"B":{"role":"Sanjay, meetup organiser","accent":"en-IN","voice":"male"}},"script":[{"s":"N","t":"Section 1. You will hear a telephone conversation between a man who runs a monthly technology meetup and a woman who works at an events venue. First, you have some time to look at questions 1 to 6."},{"pause":25,"label":"Look at questions 1 to 6"},{"s":"N","t":"Now listen carefully and answer questions 1 to 6."},{"s":"A","t":"Good morning, Quayside Exchange events team, Tamsin speaking. How can I help?"},{"s":"B","t":"Hi, Tamsin. I run a meetup for local web developers, and I'm hoping to book one of your rooms for an evening session, with some food as well."},{"s":"A","t":"Lovely, we host quite a few tech groups. Can I start with your name?"},{"s":"B","t":"Sure, it's Sanjay Pillai. That's P, I, double L, A, I."},{"s":"A","t":"Thanks, Sanjay. And what's the group called?"},{"s":"B","t":"Brightwater Frontend. We meet once a month to talk about web design and JavaScript."},{"s":"A","t":"Great. And what date were you thinking of?"},{"s":"B","t":"A Thursday in November, ideally the fourteenth."},{"s":"A","t":"Let me check. I'm afraid the fourteenth is fully booked. The following Thursday, the twenty-first, is completely free, though."},{"s":"B","t":"Our speaker's quite flexible, so the twenty-first should be fine. Let's go with that."},{"s":"A","t":"Done. And roughly how many people are you expecting?"},{"s":"B","t":"Normally about fifty come along, but this time we've got a guest speaker from a big design agency, so seventy-two people have registered already. I'd plan for seventy-five, just to be safe."},{"s":"A","t":"Then the Harbour Room won't work, as it only seats sixty. I'd suggest the Lantern Room. It holds up to a hundred, and it has a built-in projector."},{"s":"B","t":"The Lantern Room sounds perfect. What's the hire charge?"},{"s":"A","t":"Our standard rate is sixty pounds an hour, but community and non-profit groups pay forty-five."},{"s":"B","t":"We're a non-profit, so that's great. We'd need it for three hours, from six until nine. Oh, and do we need to bring a cable for the projector?"},{"s":"A","t":"No, there's an HDMI cable in the room. But a lot of newer laptops don't have that port, so your speakers will need to bring their own adaptor."},{"s":"B","t":"Good point. I'll remind them about that."},{"s":"N","t":"Before you hear the rest of the conversation, you have some time to look at questions 7 to 10."},{"pause":25,"label":"Look at questions 7 to 10"},{"s":"N","t":"Now listen and answer questions 7 to 10."},{"s":"A","t":"Now, catering. Have you had a look at our menu options?"},{"s":"B","t":"I have. Last time we ordered pizza, but by the time the talk finished, it had all gone cold, so I'd rather avoid that."},{"s":"A","t":"Understandable. The hot buffet is very popular, but it's eighteen pounds a head."},{"s":"B","t":"That's more than our sponsor will cover. What about the sandwich platters?"},{"s":"A","t":"They're fine, but people tend to find them a bit dull for an evening event. Honestly, the mezze sharing platters are better value, and there are plenty of vegetarian choices."},{"s":"B","t":"Right, let's go for the mezze platters, then."},{"s":"A","t":"Good choice. The kitchen will need your final numbers in advance. It used to be a full week before the event, but they changed that this year, so now it's just three days before."},{"s":"B","t":"Three days. That really helps, because people always register at the last minute."},{"s":"A","t":"And for drinks, tea and coffee are two pounds per person, soft drinks are sold at the bar, and we put jugs of tap water on every table at no extra cost."},{"s":"B","t":"I think we'll just have the water, then. People can buy anything else at the bar themselves."},{"s":"A","t":"Finally, we ask for a deposit of fifty pounds to hold the room. Most people pay by card over the phone."},{"s":"B","t":"Ah, the group's card is with our treasurer, and she's away this week. Could I do a bank transfer instead?"},{"s":"A","t":"Of course. I'll email you our account details this afternoon, and you'll get a confirmation as soon as the money arrives."},{"s":"B","t":"Brilliant. Thanks so much for your help, Tamsin."},{"s":"N","t":"That is the end of section 1."}],"groups":[{"type":"gap","instructions":"Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.","title":"Quayside Exchange: event booking notes","wordLimit":"ONE WORD AND/OR A NUMBER","questions":[{"n":1,"prompt":"Organiser: Sanjay ____","answer":["Pillai"],"explanation":"Sanjay spells his surname: \"It's Sanjay Pillai. That's P, I, double L, A, I.\" Remember that \"double L\" means you write the letter L twice."},{"n":2,"prompt":"Date: Thursday ____ November","answer":["21st","21","twenty-first"],"explanation":"Sanjay first asks for \"the fourteenth\", but Tamsin says it is \"fully booked\" and offers \"the twenty-first\", which he accepts: \"the twenty-first should be fine\". The fourteenth is the distractor."},{"n":3,"prompt":"Number of guests to plan for: ____","answer":["75","seventy-five"],"explanation":"Sanjay mentions three numbers: \"Normally about fifty\", \"seventy-two people have registered\" and finally \"I'd plan for seventy-five, just to be safe.\" The note asks for the number to plan for."},{"n":4,"prompt":"Room: the ____ Room","answer":["Lantern"],"explanation":"The Harbour Room is rejected because \"it only seats sixty\". Tamsin suggests \"the Lantern Room\" and Sanjay says \"The Lantern Room sounds perfect.\""},{"n":5,"prompt":"Room hire: £____ per hour","answer":["45","forty-five","£45"],"explanation":"The \"standard rate is sixty pounds an hour\", but \"community and non-profit groups pay forty-five\", and Sanjay confirms \"We're a non-profit\". Sixty is the distractor."},{"n":6,"prompt":"Presenters must bring their own ____","answer":["adaptor","adapter"],"explanation":"Sanjay asks about a cable, but Tamsin says \"there's an HDMI cable in the room\". Instead, \"your speakers will need to bring their own adaptor\", so \"cable\" is wrong."}]},{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":7,"prompt":"Which catering option does Sanjay choose?","options":[{"key":"A","text":"pizza"},{"key":"B","text":"a hot buffet"},{"key":"C","text":"sandwich platters"},{"key":"D","text":"sharing platters"}],"answer":"D","explanation":"Pizza \"had all gone cold\" last time, the hot buffet is \"more than our sponsor will cover\", and sandwiches are \"a bit dull\". Sanjay decides: \"let's go for the mezze platters\"."},{"n":8,"prompt":"When must the final catering numbers be given to the kitchen?","options":[{"key":"A","text":"ten days before the event"},{"key":"B","text":"one week before the event"},{"key":"C","text":"three days before the event"},{"key":"D","text":"on the morning of the event"}],"answer":"C","explanation":"Tamsin says \"It used to be a full week before the event, but they changed that this year, so now it's just three days before.\" One week was the old rule, so B is a trap."},{"n":9,"prompt":"Which drinks will the group have at the event?","options":[{"key":"A","text":"tea and coffee"},{"key":"B","text":"soft drinks paid for by the group"},{"key":"C","text":"water provided free of charge"},{"key":"D","text":"a mixture of hot and cold drinks"}],"answer":"C","explanation":"Tamsin says there are \"jugs of tap water on every table at no extra cost\", and Sanjay replies \"I think we'll just have the water\". Tea and coffee cost \"two pounds per person\" and are not ordered."},{"n":10,"prompt":"How will Sanjay pay the deposit?","options":[{"key":"A","text":"by card over the phone"},{"key":"B","text":"by bank transfer"},{"key":"C","text":"in cash on the evening"},{"key":"D","text":"through the sponsor"}],"answer":"B","explanation":"Paying \"by card over the phone\" is mentioned, but the card \"is with our treasurer, and she's away\", so Sanjay asks \"Could I do a bank transfer instead?\" and Tamsin agrees."}]}]},{"id":"l10","section":2,"title":"Induction day at a software company","topic":"work","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"male"},"A":{"role":"Nadia Botha, head of people operations","accent":"en-ZA","voice":"female"}},"script":[{"s":"N","t":"Section 2. You will hear the head of people operations at a software company giving an induction talk to new members of staff. First, you have some time to look at questions 1 to 4."},{"pause":25,"label":"Look at questions 1 to 4"},{"s":"N","t":"Now listen carefully and answer questions 1 to 4."},{"s":"A","t":"Good morning, everyone, and welcome to Corvane Software. I'm Nadia Botha, and I lead the people operations team, which some companies still call human resources."},{"s":"A","t":"I'll give you a quick overview of the company and some practical information, and then my colleagues will take you on a tour of the building."},{"s":"A","t":"Let me start with a little history. Corvane was set up eleven years ago by two friends working from a flat above a bakery. These days, most people know us for our learning apps for primary schools, so they assume that's how we began."},{"s":"A","t":"In fact, our very first product was an appointment booking system for dental clinics. The education work only came later, when one of the founders became a parent and saw how poor some school software was."},{"s":"A","t":"Now, working arrangements. Until last year, we asked everyone to be in the office on Tuesdays and Thursdays. That turned out to suit some teams far better than others."},{"s":"A","t":"So there's no longer a company-wide rule. Instead, each team agrees its own office days with its team lead, and you'll find out what yours are this afternoon."},{"s":"A","t":"Next, your laptops. They've been set up for you, but if anything goes wrong, please don't email me, and don't ring the helpdesk number on the noticeboard downstairs, because that line was closed in the spring."},{"s":"A","t":"Instead, post a message in the IT support channel on our chat app. Someone from the infrastructure team checks it constantly and will normally reply within the hour."},{"s":"A","t":"Finally, every one of you has been given a buddy. Your buddy isn't your line manager, and they won't be assessing your work during probation. For technical questions, your team lead is still the best person to ask."},{"s":"A","t":"Your buddy is there for all the small, everyday things nobody writes down, such as how to book leave, where the spare chargers are kept, or which coffee machine actually works."},{"s":"N","t":"Before you hear the rest of the talk, you have some time to look at questions 5 to 10."},{"pause":30,"label":"Look at questions 5 to 10"},{"s":"N","t":"Now listen and answer questions 5 to 10."},{"s":"A","t":"Before the tour, let me tell you about the meeting rooms on the second floor, because each one has quite a specific purpose. They're all named after birds."},{"s":"A","t":"The largest is the Kestrel, right by the lifts. Because of its size, people imagine we hold our parties and team celebrations there, but it's actually reserved for meetings with clients. It has the best screen, and it's closest to reception."},{"s":"A","t":"Next to it is the Heron. That used to be where we interviewed job candidates, but most interviews happen online now, so we've turned it into our device lab."},{"s":"A","t":"There are shelves of old phones and tablets in there, so you can check how your app looks and runs on each one."},{"s":"A","t":"Opposite those two is the Wren. It's small and soundproofed, so you might think it's ideal for concentrating, but please don't use it for that. Our learning design team records the tutorial videos that go with our apps in there, and they book it most days."},{"s":"A","t":"If you need to concentrate, go to the Osprey. We did consider turning it into a games room, but staff voted against that, so it's now a silent space: no calls and no conversations."},{"s":"A","t":"Then there's the Lark. You might expect your induction sessions to be held there, but we'll be using the canteen for those. The Lark is where our recruitment team meets candidates for the interviews that still take place in person."},{"s":"A","t":"So if you see a nervous-looking visitor waiting outside, give them a smile."},{"s":"A","t":"And last, at the end of the corridor, is the Finch. That's our multi-faith room, and anyone can use it for prayer or simply for some quiet reflection. We just ask that you leave your shoes on the rack outside."},{"s":"A","t":"Right, that's everything from me. Let's head up to the second floor."},{"s":"N","t":"That is the end of section 2."}],"groups":[{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":1,"prompt":"What was Corvane Software's first product?","options":[{"key":"A","text":"a learning app for primary schools"},{"key":"B","text":"a booking system for dentists"},{"key":"C","text":"a website for a local bakery"},{"key":"D","text":"a game for young children"}],"answer":"B","explanation":"People \"assume\" the company began with school apps, but Nadia says \"In fact, our very first product was an appointment booking system for dental clinics.\" The bakery is only where the founders worked."},{"n":2,"prompt":"What is the company's current policy on office attendance?","options":[{"key":"A","text":"Everyone comes in on Tuesdays and Thursdays."},{"key":"B","text":"Staff may choose any days they like."},{"key":"C","text":"Each team decides on its own office days."},{"key":"D","text":"New staff must work in the office every day."}],"answer":"C","explanation":"Tuesdays and Thursdays was the rule \"Until last year\". Now \"each team agrees its own office days with its team lead\", so A describes the old policy."},{"n":3,"prompt":"What should new staff do if they have a problem with their laptop?","options":[{"key":"A","text":"email Nadia"},{"key":"B","text":"phone the helpdesk"},{"key":"C","text":"write in an online support channel"},{"key":"D","text":"ask their team lead"}],"answer":"C","explanation":"Nadia says \"please don't email me\" and the helpdesk line \"was closed in the spring\". Instead, \"post a message in the IT support channel on our chat app\"."},{"n":4,"prompt":"What is the main role of each new employee's buddy?","options":[{"key":"A","text":"to answer technical questions"},{"key":"B","text":"to assess work during probation"},{"key":"C","text":"to help with practical day-to-day matters"},{"key":"D","text":"to act as a line manager"}],"answer":"C","explanation":"The buddy \"isn't your line manager\", \"won't be assessing your work\", and the team lead is best for technical questions. The buddy is for \"the small, everyday things nobody writes down\", such as booking leave."}]},{"type":"matching_features","instructions":"What is each meeting room on the second floor used for? Choose SIX answers from the box and write the correct letter, A-H, next to questions 5-10.","title":"Purposes","options":[{"key":"A","text":"meeting external customers"},{"key":"B","text":"working without interruption"},{"key":"C","text":"testing products on different hardware"},{"key":"D","text":"filming instructional material"},{"key":"E","text":"religious or personal reflection"},{"key":"F","text":"interviewing job applicants"},{"key":"G","text":"holding social occasions"},{"key":"H","text":"running staff induction sessions"}],"questions":[{"n":5,"prompt":"the Kestrel","answer":"A","explanation":"People imagine \"parties and team celebrations\" happen there (G), \"but it's actually reserved for meetings with clients\"."},{"n":6,"prompt":"the Heron","answer":"C","explanation":"It \"used to be where we interviewed job candidates\" (F), but it is now \"our device lab\" with \"old phones and tablets\" to \"check how your app looks and runs on each one\"."},{"n":7,"prompt":"the Wren","answer":"D","explanation":"\"You might think it's ideal for concentrating, but please don't use it for that.\" The team \"records the tutorial videos\" there, which matches filming instructional material."},{"n":8,"prompt":"the Osprey","answer":"B","explanation":"\"If you need to concentrate, go to the Osprey.\" The games room idea (G) was rejected, and it is \"a silent space: no calls and no conversations\"."},{"n":9,"prompt":"the Lark","answer":"F","explanation":"Induction sessions (H) will be in \"the canteen\", not the Lark. The Lark is \"where our recruitment team meets candidates for the interviews that still take place in person\"."},{"n":10,"prompt":"the Finch","answer":"E","explanation":"The Finch is \"our multi-faith room\" used \"for prayer or simply for some quiet reflection\", which matches religious or personal reflection."}]}]},{"id":"l11","section":3,"title":"Dissertation tutorial: remote work and productivity","topic":"education","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"A":{"role":"Aoife, student","accent":"en-IE","voice":"female"},"B":{"role":"Dr Grant, supervisor","accent":"en-US","voice":"male"}},"script":[{"s":"N","t":"Section 3. You will hear a student called Aoife talking to her supervisor, Dr Grant, about her dissertation on productivity in remote work. First, you have some time to look at questions 1 to 5."},{"pause":30,"label":"Look at questions 1 to 5"},{"s":"N","t":"Now listen carefully and answer questions 1 to 5."},{"s":"B","t":"Come in, Aoife. So, how's the dissertation going? Last time we met, you were planning to look at remote workers in general."},{"s":"A","t":"That's right, but I've narrowed it down to software developers now."},{"s":"B","t":"Was that because of the gap in the literature you mentioned?"},{"s":"A","t":"Not really. There's actually quite a lot of research on developers. It's partly because I worked in web development before university, so I know the field. But the main reason is that Tallis Systems agreed to let me survey their staff."},{"s":"B","t":"Well, access like that is valuable, so that makes sense. Now, in your proposal you said you'd measure productivity by counting each developer's commits, the changes they save to the code."},{"s":"A","t":"Yes, I thought it would be more objective than just asking people how productive they feel."},{"s":"B","t":"I understand the appeal, but once people know their commits are being counted, they start splitting their work into lots of tiny ones. You end up measuring habits, not output. I wouldn't even use it alongside the survey."},{"s":"A","t":"OK, I'll drop it, then. The survey itself has gone quite well. Sixty-three of the ninety staff have completed it, which is more than I expected."},{"s":"B","t":"That's an excellent response rate. Any problems?"},{"s":"A","t":"Just one. I asked how many hours a week they spent on deep work, and a lot of people seem to have read that as overtime. So I can't really use those answers."},{"s":"B","t":"That's a wording issue. Make a note of it in your limitations section. So, what have the results shown so far?"},{"s":"A","t":"Well, I'd assumed people would work longer hours at home, and they did, so no surprises there. I also predicted that online meetings wouldn't be any shorter than face-to-face ones, and that was right too."},{"s":"A","t":"But I thought parents of young children would struggle most at home, and in fact they rated themselves as more productive there than in the office. And the group who felt least productive at home was the junior developers, which I really didn't expect."},{"s":"B","t":"Interesting. Perhaps they miss being able to ask the person sitting next to them. And how are the office days being used?"},{"s":"A","t":"Mainly for collaboration, as you'd expect."},{"s":"N","t":"Before you hear the rest of the discussion, you have some time to look at questions 6 to 10."},{"pause":25,"label":"Look at questions 6 to 10"},{"s":"N","t":"Now listen and answer questions 6 to 10."},{"s":"B","t":"So, what's the next step?"},{"s":"A","t":"I was going to run a couple of focus groups to explore those findings."},{"s":"B","t":"Hmm. With colleagues in the same room, people rarely admit they struggle to concentrate. I'd do individual video interviews instead. Around eight should be plenty."},{"s":"A","t":"Right. That's easier to arrange anyway, as half of them are fully remote."},{"s":"B","t":"But since you'll be recording people, you'll need to send the ethics committee a new consent form. Not a whole new application, just that form."},{"s":"A","t":"OK. And I was thinking of asking the interviewees to keep a time diary, maybe for two weeks."},{"s":"B","t":"Good idea, but two weeks is a lot to ask of busy people. One week will give you enough data."},{"s":"B","t":"Now, your literature review. It's strong on fully remote work, but most companies now use hybrid working, and you've only got a couple of sources on that. You'll need more."},{"s":"A","t":"I'll look for some recent studies. When would you like the methodology chapter?"},{"s":"B","t":"Could you manage the end of February?"},{"s":"A","t":"That's tight, because the interviews won't be finished by then."},{"s":"B","t":"Fair enough. I'm at a conference in the first week of March, so let's say the fifteenth of March."},{"s":"A","t":"The fifteenth of March. That's fine. Thanks, Dr Grant."},{"s":"N","t":"That is the end of section 3."}],"groups":[{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":1,"prompt":"Why did Aoife decide to focus on software developers?","options":[{"key":"A","text":"There was little existing research on them."},{"key":"B","text":"She had previously worked in the industry."},{"key":"C","text":"A company offered her access to its employees."},{"key":"D","text":"Her supervisor recommended it."}],"answer":"C","explanation":"Aoife rejects the literature gap (\"There's actually quite a lot of research on developers\") and says her work experience is only \"partly\" the reason: \"the main reason is that Tallis Systems agreed to let me survey their staff\"."},{"n":2,"prompt":"What is Dr Grant's view of counting commits to measure productivity?","options":[{"key":"A","text":"It is more objective than a survey."},{"key":"B","text":"It should be used together with the survey."},{"key":"C","text":"It may change the way people behave."},{"key":"D","text":"It would take too long to analyse."}],"answer":"C","explanation":"Dr Grant says \"once people know their commits are being counted, they start splitting their work into lots of tiny ones\". A is Aoife's original idea, and he rejects B: \"I wouldn't even use it alongside the survey.\""},{"n":3,"prompt":"What problem did Aoife have with her survey?","options":[{"key":"A","text":"Fewer people responded than she had hoped."},{"key":"B","text":"Many people misunderstood one question."},{"key":"C","text":"Some staff refused to give details of their hours."},{"key":"D","text":"It took participants too long to complete."}],"answer":"B","explanation":"The response was \"more than I expected\", so A is wrong. The problem was that the question on deep work was misread: \"a lot of people seem to have read that as overtime\"."}]},{"type":"mcq_multi","instructions":"Choose TWO letters, A-E.","questions":[{"n":4,"count":2,"prompt":"Which TWO findings from the survey surprised Aoife?","options":[{"key":"A","text":"Staff worked longer hours at home."},{"key":"B","text":"Online meetings were no shorter than face-to-face ones."},{"key":"C","text":"Parents of young children felt more productive at home."},{"key":"D","text":"Junior developers felt least productive at home."},{"key":"E","text":"Office days were mainly used for collaboration."}],"answers":["C","D"],"explanation":"She expected parents to \"struggle most at home\", but \"in fact they rated themselves as more productive there\", and the junior developers result was something she \"really didn't expect\". Longer hours were \"no surprises\", meetings were what she \"predicted\", and collaboration was \"as you'd expect\"."}]},{"type":"gap","instructions":"Complete the notes below. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.","title":"Plan for the next stage of the dissertation","wordLimit":"NO MORE THAN TWO WORDS AND/OR A NUMBER","questions":[{"n":6,"prompt":"Replace focus groups with individual ____ (about eight people)","answer":["video interviews"],"explanation":"Aoife planned \"focus groups\", but Dr Grant says \"I'd do individual video interviews instead. Around eight should be plenty.\""},{"n":7,"prompt":"Send the ethics committee a new ____ form","answer":["consent"],"explanation":"\"You'll need to send the ethics committee a new consent form. Not a whole new application, just that form.\" A new application is not needed."},{"n":8,"prompt":"Interviewees keep a time diary for ____","answer":["one week","1 week","a week"],"explanation":"Aoife suggests \"maybe for two weeks\", but Dr Grant says \"two weeks is a lot to ask of busy people. One week will give you enough data.\""},{"n":9,"prompt":"Literature review: find more sources on ____","answer":["hybrid working","hybrid work"],"explanation":"The review is \"strong on fully remote work\", but \"most companies now use hybrid working, and you've only got a couple of sources on that. You'll need more.\""},{"n":10,"prompt":"Deadline for methodology chapter: ____","answer":["15 March","15th March","March 15","March 15th"],"explanation":"\"The end of February\" is rejected because the interviews \"won't be finished by then\", and the first week of March is a conference, so Dr Grant says \"let's say the fifteenth of March\"."}]}]},{"id":"l12","section":4,"title":"Noise pollution, health and learning","topic":"health","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"A":{"role":"Lecturer","accent":"en-NZ","voice":"male"}},"script":[{"s":"N","t":"Section 4. You will hear a lecture on noise pollution and its effects on health and learning. First, you have some time to look at questions 1 to 10."},{"pause":30,"label":"Look at questions 1 to 10"},{"s":"N","t":"Now listen carefully and answer questions 1 to 10."},{"s":"A","t":"Good afternoon. In this week's lecture on environmental health, I'm turning to a form of pollution that gets far less attention than dirty air or water, and that's noise."},{"s":"A","t":"Let's begin with measurement. Noise is measured in decibels, and the first thing to understand is that the decibel scale is logarithmic. That means an increase of ten decibels is heard as roughly a doubling of loudness, not a small step up."},{"s":"A","t":"So a busy street isn't just a little louder than a quiet office. To our ears, it may be several times as loud."},{"s":"A","t":"Why has noise been neglected for so long? Partly because it's invisible and leaves no trace. Once a lorry has passed, there's nothing to photograph and nothing to clean up, so it's easy for planners to treat it as a minor nuisance."},{"s":"A","t":"But the evidence on health is now hard to ignore. The key point is that our bodies respond to noise even when we're asleep. A sudden sound activates the stress response, and hormones such as cortisol are released into the blood."},{"s":"A","t":"Interestingly, most people don't actually wake up. What happens instead is that their sleep becomes fragmented. They move repeatedly between deeper and lighter stages, so they feel tired the next day without knowing why."},{"s":"A","t":"Over many years, this repeated stress response seems to take a toll on the heart and blood vessels. Long-term exposure to traffic and aircraft noise has been linked with high blood pressure and, through that, with heart disease."},{"s":"A","t":"A common objection is that people simply get used to noise, and if you ask residents near a busy road, many will say exactly that."},{"s":"A","t":"However, when researchers monitor them at night, their pulse still rises each time a heavy vehicle goes by. Their minds may have adapted, but their bodies haven't."},{"s":"A","t":"Let's move on to learning, where some of the most worrying findings are. Studies of primary schools located under airport flight paths have repeatedly found that the children there are slower to develop reading skills than similar children in quieter schools."},{"s":"A","t":"One explanation is that noise interferes with working memory. That's the system we use to hold information in mind for a few seconds, for example when we do mental arithmetic or follow a long instruction."},{"s":"A","t":"Teachers suffer too, of course. They raise their voices, repeat themselves and lose teaching time, although that's a topic for another day."},{"s":"A","t":"I'd like to mention one small case study from a primary school in the town of Kerrowmore, where acoustic panels were fitted to the ceilings of every classroom."},{"s":"A","t":"The researchers expected test results to improve, but in the first year the scores hardly changed. What did improve, quite dramatically, was the children's behaviour. Teachers reported fewer arguments and far less shouting, which may lead to better results later."},{"s":"A","t":"Finally, what can be done? At the source, quieter road surfaces and limits on night flights both help. Many cities also plant trees and hedges along busy roads, and residents generally welcome this."},{"s":"A","t":"But we should be honest about what greenery achieves. A narrow row of trees reduces noise much less than people imagine. Its main benefit is psychological: when people can't see the traffic, they tend to find it less annoying."},{"s":"A","t":"That doesn't make it worthless, of course. In the next session, we'll look at how cities map noise, and how those maps are used in planning decisions."},{"s":"N","t":"That is the end of section 4."}],"groups":[{"type":"gap","instructions":"Complete the notes below. Write ONE WORD ONLY for each answer.","title":"Noise pollution: effects on health and learning","wordLimit":"ONE WORD ONLY","questions":[{"n":1,"prompt":"Measurement: the decibel scale is ____, so a rise of ten decibels sounds about twice as loud","answer":["logarithmic"],"explanation":"The lecturer says \"the decibel scale is logarithmic. That means an increase of ten decibels is heard as roughly a doubling of loudness\"."},{"n":2,"prompt":"Noise is often neglected because it is ____ and leaves no trace","answer":["invisible"],"explanation":"\"Why has noise been neglected for so long? Partly because it's invisible and leaves no trace.\""},{"n":3,"prompt":"Health: during sleep, noise causes the release of hormones such as ____","answer":["cortisol"],"explanation":"\"A sudden sound activates the stress response, and hormones such as cortisol are released into the blood.\""},{"n":4,"prompt":"Most people do not wake up, but their sleep becomes ____","answer":["fragmented"],"explanation":"\"Most people don't actually wake up. What happens instead is that their sleep becomes fragmented.\""},{"n":5,"prompt":"Long-term exposure is linked to high blood ____ and heart disease","answer":["pressure"],"explanation":"Long-term exposure \"has been linked with high blood pressure and, through that, with heart disease\"."},{"n":6,"prompt":"Residents who say they are used to noise still show a rise in ____ at night","answer":["pulse"],"explanation":"People say they \"get used to noise\", but \"their pulse still rises each time a heavy vehicle goes by\"."},{"n":7,"prompt":"Learning: children at schools under flight paths are slower to develop ____ skills","answer":["reading"],"explanation":"Children at schools \"under airport flight paths\" are \"slower to develop reading skills than similar children in quieter schools\"."},{"n":8,"prompt":"Noise interferes with ____ memory, which is needed for mental arithmetic","answer":["working"],"explanation":"\"Noise interferes with working memory\", which we use \"when we do mental arithmetic or follow a long instruction\"."},{"n":9,"prompt":"Kerrowmore study: after acoustic panels were fitted, the main improvement was in pupils' ____","answer":["behaviour","behavior"],"explanation":"Researchers \"expected test results to improve, but... the scores hardly changed. What did improve, quite dramatically, was the children's behaviour.\" Test results are the distractor."},{"n":10,"prompt":"Solutions: the main benefit of trees along roads is ____ rather than physical","answer":["psychological"],"explanation":"Trees reduce noise \"much less than people imagine. Its main benefit is psychological: when people can't see the traffic, they tend to find it less annoying.\""}]}]}],"task1":[{"id":"t1-01","chartType":"line","title":"Online learning by age group","prompt":"The graph below shows the percentage of adults in Norvia who took at least one online course between 2012 and 2024, by age group. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"line","title":"Adults taking at least one online course in Norvia, by age group","xLabels":["2012","2014","2016","2018","2020","2022","2024"],"yLabel":"Percentage of adults","unit":"%","yMin":0,"yMax":50,"series":[{"name":"18-29","values":[14,19,25,31,46,42,44]},{"name":"30-44","values":[9,13,18,24,38,40,45]},{"name":"45-59","values":[5,7,10,13,22,21,24]},{"name":"60+","values":[2,2,3,5,11,13,16]}]},"keyFeatures":["Participation rose in all four age groups over the period, with a sudden jump for every group in 2020.","The 18-29 group led for most of the period, but the 30-44 group overtook it in 2024 (45% compared with 44%).","After 2020 the youngest group dipped (46% to 42%) and only partly recovered, while the 30-44 group kept rising.","The over-60s were the least likely to study online throughout, yet their figure grew eightfold, from 2% to 16%."],"usefulLanguage":["broken down into four age groups","a particularly sharp rise in","rose steadily to","respectively","dipped to ... and then recovered only slightly","continued to climb","overtook","followed a similar pattern but at much lower levels","increased eightfold"],"modelAnswer":"The line graph illustrates the proportion of adults in Norvia who took at least one online course between 2012 and 2024, broken down into four age groups.\n\nOverall, participation increased in every age group over the period, with a particularly sharp rise in 2020. Although the youngest adults were the most likely to study online for most of these years, the 30-44 age group had overtaken them by 2024, while the over-60s remained the least likely to do so throughout.\n\nIn 2012, 14% of 18-29-year-olds took an online course, compared with 9% of those aged 30-44. Both figures rose steadily to 31% and 24% respectively by 2018, before jumping to 46% and 38% in 2020. Thereafter, the figure for the youngest group dipped to 42% and then recovered only slightly to 44%, whereas the 30-44 group continued to climb, reaching 45% in 2024.\n\nThe two older groups followed a similar pattern but at much lower levels. The rate for 45-59-year-olds grew from 5% in 2012 to 22% in 2020, finishing the period at 24%. Participation among the over-60s was just 2% at the start, but it increased eightfold to 16% by 2024."},{"id":"t1-02","chartType":"line","title":"Electricity use by sector","prompt":"The graph below shows the amount of electricity consumed by data centres, households and transport in Castelmar between 2010 and 2025. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"line","title":"Electricity consumption in Castelmar by sector, 2010-2025","xLabels":["2010","2013","2016","2019","2022","2025"],"yLabel":"Electricity consumption (TWh)","unit":"","yMin":0,"yMax":70,"series":[{"name":"Households","values":[58,60,59,57,55,54]},{"name":"Data centres","values":[6,9,14,22,33,47]},{"name":"Transport","values":[2,3,5,9,16,26]}]},"keyFeatures":["Households consumed the most electricity throughout, but their use peaked at 60 TWh in 2013 and then fell gradually to 54 TWh.","Data centre consumption grew at an accelerating rate, from 6 TWh to 47 TWh, almost eight times the 2010 level.","As a result, the gap between households and data centres narrowed from 52 TWh to just 7 TWh.","Transport was the smallest consumer; its use grew slowly until 2016 (5 TWh) and then rapidly, reaching 26 TWh in 2025."],"usefulLanguage":["were the largest consumers of","edged up to a peak of","fell gradually","at an increasingly rapid rate","almost eight times the original amount","the difference between ... and ... narrowed","a mere","accelerated sharply","by contrast"],"modelAnswer":"The line graph compares the amount of electricity consumed by data centres, households and transport in Castelmar from 2010 to 2025, measured in terawatt hours (TWh).\n\nOverall, households were the largest consumers of electricity throughout the period, although their use declined slightly. Meanwhile, demand from data centres and transport grew dramatically, and by 2025 data centres had closed most of the gap with households.\n\nHousehold consumption stood at 58 TWh in 2010 and edged up to a peak of 60 TWh in 2013. From then on, it fell gradually, reaching 54 TWh in 2025, just 4 TWh below its starting level.\n\nBy contrast, data centres used only 6 TWh in 2010, but this figure rose at an increasingly rapid rate, to 22 TWh in 2019 and 47 TWh in 2025, almost eight times the original amount. As a result, the difference between data centres and households narrowed from 52 TWh to only 7 TWh. Transport was the smallest consumer, using a mere 2 TWh at the start. Its consumption grew slowly to 5 TWh in 2016, but then accelerated sharply, climbing to 26 TWh by the end of the period."},{"id":"t1-03","chartType":"bar","title":"International student numbers","prompt":"The chart below shows the number of international students enrolled at universities in five countries in 2014 and 2024. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"bar","title":"International students enrolled at universities, 2014 and 2024","categories":["Norvia","Castelmar","Estravia","Dunholm","Valoria"],"yLabel":"Number of students (thousands)","unit":"","yMax":250,"series":[{"name":"2014","values":[185,142,64,98,23]},{"name":"2024","values":[240,118,156,103,71]}]},"keyFeatures":["Norvia was the most popular destination in both years, rising from 185,000 to 240,000 students.","Castelmar was the only country where numbers fell (142,000 to 118,000), slipping from second to third place.","Estravia recorded the largest increase, from 64,000 to 156,000, and became the second most popular destination.","Valoria roughly tripled its intake (23,000 to 71,000) but still ranked last, while Dunholm stayed almost unchanged (98,000 to 103,000)."],"usefulLanguage":["the most popular destination","attracted more overseas students than a decade earlier","the only country to experience a fall","slip from second to third place","saw the most dramatic increase","roughly tripled its intake","relatively stable","edged up from ... to ...","well ahead of"],"modelAnswer":"The bar chart compares the number of international students enrolled at universities in five countries in 2014 and 2024.\n\nOverall, four of the five countries attracted more overseas students in 2024 than a decade earlier, and Norvia remained the most popular destination in both years. The most striking changes were the rapid growth in Estravia and Valoria, while Castelmar was the only country to experience a fall.\n\nIn 2014, Norvia hosted 185,000 international students, well ahead of Castelmar, with 142,000. Ten years later, Norvia's figure had risen to 240,000, whereas Castelmar's had dropped to 118,000, causing it to slip from second to third place.\n\nEstravia saw the most dramatic increase, with enrolments rising from 64,000 to 156,000, which made it the second most popular destination by 2024. Valoria, the smallest host country in both years, roughly tripled its intake from 23,000 to 71,000, although it still ranked last. Meanwhile, the number of international students in Dunholm was relatively stable, edging up from 98,000 to 103,000, but it was overtaken by Estravia and fell from third to fourth place."},{"id":"t1-04","chartType":"pie","title":"Working time at a software company","prompt":"The pie charts below show how employees at a software company spent their working hours in 2015 and 2025. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"pie","title":"How employees at a software company spent their working hours","pies":[{"title":"2015","slices":[{"label":"Writing code","value":42},{"label":"Meetings","value":17},{"label":"Email and messaging","value":11},{"label":"Testing and debugging","value":16},{"label":"Documentation","value":10},{"label":"Training","value":4}]},{"title":"2025","slices":[{"label":"Writing code","value":30},{"label":"Meetings","value":23},{"label":"Email and messaging","value":19},{"label":"Testing and debugging","value":15},{"label":"Documentation","value":5},{"label":"Training","value":8}]}]},"keyFeatures":["Writing code was the largest category in both years, but its share fell from 42% to 30%.","Meetings (17% to 23%) and email and messaging (11% to 19%) both grew; together they took up 42% of working time in 2025, more than coding.","Training doubled from 4% to 8%, overtaking documentation, which halved from 10% to 5%.","Testing and debugging was the exception, staying almost the same (16% and 15%)."],"usefulLanguage":["divided their working time between","the most time-consuming activity","took up a growing proportion of","more than twice as much as","halving from ... to ...","was almost unchanged","taken together","accounted for","overtaking"],"modelAnswer":"The two pie charts show how staff at a software company divided their working time between six activities in 2015 and 2025.\n\nOverall, writing code remained the most time-consuming activity in both years, but its share fell considerably. Meanwhile, communication took up a growing proportion of the working day, and the time devoted to training doubled.\n\nIn 2015, employees spent 42% of their hours writing code, more than twice as much as on any other task. By 2025, this had decreased to 30%. Documentation also became less significant, halving from 10% to 5%, whereas the share of time spent on testing and debugging was almost unchanged, at 16% and 15% respectively.\n\nIn contrast, the proportion of time spent in meetings rose from 17% to 23%, and email and messaging increased even more sharply, from 11% to 19%. Taken together, these two forms of communication accounted for 42% of employees' time in 2025, far more than was spent on coding. Finally, although training was the smallest category in 2015, at just 4%, it had reached 8% a decade later, overtaking documentation."},{"id":"t1-05","chartType":"table","title":"Smartphones and screen time","prompt":"The table below shows the percentage of adults who owned a smartphone and the average time adults spent looking at screens each day in four countries in 2015 and 2025. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"table","title":"Smartphone ownership and daily screen time, 2015 and 2025","columns":["Country","Ownership 2015 (%)","Ownership 2025 (%)","Screen time 2015 (hours per day)","Screen time 2025 (hours per day)"],"rows":[["Norvia","72","94","2.8","4.1"],["Castelmar","65","91","3.1","3.6"],["Estravia","38","86","1.9","4.7"],["Valoria","81","89","3.5","3.2"]],"note":"Ownership is the percentage of adults who own a smartphone. Screen time is the average number of hours an adult spends looking at screens per day."},"keyFeatures":["Ownership rose in all four countries and the figures converged: 86-94% in 2025, compared with 38-81% in 2015.","Estravia changed the most, moving from the lowest ownership (38%) and screen time (1.9 hours) in 2015 to the highest screen time (4.7 hours) in 2025.","Norvia overtook Valoria to have the highest ownership rate in 2025 (94%).","Valoria was the exception: screen time fell from 3.5 to 3.2 hours even though ownership rose."],"usefulLanguage":["varied considerably","became much more uniform","ranging from ... to ...","by far the largest rise","overtook ... to record the highest rate","a notable exception","the rise was more modest","even though","turning to"],"modelAnswer":"The table compares the percentage of adults who owned a smartphone and the average amount of time they spent looking at screens each day in four countries in 2015 and 2025.\n\nOverall, smartphone ownership increased in all four countries and became much more uniform, with figures ranging from 86% to 94% by 2025. Daily screen time also lengthened in most places, although Valoria was a notable exception.\n\nIn 2015, ownership levels varied considerably, from 81% in Valoria and 72% in Norvia to just 38% in Estravia. Over the following decade, Estravia saw by far the largest rise, to 86%, while Norvia overtook Valoria to record the highest rate, at 94%. Castelmar's figure also climbed substantially, from 65% to 91%.\n\nTurning to screen time, adults in Estravia spent the least time on screens in 2015, at 1.9 hours a day, yet ten years later they spent the most, at 4.7 hours. Norvia also saw a considerable increase, from 2.8 to 4.1 hours, whereas the rise in Castelmar was more modest, from 3.1 to 3.6 hours. By contrast, average screen time in Valoria fell from 3.5 to 3.2 hours, even though smartphone ownership there rose to 89%."},{"id":"t1-06","chartType":"process","title":"Developing a mobile app","prompt":"The diagram below shows the stages involved in developing a mobile app, from the first idea to its release and beyond. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"process","title":"From idea to release: developing a mobile app","steps":[{"label":"Idea and research","detail":"Study the market and interview potential users"},{"label":"Planning","detail":"Choose core features; agree budget and deadline"},{"label":"Design","detail":"Sketch wireframes, then create final screen designs"},{"label":"Prototype testing","detail":"Users try a clickable prototype; designs revised"},{"label":"Development","detail":"App coded in two-week sprints"},{"label":"Quality testing","detail":"Automated and manual checks; bugs returned to developers"},{"label":"Store review","detail":"App submitted to app stores; review takes 1-3 days"},{"label":"Launch","detail":"Public release with a marketing campaign"},{"label":"Feedback","detail":"Reviews and usage data collected to plan updates"}],"cyclic":true},"keyFeatures":["There are nine stages, which fall into three broad phases: research and design, building and testing, and release.","The process is cyclical: feedback collected after the launch provides ideas for the next version.","The app is tested twice: users try a prototype before any coding, and quality checks follow development.","Some stages involve going back a step: designs are revised after prototype testing, and bugs are returned to developers."],"usefulLanguage":["The process begins with","Next,","before producing","so that","Once the design has been approved,","undergoes","is returned to","After this,","Finally,","The process is cyclical"],"modelAnswer":"The diagram illustrates the stages involved in creating a mobile app, from the initial idea through to its public release and subsequent improvement.\n\nOverall, there are nine stages, which can be grouped into three main phases: research and design, building and testing, and release. The process is cyclical, since feedback from users after the launch provides ideas for the next version.\n\nThe process begins with research, in which developers study the market and interview potential users. Next, the core features are chosen and a budget and deadline are agreed. Designers then sketch wireframes before producing the final screen designs, and a clickable prototype is tried out by users so that the designs can be revised.\n\nOnce the design has been approved, the app is coded in two-week cycles known as sprints. It then undergoes automated and manual quality checks, and any bugs are returned to the developers to be fixed. After this, the app is submitted to the app stores, where the review typically takes between one and three days. Finally, it is released to the public alongside a marketing campaign, and reviews and usage data are collected to plan future updates."},{"id":"t1-07","chartType":"process","title":"Rainwater harvesting at a school","prompt":"The diagram below shows how rainwater is collected and treated for use at a secondary school. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"process","title":"How rainwater is collected and treated at a school","steps":[{"label":"Roof collection","detail":"Rain falls on the sloping school roof"},{"label":"Gutters","detail":"Water runs into gutters and downpipes"},{"label":"Leaf screen","detail":"A mesh screen removes leaves and twigs"},{"label":"First-flush diverter","detail":"First 50 litres, which carry most dirt, sent to a drain"},{"label":"Underground tank","detail":"Stores up to 20,000 litres; excess overflows to a soakaway"},{"label":"Sand filter","detail":"Water pumped up; fine particles removed"},{"label":"UV treatment","detail":"Ultraviolet light kills bacteria"},{"label":"Header tank","detail":"Mains water added if the level falls too low"},{"label":"School use","detail":"Supplies toilets and garden irrigation"}],"cyclic":false},"keyFeatures":["The process has nine stages, from rain falling on the roof to the water being used in toilets and for the garden.","Cleaning takes place in several steps: simple screening and diversion first, then a sand filter and ultraviolet light.","The first 50 litres of rain are diverted to a drain, and the underground tank holds 20,000 litres, with any excess going to a soakaway.","Mains water is a back-up that tops up the header tank when the level is too low."],"usefulLanguage":["To begin with,","runs into","after which","is diverted to","with a capacity of","In the next stage,","is pumped up through","is topped up with","Finally,"],"modelAnswer":"The diagram shows how rainwater is collected from a school roof, cleaned and stored for use in the building and its grounds.\n\nOverall, the process consists of nine stages, beginning with rain falling on the roof and ending with the treated water being supplied to the toilets and garden. Several stages are devoted to cleaning the water, first by simple physical means and later by filtration and ultraviolet light.\n\nTo begin with, rain falls onto the sloping roof and runs into gutters and downpipes. A mesh screen then removes leaves and twigs, after which a first-flush diverter sends the first 50 litres of water, which contain most of the dirt, to a drain. The remaining water is held in an underground tank with a capacity of 20,000 litres, and any excess overflows into a soakaway.\n\nIn the next stage, the water is pumped up through a sand filter, which removes fine particles, before ultraviolet light is used to kill bacteria. The clean water is then stored in a header tank, which is topped up with mains water if the level drops too low. Finally, it is supplied to the school's toilets and used to irrigate the garden."},{"id":"t1-08","chartType":"map","title":"Changes to a university campus","prompt":"The maps below show the campus of Castelmar University in 2005 and today. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"map","title":"Castelmar University campus","maps":[{"title":"2005","features":[{"label":"Main road","kind":"road","x":0,"y":90,"w":100,"h":5},{"label":"Campus road","kind":"road","x":47,"y":10,"w":5,"h":80},{"label":"Library","kind":"building","x":10,"y":12,"w":25,"h":18},{"label":"Lecture halls","kind":"building","x":10,"y":40,"w":25,"h":20},{"label":"Car park","kind":"parking","x":8,"y":66,"w":33,"h":18},{"label":"Sports field","kind":"sports","x":60,"y":12,"w":32,"h":30},{"label":"Woodland","kind":"green","x":60,"y":50,"w":32,"h":20},{"label":"Student union","kind":"building","x":62,"y":74,"w":18,"h":12},{"label":"Pond","kind":"water","x":84,"y":74,"w":10,"h":12}]},{"title":"Today","features":[{"label":"Main road","kind":"road","x":0,"y":90,"w":100,"h":5},{"label":"Campus road","kind":"road","x":47,"y":10,"w":5,"h":80},{"label":"Cycle path","kind":"path","x":43,"y":10,"w":3,"h":80},{"label":"Library","kind":"building","x":10,"y":12,"w":30,"h":18},{"label":"Lecture halls","kind":"building","x":10,"y":40,"w":25,"h":20},{"label":"Innovation centre","kind":"building","x":8,"y":66,"w":20,"h":18},{"label":"Car park","kind":"parking","x":31,"y":66,"w":10,"h":18},{"label":"Sports centre","kind":"building","x":60,"y":12,"w":14,"h":30},{"label":"Football pitch","kind":"sports","x":77,"y":12,"w":15,"h":30},{"label":"Student accommodation","kind":"building","x":60,"y":50,"w":20,"h":20},{"label":"Garden","kind":"green","x":83,"y":50,"w":9,"h":20},{"label":"Student union","kind":"building","x":62,"y":74,"w":18,"h":12},{"label":"Pond","kind":"water","x":84,"y":74,"w":10,"h":12}]}]},"keyFeatures":["The campus has become more built-up, with new buildings on land that was previously woodland, sports field or car park.","The overall layout, including the campus road, the lecture halls, the student union and the pond, is unchanged.","In the east, most of the woodland has been replaced by student accommodation, and the sports field has been split into a sports centre and a smaller football pitch.","In the west, the library has been extended, an innovation centre occupies most of the old car park, and a cycle path now runs beside the campus road."],"usefulLanguage":["has been cleared to make way for","has been replaced by","has been extended eastwards","has been reduced to roughly a third of its former size","now occupies","has been divided","remain unchanged","alongside","in the south-west corner"],"modelAnswer":"The two maps illustrate the changes that have taken place on the campus of Castelmar University since 2005.\n\nOverall, the campus has become much more developed, with several new buildings constructed on what was previously open space or parking. However, the basic layout, including the central campus road and the main academic buildings, has remained largely the same.\n\nThe most significant changes have occurred on the eastern side of the campus. Most of the woodland in this area has been cleared to make way for student accommodation, leaving only a small garden to the east of the new building. To the north, the sports field has been divided, with a sports centre now occupying its western half and a smaller football pitch next to it.\n\nOn the western side, the library has been extended eastwards, while the lecture halls have not changed. The car park in the south-west corner has been reduced to roughly a third of its former size, and an innovation centre has been built on the land this freed up. In addition, a cycle path now runs alongside the campus road. The student union and the pond, close to the main road, remain unchanged."},{"id":"t1-09","chartType":"mixed","title":"Commuting in Lindrow","prompt":"The bar chart below shows the average time taken to travel to work using five methods in the city of Lindrow in 2014 and 2024. The pie chart shows the proportion of commuters who used each method in 2024. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"mixed","title":"Commuting in Lindrow","parts":[{"type":"bar","title":"Average one-way journey time to work, 2014 and 2024","categories":["Car","Bus","Metro","Bicycle","Walking"],"yLabel":"Minutes","unit":"","yMax":50,"series":[{"name":"2014","values":[34,41,29,22,18]},{"name":"2024","values":[43,38,27,21,18]}]},{"type":"pie","title":"Main method of travel to work, 2024","pies":[{"title":"2024","slices":[{"label":"Car","value":38},{"label":"Metro","value":24},{"label":"Bus","value":17},{"label":"Bicycle","value":12},{"label":"Walking","value":9}]}]}]},"keyFeatures":["In 2024 the car was the most popular method (38%) but also the slowest (43 minutes).","Car and bus swapped places: car journeys lengthened from 34 to 43 minutes, while bus journeys fell from 41 to 38 minutes.","Journey times by metro, bicycle and on foot barely changed, and walking stayed at 18 minutes.","The quickest methods, cycling (12%) and walking (9%), were the least used."],"usefulLanguage":["by far the most popular way to","despite becoming the slowest option","the situation had reversed","had lengthened to","remained fairly stable","almost a quarter","accounted for","whereas","regarding"],"modelAnswer":"The bar chart compares the average time it took commuters in the city of Lindrow to travel to work by five different methods in 2014 and 2024, while the pie chart shows the proportion of commuters who used each method in 2024.\n\nOverall, the car was by far the most popular way to get to work in 2024, despite having become the slowest option. In contrast, the quickest methods, cycling and walking, were the least widely used.\n\nIn 2014, bus journeys took the longest, at 41 minutes on average, followed by car journeys, at 34 minutes. Ten years later, however, the situation had reversed: the average car commute had lengthened to 43 minutes, whereas the bus journey had become shorter, at 38 minutes. Journey times for the other three methods remained fairly stable, with the metro taking 27 minutes in 2024 and cycling 21 minutes, while walking still took exactly 18 minutes.\n\nRegarding the pie chart, 38% of commuters travelled by car in 2024, and almost a quarter (24%) used the metro. The bus accounted for 17% of journeys, while only 12% of people cycled to work and just 9% walked."},{"id":"t1-10","chartType":"bar","title":"Remote work by industry","prompt":"The chart below shows the average number of hours per week that employees in six industries in Norvia worked remotely in 2019 and 2025. Summarise the information by selecting and reporting the main features, and make comparisons where relevant.","chart":{"type":"bar","title":"Average weekly hours of remote work by industry in Norvia, 2019 and 2025","categories":["Information technology","Finance","Education","Healthcare","Manufacturing","Retail"],"yLabel":"Hours per week","unit":"","yMax":25,"series":[{"name":"2019","values":[6.5,4,1.5,1,1.5,0.5]},{"name":"2025","values":[22.5,15.5,6,2.5,2,0.5]}]},"keyFeatures":["Remote work increased in every industry except retail, where it stayed at 0.5 hours a week.","Information technology had the highest figure in both years, rising from 6.5 to 22.5 hours; finance was second (4 to 15.5 hours).","Education showed the largest proportional increase, quadrupling from 1.5 to 6 hours.","Growth in hands-on sectors was small: healthcare rose from 1 to 2.5 hours and manufacturing from 1.5 to 2 hours."],"usefulLanguage":["worked remotely for an average of","rose dramatically","respectively","office-based sectors","the largest proportional rise","quadrupling from ... to ...","much smaller increases","grew by only half an hour","the only industry in which"],"modelAnswer":"The bar chart compares the average number of hours per week that employees in six industries in Norvia spent working remotely in 2019 and 2025.\n\nOverall, remote working increased in every industry except retail, but the growth was far greater in office-based sectors. Information technology had the highest figure in both years, while retail workers spent the least time working remotely.\n\nIn 2019, IT employees worked remotely for an average of 6.5 hours a week, compared with 4 hours in finance. By 2025, these figures had risen dramatically, to 22.5 and 15.5 hours respectively, meaning that IT staff were working away from the office for more than three times as long as they had six years earlier.\n\nEducation saw the largest proportional rise, with remote hours quadrupling from 1.5 to 6. By contrast, the increases in healthcare and manufacturing were much smaller. Healthcare staff worked remotely for just 1 hour a week in 2019 and 2.5 hours in 2025, while the figure for manufacturing grew by only half an hour, from 1.5 to 2 hours. Retail was the only industry in which there was no change, with employees working remotely for just half an hour per week in both years."}],"task2":[{"id":"t2-00","essayType":"opinion","topic":"education","placement":true,"prompt":"Some people believe that school students should be allowed to use AI chatbots to help them with their homework. To what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["A chatbot can explain a difficult idea in several different ways, like a patient tutor available at any hour.","Pupils whose families cannot afford private lessons gain access to individual support.","Learning to question and improve AI output is a skill that most future jobs will require.","Some students will simply copy answers, so homework no longer shows what they really understand.","Chatbots sometimes give confident but wrong answers that young learners may not notice.","A middle way: allow AI for explanations and feedback, but ask pupils to show their working or submit their chat history."],"usefulVocab":["a personal tutor on demand","to level the playing field","to outsource mental effort","plausible but inaccurate answers","to accept something without question","regulation rather than prohibition","to be impossible to enforce","clear guidelines on acceptable use"],"modelAnswer":"Artificial intelligence chatbots have moved from novelty to everyday tool in a remarkably short time, and schools are now under pressure to decide whether pupils may use them for homework. In my view, allowing their use is the more sensible approach, provided that clear rules ensure they support learning rather than replace it.\n\nThe strongest argument in favour is that a chatbot can act as a tireless personal tutor. A teenager stuck on an equation at ten o'clock at night has traditionally had two options: give up or copy a friend's answer. An AI assistant, by contrast, can explain the method step by step, rephrase it when the first explanation fails and generate further practice questions. This kind of individual support was once available mainly to families who could pay for private tuition, so permitting chatbots could go some way towards levelling the playing field. Furthermore, since today's pupils will almost certainly use such tools at work, learning to question and refine an AI's output is a valuable skill in itself.\n\nAdmittedly, there is a real danger that some students will simply paste in the question and submit whatever appears, outsourcing precisely the mental effort that homework is designed to demand. Chatbots also produce plausible but inaccurate answers, which an inexperienced learner may accept without question. However, these problems call for regulation rather than prohibition, not least because a ban is almost impossible to enforce at home. Teachers could, for instance, ask pupils to submit their chat history alongside their work, or set tasks that require personal reflection, which no machine can supply on a pupil's behalf.\n\nIn conclusion, I largely agree that pupils should be permitted to use AI chatbots for homework. Used thoughtfully and within sensible guidelines, they can deepen understanding and widen access to support, whereas banning them would merely drive their use underground."},{"id":"t2-01","essayType":"opinion","topic":"technology","placement":false,"prompt":"AI coding assistants can now produce large sections of working software in a matter of seconds. Some people believe that, as a result, new programmers no longer need to learn the fundamentals of coding in depth. To what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["AI tools remove repetitive boilerplate work, so beginners can focus on design and on what users actually need.","Developers already rely on libraries and frameworks they do not fully understand, so AI could be seen as one more layer of abstraction.","AI-generated code can look correct but contain subtle bugs or security flaws that only someone with strong foundations will notice.","Debugging and problem-solving skills are built by struggling with code line by line, and these skills are what make a developer senior.","Employers increasingly need people who can review, test and explain code, not just produce it.","Balanced view: learn the fundamentals first, then use AI to speed up routine work."],"usefulVocab":["boilerplate code","a solid grasp of the fundamentals","a layer of abstraction","to take something at face value","a security vulnerability","to accumulate technical debt","a false sense of competence","to be correct, secure and maintainable","an accelerator rather than a substitute"],"modelAnswer":"The arrival of AI tools that can generate functioning code from a simple description has led some to conclude that beginners can skip the slow process of mastering programming fundamentals. While I accept that these assistants have changed what a junior developer's day looks like, I strongly disagree that they make deep foundational knowledge unnecessary; if anything, they make it more important.\n\nIt is easy to see why the opposing view is attractive. Much of the code written by new programmers has always been repetitive boilerplate, such as setting up forms or connecting to a database, which an assistant now produces instantly. Freed from such chores, a newcomer might devote more attention to understanding users' needs or designing a clean interface. Moreover, developers have long built on frameworks whose inner workings they barely understand, so AI might be seen as merely the next layer of abstraction.\n\nYet this argument overlooks a crucial difference: a popular library has been tested by thousands of users, whereas AI-generated code is produced afresh each time and can be confidently wrong. It may contain a subtle logical error or a security vulnerability that only someone with a solid grasp of the fundamentals would recognise. A junior developer who takes such output at face value is not saving time but accumulating technical debt that others must later repay. Equally, the debugging skills that distinguish senior engineers are developed precisely by wrestling with code line by line. Without that struggle, newcomers risk acquiring a false sense of competence that collapses the first time the tool fails.\n\nIn conclusion, although AI assistants can usefully take over repetitive work, they cannot replace the understanding needed to judge whether code is correct, secure and maintainable. New programmers should therefore learn the fundamentals thoroughly and treat these tools as accelerators rather than substitutes for their own expertise."},{"id":"t2-02","essayType":"discussion","topic":"work","placement":false,"prompt":"Some companies have introduced a four-day working week with no reduction in pay, believing that employees will be just as productive. Others argue that this arrangement is unrealistic for most businesses. Discuss both these views and give your own opinion. Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Rested employees may concentrate better and make fewer mistakes, so total output need not fall.","When time is limited, teams tend to cut unnecessary meetings and other low-value tasks.","A shorter week helps companies attract and keep skilled staff and reduces burnout.","Hospitals, shops and call centres must be staffed for fixed hours, so they would need extra workers and higher wage bills.","Squeezing five days of work into four could increase stress rather than reduce it.","Small firms with narrow profit margins may not be able to risk a trial."],"usefulVocab":["work-life balance","a pilot scheme","to boost productivity","low-value activities","staff retention","burnout","narrow profit margins","round-the-clock cover","a one-size-fits-all policy"],"modelAnswer":"The idea of a four-day week on full pay, once dismissed as utopian, has been trialled by a growing number of employers in recent years. While sceptics insist that it simply cannot work for most organisations, I believe it is a realistic and beneficial option for many, though certainly not all, types of business.\n\nThose who doubt the scheme point out that a great deal of work is tied to time rather than output. A hospital ward, a supermarket or a call centre must be staffed for a fixed number of hours, so giving every employee an extra day off would force managers to recruit additional workers, sharply increasing costs. Small firms operating on narrow profit margins may be unwilling to take such a gamble. There is also a concern that cramming five days' work into four would leave staff more exhausted, not less, defeating the very purpose of the reform.\n\nNevertheless, in knowledge-based sectors such as software development, marketing or finance, the experience of pilot schemes has often been encouraging. When time is scarce, teams tend to eliminate low-value activities, such as unnecessary meetings and constant email checking, that quietly consume much of a traditional week. Well-rested employees are also likely to concentrate better and make fewer costly errors. Just as importantly, a shorter week is a powerful recruitment tool: a company offering it can attract skilled candidates who might otherwise choose a better-paid competitor, and is less likely to lose experienced staff to burnout.\n\nIn my view, then, the debate should not be framed as a choice between universal adoption and outright rejection. Where productivity is measured by results rather than hours, a four-day week can benefit employers and employees alike, whereas services that depend on constant cover may need alternative arrangements, such as rotating schedules, to share similar advantages."},{"id":"t2-03","essayType":"problem_solution","topic":"health","placement":false,"prompt":"Many children now spend several hours a day looking at phones, tablets and computer screens, and doctors are increasingly concerned about the effects on their physical health. What are the causes of this situation, and what measures could be taken to address it? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Many apps and games for children use features such as autoplay and daily rewards that make them hard to put down.","Busy parents often use devices to keep children occupied while they work or do housework.","Heavy traffic and a lack of safe parks in cities mean less outdoor play than in the past.","Parents can set simple family rules, such as no devices in bedrooms at night, and model good habits themselves.","Schools can build physical activity into every day and teach some lessons outdoors.","Governments can regulate design features in apps for young children, and councils can invest in safe play spaces."],"usefulVocab":["a sedentary lifestyle","short-sightedness","disturbed sleep","to be engineered to be addictive","to keep children occupied","the default form of entertainment","to lead by example","to disable a feature by default","outdoor play"],"modelAnswer":"Young children absorbed in tablets are now a familiar sight in restaurants, on trains and even in playgrounds, raising concerns about poor eyesight, disturbed sleep and lack of exercise. In my view, the trend stems from both the design of digital products and changes in family life, and tackling it requires action from parents, schools and governments.\n\nOne major cause is that many apps and games aimed at children are deliberately engineered to be hard to put down. Features such as automatically playing the next video or rewarding daily log-ins exploit a child's natural curiosity, so that a 'quick' game easily stretches into an hour. Family circumstances play a part too. Parents who work long hours may, quite understandably, hand a child a device to keep them occupied while they cook or answer emails. In addition, heavy traffic and a shortage of safe green spaces in many cities have made outdoor play less of an option than it once was, leaving screens as the default form of entertainment.\n\nSince the causes are varied, so too must be the solutions. Within the home, parents could agree simple rules, such as keeping devices out of bedrooms at night, and, crucially, lead by example by limiting their own use. Schools could build physical activity into every day and hold some lessons outdoors, reminding children that learning is not confined to a screen. Governments also have a role: they could require apps targeted at young children to disable autoplay and similar features by default, while local councils could invest in parks and play areas that families consider safe.\n\nIn conclusion, excessive screen time among children is driven by persuasive technology, pressured family routines and a lack of outdoor alternatives. Only a combination of household boundaries, active school days and responsible regulation is likely to protect young people's long-term health."},{"id":"t2-04","essayType":"two_part","topic":"education","placement":false,"prompt":"Many schools are replacing printed textbooks with digital versions that students read on tablets or laptops. Why are schools making this change? Do you think it will improve the quality of children's learning? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Digital textbooks can be corrected and updated instantly, while printed books quickly go out of date.","Over several years, digital licences may be cheaper than buying new print editions, and pupils carry lighter bags.","Videos, interactive diagrams and quizzes give instant feedback and let teachers track each pupil's progress.","Reading long texts on screen tends to encourage skimming rather than careful reading.","Tablets that can open games and messaging apps make distraction more likely.","Pupils without reliable internet at home may fall behind, so a mix of print and digital may work best."],"usefulVocab":["to update content instantly","interactive features","immediate feedback","to monitor progress","to encourage skimming","sustained reading","the digital divide","a blended approach","to translate into deeper learning"],"modelAnswer":"In classrooms across the world, the heavy textbook is gradually being replaced by a tablet loaded with digital course materials. Schools are making this move largely for practical and financial reasons, but I am not convinced that it will automatically lead to better learning; that depends on how the technology is used.\n\nThe appeal of digital textbooks for school leaders is easy to understand. A printed book may be out of date within a year of publication, whereas an electronic version can be corrected or expanded instantly at little cost. Over several years, licences for digital content are often cheaper than repeatedly buying new print editions, and pupils no longer have to carry heavy bags between home and school. Furthermore, digital materials offer features that paper cannot, such as short videos, interactive diagrams and quizzes that give immediate feedback while allowing teachers to monitor each pupil's progress.\n\nWhether these advantages translate into deeper learning, however, is far from certain. Reading longer texts on screen tends to encourage skimming rather than careful reading, and a tablet that can also open games and messaging apps makes distraction almost inevitable. There is also a question of fairness: a pupil whose family cannot afford reliable internet access may fall behind classmates who can use every online feature at home. That said, when teachers set clear expectations and choose interactive tasks that genuinely require thought, digital resources can make abstract topics, such as the structure of a cell, far more accessible than a static page.\n\nTo sum up, schools are adopting digital textbooks mainly because they are flexible, up to date and potentially cheaper. I believe they can improve learning, but only as part of a blended approach in which printed texts are retained for sustained reading and screens are used where they offer something paper genuinely cannot."},{"id":"t2-05","essayType":"positive_negative","topic":"technology","placement":false,"prompt":"Many banks, airlines and online shops now deal with most customer enquiries through automated chatbots and voice systems instead of human staff. Is this a positive or negative development? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Chatbots answer routine questions instantly at any time of day, so customers avoid long phone queues.","Companies save on staffing costs, which may lead to lower prices.","Human staff can be moved to complex or sensitive cases that need judgement and empathy.","Bots often misunderstand unusual problems and can trap customers in frustrating loops.","Older or less confident users may feel excluded, and many call-centre jobs disappear.","The key condition: customers must always be able to reach a real person easily."],"usefulVocab":["routine enquiries","round-the-clock support","to be kept on hold","to cut operating costs","to redeploy staff","to be trapped in an automated loop","to escalate a query","a basic obligation rather than an optional extra"],"modelAnswer":"Anyone who has recently tried to change a flight or report a lost bank card has probably been greeted not by a person but by an automated assistant. Althoug
