eaning: experience (uncountable, knowledge from doing something) vs an experience (an event); work (employment) vs works (art or building works)."],"ar":"كثير من الأسماء التي تُجمع في العربية لا تُجمع في الإنجليزية، فنقول «معلومات» و«نصائح» و«أبحاث» و«معدات»، لكن الكلمات المقابلة لها في الإنجليزية غير معدودة: information وadvice وresearch وequipment. هذه الكلمات لا تأخذ s الجمع، ولا تسبقها a أو an، ويأتي الفعل بعدها مفرداً: The information is useful. وإذا أردت العدّ فاستخدم كلمة وسيطة، مثل a piece of advice أو two items of equipment، أو استخدم كلمة معدودة مرادفة، مثل a study بدلاً من a research. واستخدم much وa large amount of مع الأسماء غير المعدودة، وmany وa large number of مع الأسماء المعدودة. هذه الأخطاء صغيرة، لكنها تتكرر كثيراً في الكتابة الأكاديمية، فتؤثر في تقييم الدقة.","examples":[{"wrong":"The website gives many useful informations about visas.","right":"The website gives a lot of useful information about visas.","note":"Information is uncountable: no -s, and use a lot of or much, not many."},{"wrong":"My manager gave me an advice that changed my career.","right":"My manager gave me a piece of advice that changed my career.","note":"Advice cannot take 'an'; use 'a piece of advice' or simply 'some advice'."},{"wrong":"Recent researches show that sleep affects memory.","right":"Recent research shows that sleep affects memory.","note":"Research is uncountable and takes a singular verb. Alternatively: Recent studies show..."},{"wrong":"Hospitals in rural areas need more modern equipments.","right":"Hospitals in rural areas need more modern equipment.","note":"Equipment never takes -s."},{"wrong":"There was too much cars on the road this morning.","right":"There were too many cars on the road this morning.","note":"Cars is countable, so it takes many and a plural verb."},{"wrong":"Students should receive feedbacks on their essays regularly.","right":"Students should receive feedback on their essays regularly.","note":"Feedback is uncountable."}],"exercise":[{"q":"The government has invested heavily in ____ into renewable energy.","options":["research","researches","a research","the researches"],"answer":0,"explain":"Research is uncountable, so it has no plural and cannot take 'a'. Here it is general, so it takes no article.","explainAr":"كلمة research غير معدودة، فلا تُجمع ولا تسبقها a، والمقصود هنا البحث بشكل عام فلا تحتاج إلى أداة."},{"q":"Could you give me some ____ about preparing for the interview?","options":["advices","an advice","advise","advice"],"answer":3,"explain":"Advice is an uncountable noun, so 'some advice' is correct. 'Advise' is the verb.","explainAr":"كلمة advice اسم غير معدود، فنقول some advice. أما advise بحرف s فهي الفعل «ينصح» وليست الاسم."},{"q":"The new office furniture ____ delivered last week.","options":["were","was","have been","are"],"answer":1,"explain":"Furniture is uncountable, so it takes a singular verb. 'Last week' is a finished time, so 'was' is correct.","explainAr":"كلمة furniture غير معدودة، فيأتي الفعل بعدها مفرداً، والزمن ماضٍ منتهٍ (last week)، لذلك نستخدم was."},{"q":"There is ____ evidence that remote work improves productivity, but the results are mixed.","options":["many","a few","some","several"],"answer":2,"explain":"Evidence is uncountable, so it cannot follow many, a few or several, which are used only with plural countable nouns.","explainAr":"كلمة evidence غير معدودة، فلا تأتي بعد many أو a few أو several، لأن هذه الكلمات تُستخدم مع الأسماء المعدودة الجمع فقط."},{"q":"The amount of ____ on the motorway has increased since the new bridge opened.","options":["cars","traffics","vehicle","traffic"],"answer":3,"explain":"'The amount of' is used with uncountable nouns, and traffic is uncountable. With cars you would need 'the number of cars'.","explainAr":"عبارة the amount of تُستخدم مع الأسماء غير المعدودة، وكلمة traffic غير معدودة. أما مع cars فنقول the number of cars."}]},{"id":"g06","title":"Run-on sentences and comma splices","forSkill":"writing","why":"Arabic writing often joins many clauses with و (and) and uses commas freely between complete sentences. Transferred into English, this produces very long 'and... and...' sentences and comma splices, which make an essay look unplanned and lower both Coherence and Cohesion and Grammatical Range and Accuracy.","rule":["Two complete sentences (each with a subject and verb) cannot be joined with only a comma. This error is called a comma splice.","Fix a comma splice with a full stop, a semicolon, a conjunction (and, but, so, because, although) or a relative or participle clause.","Avoid chains of 'and': if one sentence joins three or more clauses with 'and', split it or use subordination.","However, therefore, moreover and in addition cannot join two clauses with a comma. Put a full stop or semicolon before them and a comma after: Costs rose; however, demand remained stable.","Aim for a mix of sentence lengths, with one main idea in each sentence."],"ar":"تميل الكتابة العربية إلى ربط الجمل الطويلة بحرف العطف «و» مرة بعد مرة، وتُستخدم الفاصلة بحرية بين جمل مستقلة. أما في الإنجليزية فلا يجوز وصل جملتين تامتين بفاصلة فقط، ويسمى هذا الخطأ comma splice، مثل: Many people work from home, this saves time. ولتصحيحه ضع نقطة أو فاصلة منقوطة، أو استخدم أداة ربط مثل because أو which أو so. كذلك فإن تكرار and في جملة واحدة طويلة يجعل الفكرة غير واضحة، ويوحي للممتحن بأن الكاتب لم يخطط لنصه. وانتبه إلى أن كلمات مثل however وtherefore ليست أدوات وصل بين جملتين، بل تحتاج إلى نقطة أو فاصلة منقوطة قبلها وفاصلة بعدها.","examples":[{"wrong":"Many employees now work from home, this saves them time and money.","right":"Many employees now work from home, which saves them time and money.","note":"A relative clause with 'which' fixes the comma splice. A full stop before 'This' would also be correct."},{"wrong":"The council built new roads and the traffic got worse and people started driving more and pollution increased.","right":"Although the council built new roads, traffic got worse. This was because people started driving more, which in turn increased pollution.","note":"Subordination (although, because, which) shows how the ideas are connected instead of listing them with 'and'."},{"wrong":"Online learning is flexible, however, it requires a lot of self-discipline.","right":"Online learning is flexible; however, it requires a lot of self-discipline.","note":"'However' is not a conjunction. Use a semicolon or a full stop before it."},{"wrong":"The figure for Japan was the highest, it reached 45% in 2020.","right":"The figure for Japan was the highest, reaching 45% in 2020.","note":"A participle clause joins the ideas correctly and adds grammatical range."},{"wrong":"Some people prefer to live in cities, they have more job opportunities there.","right":"Some people prefer to live in cities because they have more job opportunities there.","note":"'Because' makes the reason clear and removes the comma splice."}],"exercise":[{"q":"Which sentence is correctly punctuated?","options":["Prices rose sharply, consumers bought less.","Prices rose sharply, therefore consumers bought less.","Prices rose sharply; therefore, consumers bought less.","Prices rose sharply therefore, consumers bought less."],"answer":2,"explain":"'Therefore' cannot join two clauses on its own, so it needs a semicolon (or full stop) before it and a comma after it. The first option is a comma splice.","explainAr":"كلمة therefore لا تربط بين جملتين وحدها، لذلك تحتاج إلى فاصلة منقوطة أو نقطة قبلها وفاصلة بعدها. أما الخيار الأول ففيه وصل جملتين بفاصلة فقط."},{"q":"Choose the best way to join these sentences: 'Public transport is cheap. Many people still prefer to drive.'","options":["Although public transport is cheap, many people still prefer to drive.","Public transport is cheap, many people still prefer to drive.","Public transport is cheap and many people still prefer to drive.","Public transport is cheap, however many people still prefer to drive."],"answer":0,"explain":"The ideas contrast, so 'although' is the right link. The second and fourth options are comma splices, and 'and' in the third option hides the contrast.","explainAr":"بين الفكرتين تناقض، لذلك نستخدم although. الخياران الثاني والرابع فيهما وصل جملتين بفاصلة فقط، أما and في الخيار الثالث فلا تُظهر التناقض."},{"q":"Which sentence contains a comma splice?","options":["The app is free, but it contains adverts.","Because the app is free, it contains adverts.","The app, which is free, contains adverts.","The app is free, it contains a lot of adverts."],"answer":3,"explain":"The last sentence joins two complete clauses ('The app is free' and 'it contains a lot of adverts') with only a comma. The others use 'but', 'because' or 'which'.","explainAr":"الجملة الأخيرة تصل بين جملتين تامتين بفاصلة فقط دون أداة ربط، أما الجمل الأخرى فتستخدم but أو because أو which."},{"q":"Choose the best revision of: 'I finished the course and I got a certificate and I applied for a new job and I got it.'","options":["I finished the course and got a certificate, and I applied for a new job and got it.","After finishing the course and gaining a certificate, I applied for a new job, and I was successful.","I finished the course, I got a certificate, I applied for a new job, I got it.","I finished the course and I got a certificate, and then I applied for a new job and I got it."],"answer":1,"explain":"The second option uses a time phrase with -ing forms to show the order of events and avoids the chain of 'and'. The third option is a series of comma splices.","explainAr":"الخيار الثاني يستخدم تركيباً زمنياً مع صيغة ing ليُظهر ترتيب الأحداث، ويتجنب تكرار and. أما الخيار الثالث فيصل جملاً تامة بفواصل فقط."},{"q":"Which sentence is NOT correct?","options":["The number of visitors fell in 2019. However, it recovered the following year.","The number of visitors fell in 2019, but it recovered the following year.","The number of visitors fell in 2019, it recovered the following year.","Although the number of visitors fell in 2019, it recovered the following year."],"answer":2,"explain":"The third sentence is a comma splice: two complete clauses joined only by a comma. The others use a full stop, 'but' or 'although'.","explainAr":"الجملة الثالثة تصل بين جملتين تامتين بفاصلة فقط، وهذا خطأ. أما الجمل الأخرى فتستخدم نقطة أو but أو although."}]},{"id":"g07","title":"Relative clauses without extra pronouns","forSkill":"both","why":"An Arabic relative clause normally repeats the noun with a pronoun (الضمير العائد): 'التطبيق الذي أستخدمه' translates word for word as 'the app that I use it'. English does not allow this extra pronoun, and it also uses commas and different pronouns for defining and non-defining clauses.","rule":["Do not repeat the noun with a pronoun inside a relative clause: the app that I use, not the app that I use it.","Use who for people, which for things, and that for either in defining clauses; whose for possession; where for places; when for times.","Defining clauses (no commas) tell us which one: The employees who work remotely are happier. Non-defining clauses (with commas) add extra information: My manager, who has worked here for ten years, approved the plan.","Never use that in a non-defining clause: The website, which was launched in 2020, ...","In a defining clause, you can omit the relative pronoun when it is the object: the course (that) I took.","Use which after a comma to comment on a whole clause: Rents have risen, which has forced many young people to move."],"ar":"في العربية يحتاج الاسم الموصول غالباً إلى ضمير عائد يرجع إلى الاسم السابق، فنقول: «التطبيق الذي أستخدمه» و«الشركة التي أعمل فيها». أما في الإنجليزية فيحلّ الاسم الموصول نفسه محلّ هذا الضمير، فلا يجوز تكراره. نقول the app that I use وليس the app that I use it، ونقول the company where I work أو the company that I work for وليس the company that I work in it. استخدم who للعاقل وwhich لغير العاقل، وthat لكليهما في الجمل التي تحدد المقصود. أما الجملة الوصفية الإضافية التي تأتي بين فاصلتين فلا تُستخدم فيها that، بل who أو which فقط. ويمكن استخدام which بعد فاصلة للتعليق على الجملة كلها، وهذا يضيف تنوعاً نحوياً مفيداً في الكتابة والمحادثة.","examples":[{"wrong":"The app that I use it every day helps me learn new words.","right":"The app that I use every day helps me learn new words.","note":"'That' already refers to the app, so 'it' must be removed."},{"wrong":"This is the company which I work in it.","right":"This is the company where I work.","note":"Use 'where', or 'the company (that) I work for'. Never add 'it'."},{"wrong":"My colleague which sits next to me is from Egypt.","right":"My colleague who sits next to me is from Egypt.","note":"Use 'who' (or 'that') for people, not 'which'."},{"wrong":"Dubai, that is a popular tourist destination, attracts millions of visitors.","right":"Dubai, which is a popular tourist destination, attracts millions of visitors.","note":"Non-defining clauses (between commas) use 'which', never 'that'."},{"wrong":"Many young people cannot afford housing, it is a serious problem.","right":"Many young people cannot afford housing, which is a serious problem.","note":"'Which' comments on the whole clause and also removes the comma splice."},{"wrong":"Children who their parents read to them often enjoy books later.","right":"Children whose parents read to them often enjoy books later.","note":"'Whose' replaces 'who their'."}],"exercise":[{"q":"The course ____ was very practical.","options":["that I took it last year","which I took it last year","that I took last year","who I took last year"],"answer":2,"explain":"'That' refers to the course and is the object of 'took', so 'it' must not be added. 'Who' is only for people.","explainAr":"كلمة that تعود على the course وهي مفعول به للفعل took، فلا يجوز إضافة it بعد الفعل. أما who فتُستخدم للأشخاص فقط."},{"q":"The manager ____ hired me has just left the company.","options":["who","which","whose","where"],"answer":0,"explain":"The noun is a person and the pronoun is the subject of 'hired', so 'who' is correct.","explainAr":"الاسم السابق شخص، والاسم الموصول فاعل للفعل hired، لذلك نستخدم who."},{"q":"My hometown, ____ is on the coast, is famous for its seafood.","options":["that","where","it","which"],"answer":3,"explain":"This is a non-defining clause (between commas) and the pronoun is the subject of 'is', so 'which' is needed. 'That' is not used after a comma, and 'where' cannot be the subject of a verb; it must be followed by a clause with its own subject (where many fishermen live).","explainAr":"هذه جملة وصفية إضافية بين فاصلتين، والاسم الموصول فاعل للفعل is، لذلك نستخدم which. ولا تُستخدم that بعد الفاصلة، أما where فلا تكون فاعلاً، بل يأتي بعدها جملة لها فاعلها الخاص."},{"q":"Which sentence is correct?","options":["The city where I grew up it has changed a lot.","The city where I grew up has changed a lot.","The city which I grew up has changed a lot.","The city that I grew up there has changed a lot."],"answer":1,"explain":"'Where' replaces 'in the city', so nothing else is needed. The first and fourth options repeat a pronoun or adverb, and the third needs 'in' (which I grew up in).","explainAr":"كلمة where تحلّ محلّ in the city، فلا نحتاج إلى أي إضافة. الخياران الأول والرابع يكرران الضمير أو كلمة there، والخيار الثالث ينقصه حرف الجر in."},{"q":"Housing costs have doubled, ____ means many young people still live with their parents.","options":["that","it","which","what"],"answer":2,"explain":"After a comma, 'which' can refer to the whole previous clause. 'It' would create a comma splice, and 'that' cannot follow a comma here.","explainAr":"بعد الفاصلة يمكن أن تعود which على الجملة السابقة كلها. أما it فتؤدي إلى وصل جملتين بفاصلة فقط، ولا تُستخدم that بعد الفاصلة في هذا الموضع."}]},{"id":"g08","title":"The passive voice in academic writing","forSkill":"writing","why":"Arabic forms the passive (المبني للمجهول) by changing the vowels of the verb and uses it less in everyday writing, so learners either avoid the English passive or form it incorrectly ('the data collected', 'are mix'). Task 1 process diagrams and Task 2 essays both reward an accurate, objective passive.","rule":["Form the passive with be in the correct tense + past participle: is made, was built, has been introduced, will be replaced, should be banned.","Use the passive when the action matters more than the doer, or when the doer is unknown or obvious: The data was collected in 2022.","Use the present simple passive to describe stages in a process: The leaves are picked, dried and then packed.","Add 'by + agent' only when it gives useful information: The policy was introduced by the city council.","Only verbs that take an object can be passive. Rise, fall, happen, occur and appear cannot: The accident happened, not The accident was happened.","Impersonal passives sound academic in Task 2: It is often argued that... It is widely believed that..."],"ar":"يُبنى الفعل للمجهول في العربية بتغيير حركاته، مثل: كَتَبَ ← كُتِبَ. أما في الإنجليزية فيتكوّن المبني للمجهول من فعل be بالزمن المناسب يليه التصريف الثالث للفعل (past participle)، مثل The data was collected و New roads have been built. ومن الأخطاء الشائعة حذف be، فيُكتب The survey conducted in 2020، أو استخدام الفعل المجرد بدلاً من التصريف الثالث، مثل are mix. يُستخدم المبني للمجهول كثيراً في الكتابة الأكاديمية لأنه يركّز على الحدث لا على الفاعل، وهو ضروري في وصف مراحل العمليات في المهمة الأولى. لكن انتبه: الأفعال اللازمة التي لا تأخذ مفعولاً به، مثل rise وfall وhappen، لا تُبنى للمجهول أبداً.","examples":[{"wrong":"The questionnaire distributed to 500 employees.","right":"The questionnaire was distributed to 500 employees.","note":"Without 'was', the questionnaire seems to do the distributing."},{"wrong":"First, the raw materials are mix with water.","right":"First, the raw materials are mixed with water.","note":"The passive needs the past participle (mixed), not the base form."},{"wrong":"The number of users was increased dramatically in 2021.","right":"The number of users increased dramatically in 2021.","note":"In trend descriptions 'increase' has no object, so it is active."},{"wrong":"A new metro line will built by 2030.","right":"A new metro line will be built by 2030.","note":"Future passive: will be + past participle."},{"wrong":"Smoking should ban in all public places.","right":"Smoking should be banned in all public places.","note":"Modal passive: modal + be + past participle."},{"wrong":"The accident was happened late at night.","right":"The accident happened late at night.","note":"'Happen' has no object, so it can never be passive."}],"exercise":[{"q":"In the next stage, the bottles ____ and sorted by colour.","options":["are collected","collect","are collecting","collected"],"answer":0,"explain":"Bottles do not collect anything; someone collects them. A process description uses the present simple passive: are + past participle.","explainAr":"الزجاجات لا تقوم بالجمع، بل يجمعها شخص ما. ووصف مراحل العملية يكون بالمبني للمجهول في المضارع البسيط: are مع التصريف الثالث."},{"q":"The new library ____ in 2019 at a cost of three million pounds.","options":["built","was build","was built","has built"],"answer":2,"explain":"The library did not build itself, so the passive is needed, and 'in 2019' requires the past simple: was + past participle (built).","explainAr":"المكتبة لم تبنِ نفسها، لذلك نحتاج إلى المبني للمجهول، وعبارة in 2019 تتطلب الماضي البسيط: was ثم التصريف الثالث built."},{"q":"Which verb CANNOT be used in the passive?","options":["introduce","produce","reduce","occur"],"answer":3,"explain":"'Occur' never takes an object, so it has no passive form. The other three verbs take objects (introduce a law, produce goods, reduce costs).","explainAr":"الفعل occur لازم لا يأخذ مفعولاً به، لذلك لا يُبنى للمجهول. أما الأفعال الأخرى فمتعدية، مثل introduce a law وproduce goods وreduce costs."},{"q":"It ____ that working from home improves work-life balance.","options":["often argues","is often argued","is often arguing","has often argued"],"answer":1,"explain":"This is an impersonal passive: It + be + past participle + that. It means 'people often argue that'.","explainAr":"هذا تركيب المبني للمجهول غير الشخصي: It ثم be ثم التصريف الثالث ثم that، ومعناه «كثيراً ما يُقال إن»."},{"q":"Since 2015, several measures ____ to reduce air pollution in the city.","options":["have taken","were taking","have been take","have been taken"],"answer":3,"explain":"'Since 2015' needs the present perfect, and measures are taken by someone, so the form is have been + past participle (taken).","explainAr":"عبارة since 2015 تتطلب المضارع التام، والإجراءات يتخذها شخص ما، لذلك نستخدم have been ثم التصريف الثالث taken."}]},{"id":"g09","title":"Conditionals for building arguments","forSkill":"both","why":"Arabic often uses a past verb after إذا even for future meaning, and لو for imagined situations, so learners mix English patterns and write 'If the government will invest...' or 'If I would have time...'. Accurate conditionals are one of the easiest ways to show range in Task 2 and Speaking Part 3.","rule":["First conditional (a real future possibility): If + present simple, will/can/may + base verb: If the government invests in public transport, congestion will fall.","Never use will or would in the if-clause: If prices rise, not If prices will rise.","Second conditional (hypothetical or unlikely): If + past simple, would/could/might + base verb: If cars were banned from city centres, the air would be cleaner. Use were for all persons in formal style.","Third conditional (an imagined past): If + had + past participle, would have + past participle: If I had started earlier, I would have finished on time.","For range, use unless (= if not), provided that, as long as and otherwise, and formal inversion: Were governments to raise taxes, ... / Had I known, ..."],"ar":"في العربية نستخدم الفعل الماضي غالباً بعد «إذا» حتى عندما نتحدث عن المستقبل، فنقول «إذا درستَ نجحتَ»، ونستخدم «لو» للأمور الافتراضية. أما في الإنجليزية فلكل نوع من الشرط نمط زمني ثابت. في الشرط الأول، وهو احتمال حقيقي في المستقبل، نستخدم المضارع البسيط بعد if و will في جواب الشرط، ولا نستخدم will بعد if أبداً: If the government invests more, unemployment will fall. وفي الشرط الثاني، وهو افتراض بعيد يقابل «لو» غالباً، نستخدم الماضي البسيط بعد if و would في الجواب: If I lived abroad, I would miss my family. وفي الشرط الثالث نتحدث عن ماضٍ لم يحدث: If I had known, I would have helped. واستخدام الشرط بدقة في المقالة وفي الجزء الثالث من المحادثة يُظهر تنوعاً نحوياً واضحاً.","examples":[{"wrong":"If the government will raise fuel prices, people will drive less.","right":"If the government raises fuel prices, people will drive less.","note":"The if-clause uses the present simple, even for the future."},{"wrong":"If I would have more free time, I would learn to play the guitar.","right":"If I had more free time, I would learn to play the guitar.","note":"Second conditional: past simple in the if-clause, would in the main clause."},{"wrong":"If I studied harder at school, I would have gone to a better university.","right":"If I had studied harder at school, I would have gone to a better university.","note":"An imagined past result needs the past perfect in the if-clause."},{"wrong":"Unless the city doesn't build more housing, rents will keep rising.","right":"Unless the city builds more housing, rents will keep rising.","note":"'Unless' already means 'if not', so do not add another negative."},{"wrong":"If cars was banned from the city centre, it will be much quieter.","right":"If cars were banned from the city centre, it would be much quieter.","note":"Do not mix patterns: past in the if-clause goes with would, not will."}],"exercise":[{"q":"If more people ____ public transport, there would be less congestion.","options":["use","will use","used","would use"],"answer":2,"explain":"The main clause has 'would', so this is a second conditional: the if-clause needs the past simple 'used'.","explainAr":"جواب الشرط يحتوي على would، فهذا شرط من النوع الثاني، ويأتي بعد if الماضي البسيط used."},{"q":"If the company ____ its prices, it will lose customers.","options":["increases","will increase","increased","would increase"],"answer":0,"explain":"The main clause has 'will', so this is a first conditional: present simple after 'if', never 'will'.","explainAr":"جواب الشرط يحتوي على will، فهذا شرط من النوع الأول، ويأتي بعد if المضارع البسيط، ولا نستخدم will بعد if."},{"q":"If I ____ about the course earlier, I would have enrolled.","options":["knew","have known","would know","had known"],"answer":3,"explain":"'Would have enrolled' shows an imagined past, so this is a third conditional: if + past perfect (had known).","explainAr":"عبارة would have enrolled تدل على ماضٍ لم يحدث، فهذا شرط من النوع الثالث، ويأتي بعد if الماضي التام had known."},{"q":"Students will not improve ____ they receive regular feedback.","options":["if","unless","provided that","as long as"],"answer":1,"explain":"The meaning is 'if they do not receive feedback, they will not improve', so 'unless' (= if not) is correct. The other options give the opposite meaning.","explainAr":"المعنى: لن يتحسن الطلاب إذا لم يحصلوا على تقييم منتظم، لذلك نستخدم unless بمعنى «إلا إذا». أما الخيارات الأخرى فتعطي معنى معاكساً."},{"q":"____ governments to ban private cars, city centres would become much quieter.","options":["If","Should","Were","Had"],"answer":2,"explain":"This is a formal inverted second conditional: Were + subject + to-infinitive = If governments were to ban. 'If' would need 'were' after the subject.","explainAr":"هذا شرط من النوع الثاني بصيغة التقديم الرسمية: Were ثم الفاعل ثم to مع الفعل، ومعناه If governments were to ban. أما If فتحتاج إلى were بعد الفاعل."}]},{"id":"g10","title":"Comparatives and superlatives for Task 1","forSkill":"writing","why":"Arabic forms comparisons with one pattern (أفعل) followed by من, so learners sometimes double the comparative ('more higher'), use 'from' instead of 'than', or forget 'the' with superlatives. Task 1 requires accurate comparisons in almost every sentence.","rule":["One-syllable adjectives add -er/-est: higher, the highest. Longer adjectives use more/the most: more popular, the most expensive. Never combine the two: more higher.","Use than after a comparative, never from or that alone: Sales were higher than in 2010.","Superlatives need the (or a possessive): the largest proportion, its lowest point.","Show the size of a difference with slightly, a little, considerably, significantly, much or far. Do not use very with comparatives.","Use as... as and twice/three times as... as for equal or multiple comparisons: Exports were twice as high as imports.","Compare like with like, using that/those to avoid repeating the noun: The rate in the north was higher than that in the south."],"ar":"تُصاغ المقارنة في العربية بوزن «أفعل» مع «مِن»، مثل «أعلى من» و«أكثر شيوعاً من». أما في الإنجليزية فنضيف er إلى الصفة القصيرة مثل higher، ونستخدم more مع الصفة الطويلة مثل more popular، ولا نجمع بينهما أبداً، فلا نقول more higher. وتأتي than بعد صيغة المقارنة، لا from. أما صيغة التفضيل فتحتاج إلى the: the highest figure. وفي المهمة الأولى من الكتابة تحتاج إلى المقارنة في كل فقرة تقريباً، لذا تعلّم الكلمات التي تبيّن حجم الفرق، مثل slightly وconsiderably وfar، وتراكيب مثل twice as high as. ولا تستخدم very مع صيغة المقارنة. وتذكّر أن تقارن الشيء بما يماثله، فتقول: The rate in Spain was higher than that in Italy.","examples":[{"wrong":"The figure for Canada was more higher than the figure for Mexico.","right":"The figure for Canada was higher than the figure for Mexico.","note":"Use either -er or more, never both."},{"wrong":"Spending on rent was larger from spending on food.","right":"Spending on rent was larger than spending on food.","note":"Comparatives are followed by 'than', not 'from' (a translation of من)."},{"wrong":"Brazil had highest percentage of renewable energy.","right":"Brazil had the highest percentage of renewable energy.","note":"Superlatives need 'the'."},{"wrong":"The number of male students was double as many as female students.","right":"There were twice as many male students as female students.","note":"Use 'twice as many... as' for countable nouns; 'double' does not work in this pattern."},{"wrong":"Unemployment in the north was higher than the south.","right":"Unemployment in the north was higher than that in the south.","note":"Compare unemployment with unemployment, not with a region. 'That' replaces 'unemployment'."},{"wrong":"Online sales were very higher in 2020 than in 2015.","right":"Online sales were much higher in 2020 than in 2015.","note":"'Very' cannot modify a comparative; use much, far or considerably."}],"exercise":[{"q":"In 2020, coal was ____ source of electricity in the country.","options":["most important","the more important","the most important","the importantest"],"answer":2,"explain":"'Important' is a long adjective, so the superlative is 'the most important'. A superlative before a noun needs 'the'.","explainAr":"كلمة important صفة طويلة، فصيغة التفضيل منها the most important، وصيغة التفضيل قبل الاسم تحتاج إلى the."},{"q":"Car ownership in rural areas was considerably ____ in urban areas.","options":["more high than that","higher than that","higher from that","higher that"],"answer":1,"explain":"'High' is a short adjective (higher), the comparison word is 'than', and 'that' replaces 'car ownership' so like is compared with like.","explainAr":"كلمة high صفة قصيرة فنقول higher، وأداة المقارنة هي than، وكلمة that تحلّ محلّ car ownership حتى نقارن الشيء بما يماثله."},{"q":"The price of houses in the capital was ____ the national average.","options":["three times as high as","three times higher from","three times as higher as","three times high than"],"answer":0,"explain":"The pattern for multiples is: number + times + as + adjective (base form) + as.","explainAr":"تركيب المضاعفات هو: العدد ثم times ثم as ثم الصفة في صيغتها الأصلية ثم as."},{"q":"Which word CANNOT go in the gap? 'Spending on health was ____ higher than spending on defence.'","options":["significantly","far","slightly","very"],"answer":3,"explain":"'Very' cannot modify a comparative adjective. The other three words show how big the difference is and are all correct.","explainAr":"كلمة very لا تأتي قبل صيغة المقارنة، أما الكلمات الثلاث الأخرى فتبيّن حجم الفرق وكلها صحيحة."},{"q":"Of the five countries, Norway recorded ____ level of unemployment.","options":["the lower","lowest","the lowest","the most low"],"answer":2,"explain":"Comparing five countries needs a superlative, and 'low' is a short adjective: the lowest.","explainAr":"المقارنة بين خمس دول تحتاج إلى صيغة التفضيل، وكلمة low صفة قصيرة فنقول the lowest."}]},{"id":"g11","title":"Describing trends: verbs, nouns and adverbs","forSkill":"writing","why":"Task 1 line and bar charts require accurate verb forms (rise, rose, risen) and the right choice between verb + adverb (rose sharply) and adjective + noun (a sharp rise). Arabic speakers often confuse rise and raise, mix the two patterns ('a sharply rise') or use the wrong preposition ('a rise of the price').","rule":["Learn the irregular forms: rise, rose, risen; fall, fell, fallen; grow, grew, grown. Increase, decrease, decline, drop and fluctuate are regular.","Rise and fall have no object: Prices rose. Raise needs an object: The bank raised interest rates.","Verb + adverb: rose sharply, fell slightly, increased steadily. Adjective + noun: a sharp rise, a slight fall, a steady increase.","With nouns, use there was or a time phrase + saw/experienced: There was a sharp rise in sales. The decade saw a gradual decline in...","After a noun, use in for what changed and of for the size: a rise in unemployment of 3%.","Describe the end of a trend with level off, stabilise, peak at, reach a peak of and hit a low of."],"ar":"في وصف الاتجاهات في المهمة الأولى تحتاج إلى أفعال دقيقة. احفظ التصريفات الشاذة: rise وrose وrisen، وfall وfell وfallen. وفرّق بين rise وهو فعل لازم لا يحتاج إلى مفعول به، مثل The price rose، وraise وهو فعل متعدٍّ، مثل The company raised its prices. ويمكنك التعبير عن التغيّر بطريقتين: فعل يليه ظرف مثل rose sharply، أو صفة يليها اسم مثل a sharp rise. لا تخلط بين الطريقتين، فلا تقل fell sharp أو a sharply rise. ومع الاسم نستخدم in لما تغيّر وof لمقدار التغيّر: a rise in sales of 10%. أما مع الفعل فنستخدم by لمقدار التغيّر وto للقيمة النهائية. والتنويع بين التركيبين يرفع درجة التنوع النحوي والمفردات.","examples":[{"wrong":"The number of visitors raised dramatically in 2018.","right":"The number of visitors rose dramatically in 2018.","note":"There is no object, so use rise (rose), not raise."},{"wrong":"Sales have rose steadily since 2015.","right":"Sales have risen steadily since 2015.","note":"The present perfect needs the past participle: risen."},{"wrong":"There was a significantly increase in car ownership.","right":"There was a significant increase in car ownership.","note":"A noun (increase) is described by an adjective (significant), not an adverb."},{"wrong":"Unemployment fell sharp between 2010 and 2012.","right":"Unemployment fell sharply between 2010 and 2012.","note":"A verb (fell) is described by an adverb (sharply)."},{"wrong":"There was a rise of the price of oil.","right":"There was a rise in the price of oil.","note":"Use 'in' for the thing that changed; 'of' is for the amount (a rise of 10%)."},{"wrong":"The figure increased with 15% in two years.","right":"The figure increased by 15% in two years.","note":"After a verb, the size of a change takes 'by'."}],"exercise":[{"q":"The proportion of students studying online ____ steadily over the period.","options":["raised","rose","risen","rised"],"answer":1,"explain":"There is no object, so the verb is 'rise', and its past simple is 'rose'. 'Risen' is the past participle and needs 'has' or 'had'.","explainAr":"لا يوجد مفعول به، فالفعل المناسب rise، وماضيه البسيط rose. أما risen فهو التصريف الثالث ويحتاج إلى has أو had قبله."},{"q":"The decade ____ a dramatic fall in the birth rate.","options":["was seen","fell","happened","saw"],"answer":3,"explain":"A time period can be the subject of 'saw' + noun phrase: The decade saw a dramatic fall. This is a useful alternative to 'there was'.","explainAr":"يمكن أن تكون الفترة الزمنية فاعلاً للفعل saw يليه اسم: The decade saw a dramatic fall، وهو بديل مفيد لعبارة there was."},{"q":"There was a ____ decline in the use of landline phones.","options":["gradual","gradually","graduation","gradualness"],"answer":0,"explain":"'Decline' is a noun here, so it needs an adjective before it: a gradual decline.","explainAr":"كلمة decline هنا اسم، فتحتاج إلى صفة قبلها: a gradual decline، وليس الظرف gradually."},{"q":"By 2020, the figure had ____ to its lowest point.","options":["fell","fall","felt","fallen"],"answer":3,"explain":"The past perfect is had + past participle, and the past participle of 'fall' is 'fallen'. 'Felt' comes from 'feel'.","explainAr":"الماضي التام يتكوّن من had مع التصريف الثالث، والتصريف الثالث للفعل fall هو fallen. أما felt فهي من الفعل feel."},{"q":"Which sentence is correct?","options":["The government rose taxes in 2019.","Taxes were risen by the government in 2019.","The government raised taxes in 2019.","The government has rose taxes in 2019."],"answer":2,"explain":"'Taxes' is the object, so the verb must be 'raise' (raised). 'Rise' never takes an object and cannot be passive.","explainAr":"كلمة taxes مفعول به، لذلك نستخدم الفعل المتعدي raise وماضيه raised. أما rise فلا يأخذ مفعولاً به ولا يُبنى للمجهول."}]},{"id":"g12","title":"Prepositions with numbers and time","forSkill":"writing","why":"Arabic prepositions do not map neatly onto English ones (في can mean in, on or at), so learners often guess. In Task 1 a single wrong preposition changes the meaning of the data: 'rose by 10%' and 'rose to 10%' describe different changes.","rule":["By = the size of a change: Sales rose by 5% (for example, from 20% to 25%).","From = the starting value and to = the final value: The figure rose from 20% to 25%.","At = a value at one point: Prices stood at £3. Unemployment peaked at 12%.","Time: in + years, months, seasons and decades (in 2010, in March, in the 1990s); on + days and dates (on Monday, on 5 June); at + clock times and at night, at the weekend.","For a period, use between... and or from... to, never between... to.","By + a time means 'not later than': By 2020, the figure had doubled. Until means a situation continued up to that point: It remained stable until 2015."],"ar":"حروف الجر في العربية لا تقابل حروف الجر الإنجليزية مقابلة مباشرة، فحرف «في» مثلاً قد يقابل in أو on أو at. وفي المهمة الأولى من الكتابة قد يغيّر حرف جر واحد معنى الرقم كله: فعبارة rose by 10% تعني أن مقدار الزيادة عشرة في المئة، بينما rose to 10% تعني أن القيمة النهائية أصبحت عشرة في المئة. استخدم from للقيمة الأولى وto للقيمة النهائية، وat لقيمة ثابتة في نقطة معينة، مثل peaked at 80%. وفي الزمن نستخدم in مع السنوات والشهور، وon مع الأيام والتواريخ، وat مع الساعات. ولا تخلط بين between… and وfrom… to. أما by مع الزمن فتعني «بحلول»، مثل By 2020, the figure had doubled، بينما until تعني «حتى» أي استمرار الحالة إلى تلك النقطة.","examples":[{"wrong":"The price of petrol rose with 20 pence.","right":"The price of petrol rose by 20 pence.","note":"The size of a change takes 'by'."},{"wrong":"Between 2005 to 2015, the population doubled.","right":"Between 2005 and 2015, the population doubled.","note":"Between... and; from... to. Do not mix them."},{"wrong":"The unemployment rate peaked in 12% in 2009.","right":"The unemployment rate peaked at 12% in 2009.","note":"A value at one point takes 'at'; the year takes 'in'."},{"wrong":"My exam is in Saturday at the morning.","right":"My exam is on Saturday morning.","note":"Days take 'on'. 'In the morning' alone is fine, but with a day we say 'on Saturday morning'."},{"wrong":"Until 2030, half of all new cars will be electric.","right":"By 2030, half of all new cars will be electric.","note":"A target or deadline uses 'by' (not later than), not 'until'."},{"wrong":"The figure dropped from 40% until 25%.","right":"The figure dropped from 40% to 25%.","note":"The final value takes 'to'."}],"exercise":[{"q":"The number of subscribers increased from 2 million ____ 5 million.","options":["by","at","to","until"],"answer":2,"explain":"'From' gives the starting value and 'to' gives the final value. The increase was by 3 million, not by 5 million.","explainAr":"تدل from على القيمة الأولى وto على القيمة النهائية. أما مقدار الزيادة فكان ثلاثة ملايين، فلا يصح by مع خمسة ملايين."},{"q":"Profits fell ____ £3 million, from £15 million to £12 million.","options":["by","to","at","of"],"answer":0,"explain":"£3 million is the size of the fall (15 minus 12), so it takes 'by'. 'To' would mean the final figure was £3 million.","explainAr":"ثلاثة ملايين هي مقدار الانخفاض (15 ناقص 12)، لذلك نستخدم by. أما to فتعني أن القيمة النهائية أصبحت ثلاثة ملايين."},{"q":"Car sales remained stable ____ around 40,000 a year.","options":["on","in","at","by"],"answer":2,"explain":"A level that stays the same is described with 'at': remained stable at, stood at, levelled off at.","explainAr":"عندما نصف قيمة ثابتة نستخدم at، كما في remained stable at وstood at وlevelled off at."},{"q":"The new metro line opened ____ 14 March 2022.","options":["in","at","by","on"],"answer":3,"explain":"A specific date takes 'on'. 'In' is used only for the month or year alone (in March, in 2022).","explainAr":"التاريخ المحدد باليوم يأخذ on، أما in فتُستخدم مع الشهر وحده أو السنة وحدها، مثل in March وin 2022."},{"q":"____ the end of the period, renewable energy had overtaken coal.","options":["Until","By","In","Since"],"answer":1,"explain":"'By' + a time means that the change was complete at that point, and it often goes with the past perfect (had overtaken).","explainAr":"كلمة by مع الزمن تعني «بحلول»، أي أن التغيّر اكتمل عند تلك النقطة، وكثيراً ما تأتي مع الماضي التام مثل had overtaken."}]},{"id":"g13","title":"Word formation: choosing the right word form","forSkill":"both","why":"Arabic builds related words from a root using patterns (اقتصاد، اقتصادي), so learners often know the root but choose the wrong English form, writing 'economical growth', 'it effects people' or 'a success person'. Word form errors lower your Lexical Resource score and can also confuse meaning.","rule":["First decide which part of speech the sentence needs: a noun after an article or adjective, an adjective before a noun or after be, an adverb to describe a verb or adjective.","Economic = related to the economy (economic growth); economical = saving money or fuel (an economical car).","Affect is normally a verb (Pollution affects health); effect is normally a noun (Pollution has an effect on health).","Learn common families: success, successful, succeed, successfully; benefit, beneficial; danger, dangerous, endanger; responsibility, responsible, responsibly.","Typical suffixes: -tion, -ment, -ness, -ity for nouns; -al, -ive, -ous, -ful for adjectives; -ise, -en, -ify for verbs; -ly for adverbs."],"ar":"تُشتق الكلمات في العربية من جذر واحد على أوزان مختلفة، مثل اقتصاد واقتصادي واقتصادياً، وهذا يشبه ما يحدث في الإنجليزية من خلال اللواحق مثل -tion و-al و-ly. لكن المشكلة أن المتعلم يعرف الجذر ثم يختار الصيغة الخطأ، فيكتب economical growth بدلاً من economic growth. فكلمة economic تعني «اقتصادي» أي متعلق بالاقتصاد، أما economical فتعني «موفِّر» أو «قليل التكلفة». ومن الأخطاء الشائعة أيضاً الخلط بين affect وهو فعل بمعنى «يؤثّر في»، وeffect وهو اسم بمعنى «تأثير». لذلك اسأل نفسك دائماً: هل يحتاج هذا الموضع إلى اسم أم فعل أم صفة أم ظرف؟ وتعلّم الكلمات على شكل عائلات، لأن ذلك يرفع دقة المفردات ويوسّع حصيلتك اللغوية.","examples":[{"wrong":"Tourism is important for the economical growth of my country.","right":"Tourism is important for the economic growth of my country.","note":"Growth of the economy is economic; economical means 'not wasteful'."},{"wrong":"Social media effects the way teenagers see themselves.","right":"Social media affects the way teenagers see themselves.","note":"A verb is needed, so use affect."},{"wrong":"My father is a very success businessman.","right":"My father is a very successful businessman.","note":"An adjective is needed before the noun 'businessman'."},{"wrong":"Regular exercise is benefit for mental health.","right":"Regular exercise is beneficial for mental health.","note":"After 'is' we need an adjective here. Alternatively: Regular exercise benefits mental health."},{"wrong":"Parents should take responsible for their children's screen time.","right":"Parents should take responsibility for their children's screen time.","note":"'Take' needs a noun object: take responsibility for."},{"wrong":"Many people are not aware of the dangerous of fast food.","right":"Many people are not aware of the dangers of fast food.","note":"After 'the' and before 'of' we need a noun: dangers."}],"exercise":[{"q":"Hybrid cars are more ____ than traditional cars because they use less fuel.","options":["economic","economy","economical","economically"],"answer":2,"explain":"The meaning is 'saving fuel and money', so the adjective is 'economical'. 'Economic' means 'related to the economy'.","explainAr":"المعنى هنا «موفِّر للوقود والمال»، لذلك نستخدم الصفة economical. أما economic فتعني «متعلق بالاقتصاد»."},{"q":"Lack of sleep can seriously ____ a student's concentration.","options":["affect","effect","effective","affection"],"answer":0,"explain":"After the modal 'can' we need a verb, and the verb meaning 'have an influence on' is 'affect'.","explainAr":"بعد الفعل الناقص can نحتاج إلى فعل، والفعل الذي يعني «يؤثّر في» هو affect، أما effect فهو اسم."},{"q":"Living abroad can be a very ____ experience.","options":["benefit","beneficially","beneficiary","beneficial"],"answer":3,"explain":"Between 'very' and the noun 'experience' we need an adjective: beneficial.","explainAr":"بين very والاسم experience نحتاج إلى صفة، وهي beneficial."},{"q":"The project was a great ____, thanks to careful planning.","options":["successful","success","succeed","successfully"],"answer":1,"explain":"After 'a great' we need a noun: a great success.","explainAr":"بعد a great نحتاج إلى اسم، فنقول a great success."},{"q":"Governments must deal with the ____ of rising sea levels.","options":["consequent","consequently","consequences","consequential"],"answer":2,"explain":"After 'the' and before 'of' we need a noun: the consequences of. The other options are an adjective, an adverb and another adjective.","explainAr":"بعد the وقبل of نحتاج إلى اسم، فنقول the consequences of. أما الخيارات الأخرى فهي صفة وظرف وصفة أخرى."}]},{"id":"g14","title":"Complex sentences for grammatical range","forSkill":"both","why":"Band 7 in Grammatical Range and Accuracy needs a variety of complex structures used with good control. Many Arabic speakers rely on 'and', 'but' and 'because', or translate Arabic patterns such as 'رغم أن... إلا أن', which produces the common error 'Although..., but...'.","rule":["Although or even though + clause shows contrast. Do not add but to the other clause: Although the course was expensive, it was worth it.","Despite or in spite of + noun or -ing form, never a full clause: Despite the high cost... / Despite being expensive...","Whereas and while compare two contrasting facts: Car use rose in the suburbs, whereas it fell in the city centre.","A non-defining which-clause adds a comment: The app is free, which explains its popularity.","Participle clauses make writing concise: Having finished my degree, I joined a start-up. The subject of both clauses must be the same person or thing.","Mix simple and complex sentences; accuracy matters more than length."],"ar":"للوصول إلى الدرجة 7 في معيار التنوع والدقة النحوية يجب أن تستخدم تراكيب معقدة متنوعة دون أخطاء كثيرة. ومن أشهر أخطاء المتعلمين العرب قول Although…, but… ترجمةً لتركيب «رغم أن… إلا أن…»، والصواب أن تستخدم أداة واحدة فقط: Although the job was stressful, I enjoyed it. وانتبه إلى أن despite يأتي بعدها اسم أو صيغة ing وليس جملة كاملة. واستخدم whereas للمقارنة بين حقيقتين متقابلتين، وهي مفيدة جداً في المهمة الأولى. أما تراكيب اسم الفاعل مثل Having finished my degree, I… فتجعل الكتابة موجزة وأكاديمية، بشرط أن يكون الفاعل في الجملتين واحداً. ولا تُكثر من الجمل الطويلة على حساب الدقة، فالجملة القصيرة الصحيحة أفضل من الطويلة المليئة بالأخطاء.","examples":[{"wrong":"Although the salary was low, but I accepted the job.","right":"Although the salary was low, I accepted the job.","note":"Use one contrast word only: although or but, not both."},{"wrong":"Despite the course was difficult, most students passed.","right":"Despite the difficulty of the course, most students passed.","note":"'Despite' needs a noun phrase. Alternatively: Although the course was difficult, ..."},{"wrong":"Having finished the report, the computer crashed.","right":"After I had finished the report, the computer crashed.","note":"The participle clause wrongly suggests that the computer finished the report. Both clauses must share a subject."},{"wrong":"Whereas exports from Germany rose, but exports from Italy fell.","right":"Whereas exports from Germany rose, those from Italy fell.","note":"'Whereas' already shows contrast, so 'but' must be removed."},{"wrong":"The city introduced bike lanes, this was very popular.","right":"The city introduced bike lanes, which proved very popular.","note":"A which-clause comments on the whole idea and avoids a comma splice."},{"wrong":"Even I was tired, I continued working.","right":"Even though I was tired, I continued working.","note":"'Even' alone is not a conjunction; use 'even though' or 'although'."}],"exercise":[{"q":"____ online shopping is convenient, many people still prefer to see products before buying them.","options":["Despite","However","Although","In spite of"],"answer":2,"explain":"A full clause follows (online shopping is convenient), so we need the conjunction 'although'. Despite and in spite of need a noun or -ing form, and however cannot join clauses.","explainAr":"يأتي بعد الفراغ جملة كاملة، لذلك نحتاج إلى أداة الربط although. أما despite وin spite of فيأتي بعدهما اسم أو صيغة ing، وhowever لا تربط بين جملتين."},{"q":"Which sentence is correct?","options":["Although it was raining, but we went out.","Despite it was raining, we went out.","Even it was raining, we went out.","Although it was raining, we went out."],"answer":3,"explain":"Only the last sentence uses one correct contrast conjunction. The first doubles the link word, the second uses despite with a clause, and the third uses 'even' as a conjunction.","explainAr":"الجملة الأخيرة وحدها تستخدم أداة تناقض واحدة صحيحة. الأولى تكرر أداة الربط، والثانية تضع جملة كاملة بعد despite، والثالثة تستخدم even وحدها كأداة ربط."},{"q":"____ the instructions carefully, I installed the software without any problems.","options":["Having read","Despite reading","Although I read","I read"],"answer":0,"explain":"The participle clause shows that reading happened first and the subject (I) is the same in both clauses. 'Despite' and 'although' show contrast, which is illogical here, and 'I read' creates a comma splice.","explainAr":"تركيب Having read يدل على أن القراءة حدثت أولاً، والفاعل I واحد في الجملتين. أما despite وalthough فتدلان على تناقض لا معنى له هنا، وI read تؤدي إلى وصل جملتين بفاصلة فقط."},{"q":"Sales of e-books increased, ____ sales of printed books remained stable.","options":["despite","in spite","whereas","although of"],"answer":2,"explain":"'Whereas' links two contrasting facts in full clauses. 'Despite' cannot be followed by a clause, and 'in spite' and 'although of' are not correct forms.","explainAr":"تربط whereas بين حقيقتين متقابلتين في جملتين كاملتين. أما despite فلا يأتي بعدها جملة، وin spite وalthough of صيغتان غير صحيحتين."},{"q":"____ the high cost of living, the city continues to attract young professionals.","options":["Although","Even though","Whereas","Despite"],"answer":3,"explain":"A noun phrase follows (the high cost of living), so we need 'despite'. Although, even though and whereas must be followed by a full clause.","explainAr":"يأتي بعد الفراغ اسم (the high cost of living)، لذلك نستخدم despite. أما although وeven though وwhereas فيجب أن تأتي بعدها جملة كاملة."}]}],"vocab":[{"w":"analyse","pos":"verb","lvl":1,"topic":"general","def":"to examine something carefully in order to understand it or explain how its parts work","ex":"Researchers analysed the survey responses to find out why so many students prefer recorded lectures.","col":["analyse data","analyse the results","analyse in detail"],"fam":"analysis (n), analyst (n), analytical (adj)","ar":"يُحلِّل","bank":0},{"w":"assess","pos":"verb","lvl":1,"topic":"general","def":"to judge the size, quality, value or importance of something after thinking about it carefully","ex":"Before launching the scheme, the company assessed its likely impact on staff who work from home.","col":["assess the impact of","assess the risks","accurately assess"],"fam":"assessment (n), assessor (n)","ar":"يُقيِّم، يُقدِّر","bank":0},{"w":"indicate","pos":"verb","lvl":1,"topic":"general","def":"to show that something is true, exists or is likely to happen","ex":"The figures indicate that demand for evening courses rose steadily between 2015 and 2020.","col":["the figures indicate that","clearly indicate","research indicates"],"fam":"indication (n), indicator (n), indicative (adj)","ar":"يُشير إلى، يدلّ على","bank":0},{"w":"illustrate","pos":"verb","lvl":1,"topic":"general","def":"to show or explain something, especially by using a chart, picture or example","ex":"The bar chart illustrates how many hours employees in four countries spent commuting each week.","col":["the chart illustrates","illustrate a point","clearly illustrate"],"fam":"illustration (n), illustrative (adj)","ar":"يُوضِّح، يُبيِّن","bank":0},{"w":"proportion","pos":"noun","lvl":1,"topic":"general","def":"a part or share of a whole, often given as a percentage or fraction","ex":"The proportion of adults who read the news on their phones doubled over the decade.","col":["a large/small proportion of","the proportion of","in proportion to"],"fam":"proportional (adj), proportionate (adj), disproportionate (adj)","ar":"نِسبة، حِصّة","bank":0},{"w":"approximately","pos":"adverb","lvl":1,"topic":"general","def":"close to a particular number or amount, but not exactly","ex":"Approximately two thirds of the respondents said they used public transport to get to work.","col":["approximately half of","approximately 20 per cent","approximately equal"],"fam":"approximate (adj, v), approximation (n)","ar":"تقريبًا","bank":0},{"w":"respectively","pos":"adverb","lvl":1,"topic":"general","def":"in the same order as the things you have just mentioned","ex":"Spending on research and on marketing reached 12% and 18% of the budget respectively in 2020.","col":["X and Y respectively","at 20% and 35% respectively"],"fam":"respective (adj)","ar":"على التوالي، على الترتيب","bank":0},{"w":"overall","pos":"adverb / adjective","lvl":1,"topic":"general","def":"when everything is considered; used to introduce a general summary","ex":"Overall, the number of people working from home increased, while office attendance fell.","col":["overall, it is clear that","the overall trend","the overall figure"],"fam":"overall (adj)","ar":"إجمالًا، بوجهٍ عام","bank":0},{"w":"fluctuate","pos":"verb","lvl":1,"topic":"general","def":"to change often, rising and falling in an irregular way","ex":"Sales of laptops fluctuated between two and three million units before rising sharply in 2020.","col":["fluctuate between X and Y","fluctuate wildly","fluctuate around"],"fam":"fluctuation (n), fluctuating (adj)","ar":"يتذبذب، يتقلّب","bank":0},{"w":"decline","pos":"verb / noun","lvl":1,"topic":"general","def":"to become smaller, weaker or less in number or quality; a fall of this kind","ex":"Newspaper sales declined steadily over the period, while online subscriptions grew rapidly.","col":["decline steadily/sharply","a gradual decline in","be in decline"],"fam":"declining (adj)","ar":"ينخفض، انخفاض","bank":0},{"w":"peak","pos":"verb / noun","lvl":1,"topic":"general","def":"to reach the highest point or level; the highest point","ex":"Home internet use peaked at 9 pm and then fell steadily until the early morning.","col":["peak at","reach a peak of","peak hours"],"fam":"peak (adj)","ar":"يبلغ الذروة، ذروة","bank":0},{"w":"substantial","pos":"adjective","lvl":1,"topic":"general","def":"large in amount, size, value or importance","ex":"Training staff to use the new software required a substantial amount of time.","col":["a substantial increase","a substantial amount of","substantial evidence"],"fam":"substantially (adv), substance (n)","ar":"كبير، ملموس","bank":0},{"w":"whereas","pos":"conjunction","lvl":1,"topic":"general","def":"used to compare two facts and show how they are different","ex":"Younger employees preferred flexible hours, whereas older staff valued job security more highly.","col":["X rose, whereas Y fell","whereas the figure for Y"],"fam":"no derived forms; compare while, whilst (conj)","ar":"بينما، في حين أنّ","bank":0},{"w":"consequently","pos":"adverb","lvl":1,"topic":"general","def":"as a result of what has just been mentioned","ex":"Many firms moved their training online; consequently, their travel costs fell significantly.","col":["and consequently","consequently, there has been","consequently, many people"],"fam":"consequence (n), consequent (adj)","ar":"نتيجةً لذلك، وبالتالي","bank":0},{"w":"account for","pos":"phrasal verb","lvl":1,"topic":"general","def":"to form a particular part or amount of something; also, to explain why something happens","ex":"Smartphones accounted for nearly half of all online purchases in the final year shown.","col":["account for X% of","account for the largest share","account for the difference"],"fam":"account (n)","ar":"يُشكِّل (نسبةً)، يُفسِّر","bank":0},{"w":"evidence","pos":"noun","lvl":1,"topic":"general","def":"facts, signs or information that show whether something is true","ex":"There is growing evidence that regular exercise improves concentration at work.","col":["growing evidence","provide evidence of","strong evidence"],"fam":"evident (adj), evidently (adv)","ar":"دليل، أدلّة","bank":0},{"w":"emission","pos":"noun","lvl":1,"topic":"environment","def":"gas, heat or another substance sent out into the air, especially by vehicles and factories","ex":"Allowing staff to work from home two days a week could cut the carbon emissions caused by commuting.","col":["carbon emissions","reduce/cut emissions","greenhouse gas emissions"],"fam":"emit (v)","ar":"انبعاث، انبعاثات","bank":0},{"w":"sustainable","pos":"adjective","lvl":1,"topic":"environment","def":"able to continue for a long time without damaging the environment or using up natural resources","ex":"Universities are under pressure to adopt more sustainable practices, such as reducing paper use.","col":["sustainable development","environmentally sustainable","a sustainable future"],"fam":"sustainability (n), sustain (v), unsustainable (adj)","ar":"مُستدام","bank":0},{"w":"hypothesis","pos":"noun","lvl":1,"topic":"science","def":"an idea that might explain something but has not yet been proved, used as a starting point for research","ex":"The researchers tested the hypothesis that shorter meetings would help employees make better decisions.","col":["test a hypothesis","support/reject the hypothesis","put forward a hypothesis"],"fam":"hypotheses (pl), hypothetical (adj), hypothesise (v)","ar":"فَرَضيّة","bank":0},{"w":"comprise","pos":"verb","lvl":1,"topic":"general","def":"to consist of particular parts or members; to be made up of","ex":"The research team comprised three engineers, two designers and a data analyst.","col":["comprise X members","mainly comprise","the sample comprised"],"fam":"comprising (participle)","ar":"يتألّف من، يضمّ","bank":0},{"w":"crucial","pos":"adjective","lvl":1,"topic":"general","def":"extremely important, because it affects what happens next","ex":"Clear communication is crucial when team members work in different time zones.","col":["play a crucial role in","crucial to/for","absolutely crucial"],"fam":"crucially (adv)","ar":"بالغ الأهمية، حاسم","bank":0},{"w":"beneficial","pos":"adjective","lvl":1,"topic":"general","def":"having a good or helpful effect","ex":"Short breaks away from screens are beneficial for both concentration and eyesight.","col":["beneficial to/for","mutually beneficial","highly beneficial"],"fam":"benefit (n, v), beneficiary (n)","ar":"مُفيد، نافع","bank":0},{"w":"detrimental","pos":"adjective","lvl":1,"topic":"general","def":"causing harm or damage","ex":"Spending long hours on social media late at night can have a detrimental effect on students' sleep.","col":["a detrimental effect/impact on","detrimental to","potentially detrimental"],"fam":"detriment (n), detrimentally (adv)","ar":"ضارّ، مُؤذٍ","bank":0},{"w":"adverse","pos":"adjective","lvl":1,"topic":"general","def":"negative and harmful; not good for someone or something","ex":"Some parents worry that violent video games may have adverse effects on children's behaviour.","col":["adverse effects","adverse consequences","adverse weather conditions"],"fam":"adversely (adv), adversity (n)","ar":"سلبيّ، مُعاكِس","bank":0},{"w":"inevitable","pos":"adjective","lvl":1,"topic":"general","def":"certain to happen and impossible to avoid or prevent","ex":"As machines take over routine tasks, some changes to the way we work seem inevitable.","col":["almost inevitable","an inevitable consequence of","it is inevitable that"],"fam":"inevitably (adv), inevitability (n)","ar":"حتميّ، لا مفرّ منه","bank":0},{"w":"notable","pos":"adjective","lvl":1,"topic":"general","def":"important or interesting enough to deserve attention","ex":"The most notable change was the sharp fall in the number of households with a landline phone.","col":["a notable exception","the most notable feature","a notable increase"],"fam":"notably (adv), note (v)","ar":"لافت للنظر، جدير بالملاحظة","bank":0},{"w":"renewable","pos":"adjective","lvl":1,"topic":"environment","def":"(of energy) coming from sources that are naturally replaced, such as wind, sunlight or moving water","ex":"Several technology companies now aim to power their data centres entirely with renewable energy.","col":["renewable energy","renewable sources","invest in renewables"],"fam":"renew (v), renewal (n), renewables (n pl)","ar":"مُتجدِّد","bank":0},{"w":"variable","pos":"noun","lvl":1,"topic":"science","def":"a factor that can change in an experiment or situation and may affect the result","ex":"The study controlled for other variables, such as age and income, before comparing the two groups.","col":["control for variables","a key variable","independent/dependent variable"],"fam":"vary (v), variation (n), variable (adj), variability (n)","ar":"مُتغيِّر","bank":0},{"w":"emphasise","pos":"verb","lvl":1,"topic":"general","def":"to show that something is especially important or deserves special attention","ex":"The report emphasises the need for better digital skills among older workers.","col":["emphasise the importance of","emphasise the need for","strongly emphasise"],"fam":"emphasis (n), emphatic (adj)","ar":"يُؤكِّد، يُشدِّد على","bank":0},{"w":"justify","pos":"verb","lvl":1,"topic":"general","def":"to give a good reason for a decision or action","ex":"It is hard to justify spending so much on new equipment when many classrooms need basic repairs.","col":["justify the cost","difficult to justify","fully justified"],"fam":"justification (n), justifiable (adj), unjustified (adj)","ar":"يُبرِّر","bank":0},{"w":"acknowledge","pos":"verb","lvl":1,"topic":"general","def":"to accept or admit that something is true or exists","ex":"Although I acknowledge that online courses are convenient, I believe face-to-face teaching is more effective.","col":["acknowledge that","widely acknowledged","acknowledge the importance of"],"fam":"acknowledgement (n)","ar":"يُقِرّ بـ، يعترف بـ","bank":0},{"w":"outweigh","pos":"v
