ring for it may amount to little more than teaching the curriculum thoroughly. The difficulty is that few tests are able to capture qualities such as creativity or the capacity to collaborate."},{"label":"F","text":"A second line of criticism concerns fairness. Because average scores tend to rise with family income, some critics argue that tests measure social advantage as much as ability; families who can pay for private tutoring and practice materials give their children a considerable head start. Others go further, claiming that some test questions assume cultural knowledge that is more familiar to certain groups than to others. Defenders reply that the alternatives are often worse. Teachers' own judgements, Dr Felix Amadou-Strand points out, have been shown in some studies to be influenced by pupils' behaviour, appearance and background, and such biases are far harder to detect than those in a published test. A standardised test, he argues, at least makes inequality visible, which is the first step towards tackling it."},{"label":"G","text":"What seems clear is that the real question is not whether to test but how. Several education systems are experimenting with approaches that combine shorter external tests with assessed coursework, or that test a sample of pupils rather than every child, which provides national data while easing the pressure on individual schools. Varnham sees a lesson here from the long history she studies. Examinations, she observes, have always shaped what is taught, so 'the real task is to design tests worth teaching to'."}],"groups":[{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":1,"prompt":"What point does the writer make in the first paragraph?","options":[{"key":"A","text":"Most people involved in the debate are well informed about its history."},{"key":"B","text":"The origins of standardised testing help to account for why it has been neither fully embraced nor given up."},{"key":"C","text":"Opponents of standardised testing have weaker arguments than its supporters."},{"key":"D","text":"Standardised tests are used less widely than they were in the past."}],"answer":"B","explanation":"Paragraph A says understanding how testing arose 'helps to explain why it has proved so difficult either to defend wholeheartedly or to abandon'. A is contradicted: the debate is 'far older than most of its participants realise'. Neither side's arguments are judged stronger (C)."},{"n":2,"prompt":"The precautions taken in some periods of the Chinese examination system were intended to","options":[{"key":"A","text":"limit the number of candidates who passed."},{"key":"B","text":"make the examinations accessible to poorer families."},{"key":"C","text":"ensure that candidates wrote in the prescribed style."},{"key":"D","text":"prevent examiners from knowing whose work they were marking."}],"answer":"D","explanation":"Paragraph B says that, to prevent favouritism, 'candidates' names were concealed' and answers were recopied 'so that examiners could not recognise the handwriting'. The 'prescribed style' (C) is mentioned, but as something tested, not as the aim of the precautions; B contradicts Varnham's point about wealthy families."},{"n":3,"prompt":"According to the passage, nineteenth-century reformers preferred written examinations because they","options":[{"key":"A","text":"reduced the influence of teachers' personal opinions of pupils."},{"key":"B","text":"could be marked rapidly by machine."},{"key":"C","text":"were cheaper to run than oral interviews."},{"key":"D","text":"tested a wider range of abilities."}],"answer":"A","explanation":"Paragraph C says reformers thought written papers were 'more impartial than an oral interview, in which a teacher's opinion of a child might colour the result'. Machine marking (B) and falling costs (C) belong to the twentieth century, not to the reformers' arguments."},{"n":4,"prompt":"What was one consequence of machine marking?","options":[{"key":"A","text":"The multiple-choice format was invented."},{"key":"B","text":"Intelligence tests replaced other forms of assessment."},{"key":"C","text":"Marking additional papers became far less expensive."},{"key":"D","text":"Civil servants began to be appointed by examination."}],"answer":"C","explanation":"Paragraph C says that once answer sheets could be marked by machine, 'the cost of marking each additional paper fell dramatically'. The multiple-choice format (A) came before machine marking, and civil service examinations (D) began in the previous century."}]},{"type":"matching_features","instructions":"Look at the following statements and the list of researchers below. Match each statement with the correct researcher, A-D. NB You may use any letter more than once.","title":"List of Researchers","options":[{"key":"A","text":"Dr Odile Varnham"},{"key":"B","text":"Professor Bernard Oyelaran-Fisk"},{"key":"C","text":"Dr Hana Kirchwell"},{"key":"D","text":"Dr Felix Amadou-Strand"}],"questions":[{"n":5,"prompt":"Difficulties occur when a test is used for a purpose it was not designed for.","answer":"B","explanation":"In paragraph D, Oyelaran-Fisk says the most serious problems arise 'when a test designed for one purpose is pressed into service for another'."},{"n":6,"prompt":"Teachers' assessments may contain prejudices that are difficult to identify.","answer":"D","explanation":"In paragraph F, Amadou-Strand points out that teachers' judgements can be influenced by 'behaviour, appearance and background', and that such biases are 'far harder to detect' than those in a published test."},{"n":7,"prompt":"When schools are under pressure, activities that are not examined tend to be cut first.","answer":"C","explanation":"In paragraph E, Kirchwell found that in the schools under greatest pressure, 'art, music and extended project work were the first activities to be reduced'. These are activities the tests do not assess."},{"n":8,"prompt":"A historical examination system made it possible to gain an official position through achievement rather than birth.","answer":"A","explanation":"In paragraph B, Varnham argues that the Chinese system's real innovation was 'the idea that an official post could be earned rather than inherited'."},{"n":9,"prompt":"Examinations have always influenced the content of teaching.","answer":"A","explanation":"In paragraph G, Varnham 'observes' that examinations 'have always shaped what is taught'. Kirchwell (C) describes the effect of testing in present-day schools under pressure, but she does not claim it has always been so."}]},{"type":"gap","instructions":"Complete the summary below. Choose NO MORE THAN TWO WORDS from the passage for each answer.","title":"Concerns about standardised testing and possible responses","wordLimit":"NO MORE THAN TWO WORDS","questions":[{"n":10,"prompt":"When a school's standing depends on its results, teachers are tempted to spend lessons on the content and ____ expected in the test, while subjects that are not assessed may suffer.","answer":["question types"],"explanation":"Paragraph E says there is an incentive to devote lesson time 'to the material and question types that will appear on the test'. 'Content' in the summary paraphrases 'material', so the missing words are 'question types'."},{"n":11,"prompt":"Critics also question whether tests are fair, since higher scores are generally associated with greater ____.","answer":["family income","income"],"explanation":"Paragraph F says 'average scores tend to rise with family income', which is why some critics think tests measure social advantage."},{"n":12,"prompt":"Supporters reply that teachers' judgements contain hidden biases, whereas a standardised test at least reveals ____, the first step towards dealing with it.","answer":["inequality"],"explanation":"Paragraph F reports Amadou-Strand's argument that a standardised test 'at least makes inequality visible, which is the first step towards tackling it'. 'Reveals' paraphrases 'makes visible'."},{"n":13,"prompt":"Some education systems now assess only a ____ of pupils, which still provides national data but reduces the pressure on schools.","answer":["sample"],"explanation":"Paragraph G mentions approaches that 'test a sample of pupils rather than every child, which provides national data while easing the pressure on individual schools'."}]}]}],"listening":[{"id":"lp","section":1,"title":"Joining a co-working space","topic":"work","placement":true,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"A":{"role":"Hana (receptionist)","accent":"en-NZ","voice":"female"},"B":{"role":"Marcus","accent":"en-IN","voice":"male"}},"script":[{"s":"N","t":"Section 1. You will hear a telephone conversation between a receptionist at a co-working space and a freelancer who wants to become a member. First, you have some time to look at questions 1 to 5."},{"pause":25,"label":"Look at questions 1 to 5"},{"s":"N","t":"Now listen carefully and answer questions 1 to 5."},{"s":"A","t":"Good morning, Hillgate Works, Hana speaking. How can I help?"},{"s":"B","t":"Hi. I'm a freelancer, and I'd like to find out about joining."},{"s":"A","t":"Of course. Could I have your name first?"},{"s":"B","t":"Sure, it's Marcus Thelwall. That's T, H, E, L, W, A, double L."},{"s":"A","t":"Thanks, Marcus. And what kind of work do you do?"},{"s":"B","t":"Well, I trained as a graphic designer, but I hardly do any design these days. I'm a freelance copywriter now. I mostly write website content for tech companies."},{"s":"A","t":"Lovely. Now, we offer two types of membership. With a fixed desk, you get the same desk every day and you can leave your things there overnight."},{"s":"B","t":"That sounds handy, but I'm only planning to come in three days a week."},{"s":"A","t":"In that case a flexible desk would probably suit you better. You just choose any free desk in the open-plan area when you arrive."},{"s":"B","t":"Right, I'll go for the flexible one, then. How much is that?"},{"s":"A","t":"Let me check. It's a hundred and ninety-five pounds a month. Oh, sorry, I'm looking at the wrong line, that's the fixed desk. Yours is a hundred and forty-five."},{"s":"B","t":"That's fine. And could I start on the first of April?"},{"s":"A","t":"Ah, the first is a public holiday, so the building will be closed. Would the following Monday suit you?"},{"s":"B","t":"Monday the eighth? Yes, that's fine."},{"s":"A","t":"Great, so that's Monday the eighth of April."},{"s":"N","t":"Before the conversation continues, you have some time to look at questions 6 to 8."},{"pause":20,"label":"Look at questions 6 to 8"},{"s":"N","t":"Now listen and answer questions 6 to 8."},{"s":"A","t":"Is there anything in particular you need from a workspace, Marcus?"},{"s":"B","t":"Well, a reliable internet connection, obviously, but every place has decent wifi these days. What I really need is somewhere private to talk to clients on the phone without disturbing anyone."},{"s":"A","t":"Well, we have four soundproof phone booths on each floor, and members can use them whenever they're free."},{"s":"B","t":"Perfect. What about meeting rooms? Some clients like to meet face to face."},{"s":"A","t":"Members used to get meeting rooms at half price, but we changed that in January. Now every member gets three hours free each month, and after that it's twelve pounds an hour."},{"s":"B","t":"That should be plenty for me. Is there anything I need to bring on my first day?"},{"s":"A","t":"Some co-working spaces ask for a reference from your last workspace, but we don't. Just bring some photo ID, such as a passport or a driving licence."},{"s":"B","t":"And do I need a passport-sized photo for the access card?"},{"s":"A","t":"No, we'll take your picture at the front desk and print your card there and then."},{"s":"B","t":"Brilliant. Thanks for your help, Hana."},{"s":"A","t":"You're welcome, Marcus. See you on the eighth."},{"s":"N","t":"That is the end of section 1."}],"groups":[{"type":"gap","instructions":"Complete the form below. Write ONE WORD AND/OR A NUMBER for each answer.","title":"Hillgate Works: New Member Form","wordLimit":"ONE WORD AND/OR A NUMBER","questions":[{"n":1,"prompt":"Name: Marcus ____","answer":["Thelwall"],"explanation":"Marcus says \"it's Marcus Thelwall\" and spells it \"T, H, E, L, W, A, double L\". Remember that \"double L\" means two Ls at the end."},{"n":2,"prompt":"Occupation: freelance ____","answer":["copywriter"],"explanation":"He says \"I trained as a graphic designer, but I hardly do any design these days. I'm a freelance copywriter now.\" Graphic design was his earlier job, so it is the distractor."},{"n":3,"prompt":"Type of membership: ____ desk","answer":["flexible"],"explanation":"Hana describes the fixed desk first, but Marcus will only come \"three days a week\" and says \"I'll go for the flexible one\"."},{"n":4,"prompt":"Monthly fee: £____","answer":["145","£145"],"explanation":"Hana first reads \"a hundred and ninety-five pounds\" but corrects herself: \"that's the fixed desk. Yours is a hundred and forty-five.\""},{"n":5,"prompt":"Start date: Monday ____","answer":["8 April","8th April","April 8","April 8th"],"explanation":"Marcus asks for \"the first of April\", but that is a public holiday, so they agree on \"Monday the eighth of April\"."}]},{"type":"mcq","instructions":"Choose the correct letter, A, B or C.","questions":[{"n":6,"prompt":"What does Marcus say he most needs from a workspace?","options":[{"key":"A","text":"a reliable internet connection"},{"key":"B","text":"a private place to make phone calls"},{"key":"C","text":"a room for meeting clients in person"}],"answer":"B","explanation":"He mentions the internet but dismisses it (\"every place has decent wifi these days\"), then says \"What I really need is somewhere private to talk to clients on the phone\". Meeting rooms are only asked about afterwards."},{"n":7,"prompt":"What do members now get when they use the meeting rooms?","options":[{"key":"A","text":"three hours free every month"},{"key":"B","text":"half the standard hourly price"},{"key":"C","text":"unlimited use for twelve pounds a month"}],"answer":"A","explanation":"Half price was the old system: \"Members used to get meeting rooms at half price, but we changed that in January.\" Now \"every member gets three hours free each month\"; twelve pounds is the hourly charge after that."},{"n":8,"prompt":"What does Marcus need to bring on his first day?","options":[{"key":"A","text":"a reference from his previous workspace"},{"key":"B","text":"a passport-sized photograph"},{"key":"C","text":"an identity document with his photo on it"}],"answer":"C","explanation":"Hana says other places ask for a reference \"but we don't. Just bring some photo ID, such as a passport or a driving licence.\" A photograph is not needed because \"we'll take your picture at the front desk\"."}]}]},{"id":"l01","section":1,"title":"Enrolling on an evening web design course","topic":"education","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"A":{"role":"Owen (enrolments adviser)","accent":"en-IE","voice":"male"},"B":{"role":"Ruth","accent":"en-CA","voice":"female"}},"script":[{"s":"N","t":"Section 1. You will hear a woman phoning a college to enrol on an evening course. First, you have some time to look at questions 1 to 6."},{"pause":25,"label":"Look at questions 1 to 6"},{"s":"N","t":"Now listen carefully and answer questions 1 to 6."},{"s":"A","t":"Larchmont Community College, enrolments. Owen speaking."},{"s":"B","t":"Oh, hello. I'm calling about your evening courses in web design. I'd like to sign up, if there are still places."},{"s":"A","t":"There are, yes. I'll just take a few details. Can I have your full name?"},{"s":"B","t":"It's Ruth Ashdown."},{"s":"A","t":"Could you spell the surname for me?"},{"s":"B","t":"Yes, A, S, H, D, O, W, N."},{"s":"A","t":"Thank you. And can I ask what you do for a living? We collect that for our records."},{"s":"B","t":"I worked as an accountant for about twelve years, but these days I run a bakery. It's only a small one, on the high street."},{"s":"A","t":"Lovely. Now, which course were you interested in?"},{"s":"B","t":"I was thinking of Web Design Intermediate. I've used website builders a bit, so I'm not a complete beginner."},{"s":"A","t":"Have you done any coding at all, though? The intermediate course assumes you can already write basic HTML."},{"s":"B","t":"No, never. I've only ever dragged and dropped things."},{"s":"A","t":"Then I'd really recommend Web Design Foundation. It starts from the very beginning, and you can move up next term."},{"s":"B","t":"OK, Foundation it is."},{"s":"A","t":"We run it on two evenings. The Tuesday group is completely full, I'm afraid, but there's space on Thursdays."},{"s":"B","t":"Thursday's actually better for me anyway, because I do the shop's accounts on Tuesday nights."},{"s":"A","t":"Good. Classes usually start at half past six, but the Thursday group starts a bit later, at a quarter past seven, because the room's used for another class before that."},{"s":"B","t":"A quarter past seven. That's fine, the shop closes at six."},{"s":"A","t":"And the fee for the ten weeks is three hundred and twenty pounds."},{"s":"B","t":"Oh. Is there any kind of discount? I live in Larchmont itself, if that makes a difference."},{"s":"A","t":"It does, actually. Residents of the borough pay the reduced rate, which is two hundred and seventy-five pounds."},{"s":"B","t":"That's much better."},{"s":"N","t":"Before you hear the rest of the conversation, you have some time to look at questions 7 to 10."},{"pause":25,"label":"Look at questions 7 to 10"},{"s":"N","t":"Now listen and answer questions 7 to 10."},{"s":"A","t":"Can I ask why you want to do the course? It helps the tutor plan the sessions."},{"s":"B","t":"Well, my nephew built my website, but every time I change the menu or the prices, I have to wait days for him to update it. I just want to be able to do it myself."},{"s":"A","t":"That's very common. And will you need the certificate at the end? Some people want it for job applications."},{"s":"B","t":"Not really, I'm not too bothered about that."},{"s":"A","t":"Fair enough, everyone gets one anyway. Now, about the first class. The computer room has desktop machines, so there's no need to bring a laptop."},{"s":"B","t":"Should I bring a memory stick to save my work?"},{"s":"A","t":"No, everything's saved online these days. But do bring some notes on what you'd like your own website to do. The tutor uses them in the first session."},{"s":"B","t":"Right. And is there an exam at the end?"},{"s":"A","t":"There used to be a written test in the final week, but that was dropped last year. Now you build a small website of your own, and the tutor marks that. You can present it to the group if you like, but that part is optional."},{"s":"B","t":"That sounds much more useful. Is there anything I should do before the course starts?"},{"s":"A","t":"Some students buy the recommended textbook, but it's quite expensive and the tutor gives out handouts anyway. What I'd really suggest is watching the free introductory videos on our website. There are three, about twenty minutes each."},{"s":"B","t":"I'll do that. Could I come and see the computer room beforehand?"},{"s":"A","t":"You're welcome to, but it's locked in the evenings except on class nights, so you'd need to come in during the day."},{"s":"B","t":"I can't really leave the shop during the day, so I'll just wait. Thanks, Owen."},{"s":"A","t":"No problem. I'll email you the confirmation this afternoon."},{"s":"N","t":"That is the end of section 1."}],"groups":[{"type":"gap","instructions":"Complete the form below. Write ONE WORD AND/OR A NUMBER for each answer.","title":"Larchmont Community College: Evening Course Enrolment","wordLimit":"ONE WORD AND/OR A NUMBER","questions":[{"n":1,"prompt":"Name: Ruth ____","answer":["Ashdown"],"explanation":"Ruth gives her name as \"Ruth Ashdown\" and spells the surname \"A, S, H, D, O, W, N\"."},{"n":2,"prompt":"Occupation: runs a ____","answer":["bakery"],"explanation":"She \"worked as an accountant\" in the past, \"but these days I run a bakery\". The form asks about her present job, so accountant is the distractor."},{"n":3,"prompt":"Course: Web Design ____","answer":["Foundation"],"explanation":"Ruth first asks about the Intermediate course, but she has never written code, so Owen says \"I'd really recommend Web Design Foundation\" and she agrees: \"OK, Foundation it is.\""},{"n":4,"prompt":"Day: ____ evenings","answer":["Thursday","Thursdays"],"explanation":"\"The Tuesday group is completely full, I'm afraid, but there's space on Thursdays.\" Ruth says Thursday is \"actually better for me anyway\"."},{"n":5,"prompt":"Class start time: ____","answer":["7.15","7:15","7.15 pm","7:15 pm","7.15pm","7:15pm","19.15","19:15"],"explanation":"Classes \"usually start at half past six, but the Thursday group starts a bit later, at a quarter past seven\". Half past six (6.30) is the distractor."},{"n":6,"prompt":"Fee: £____","answer":["275","£275"],"explanation":"The standard fee is \"three hundred and twenty pounds\", but Ruth lives in Larchmont, so she pays \"the reduced rate, which is two hundred and seventy-five pounds\"."}]},{"type":"mcq","instructions":"Choose the correct letter, A, B or C.","questions":[{"n":7,"prompt":"What is Ruth's main reason for taking the course?","options":[{"key":"A","text":"to get a certificate for job applications"},{"key":"B","text":"to make changes to her website without help"},{"key":"C","text":"to help her nephew with his web design work"}],"answer":"B","explanation":"She is tired of waiting for her nephew to update the menu and prices: \"I just want to be able to do it myself.\" She is \"not too bothered\" about the certificate, so A is wrong."},{"n":8,"prompt":"What should Ruth bring to the first class?","options":[{"key":"A","text":"a laptop"},{"key":"B","text":"a memory stick"},{"key":"C","text":"some ideas for her own website"}],"answer":"C","explanation":"There is \"no need to bring a laptop\" and no memory stick is needed because \"everything's saved online\". Owen says \"do bring some notes on what you'd like your own website to do\"."},{"n":9,"prompt":"How are students on the course assessed?","options":[{"key":"A","text":"by a written test in the final week"},{"key":"B","text":"by a website they create"},{"key":"C","text":"by a presentation to the group"}],"answer":"B","explanation":"The written test \"was dropped last year\". \"Now you build a small website of your own, and the tutor marks that.\" The presentation is \"optional\", so it is not the assessment."},{"n":10,"prompt":"What does Owen recommend Ruth does before the course starts?","options":[{"key":"A","text":"watch some videos online"},{"key":"B","text":"buy the course textbook"},{"key":"C","text":"visit the computer room"}],"answer":"A","explanation":"He says the textbook is \"quite expensive\" and not really needed: \"What I'd really suggest is watching the free introductory videos on our website.\" Visiting the room is possible but not his recommendation, and Ruth decides not to."}]}]},{"id":"l02","section":2,"title":"Welcome to a new science centre","topic":"science","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"G":{"role":"Tess (guide)","accent":"en-AU","voice":"female"}},"script":[{"s":"N","t":"Section 2. You will hear a guide welcoming a group of visitors to a new science centre. First, you have some time to look at questions 1 to 4."},{"pause":25,"label":"Look at questions 1 to 4"},{"s":"N","t":"Now listen carefully and answer questions 1 to 4."},{"s":"G","t":"Good morning, everyone, and welcome to the Wrenfield Discovery Centre. My name's Tess, and I'll be giving you a quick introduction before you go off and explore."},{"s":"G","t":"First, a little history. Lots of visitors assume this building used to be the town's power station, because of that tall brick chimney you passed on the way in. In fact, it was a wool mill, and for over a century it produced cloth that was sold all over the country."},{"s":"G","t":"The mill closed in the nineteen-eighties, and the building stood empty for years until the town council and a local university turned it into the centre you see today. We opened just three weeks ago, so you're among our very first visitors."},{"s":"G","t":"So what makes us different? In a traditional science museum, most objects sit behind glass with a label next to them. Here, almost nothing is behind glass. You're meant to push, pull, build and take things apart. If something breaks, don't worry, our technicians can fix it."},{"s":"G","t":"A group of local schoolchildren helped us test some of the exhibits before we opened, and we're planning to change a few displays each year. But the main idea is simple: science is something you do, not something you just look at."},{"s":"G","t":"Now, a few practical points. I know some of you were hoping for a coffee, but I'm sorry to say the café is still waiting for its coffee machine to arrive, so today it's only serving cold drinks and snacks."},{"s":"G","t":"The planetarium show costs an extra four pounds, and there's no reduction on that, I'm afraid. However, because we're still in our opening month, if you show your wristband in the gift shop, you'll get fifteen per cent off anything you buy."},{"s":"G","t":"Speaking of wristbands, yours isn't just a ticket. At every exhibit there's a small scanner. Touch your wristband against it, and your results are stored, so you can log in at home and look back at everything you did today."},{"s":"G","t":"You're welcome to keep the wristband as a souvenir, there's no need to hand it in. But please be aware that it won't let you back in if you leave the building, so if you go out for lunch, you'll need to buy a new ticket."},{"s":"N","t":"Before you hear the rest of the talk, you have some time to look at questions 5 to 10."},{"pause":25,"label":"Look at questions 5 to 10"},{"s":"N","t":"Now listen and answer questions 5 to 10."},{"s":"G","t":"Right, let me tell you about the different areas. Here on the ground floor you'll find the Weather Lab. The highlight there is the storm booth. You step inside, close the door, and feel winds of up to eighty kilometres an hour. Hold on to your hat!"},{"s":"G","t":"Next to it is the Tinker Workshop. Our staff used to run live demonstrations in there, but those have moved to the main hall because the workshop got too crowded."},{"s":"G","t":"So now it's all hands-on. You can build a simple machine, such as a pulley or a little crane, using recycled cardboard, bottle tops and string."},{"s":"G","t":"Up on the first floor is the Sound Tunnel. It's a long, dark corridor, and when you speak or sing into the microphones, you can watch your voice turn into moving patterns on a huge screen. Children love it, and so do the adults, to be honest."},{"s":"G","t":"Opposite that is Code Corner. You might expect a room full of computers, but in fact there's just one tablet on each table. You use it to give simple instructions to a small robot and try to guide it through a maze without touching any of the walls."},{"s":"G","t":"Also on the first floor is the Body Zone. There's a lot to do in there, but the most popular activity is the reaction wall. Lights flash on and off at random, and you have to hit them as fast as you can. Your time goes straight onto the scoreboard."},{"s":"G","t":"Finally, if the weather's good, do go up to the Rooftop Garden. We did consider putting a telescope up there, but the city lights make stargazing almost impossible, so we decided against it."},{"s":"G","t":"Instead, you'll find vegetables and herbs growing in water, with no soil at all, and our gardener is always happy to explain how it works."},{"s":"G","t":"Right, that's enough from me. Enjoy your visit, and don't forget to scan those wristbands!"},{"s":"N","t":"That is the end of section 2."}],"groups":[{"type":"mcq","instructions":"Choose the correct letter, A, B or C.","questions":[{"n":1,"prompt":"The building that houses the centre was originally","options":[{"key":"A","text":"a textile factory."},{"key":"B","text":"a power station."},{"key":"C","text":"part of a university."}],"answer":"A","explanation":"\"Lots of visitors assume this building used to be the town's power station ... In fact, it was a wool mill.\" A wool mill is a textile factory. The university only helped to turn it into the centre."},{"n":2,"prompt":"According to the guide, the main difference between the centre and a traditional science museum is that","options":[{"key":"A","text":"its exhibits were designed by local schoolchildren."},{"key":"B","text":"visitors are expected to handle the exhibits."},{"key":"C","text":"all of its displays are replaced every year."}],"answer":"B","explanation":"\"Here, almost nothing is behind glass. You're meant to push, pull, build and take things apart.\" Schoolchildren only \"helped us test\" exhibits, and only \"a few displays\" will change each year."},{"n":3,"prompt":"Today, visitors can get a discount in","options":[{"key":"A","text":"the café."},{"key":"B","text":"the planetarium."},{"key":"C","text":"the gift shop."}],"answer":"C","explanation":"The planetarium has \"no reduction\" and the café only has cold drinks, but \"if you show your wristband in the gift shop, you'll get fifteen per cent off anything you buy.\""},{"n":4,"prompt":"What does the guide say about the wristbands?","options":[{"key":"A","text":"They keep a record of what visitors do at the exhibits."},{"key":"B","text":"They must be handed in when visitors leave."},{"key":"C","text":"They allow visitors to leave and come back later."}],"answer":"A","explanation":"\"Touch your wristband against it, and your results are stored, so you can log in at home and look back at everything you did today.\" There is \"no need to hand it in\" and it \"won't let you back in\"."}]},{"type":"matching_features","instructions":"What can visitors do in each of the following areas of the centre? Choose SIX answers from the box and write the correct letter, A-H, next to questions 5-10.","title":"Areas of the centre","options":[{"key":"A","text":"watch scientists carry out experiments"},{"key":"B","text":"compete to see who can react most quickly"},{"key":"C","text":"find out how food can be grown without soil"},{"key":"D","text":"feel what it is like to be in extreme weather"},{"key":"E","text":"look at the stars and planets"},{"key":"F","text":"guide a machine along a route"},{"key":"G","text":"see an image of their own voice"},{"key":"H","text":"make a simple device from waste materials"}],"questions":[{"n":5,"prompt":"the Weather Lab","answer":"D","explanation":"In the storm booth you \"feel winds of up to eighty kilometres an hour\", which is an experience of extreme weather."},{"n":6,"prompt":"the Tinker Workshop","answer":"H","explanation":"Live demonstrations \"have moved to the main hall\", so A is wrong. Now \"you can build a simple machine ... using recycled cardboard, bottle tops and string\"."},{"n":7,"prompt":"the Sound Tunnel","answer":"G","explanation":"\"When you speak or sing into the microphones, you can watch your voice turn into moving patterns on a huge screen.\""},{"n":8,"prompt":"Code Corner","answer":"F","explanation":"Visitors \"give simple instructions to a small robot and try to guide it through a maze\". A robot is a machine and the maze is the route."},{"n":9,"prompt":"the Body Zone","answer":"B","explanation":"On the reaction wall \"you have to hit them as fast as you can. Your time goes straight onto the scoreboard\", so visitors compete on reaction speed."},{"n":10,"prompt":"the Rooftop Garden","answer":"C","explanation":"The telescope idea was rejected (\"we decided against it\"), so E is wrong. Instead there are \"vegetables and herbs growing in water, with no soil at all\" and the gardener explains how it works."}]}]},{"id":"l03","section":3,"title":"Testing a university app","topic":"technology","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"T":{"role":"Dr Hallworth (tutor)","accent":"en-US","voice":"male"},"L":{"role":"Leila","accent":"en-ZA","voice":"female"},"A":{"role":"Arun","accent":"en-IN","voice":"male"}},"script":[{"s":"N","t":"Section 3. You will hear two students, Leila and Arun, talking to their tutor about a group project in which they tested how easy their university's mobile app is to use. First, you have some time to look at questions 1 to 5."},{"pause":30,"label":"Look at questions 1 to 5"},{"s":"N","t":"Now listen carefully and answer questions 1 to 5."},{"s":"T","t":"Come in, both of you. So, how's the usability project going? Remind me why you chose the Campus Compass app in the first place."},{"s":"A","t":"Well, we'd heard a lot of complaints about it, but honestly that wasn't the main reason. Every student has it on their phone, so we knew it would be easy to find people to take part."},{"s":"L","t":"And we thought the IT department might be interested in our results, although they haven't actually asked us for anything."},{"s":"T","t":"Fair enough. And how did the sessions go? You were using the think-aloud method, weren't you?"},{"s":"L","t":"Yes, we asked each participant to say what they were thinking while they did the tasks. But in the first few sessions people hardly said a word. They just went completely silent."},{"s":"A","t":"At first we thought it was because the room was noisy, as there's a lot of traffic in that corridor. But we moved to a quieter room, and it made no difference."},{"s":"L","t":"So from the fourth session on, we started with a short practice task, just checking the weather on their phone, and that got them talking much more naturally."},{"s":"T","t":"That's a good solution, and worth mentioning in your report. How many people did you test altogether?"},{"s":"A","t":"Ten. We were a bit worried that wasn't enough."},{"s":"T","t":"I wouldn't worry. People often assume you need large numbers, but in this kind of testing a small group usually reveals most of the serious problems. More participants would mostly show you the same issues again. Spend your time on the analysis instead."},{"s":"L","t":"That's a relief."},{"s":"T","t":"And what did you actually measure in each session?"},{"s":"A","t":"We timed how long each task took, and we noted down every error, like tapping the wrong button or having to go back a screen."},{"s":"L","t":"We'd hoped to use eye-tracking glasses as well, but the equipment was booked for the whole term. And we tried counting the number of taps, but it was impossible to keep up while we were watching."},{"s":"A","t":"We also planned a satisfaction questionnaire at the end, but our pilot showed it took longer than the tasks themselves, so we dropped it."},{"s":"T","t":"That's a pity, because you'll need some way of showing how people felt. Perhaps add a single rating question next time."},{"s":"N","t":"Before you hear the rest of the discussion, you have some time to look at questions 6 to 10."},{"pause":30,"label":"Look at questions 6 to 10"},{"s":"N","t":"Now listen and answer questions 6 to 10."},{"s":"T","t":"So, what did you find out about the main features?"},{"s":"L","t":"Let's start with the timetable. We expected it to be difficult because the colour coding is so confusing, but almost everyone found their next lecture in under twenty seconds, which was much quicker than we'd predicted."},{"s":"A","t":"Booking a study room in the library was a different story. People found the page easily enough, but the time boxes use the twenty-four-hour clock."},{"s":"A","t":"So several people typed in three when they meant three in the afternoon, and ended up booking a room in the middle of the night."},{"s":"T","t":"That's an easy fix, at least. What about the campus map?"},{"s":"L","t":"Technically it works, but nobody wanted to use it. As soon as we asked them to find the sports hall, most participants closed our app and opened the ordinary maps app on their phone instead."},{"s":"A","t":"Then there were the notification settings. We thought people might not recognise the icons, but actually the bell symbol was fine."},{"s":"A","t":"The real problem was that the settings are hidden inside the profile menu, and only two people found them without us pointing them out."},{"s":"T","t":"And logging in? I've heard students say it doesn't work on older phones."},{"s":"L","t":"We tested it on some quite old handsets, and it was fine. It just takes ages. With the two-step verification, logging in took nearly a minute on average, which people found really frustrating."},{"s":"T","t":"Good. You've got plenty of material there. For the report, I'd like you to rank these problems by how serious they are."},{"s":"A","t":"We'll do that this week."},{"s":"N","t":"That is the end of section 3."}],"groups":[{"type":"mcq","instructions":"Choose the correct letter, A, B or C.","questions":[{"n":1,"prompt":"Why did the students choose the Campus Compass app for their project?","options":[{"key":"A","text":"Many students had complained about it."},{"key":"B","text":"It would be easy to recruit participants."},{"key":"C","text":"The IT department had asked for feedback on it."}],"answer":"B","explanation":"Arun says the complaints were not \"the main reason\": \"Every student has it on their phone, so we knew it would be easy to find people to take part.\" The IT department \"haven't actually asked us for anything\"."},{"n":2,"prompt":"What problem did the students have in the first testing sessions?","options":[{"key":"A","text":"The participants did not talk enough."},{"key":"B","text":"The room was too noisy."},{"key":"C","text":"The tasks were too difficult."}],"answer":"A","explanation":"Leila says \"people hardly said a word. They just went completely silent.\" They thought noise was the cause, but moving to a quieter room \"made no difference\", so B is wrong."},{"n":3,"prompt":"What does the tutor say about the number of participants?","options":[{"key":"A","text":"It is too small for the results to be reliable."},{"key":"B","text":"It is large enough to show the main problems."},{"key":"C","text":"It should be increased before the report is written."}],"answer":"B","explanation":"Dr Hallworth says \"a small group usually reveals most of the serious problems\" and that more people \"would mostly show you the same issues again\", so they should not recruit more."}]},{"type":"mcq_multi","instructions":"Choose TWO letters, A-E.","questions":[{"n":4,"count":2,"prompt":"Which TWO kinds of data did the students record in their sessions?","options":[{"key":"A","text":"the time taken to complete each task"},{"key":"B","text":"where participants looked on the screen"},{"key":"C","text":"the number of taps participants made"},{"key":"D","text":"the mistakes participants made"},{"key":"E","text":"how satisfied participants felt"}],"answers":["A","D"],"explanation":"Arun says \"We timed how long each task took, and we noted down every error\". Eye tracking was not possible (\"the equipment was booked\"), counting taps was \"impossible to keep up\", and the questionnaire was dropped."}]},{"type":"matching_features","instructions":"What did the students find out about each feature of the app? Choose FIVE answers from the box and write the correct letter, A-G, next to questions 6-10.","title":"Features of the app","options":[{"key":"A","text":"Participants made errors when entering information."},{"key":"B","text":"Participants preferred to use a different app."},{"key":"C","text":"It did not work properly on older phones."},{"key":"D","text":"It was slow to use."},{"key":"E","text":"Participants were confused by the icons."},{"key":"F","text":"Participants completed the task faster than expected."},{"key":"G","text":"Most participants could not find it without help."}],"questions":[{"n":6,"prompt":"the timetable","answer":"F","explanation":"Leila says \"almost everyone found their next lecture in under twenty seconds, which was much quicker than we'd predicted\". The confusing colour coding is what they expected, not what happened."},{"n":7,"prompt":"the study room booking","answer":"A","explanation":"Because of the twenty-four-hour clock, \"several people typed in three when they meant three in the afternoon\" and booked a room \"in the middle of the night\"."},{"n":8,"prompt":"the campus map","answer":"B","explanation":"\"Technically it works, but nobody wanted to use it.\" Most participants \"opened the ordinary maps app on their phone instead\"."},{"n":9,"prompt":"the notification settings","answer":"G","explanation":"The icons were not the problem (\"the bell symbol was fine\"), so E is wrong. The settings are \"hidden inside the profile menu, and only two people found them without us pointing them out\"."},{"n":10,"prompt":"the login process","answer":"D","explanation":"On older phones \"it was fine\", so C is wrong. \"It just takes ages\": logging in \"took nearly a minute on average\"."}]}]},{"id":"l04","section":4,"title":"Urban heat islands and city design","topic":"environment","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"L":{"role":"Lecturer","accent":"en-NZ","voice":"male"}},"script":[{"s":"N","t":"Section 4. You will hear a lecture about urban heat islands and how the design of cities can reduce them. First, you have some time to look at questions 1 to 10."},{"pause":30,"label":"Look at questions 1 to 10"},{"s":"N","t":"Now listen carefully and answer questions 1 to 10."},{"s":"L","t":"Good morning. Today we're looking at a problem that affects almost every large city: the urban heat island. Put simply, this is when a city is noticeably warmer than the countryside around it."},{"s":"L","t":"Now, you might expect the difference to be greatest in the middle of a summer afternoon, when the streets feel hottest. In fact, the gap is usually largest at night, when the countryside cools down quickly but the city holds on to its heat."},{"s":"L","t":"So why does this happen? The first cause is the materials cities are built from. Asphalt and concrete absorb large amounts of energy from the sun during the day, and then release it slowly after sunset, rather like a storage heater."},{"s":"L","t":"The second cause is the lack of vegetation. In the countryside, plants cool the air around them through the evaporation of water from their leaves. Replace fields with car parks, and you lose that natural cooling."},{"s":"L","t":"Third, there's the shape of the city itself. When tall buildings line narrow streets, they block the wind, which would otherwise carry warm air away. They also trap heat that is reflected back and forth between their walls."},{"s":"L","t":"And finally, cities produce heat of their own, from vehicles, from factories and, ironically, from air conditioners, which pump hot air out into the street."},{"s":"L","t":"What are the consequences? The most serious is the effect on health. During a heatwave, the risk of heat-related illness rises sharply."},{"s":"L","t":"It's older people living alone who are most vulnerable, partly because there may be nobody around to notice when they become unwell."},{"s":"L","t":"There's an economic cost too. People use more air conditioning, so demand for electricity rises, and on the hottest days this can put real strain on the supply. Water use goes up as well, but it's the energy bill that worries city authorities most."},{"s":"L","t":"So what can planners do? Let's start with roofs. A cool roof is simply one coated with pale, reflective paint, so that it sends sunlight back into the sky instead of absorbing it."},{"s":"L","t":"A good example is the city of Varnholm. The council originally intended to paint the roofs of its hospitals, but the work turned out to be too disruptive for patients, so it began with schools instead."},{"s":"L","t":"The engineers had predicted a fall of around five degrees in top-floor classrooms. In practice, the drop was smaller, up to three degrees, but that was still enough to make lessons far more comfortable in the summer term."},{"s":"L","t":"Green roofs, which are covered with plants, are another option. They cost more and need stronger buildings to support them, but they also store rainwater, which helps to reduce flooding."},{"s":"L","t":"However, the measure that many researchers rate most highly is also the oldest: planting trees along streets. Trees cool the air through evaporation, just as fields do, and they also provide shade."},{"s":"L","t":"But not all trees are equally useful. Planners should choose species with a wide canopy, because a broad layer of leaves shades far more of the pavement than a tall, narrow tree does."},{"s":"L","t":"Of course, none of these measures works on its own. Next week, we'll look at how some cities are combining them in a single long-term strategy."},{"s":"N","t":"That is the end of section 4."}],"groups":[{"type":"gap","instructions":"Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.","title":"Urban heat islands","wordLimit":"ONE WORD AND/OR A NUMBER","questions":[{"n":1,"prompt":"Definition: a city is warmer than the surrounding ____","answer":["countryside"],"explanation":"The lecturer defines it as \"when a city is noticeably warmer than the countryside around it\"."},{"n":2,"prompt":"The temperature difference is usually greatest at ____","answer":["night"],"explanation":"\"You might expect the difference to be greatest in the middle of a summer afternoon ... In fact, the gap is usually largest at night.\" Afternoon is the distractor."},{"n":3,"prompt":"Causes: asphalt and concrete absorb the sun's energy and ____ it slowly after sunset","answer":["release"],"explanation":"\"Asphalt and concrete absorb large amounts of energy from the sun during the day, and then release it slowly after sunset.\""},{"n":4,"prompt":"Causes: fewer plants means less cooling from the ____ of water from leaves","answer":["evaporation"],"explanation":"\"Plants cool the air around them through the evaporation of water from their leaves.\""},{"n":5,"prompt":"Causes: tall buildings along narrow streets block the ____","answer":["wind"],"explanation":"\"When tall buildings line narrow streets, they block the wind, which would otherwise carry warm air away.\""},{"n":6,"prompt":"Effects: in a heatwave, older people who live ____ are most at risk","answer":["alone"],"explanation":"\"It's older people living alone who are most vulnerable\", because nobody may notice when they become unwell."},{"n":7,"prompt":"Effects: greater use of air conditioning increases demand for ____","answer":["electricity"],"explanation":"\"People use more air conditioning, so demand for electricity rises.\" Water use also rises, but the question is about the effect of air conditioning, and the lecturer stresses the energy bill."},{"n":8,"prompt":"Cool roofs: in Varnholm, the roofs of ____ were painted first","answer":["schools"],"explanation":"The council \"originally intended to paint the roofs of its hospitals\", but this was too disruptive, \"so it began with schools instead\"."},{"n":9,"prompt":"Cool roofs: top-floor temperatures fell by up to ____ degrees","answer":["3","three"],"explanation":"Engineers \"had predicted a fall of around five degrees\", but \"in practice, the drop was smaller, up to three degrees\". Five is the prediction, not the result."},{"n":10,"prompt":"Street trees: choose species with a wide ____ to shade more of the pavement","answer":["canopy"],"explanation":"\"Planners should choose species with a wide canopy, because a broad layer of leaves shades far more of the pavement.\""}]}]},{"id":"l05","section":1,"title":"Renting a flat near the university","topic":"society","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"A":{"role":"Callum, letting agent","accent":"en-NZ","voice":"male"},"B":{"role":"Priya, student","accent":"en-IN","voice":"female"}},"script":[{"s":"N","t":"Section 1. You will hear a telephone conversation between a student who is moving to a new city and an agent at a letting agency. First, you have some time to look at questions 1 to 6."},{"pause":25,"label":"Look at questions 1 to 6"},{"s":"N","t":"Now listen carefully and answer questions 1 to 6."},{"s":"A","t":"Good morning, Brightwater Lettings, Callum speaking. How can I help you?"},{"s":"B","t":"Hi. I'm starting a postgraduate course at Harlowe University in September, and I'm looking for a flat somewhere near the campus."},{"s":"A","t":"No problem. I'll just take a few details first. Could I have your name, please?"},{"s":"B","t":"Yes, it's Priya Vellanki."},{"s":"A","t":"And how do you spell your surname?"},{"s":"B","t":"It's V, E, double L, A, N, K, I."},{"s":"A","t":"Thanks. And what will you be studying? Some of our landlords like to know."},{"s":"B","t":"Well, my first degree was in computing, but the master's is in robotics. It's a one-year course."},{"s":"A","t":"Robotics, great. So when would you like to move in?"},{"s":"B","t":"The course begins on the fifteenth of September, so I was thinking of the tenth. Oh, actually, no. My flight doesn't land until the eleventh, so let's say the twelfth."},{"s":"A","t":"The twelfth of September. And what's your budget per month?"},{"s":"B","t":"I was hoping to keep it under six hundred and fifty pounds, but after looking online, that seems unrealistic. I could go up to seven hundred and twenty."},{"s":"A","t":"Seven hundred and twenty a month. That gives us more options. And how close to the campus do you need to be? There are cheaper flats in Dunmore, which is about thirty minutes away by bus."},{"s":"B","t":"I'd rather not depend on buses. I'd like to walk. Fifteen minutes would be perfect, but I could accept up to twenty-five."},{"s":"A","t":"So a maximum of twenty-five minutes on foot. Is there anything else you definitely need? Parking, for example?"},{"s":"B","t":"No, I don't drive. But I'm bringing my bicycle, so I'll need somewhere safe to keep a bicycle, ideally inside the building."},{"s":"A","t":"Right. Secure storage for a bicycle. I'll add that."},{"s":"N","t":"Before you hear the rest of the conversation, you have some time to look at questions 7 to 10."},{"pause":25,"label":"Look at questions 7 to 10"},{"s":"N","t":"Now listen and answer questions 7 to 10."},{"s":"A","t":"OK, I've got two flats that might suit you. The first is on Quarry Lane. It's a one-bedroom flat, about ten minutes' walk from the main campus, and it's six hundred and ninety a month."},{"s":"B","t":"That sounds ideal. It's not on a main road, is it? I'm a light sleeper."},{"s":"A","t":"No, it's a quiet side street. The problem is that the current tenant is staying until the end of October, so it won't be free when you arrive."},{"s":"B","t":"Oh, that's a shame. I can't really stay in a hotel for six weeks."},{"s":"A","t":"The second is in Linden Court, a newer building about twenty minutes' walk away. It's seven hundred and ten a month, and the rent includes water and internet."},{"s":"A","t":"Sorry, I'm reading last year's advert. The landlord no longer pays for the internet, so it's water and heating now."},{"s":"B","t":"Heating's probably more useful in winter anyway. Is there a lift?"},{"s":"A","t":"There is, and there's a bike room in the basement."},{"s":"B","t":"Perfect. So how do I reserve it? I'm still overseas."},{"s":"A","t":"Normally we ask for one week's rent as a holding deposit. But for international students, this landlord will accept a letter from your university confirming your place instead."},{"s":"A","t":"You'll need your passport too, but only when you sign the contract."},{"s":"B","t":"I can ask the admissions office for that letter today. Could I see the flat before I agree to anything? My cousin lives in the city, but he's away until next month."},{"s":"A","t":"I can show you round on a video call. My colleague usually does those on Thursdays, but she's on holiday this week, so I'll do it myself on Friday morning."},{"s":"B","t":"Friday's fine. Would ten o'clock suit you?"},{"s":"A","t":"Ten o'clock it is. I'll email you a link."},{"s":"B","t":"Thanks so much, Callum."},{"s":"N","t":"That is the end of section 1."}],"groups":[{"type":"gap","instructions":"Complete the form below. Write ONE WORD AND/OR A NUMBER for each answer.","title":"Brightwater Lettings: tenant enquiry form","wordLimit":"ONE WORD AND/OR A NUMBER","questions":[{"n":1,"prompt":"Name: Priya ____","answer":["Vellanki"],"explanation":"Priya spells her surname: \"V, E, double L, A, N, K, I\". \"Double L\" means the letter L is written twice."},{"n":2,"prompt":"Course: one-year master's in ____","answer":["robotics"],"explanation":"Priya says \"my first degree was in computing, but the master's is in robotics\". Computing is her previous degree, so it is the distractor."},{"n":3,"prompt":"Move-in date: ____ September","answer":["12","12th","twelfth"],"explanation":"She first suggests the tenth, then corrects herself: \"My flight doesn't land until the eleventh, so let's say the twelfth.\" The fifteenth is the day her course begins."},{"n":4,"prompt":"Maximum rent per month: £____","answer":["720","£720"],"explanation":"She hoped to pay under six hundred and fifty pounds but says \"I could go up to seven hundred and twenty\", and Callum repeats the figure."},{"n":5,"prompt":"Maximum walking time to campus: ____ minutes","answer":["25","twenty-five"],"explanation":"\"Fifteen minutes would be perfect, but I could accept up to twenty-five\", confirmed by Callum: \"a maximum of twenty-five minutes on foot\". Thirty minutes is the bus journey from Dunmore."},{"n":6,"prompt":"Essential: secure storage for a ____","answer":["bicycle","bike"],"explanation":"Priya rejects parking (\"I don't drive\") but says \"I'll need somewhere safe to keep a bicycle\"."}]},{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":7,"prompt":"Why is the flat on Quarry Lane unsuitable for Priya?","options":[{"key":"A","text":"It costs more than she can afford."},{"key":"B","text":"It is on a noisy road."},{"key":"C","text":"It will not be available when she arrives."},{"key":"D","text":"It is too far from the campus."}],"answer":"C","explanation":"Callum says \"the current tenant is staying until the end of October, so it won't be free when you arrive\". The rent of £690 is within her budget, it is \"a quiet side street\" and it is only ten minutes' walk away."},{"n":8,"prompt":"What is included in the rent at Linden Court?","options":[{"key":"A","text":"water and internet"},{"key":"B","text":"heating and internet"},{"key":"C","text":"water and heating"},{"key":"D","text":"heating and electricity"}],"answer":"C","explanation":"Callum first says \"water and internet\" but corrects himself because he is reading an old advert: \"The landlord no longer pays for the internet, so it's water and heating now.\""},{"n":9,"prompt":"To reserve the Linden Court flat, Priya needs to provide","options":[{"key":"A","text":"one week's rent."},{"key":"B","text":"a copy of her passport."},{"key":"C","text":"a letter from her university."},{"key":"D","text":"a reference from a previous landlord."}],"answer":"C","explanation":"A week's rent is what they \"normally\" ask for, but \"this landlord will accept a letter from your university confirming your place instead\". The passport is needed \"only when you sign the contract\"."},{"n":10,"prompt":"How will Priya see the flat?","options":[{"key":"A","text":"on a video call on Thursday"},{"key":"B","text":"on a video call on Friday"},{"key":"C","text":"through a visit by her cousin"},{"key":"D","text":"at a viewing after she arrives"}],"answer":"B","explanation":"Video viewings are usually on Thursdays, but the colleague is on holiday, so Callum says \"I'll do it myself on Friday morning\". Her cousin is \"away until next month\"."}]}]},{"id":"l06","section":2,"title":"A new city volunteer programme","topic":"society","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"P":{"role":"Radio presenter","accent":"en-GB","voice":"male"},"C":{"role":"Leanne Dube, programme coordinator","accent":"en-ZA","voice":"female"}},"script":[{"s":"N","t":"Section 2. You will hear part of a local radio programme in which a coordinator talks about a new volunteer programme in the city. First, you have some time to look at questions 1 to 4."},{"pause":25,"label":"Look at questions 1 to 4"},{"s":"N","t":"Now listen carefully and answer questions 1 to 4."},{"s":"P","t":"Good afternoon, and welcome back to Corrington Today. My guest this week is Leanne Dube, who coordinates the city's new volunteer programme, Corrington Connect. Leanne, welcome."},{"s":"C","t":"Thanks for having me. Corrington Connect brings together all the volunteering opportunities in the city in one place, and I'd like to explain how it works."},{"s":"C","t":"People often assume the council started it to save money, but that was never the aim. Last year we surveyed residents, and almost half said they'd like to volunteer but had no idea where to start. So the programme is really about making that first step easier."},{"s":"C","t":"Now, a question I get all the time is how much time you have to give. When we launched in the spring, we asked for two hours every week. That put a lot of people off, especially parents and shift workers, so we've changed it."},{"s":"C","t":"The minimum is now four hours a month, and you can spread those hours however you like."},{"s":"C","t":"Before you start, there's one thing everyone has to do, and that's come to an induction evening at the Central Library. We tried running these online at first, but volunteers told us they missed meeting each other face to face."},{"s":"C","t":"References, by the way, are only needed for some roles, which I'll come to."},{"s":"C","t":"So what do volunteers get in return? Well, we can't pay anyone, and many people ask about free bus travel. Sadly, the budget didn't stretch that far."},{"s":"C","t":"What every volunteer does get is a Connect card, which gives ten percent off at more than sixty local shops and cafés. And after a hundred hours, you can also ask for a reference letter from the council."},{"s":"N","t":"Before you hear the rest of the talk, you have some time to look at questions 5 to 10."},{"pause":25,"label":"Look at questions 5 to 10"},{"s":"N","t":"Now listen and answer questions 5 to 10."},{"s":"C","t":"Let me tell you about some of our projects. The Riverside Clean-up takes place on the first Saturday morning of every month, and in summer we add Wednesday evenings too."},{"s":"C","t":"Lots of parents bring their children along, and we have gloves in small sizes, so it's ideal for families."},{"s":"C","t":"Digital Buddies pairs volunteers with older residents who want help with things like video calls or online banking. You don't need to be an expert. If you can use a smartphone, you can help."},{"s":"C","t":"The project was actually suggested by a retired teacher, Mr Osei, who wrote to the council last year."},{"s":"C","t":"Our Homework Club runs on weekday afternoons at the Fenwick Community Centre. Because volunteers work with under-sixteens, they need a background check, and that can take up to three weeks, so please apply early."},{"s":"C","t":"The Community Fridge collects food from supermarkets that would otherwise be thrown away. It's been so popular that we've had to stop taking new volunteers for now, but if you put your name on our list, we'll contact you as soon as a place comes up."},{"s":"C","t":"Then there's the Heritage Trail, where our guides lead walking tours of the old town. At the moment the walks start outside the City Museum, but from January they'll begin at the new visitor centre on Harbour Street."},{"s":"C","t":"Finally, the Repair Café, held on the last Thursday evening of each month. People bring broken lamps, laptops and toasters, and volunteers fix them. We'd hoped the local college would run it with us, but that hasn't happened yet."},{"s":"C","t":"This is the one project where experience really matters, so we're looking for people who know about electronics or sewing. To find out more about any of these projects, just visit the council website. Thank you."},{"s":"N","t":"That is the end of section 2."}],"groups":[{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":1,"prompt":"Why did the council set up Corrington Connect?","options":[{"key":"A","text":"to reduce the cost of public services"},{"key":"B","text":"to help residents who wanted to volunteer but did not know how"},{"key":"C","text":"to replace council staff who had left"},{"key":"D","text":"because many residents said they felt lonely"}],"answer":"B","explanation":"Leanne rejects the money-saving idea (\"that was never the aim\") and says \"almost half said they'd like to volunteer but had no idea where to start\"."},{"n":2,"prompt":"What is the minimum time commitment for volunteers now?","options":[{"key":"A","text":"two hours a week"},{"key":"B","text":"one day a month"},{"key":"C","text":"four hours a month"},{"key":"D","text":"four hours a week"}],"answer":"C","explanation":"Two hours a week was the original requirement, but \"we've changed it. The minimum is now four hours a month\"."},{"n":3,"prompt":"What must all new volunteers do before they start?","options":[{"key":"A","text":"complete an online training course"},{"key":"B","text":"provide references"},{"key":"C","text":"attend an evening session at the library"},{"key":"D","text":"have an interview with Leanne"}],"answer":"C","explanation":"\"There's one thing everyone has to do, and that's come to an induction evening at the Central Library.\" The sessions used to be online, and references are \"only needed for some roles\"."},{"n":4,"prompt":"What does every volunteer receive?","options":[{"key":"A","text":"free bus travel"},{"key":"B","text":"discounts at local businesses"},{"key":"C","text":"a certificate after fifty hours"},{"key":"D","text":"a reference letter from the council"}],"answer":"B","explanation":"\"What every volunteer does get is a Connect card, which gives ten percent off at more than sixty local shops and cafés.\" Free bus travel was not affordable, and the reference letter is only available after a hundred hours."}]},{"type":"matching_features","instructions":"What does the speaker say about each of the following projects? Choose SIX answers from the box and write the correct letter, A-H, next to questions 5-10.","title":"Corrington Connect projects","options":[{"key":"A","text":"It needs volunteers with relevant experience."},{"key":"B","text":"It only takes place at weekends."},{"key":"C","text":"It requires a check that can take several weeks."},{"key":"D","text":"It is not accepting new volunteers at present."},{"key":"E","text":"It is particularly suitable for families."},{"key":"F","text":"It will soon start from a different place."},{"key":"G","text":"It is run jointly with a local college."},{"key":"H","text":"It was proposed by a member of the public."}],"questions":[{"n":5,"prompt":"Riverside Clean-up","answer":"E","explanation":"Leanne says children come with their parents and \"it's ideal for families\". B is wrong because there are also \"Wednesday evenings\" in summer."},{"n":6,"prompt":"Digital Buddies","answer":"H","explanation":"\"The project was actually suggested by a retired teacher, Mr Osei, who wrote to the council.\" A is wrong: \"You don't need to be an expert.\""},{"n":7,"prompt":"Homework Club","answer":"C","explanation":"Volunteers \"need a background check, and that can take up to three weeks\"."},{"n":8,"prompt":"Community Fridge","answer":"D","explanation":"\"We've had to stop taking new volunteers for now\", although people can put their names on a list."},{"n":9,"prompt":"Heritage Trail","answer":"F","explanation":"The walks start outside the City Museum now, but \"from January they'll begin at the new visitor centre on Harbour Street\"."},{"n":10,"prompt":"Repair Café","answer":"A","explanation":"\"This is the one project where experience really matters\". G is wrong because working with the college \"hasn't happened yet\"."}]}]},{"id":"l07","section":3,"title":"Survey on online learning habits","topic":"education","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"A":{"role":"Hana, student","accent":"en-US","voice":"female"},"B":{"role":"Tom, student","accent":"en-AU","voice":"male"},"L":{"role":"Dr Lindqvist, lecturer","accent":"en-CA","voice":"male"}},"script":[{"s":"N","t":"Section 3. You will hear two students, Hana and Tom, discussing the results of a survey they carried out on students' online learning habits. Later, their lecturer, Dr Lindqvist, joins them. First, you have some time to look at questions 1 to 5."},{"pause":30,"label":"Look at questions 1 to 5"},{"s":"N","t":"Now listen carefully and answer questions 1 to 5."},{"s":"A","t":"OK, Tom, the survey's closed. We got two hundred and twelve responses in the end, which is more than I expected."},{"s":"B","t":"Great. So, what jumped out at you?"},{"s":"A","t":"Honestly, the playback speed. Nearly sixty percent said they usually watch recorded lectures at one and a half times normal speed or faster. I had no idea it was that common."},{"s":"B","t":"Neither did I. I assumed it was just a few people cramming before exams. What about the discussion forums?"},{"s":"A","t":"Hardly anyone uses them, but that's not exactly news. Nobody ever posts there. The devices question was the real shock for me, though. Over forty percent said their phone is the main device they study on."},{"s":"B","t":"Same here. I was sure laptops would dominate. And the late-night studying? Most people said they do their work after ten p.m."},{"s":"A","t":"Well, we predicted that in our proposal, so no surprise there."},{"s":"B","t":"Right. But we've got a problem with question nine, the one about weekly study hours."},{"s":"A","t":"I know. Some people included time in lectures and others didn't, so the figures are all over the place. It's not the number of responses that worries me. It's that people read the question in completely different ways."},{"s":"B","t":"Could we send out a short follow-up survey to check?"},{"s":"A","t":"There isn't time. The report's due in ten days."},{"s":"B","t":"Then should we just leave question nine out?"},{"s":"A","t":"If we drop it, it looks as if we're hiding something. Let's keep the data, but explain the problem clearly in the limitations section."},{"s":"B","t":"Fair enough. Oh, and the question about platform features. I expected the practice quizzes to come top, but the feature people said they'd miss most was the automatic captions."},{"s":"A","t":"Yes, even native speakers said they use them to check technical terms."},{"s":"N","t":"Before you hear the rest of the discussion, you have some time to look at questions 6 to 10."},{"pause":30,"label":"Look at questions 6 to 10"},{"s":"N","t":"Now listen and answer questions 6 to 10."},{"s":"L","t":"Hello, you two. You wanted to talk through your draft report?"},{"s":"A","t":"Yes, thanks, Dr Lindqvist. Could we start with the introduction?"},{"s":"L","t":"Sure. It's clear and it's the right length, but it reads a bit like a blog post. You say online learning is obviously the future. Keep the content, but make the language more neutral and academic."},{"s":"B","t":"OK. What about the methodology? We wondered if it was too long."},{"s":"L","t":"I thought so at first, but when I reread it, every paragraph was necessary. I wouldn't change a thing there."},{"s":"A","t":"And the results? We've got that big table of percentages."},{"s":"L","t":"It's hard to read. I was going to suggest moving it to an appendix, but readers need those figures. Keep it where it is, but present the key findings as a bar chart as well."},{"s":"B","t":"Right. And the discussion section?"},{"s":"L","t":"At the moment, it only talks about your own data. You need to show how your findings compare with published research. Three or four studies would be enough."},{"s":"A","t":"And finally, the recommendations. Should we add more? There are only five."},{"s":"L","t":"Five is plenty. The problem is that they repeat a lot of what's in your conclusion. I'd merge the two into a single section."},{"s":"B","t":"That makes sense. Thanks, that's really helpful."},{"s":"N","t":"That is the end of section 3."}],"groups":[{"type":"mcq_multi","instructions":"Choose TWO letters, A-E.","questions":[{"n":1,"count":2,"prompt":"Which TWO survey findings surprised both Hana and Tom?","options":[{"key":"A","text":"Many students speed up recorded lectures."},{"key":"B","text":"Few students use the online discussion forums."},{"key":"C","text":"Most students study late at night."},{"key":"D","text":"Many students mainly use a phone for studying."},{"key":"E","text":"Students rarely watch a recording more than once."}],"answers":["A","D"],"explanation":"Hana says of the playback speed \"I had no idea it was that common\" and Tom agrees (\"Neither did I\"); the phone finding was \"the real shock\" and Tom replies \"Same here\". The forum result was \"not exactly news\" and late-night study was \"no surprise\"."}]},{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":3,"prompt":"What is the problem with question nine of the survey?","options":[{"key":"A","text":"Too few students answered it."},{"key":"B","text":"Students understood it in different ways."},{"key":"C","text":"It was too long and complicated."},{"key":"D","text":"Some of the answers were lost."}],"answer":"B","explanation":"Hana says \"Some people included time in lectures and others didn't\" and \"people read the question in completely different ways\". She says it is \"not the number of responses that worries me\", so A is wrong."},{"n":4,"prompt":"What do the students decide to do about question nine?","options":[{"key":"A","text":"send out a follow-up survey"},{"key":"B","text":"leave it out of the report"},{"key":"C","text":"explain the problem in the report"},{"key":"D","text":"interview some of the respondents"}],"answer":"C","explanation":"A follow-up survey is rejected (\"There isn't time\") and so is dropping the question. Hana says \"keep the data, but explain the problem clearly in the limitations section\"."},{"n":5,"prompt":"Which feature of the online platform did students say they would miss most?","options":[{"key":"A","text":"the practice quizzes"},{"key":"B","text":"the automatic captions"},{"key":"C","text":"the discussion forums"},{"key":"D","text":"the downloadable slides"}],"answer":"B","explanation":"Tom \"expected the practice quizzes to come top\", but \"the feature people said they'd miss most was the automatic captions\"."}]},{"type":"matching_features","instructions":"What does Dr Lindqvist suggest for each section of the report? Choose FIVE answers from the box and write the correct letter, A-H, next to questions 6-10.","title":"Suggestions","options":[{"key":"A","text":"shorten it"},{"key":"B","text":"add a chart"},{"key":"C","text":"move part of it to an appendix"},{"key":"D","text":"combine it with another section"},{"key":"E","text":"refer to other studies"},{"key":"F","text":"change the style of writing"},{"key":"G","text":"make no changes"},{"key":"H","text":"add more points"}],"questions":[{"n":6,"prompt":"Introduction","answer":"F","explanation":"\"It reads a bit like a blog post... make the language more neutral and academic.\" A is wrong because \"it's the right length\"."},{"n":7,"prompt":"Methodology","answer":"G","explanation":"The students wonder if it is too long, and he \"thought so at first\", but then says \"I wouldn't change a thing there\"."},{"n":8,"prompt":"Results","answer":"B","explanation":"He considered an appendix but rejects it: \"Keep it where it is, but present the key findings as a bar chart as well.\""},{"n":9,"prompt":"Discussion","answer":"E","explanation":"\"You need to show how your findings compare with published research. Three or four studies would be enough.\""},{"n":10,"prompt":"Recommendations","answer":"D","explanation":"Hana asks about adding more, but he says \"Five is plenty\" and \"I'd merge the two into a single section\", meaning the recommendations and the conclusion."}]}]},{"id":"l08","section":4,"title":"Biomimicry in architecture","topic":"science","placement":false,"speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"L":{"role":"Lecturer","accent":"en-IE","voice":"female"}},"script":[{"s":"N","t":"Section 4. You will hear a lecture on biomimicry in architecture. First, you have some time to look at questions 1 to 4."},{"pause":25,"label":"Look at questions 1 to 4"},{"s":"N","t":"Now look at questions 5 to 10."},{"pause":25,"label":"Look at questions 5 to 10"},{"s":"N","t":"Now listen carefully and answer questions 1 to 10."},{"s":"L","t":"Good morning, everyone. Today's lecture is about biomimicry, which means designing buildings and products by learning from nature. Architects have always borrowed from nature, of course. Think of stone columns carved to look like palm trees."},{"s":"L","t":"But that's really decoration. Biomimicry asks a different question: not what does nature look like, but how does it work? And it doesn't mean using natural materials, either. A biomimetic building might be made entirely of concrete, glass and steel."},{"s":"L","t":"So why has this approach become so popular over the last twenty years or so? Some people point to fashion, and there's certainly been pressure to cut energy use. But in my view, the main reason is computing power."},{"s":"L","t":"Architects can now model how air or heat moves through a design in a matter of hours, so ideas taken from nature can actually be tested before anything is built."},{"s":"L","t":"The example everyone mentions is an office and shopping centre in Harare, in Zimbabwe, which opened in the nineteen nineties. Its designers studied termite mounds, which stay surprisingly cool inside even when the land around them is extremely hot."},{"s":"L","t":"The building has no conventional air-conditioning system. Instead, cool night air is drawn in and stored in the heavy concrete structure, and warm air escapes through chimneys on the roof."},{"s":"L","t":"And because there was no expensive cooling equipment to install, it actually cost less to build than a typical office of the same size."},{"s":"L","t":"Interestingly, the biology behind it has since been questioned. The original theory was that hot air simply rose up through the mound and out of the top, like smoke from a chimney."},{"s":"L","t":"But more recent studies suggest the mound behaves more like a lung. As the outside temperature rises and falls each day, air moves slowly in and out, almost as if the mound were breathing."},{"s":"L","t":"Let's move on to some other examples. Many of you will have seen how water forms perfect droplets on a lotus leaf and rolls off. You might assume the leaf is very smooth, but under a microscope its surface is covered in tiny bumps, and those bumps are coated in wax."},{"s":"L","t":"As the droplets roll off, they pick up dirt and carry it away, so the leaf cleans itself. You might expect this idea to be used mainly for windows, but in fact the best-known product is a paint for outside walls, which is washed clean whenever it rains."},{"s":"L","t":"My next example comes from one of the driest places on Earth, the Namib Desert in south-western Africa. There's almost no rain there, so a small beetle survives by standing on the sand dunes in the early morning and letting fog collect on its back."},{"s":"L","t":"The water then runs down towards its mouth. Engineers have copied this idea with large mesh nets that catch fog and turn it into drinking water."},{"s":"L","t":"These nets won't work in every dry region, though. Inland deserts rarely get fog, so they're most useful in coastal areas, where fog regularly comes in from the sea."},{"s":"L","t":"Finally, consider the humble pine cone. Its scales open and close depending on the weather, with no muscles at all. People often assume this is a reaction to temperature, but it's actually humidity. When the air is dry, the scales open, and when it's damp, they close."},{"s":"L","t":"Researchers have used this principle to build panels for the outside of buildings that open and close by themselves. You might expect them to be made of plastic or metal, but they're made from thin layers of wood, which naturally swells when it absorbs moisture."},{"s":"L","t":"So the panels need no motors and no electricity. Next week, we'll look at the limits of biomimicry, and at why copying nature doesn't always produce better buildings."},{"s":"N","t":"That is the end of section 4."}],"groups":[{"type":"mcq","instructions":"Choose the correct letter, A, B, C or D.","questions":[{"n":1,"prompt":"According to the lecturer, what makes biomimicry different from earlier nature-inspired architecture?","options":[{"key":"A","text":"It copies the appearance of plants and animals more closely."},{"key":"B","text":"It is based on how natural systems work."},{"key":"C","text":"It relies on natural building materials."},{"key":"D","text":"It is mainly used for decoration."}],"answer":"B","explanation":"Biomimicry asks \"not what does nature look like, but how does it work?\" C is wrong: \"it doesn't mean using natural materials, either\". Decoration describes the older approach."},{"n":2,"prompt":"What does the lecturer believe is the main reason for the recent popularity of biomimicry?","options":[{"key":"A","text":"changing fashions in design"},{"key":"B","text":"the need to reduce energy use"},{"key":"C","text":"the ability to test designs on computers"},{"key":"D","text":"greater public interest in nature"}],"answer":"C","explanation":"Fashion and energy are what \"some people point to\", but \"in my view, the main reason is computing power\", because designs \"can actually be tested before anything is built\"."},{"n":3,"prompt":"What does the lecturer say about the building in Harare?","options":[{"key":"A","text":"It was cheaper to build than a conventional office."},{"key":"B","text":"It was designed by a team of biologists."},{"key":"C","text":"It only needs air conditioning at night."},{"key":"D","text":"It was the first building to copy termite mounds."}],"answer":"A","explanation":"\"Because there was no expensive cooling equipment to install, it actually cost less to build than a typical office of the same size.\" C is wrong: it has \"no conventional air-conditioning system\"; cool night air is simply drawn in."},{"n":4,"prompt":"What does more recent research suggest about termite mounds?","options":[{"key":"A","text":"Hot air escapes from the top, as in a chimney."},{"key":"B","text":"Air moves in and out of them in a daily cycle."},{"key":"C","text":"They are cooler inside than scientists had thought."},{"key":"D","text":"They are ventilated by the termites' movements."}],"answer":"B","explanation":"\"As the outside temperature rises and falls each day, air moves slowly in and out, almost as if the mound were breathing.\" A describes \"the original theory\", which \"has since been questioned\"."}]},{"type":"gap","instructions":"Complete the notes below. Write ONE WORD ONLY for each answer.","title":"Other examples of biomimicry","wordLimit":"ONE WORD ONLY","questions":[{"n":5,"prompt":"Lotus leaf: surface has tiny bumps coated in ____","answer":["wax"],
