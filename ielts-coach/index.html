h this shift can be deeply frustrating when it goes wrong, I believe it is, on balance, a positive development, as long as companies continue to offer a human alternative.\n\nThe most obvious benefit is speed and availability. A large proportion of customer enquiries are routine, such as checking a delivery date or resetting a password, and a well-designed chatbot can resolve these instantly at any hour, sparing customers a long wait on hold. For businesses, automating such tasks considerably reduces operating costs, savings that may be passed on in the form of lower prices. Perhaps less obviously, automation can also improve human service: when staff no longer spend their shifts answering identical questions, they can be redeployed to complex cases, such as fraud claims or bereavement, that genuinely require patience and judgement.\n\nThere are, of course, genuine drawbacks. Chatbots still struggle with unusual problems, and few experiences are more exasperating than being trapped in an automated loop that keeps offering irrelevant answers. Older or less confident users may feel excluded altogether, while the decline of call-centre work has cost many people their jobs. However, these problems arise mainly when firms treat automation as a way to avoid customers rather than to serve them. Where people can easily escalate a query to a trained member of staff, the technology handles the simple cases and humans handle the rest.\n\nIn conclusion, automated customer service brings real gains in speed, cost and availability, and can even raise the quality of human support. I therefore regard it as a positive trend, but only if companies treat a clear route to a real person as a basic obligation rather than an optional extra."},{"id":"t2-06","essayType":"adv_disadv","topic":"work","placement":false,"prompt":"An increasing number of people now earn their living by doing short-term tasks arranged through apps and websites, such as delivering food, driving passengers or completing freelance projects, rather than having a permanent job. Do the advantages of this trend outweigh the disadvantages? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Workers can choose their own hours and combine work with study or caring for family.","Low barriers to entry allow newcomers, such as recent migrants or students, to start earning quickly.","Skilled freelancers, such as developers and designers, can find clients all over the world.","Most platform workers have no sick pay, paid holidays or pension, and their income is unpredictable.","Algorithms control pay and access to work, so individuals have little bargaining power.","Workers carry the costs and risks, such as vehicles, fuel and insurance, that employers would normally cover."],"usefulVocab":["the gig economy","flexible working hours","low barriers to entry","to be classified as self-employed","employment rights","sick pay and paid holidays","bargaining power","a precarious existence","a supplement to a main income"],"modelAnswer":"Digital platforms have made it possible to earn money by the hour, or even by the task, without ever signing an employment contract. Although this model offers genuine freedom to certain groups, I believe that, in its current form, its disadvantages outweigh its advantages for the majority of those who depend on it.\n\nThe case for platform work rests largely on flexibility. A university student can deliver meals between lectures, and a parent can accept freelance translation work during school hours, arrangements that a conventional nine-to-five job would rarely permit. Barriers to entry are also low: a newly arrived migrant with few local contacts can start earning within days. For highly skilled freelancers, such as web developers or illustrators, online marketplaces open the door to clients across the globe, allowing them to build an international portfolio from home.\n\nHowever, these benefits come at a considerable price. Because platform workers are usually classified as self-employed, they are typically entitled to neither sick pay nor paid holidays, and few contribute to a pension. A delivery rider who breaks a wrist may lose all income overnight. Moreover, pay rates and access to work are often determined by algorithms that can change without warning, leaving individuals with almost no bargaining power. What is presented as independence can therefore become a precarious existence in which the company holds the power while the worker carries the risk, including the cost of vehicles, fuel and insurance. For those relying on this work as their main income rather than a supplement, such insecurity is a serious problem.\n\nIn conclusion, gig work offers welcome flexibility and opportunity, particularly to students and skilled professionals. Yet for the many who depend on it full-time, the lack of security outweighs these gains, which is why governments should ensure that flexibility does not come at the expense of basic employment rights."},{"id":"t2-07","essayType":"opinion","topic":"education","placement":false,"prompt":"Some people believe that learning to write computer code should be compulsory for all children from the start of primary school, in the same way as reading and mathematics. To what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Coding teaches children to break problems into small steps and to keep trying when something fails.","Digital skills are needed in almost every career, and early exposure may reduce stereotypes about who is good at technology.","Young children can learn through play, for example with floor robots or block-based programs.","Reading and mathematics are foundations for every other subject, so coding should not have equal status.","Primary timetables are already crowded, and many primary teachers are not trained to teach programming.","Coding could be built into maths, science and art projects instead of being a separate core subject."],"usefulVocab":["computational thinking","to break a problem down","trial and error","block-based programming","foundational skills","an overcrowded curriculum","to challenge stereotypes","to complement rather than compete with","digital literacy"],"modelAnswer":"As software shapes almost every aspect of modern life, some argue that coding should become a core primary school subject alongside reading and mathematics. I agree that young children benefit from an early introduction to programming, but I do not believe it deserves equal status with literacy and numeracy.\n\nThere are persuasive reasons for introducing coding early. Writing even a simple program teaches children to break a large problem into small, ordered steps and to test and correct their work when it fails, habits of mind that are valuable well beyond computing. Young learners can acquire these skills through play, for example by guiding a floor robot around an obstacle course or snapping together colourful blocks of instructions on a screen. Early exposure may also challenge stereotypes about who is suited to technology. If every child, regardless of gender or background, writes programs at seven, fewer will reach adolescence convinced that computing is not for people like them.\n\nHowever, placing coding on the same level as reading and mathematics would be a mistake. These two subjects are foundational in a way that programming is not: a child who cannot read fluently will struggle in every other lesson, including computing itself. Primary timetables are already overcrowded, and devoting equal time to a new subject would inevitably mean less time for core skills or for the arts and physical education. There is also a practical obstacle, since relatively few primary teachers have been trained to teach programming confidently, and a subject taught badly may discourage children rather than inspire them.\n\nIn conclusion, I agree with the proposal only in part. Children should certainly encounter coding from an early age, ideally woven into mathematics, science and art projects, but it should complement rather than compete with the basic skills on which all later learning depends."},{"id":"t2-08","essayType":"discussion","topic":"technology","placement":false,"prompt":"Some cities are installing networks of sensors and cameras to collect data on traffic, energy use and public spaces, arguing that this makes urban services more efficient. Others believe that this level of monitoring is a serious threat to people's privacy. Discuss both these views and give your own opinion. Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Traffic lights that respond to real-time data can reduce congestion, journey times and air pollution.","Sensors can detect water leaks, full bins or broken street lights early, saving public money.","Data on how people use parks and bus routes helps planners make evidence-based decisions.","Cameras combined with facial recognition could track where every resident goes.","Data could be misused by a future government, sold to companies or stolen by hackers.","Possible safeguards: anonymise data, ban facial recognition, and have independent bodies publish what is collected."],"usefulVocab":["real-time data","traffic congestion","to optimise public services","evidence rather than guesswork","mass surveillance","facial recognition software","to be repurposed","to anonymise data at the point of collection","independent oversight","privacy by design"],"modelAnswer":"Across the world, city authorities are embedding sensors in roads, streetlights and bins, promising cleaner, faster and cheaper public services. Critics, however, warn that such 'smart' cities may become instruments of surveillance. Having considered both positions, I believe the technology is worth adopting, but only under strict rules on what data is gathered and who may use it.\n\nSupporters of smart city projects point to tangible improvements in everyday life. Traffic signals that respond to real-time data can shorten queues at busy junctions, cutting both journey times and exhaust emissions. Sensors in water pipes can detect leaks before they flood a street, while bins that report when they are full allow collection lorries to avoid unnecessary trips. At a time of tight municipal budgets, such efficiencies free up money for schools and housing. Data on how people actually use parks and bus routes can also help planners base their decisions on evidence rather than guesswork.\n\nOpponents, though, argue that the same infrastructure can easily be repurposed. A camera installed to count cyclists could, with facial recognition software, record exactly where each resident goes and when. Once such a system exists, there is no guarantee that a future government will resist using it to monitor protesters or journalists, and large datasets are always vulnerable to hackers. These fears are, in my view, entirely legitimate, but they argue for safeguards rather than rejection. Data can be anonymised at the point of collection, facial recognition can be prohibited by law, and an independent body can publish exactly what each device records.\n\nIn conclusion, smart city technology offers real gains in efficiency and sustainability, yet carries a genuine risk of intrusive surveillance. Provided that privacy is protected by design and enforced through transparent oversight, I believe its benefits justify its use."},{"id":"t2-09","essayType":"problem_solution","topic":"environment","placement":false,"prompt":"Every year, huge numbers of mobile phones, laptops and other electronic devices are thrown away, many of them while they still work. What are the causes of this problem, and what solutions can you suggest? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Manufacturers release new models every year, and advertising makes older devices seem outdated.","Devices are hard to repair: batteries are glued in, spare parts are expensive and software updates stop.","A repair often costs almost as much as a new device, so people choose to replace rather than fix.","Right-to-repair laws could force manufacturers to sell spare parts and publish repair guides.","Longer software support and lower taxes on repairs and refurbished devices would make keeping a device more attractive.","Retailers could be required to take back old equipment so that it is recycled safely."],"usefulVocab":["electronic waste","a throwaway culture","planned obsolescence","spare parts","right-to-repair legislation","security updates","refurbished devices","to extend the lifespan of a product","to be dumped in landfill"],"modelAnswer":"Electronic devices have become essential to modern life, yet they are increasingly treated as disposable. Vast numbers of phones and laptops are discarded long before they stop functioning, creating mountains of waste that contain both toxic substances and valuable metals. In my view, the problem is driven largely by commercial practices and could be significantly reduced through regulation and easier repair.\n\nThe root cause is arguably the business model of the technology industry itself. Manufacturers launch new models every year and market them as essential upgrades, encouraging consumers to regard a two-year-old phone as outdated. Many devices are also designed in ways that make repair difficult: batteries are glued in place, spare parts are expensive or unavailable, and older models eventually stop receiving software updates, leaving them insecure or unable to run common apps. Faced with a repair bill that approaches the price of a new handset, most people understandably choose to replace rather than fix.\n\nTackling this requires action on several fronts. Governments could introduce right-to-repair legislation obliging manufacturers to sell spare parts and publish repair guides for a minimum period after a product is launched. Equally important would be a legal requirement to provide security updates for far longer, so that working hardware is not made obsolete by software. Financial incentives also matter: reducing tax on repair services and refurbished devices would make keeping a phone more attractive than replacing it. Finally, retailers could be required to take back old equipment, ensuring that devices which genuinely cannot be saved are recycled safely rather than dumped in landfill.\n\nIn conclusion, electronic waste stems largely from rapid product cycles and devices that are difficult to repair. Through stronger repair rights, longer software support and incentives that reward reuse, it should be possible to extend the lifespan of the devices we depend on and reduce their environmental cost."},{"id":"t2-10","essayType":"opinion","topic":"work","placement":false,"prompt":"Many companies have removed private offices and asked employees to work together in large open-plan spaces in order to encourage teamwork. Some people believe that this type of office harms productivity more than it improves collaboration. To what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Open-plan offices allow quick questions and spontaneous exchanges of ideas.","New employees can learn by overhearing experienced colleagues, and managers seem more approachable.","They are cheaper, because more people can fit into the same floor space.","Noise and constant interruptions make deep, focused work, such as programming or writing, very difficult.","Many employees wear headphones and send messages instead of talking, which defeats the purpose.","Lack of privacy can increase stress, and illnesses spread more easily; mixed layouts may be a better solution."],"usefulVocab":["to foster collaboration","within earshot","a hierarchical culture","uninterrupted concentration","to lose one's train of thought","constant interruptions","to be counterproductive","knowledge work","quiet zones"],"modelAnswer":"Over the past two decades, walls and private offices have disappeared from many workplaces, replaced by long rows of shared desks in the name of teamwork. I largely agree that this design does more damage to productivity than good to collaboration, although I accept that it has some merits.\n\nAdvocates of open-plan offices are not entirely wrong. When colleagues sit within earshot of one another, a quick question can be resolved in seconds rather than through a chain of emails, and new employees in particular can learn simply by overhearing how experienced staff handle problems. Removing private offices can also make senior managers more approachable, softening an overly hierarchical culture. Not least, such layouts are cheaper, as a company can fit far more people into the same floor space.\n\nNevertheless, these advantages are frequently outweighed by the cost to concentration. Many modern jobs, from writing reports to designing software, depend on long periods of uninterrupted thought, and an environment filled with phone calls, conversations and passing colleagues makes such focus almost impossible. Each interruption may last only a minute, but regaining one's train of thought can take considerably longer. Ironically, open-plan offices may even reduce genuine collaboration: many employees respond to the noise by wearing headphones and messaging the person sitting opposite rather than speaking to them. The lack of privacy can also add to stress, and illnesses such as colds spread more easily when dozens of people share the same space.\n\nIn conclusion, while open-plan offices make informal communication easier and reduce costs, I believe they undermine the deep concentration on which most knowledge work depends. A more effective approach would be a mixed layout, combining shared areas for teamwork with quiet rooms where employees can work without disruption."},{"id":"t2-11","essayType":"adv_disadv","topic":"technology","placement":false,"prompt":"In some countries, governments are moving public services such as tax returns, licence renewals and appointment bookings entirely online and closing their face-to-face offices. Do the advantages of this development outweigh the disadvantages? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Citizens can use services at any time without travelling or queuing.","Online forms can check information as it is entered, reducing errors and incomplete applications.","Governments save on administration, and the money could be spent on front-line services.","Elderly people, some disabled people and those without devices or internet may be shut out.","Rural areas with poor broadband face similar barriers, and unusual cases do not fit standard forms.","A system failure or cyber attack could leave a whole population without access at once."],"usefulVocab":["digital by default","to streamline administration","front-line services","digital exclusion","broadband coverage","to be shut out of a service","to be legally entitled to","a cyber attack","an acceptable side effect"],"modelAnswer":"Many governments are now redesigning public services to be 'digital by default', and some have gone further by closing the offices where citizens once queued to renew a licence or submit paperwork. While online services bring undeniable efficiencies, I believe that removing every face-to-face alternative creates disadvantages that outweigh these gains.\n\nThe benefits of moving services online are considerable. A citizen can complete a tax return at midnight or renew a passport during a lunch break, without travelling to an office or waiting in a queue. Well-designed digital forms also reduce errors, since they can check information as it is entered and prevent incomplete applications from being submitted. For the state, processing applications electronically cuts administrative costs, and those savings can, in principle, be redirected to front-line services such as healthcare or education.\n\nYet these advantages are enjoyed mostly by people who are already comfortable online. Elderly citizens, people with certain disabilities and those who cannot afford a computer or a reliable connection may find themselves effectively shut out of services to which they are legally entitled. Rural areas with weak broadband coverage face a similar barrier. Moreover, online systems handle standard cases well but tend to fail people whose circumstances are unusual, such as a refugee without the documents a form demands, who then has no one to explain the problem to. If a system crashes or suffers a cyber attack, an entire population may lose access at once. Since public services exist to serve everyone, excluding even a minority is a serious failure rather than an acceptable side effect.\n\nIn conclusion, digital public services are faster and cheaper for most citizens, but making them the only option sacrifices fairness for efficiency. Governments should therefore expand online access while keeping at least a limited network of offices for those who need personal help."},{"id":"t2-12","essayType":"discussion","topic":"education","placement":false,"prompt":"Some people believe that employers should treat degrees completed entirely online as equal to those earned at a traditional campus-based university. Others argue that a campus degree will always be more valuable. Discuss both these views and give your own opinion. Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Campus life helps students develop teamwork, presentation skills and professional networks.","Some subjects, such as medicine or engineering, need hands-on practice that is hard to provide online.","Some online providers have low standards, so employers are cautious.","Many respected universities teach the same curriculum, with the same staff and exams, online and on campus.","Completing a degree online requires strong self-discipline and time management, which employers value.","Online degrees open higher education to working adults, parents and people in remote areas."],"usefulVocab":["academic rigour","an accredited institution","the mode of delivery","hands-on experience","professional networks","self-discipline","time-management skills","to widen access to higher education","supervised placements","to be judged on equal terms"],"modelAnswer":"As universities increasingly offer complete degree programmes over the internet, a debate has emerged over whether employers should value these qualifications as highly as traditional ones. Although campus study offers certain advantages, I believe that an online degree from a reputable institution should be judged on equal terms.\n\nThose who favour campus degrees argue that university is about far more than lectures and examinations. Living and studying alongside others, students learn to work in teams, present ideas in person and build professional networks that may prove invaluable later in their careers. Some subjects also require hands-on experience that is difficult to replicate remotely; few people would want to be treated by a doctor who had learned clinical skills entirely through a screen. In addition, the online market includes some providers with questionable standards, which makes employers understandably cautious.\n\nHowever, these concerns relate to the quality of particular courses rather than to online learning as such. Many established universities now teach the same curriculum online as on campus, using the same academic staff and comparable assessments, so the knowledge gained is essentially identical. Indeed, completing a demanding degree without the structure of a timetable arguably requires greater self-discipline and time management, qualities that most employers prize. Online study also opens higher education to working adults, parents and people in remote regions, and dismissing their achievements would mean overlooking a large pool of talent. Where practical skills are essential, as in medicine or engineering, programmes can combine online theory with supervised placements.\n\nIn conclusion, while campus life can foster valuable interpersonal skills and practical experience, I believe employers should focus on the rigour and accreditation of a degree rather than on how it was delivered. Judging applicants on what they have learned, rather than where they sat while learning it, is both fairer and more sensible."},{"id":"t2-13","essayType":"two_part","topic":"society","placement":false,"prompt":"Online platforms now allow people to give public ratings to almost anyone who provides a service, from taxi drivers and delivery workers to doctors and teachers. Why have these rating systems become so widespread? What effects do they have on the people who are being rated? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Apps that connect strangers need a quick way to build trust between customers and workers.","Ratings are a cheap form of quality control, replacing paid supervisors.","Consumers often trust reviews from ordinary people more than advertising.","Good ratings can reward hard work and give workers a sense of pride.","Scores can reflect things outside the worker's control, or even customers' prejudices.","Low ratings can cost workers their jobs, and professionals may avoid necessary but unpopular decisions."],"usefulVocab":["to build trust between strangers","a form of quality control","peer reviews","to be on the receiving end","factors beyond someone's control","unconscious bias","to have one's account suspended","to play it safe","professional integrity"],"modelAnswer":"Whether we take a taxi, order a meal or visit a clinic, we are now routinely invited to award stars to the person who served us. This practice has spread because it benefits both platforms and consumers, but its consequences for those being judged are, in my view, more harmful than helpful.\n\nThe popularity of rating systems stems partly from the nature of the digital economy. Platforms that connect strangers, such as ride-hailing apps, cannot function unless customers feel confident that a driver is safe and reliable, and a public score offers a simple way to build that trust. Ratings are also remarkably cheap for companies: rather than employing supervisors to monitor quality, a firm can let thousands of customers do the job for free. Consumers, for their part, tend to trust the experiences of other ordinary people more than advertising, so they actively seek out and contribute reviews.\n\nFor those on the receiving end, the effects are mixed. Admittedly, ratings can reward hard work, and a conscientious delivery driver may take genuine pride in a near-perfect score. However, scores frequently reflect factors beyond a worker's control, such as traffic delays or a restaurant preparing food slowly, and may even be influenced by customers' prejudices about age, accent or ethnicity. For platform workers, the stakes are high, as falling below a certain average can lead to their account being suspended. Professionals are affected too: a doctor who refuses to prescribe unnecessary antibiotics or a teacher who marks rigorously may receive poor reviews precisely for doing the job properly, which may tempt them to play it safe instead.\n\nIn conclusion, rating systems have spread because they create trust cheaply and give consumers a voice. Yet by exposing workers to constant and sometimes unfair judgement, they can undermine both well-being and professional integrity, so their influence should be treated with caution."},{"id":"t2-14","essayType":"problem_solution","topic":"technology","placement":false,"prompt":"Many apps and websites are deliberately designed to keep users scrolling and clicking for as long as possible. What problems does this cause, and what measures could be taken to tackle them? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Constant notifications make it hard to concentrate on study or work for long periods.","Late-night scrolling reduces sleep and affects mood and performance the next day.","Algorithms promote content that provokes strong emotions, which can distort public debate and harm self-esteem.","Individuals can turn off non-essential notifications and use built-in screen-time tools.","Designers can adopt ethical design, such as natural stopping points and success measured by user satisfaction.","Governments can ban the most manipulative features for children and require transparency about recommendation systems."],"usefulVocab":["the attention economy","infinite scrolling","push notifications","engagement metrics","to optimise for engagement","knock-on effects","ethical design","natural stopping points","to curb manipulative features","digital well-being"],"modelAnswer":"Behind many popular apps lies a business model that depends on capturing as much of our attention as possible, since more time on a platform means more advertising revenue. Features such as infinite scrolling and constant notifications are the result. In my view, this approach causes significant personal and social harm, but it can be curbed through combined action by individuals, industry and government.\n\nThe most immediate problem is the effect on concentration. When a phone signals a new notification every few minutes, sustained focus on study or work becomes extremely difficult, and many users find themselves picking up their device without consciously deciding to do so. Late-night scrolling can also eat into sleep, with knock-on effects on mood and performance the following day. On a wider scale, recommendation algorithms optimised for engagement tend to favour content that provokes strong emotions, such as outrage or envy, because it keeps people watching. This can distort public debate and leave young users in particular feeling inadequate as they compare themselves with others' carefully edited images.\n\nSeveral measures could reduce these harms. Individuals can disable non-essential notifications and use the screen-time tools built into most phones. More fundamentally, the technology industry should embrace ethical design, for instance by building in natural stopping points rather than endless feeds, and by measuring success through user satisfaction rather than minutes spent on screen. Since commercial pressures make voluntary change unlikely, however, regulation is also needed. Governments could prohibit the most manipulative features, such as autoplay and infinite scroll, on services used by children, and require platforms to explain how their recommendation systems rank content.\n\nIn conclusion, attention-maximising design undermines concentration and sleep and can distort public discourse. While individuals can protect themselves to some extent, lasting change will depend on designers rethinking their priorities and on regulators setting clear limits."},{"id":"t2-15","essayType":"positive_negative","topic":"education","placement":false,"prompt":"Many universities now record all of their lectures and make them available online. As a result, a large number of students rarely attend classes in person. Is this a positive or negative development? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Students can pause and replay difficult explanations, which is especially useful for second-language learners.","Recordings help students who work, care for relatives or are ill not to miss content.","Watching alone is passive: students cannot ask questions or join discussions.","Many students postpone watching and then cram hours of recordings before exams.","Empty lecture halls weaken the sense of community, which can lead to isolation.","Lecturers lose live feedback; universities could make in-person sessions more interactive."],"usefulVocab":["to revise at one's own pace","a lifeline for","caring responsibilities","to supplement rather than replace","passive learning","to cram for an examination","a sense of community","to feel isolated","interactive sessions"],"modelAnswer":"Lecture recordings, once a rare privilege, are now standard at many universities, and lecture halls that were once crowded are increasingly half-empty. Although recordings are a valuable resource in themselves, I believe that the widespread decline in attendance they have encouraged is, on the whole, a negative development.\n\nThere is no doubt that recordings bring real benefits. A student who finds a statistics lecture difficult can pause it, replay a complex explanation and take careful notes, which is especially helpful for those studying in their second language. Recordings are also a lifeline for students who work part-time, care for relatives or fall ill, ensuring that they do not miss essential content. From this perspective, online access makes higher education more flexible and inclusive.\n\nThe problem arises when recordings replace attendance rather than supplement it. Watching a video alone is a largely passive experience: students cannot ask questions, take part in discussions or benefit from the energy of a live audience. In practice, many also intend to catch up later but postpone doing so until the week before an examination, when they cram dozens of hours of material at double speed and retain relatively little. Perhaps more importantly, empty lecture halls erode the sense of community that university life should provide. Students who rarely come to campus have fewer opportunities to form friendships and study groups, and may feel isolated, which can affect both their well-being and their results.\n\nIn conclusion, recorded lectures are an excellent tool for revision and for students facing genuine obstacles to attendance. However, when they become a substitute for being present, learning becomes more passive and isolated, which is why I regard the overall trend as negative. Universities should make in-person sessions more interactive, so that attending offers something a recording cannot."},{"id":"t2-16","essayType":"opinion","topic":"work","placement":false,"prompt":"Some people argue that employees who work from home should be paid less than those who travel to an office, because they save time and money on commuting. To what extent do you agree or disagree? Give reasons for your answer and include any relevant examples from your own knowledge or experience.","ideas":["Home workers save on train tickets or fuel and gain hours each week.","Office-based staff may feel they earn less in real terms once travel costs are deducted.","Remote workers pay for heating, electricity, internet and equipment that an office would provide.","Employers already save money on office rent and running costs when staff work from home.","Pay should reflect skills, responsibility and results, not location: equal pay for equal work.","Lower pay would penalise parents and disabled workers; a travel allowance for office staff would be fairer."],"usefulVocab":["commuting costs","disposable income","in real terms","office rent and overheads","equal pay for equal work","to penalise","a travel allowance","to bear the cost of","to be determined by performance"],"modelAnswer":"Since remote working became widespread, some employers have questioned whether staff who no longer commute should be paid the same as their office-based colleagues. Although I understand the reasoning behind this proposal, I strongly disagree with it, as salaries should reflect the value of the work done rather than the place where it is carried out.\n\nAdmittedly, the argument has a certain surface logic. A person who works from home avoids the expense of train tickets or fuel and gains hours each week that would otherwise be spent in traffic. Office-based employees may therefore feel that, once travel costs are deducted, they are effectively earning less for the same job. Some home workers also choose to live where housing is considerably cheaper, which further increases their disposable income.\n\nHowever, this view rests on a narrow and one-sided calculation. Remote employees transfer many costs from their employer to themselves, paying for the heating, electricity, internet connection and often the furniture that a company would otherwise provide. Meanwhile, the employer saves substantially on office rent and overheads. More fundamentally, the principle of equal pay for equal work should not depend on location: a developer who writes the same code to the same standard deserves the same reward wherever her desk happens to be. Cutting salaries would also penalise precisely those for whom remote work matters most, including parents of young children and people with disabilities. If commuters genuinely face unfair costs, the obvious solution is a travel allowance for office staff, not a pay cut for everyone else.\n\nIn conclusion, while home workers may save on commuting, they bear other costs, and their contribution to an organisation is no less valuable. Pay should therefore be determined by skill, responsibility and performance, not by whether an employee walks into an office each morning."}],"speaking":{"part1":[{"id":"p1-00","topic":"Your work or studies and your daily routine","placement":true,"questions":["Do you work, or are you a student at the moment?","What does a typical working day look like for you?","Which part of the day do you usually find most productive, and why?"]},{"id":"p1-01","topic":"Your work or studies","placement":false,"questions":["What do you do, and what does your job involve?","Why did you decide to go into this line of work?","What do you find most challenging about your job?","Do you prefer working on your own or as part of a team?","Is there anything you would like to change about the way you work?"]},{"id":"p1-02","topic":"Your hometown","placement":false,"questions":["Where is your hometown?","What do you like most about living there?","Has your hometown changed much since you were a child?","Is it a good place for young people to find work?","Would you recommend it to someone visiting your country? Why or why not?"]},{"id":"p1-03","topic":"Mobile phones","placement":false,"questions":["How often do you use your phone during the day?","Apart from making calls, what do you mainly use it for?","Can you remember when you got your first mobile phone?","Have you ever tried to spend a whole day without your phone?","Do you think people rely on their phones too much nowadays?"]},{"id":"p1-04","topic":"Apps","placement":false,"questions":["What kinds of apps do you use most often?","Is there an app you feel you couldn't live without?","Do you ever pay for apps, or do you mostly use free ones?","How do you usually find out about new apps?","Have you deleted any apps recently? Why?"]},{"id":"p1-05","topic":"Reading","placement":false,"questions":["Do you enjoy reading?","What kinds of things do you usually read?","Do you prefer reading on paper or on a screen?","Did you read a lot when you were a child?","Is there a book you would like to read again one day?"]},{"id":"p1-06","topic":"Learning languages","placement":false,"questions":["How many languages can you speak?","What do you find most difficult about learning English?","How do you practise English outside of lessons?","Would you like to learn another language in the future?","At what age do you think children should start learning a foreign language?"]},{"id":"p1-07","topic":"Weekends","placement":false,"questions":["What do you usually do at the weekend?","Do you prefer to relax or to keep busy at weekends?","Do you ever have to work at the weekend?","What did you do last weekend?","Are your weekends different now from when you were younger?"]},{"id":"p1-08","topic":"Food and cooking","placement":false,"questions":["Do you like cooking?","Who does most of the cooking in your home?","Is there a traditional dish from your country that you particularly enjoy?","Do you prefer eating at home or eating out?","Have your eating habits changed in the last few years?"]},{"id":"p1-09","topic":"Music","placement":false,"questions":["What kind of music do you like listening to?","At what times of day do you usually listen to music?","Do you listen to music while you are working or studying?","Have you ever learnt to play a musical instrument?","Is traditional music still popular in your country?"]},{"id":"p1-10","topic":"Weather and seasons","placement":false,"questions":["What is the weather usually like where you live?","Which season do you like best, and why?","Does the weather ever affect your mood?","How often do you check the weather forecast?","Would you like to live somewhere with a very different climate?"]},{"id":"p1-11","topic":"Sleep","placement":false,"questions":["How many hours do you usually sleep at night?","Do you find it easy to fall asleep?","Do you ever have a nap during the day?","Do you tend to use your phone just before you go to bed?","What do you do when you can't get to sleep?"]},{"id":"p1-12","topic":"Social media","placement":false,"questions":["Which social media platforms do you use?","Roughly how much time do you spend on social media each day?","Do you post much about your own life online?","Have you ever taken a break from social media?","Do you think social media has changed the way people make friends?"]},{"id":"p1-13","topic":"Shopping online","placement":false,"questions":["How often do you buy things online?","What was the last thing you bought online?","Do you prefer shopping online or in a physical shop? Why?","Have you ever had a problem with something you ordered online?","Do older people in your country shop online as much as younger people?"]},{"id":"p1-14","topic":"Getting around","placement":false,"questions":["How do you usually get to work or to your place of study?","How long does that journey normally take you?","Is public transport good in your city?","Would you ever consider cycling to work? Why or why not?","What could be done to improve transport where you live?"]}],"part2":[{"id":"p2-00","topic":"places","placement":true,"cue":"Describe a place in your town or city where you like to spend time.","bullets":["where it is","how often you go there","what you usually do there"],"finalBullet":"and explain why you like spending time there.","part3":{"theme":"Public spaces in cities","questions":["Why do people who live in cities need public spaces such as parks and squares?","Should local governments spend more on public spaces or on roads and housing?","How have the places where young people meet changed in recent years?","Have shopping centres replaced traditional meeting places in your country? Is this a good thing?"]},"usefulPhrases":["The place I'd like to talk about is...","It's somewhere I've been going since I was a teenager.","Let me think... I'd say I go there two or three times a month.","To give you an idea of what it's like,...","It's not the most impressive place, but...","I suppose the main reason I like it is that..."]},{"id":"p2-01","topic":"technology","placement":false,"cue":"Describe an app that has made your daily life easier.","bullets":["what the app is and what it does","how you started using it","how often you use it"],"finalBullet":"and explain how it has made your life easier.","part3":{"theme":"Technology and convenience","questions":["Why are some people reluctant to start using new apps and technology?","Do apps that make life more convenient also make people less independent?","Should companies be allowed to collect data about how people use their apps?","How might everyday technology change the way people work over the next twenty years?","Is it the responsibility of app designers to make sure their products are not addictive?"]},"usefulPhrases":["The app I'm going to talk about is...","I came across it more or less by accident.","Basically, it lets you...","Before I started using it, I used to...","The best way to explain it is with an example.","Let me see... I'd say I use it at least twice a day.","It's not perfect, though. One thing that annoys me is...","To be honest, I can't imagine going back to the old way."]},{"id":"p2-02","topic":"education","placement":false,"cue":"Describe a skill you learned online.","bullets":["what the skill is","where and how you learned it online","how long it took you to learn it"],"finalBullet":"and explain how you feel about learning in this way.","part3":{"theme":"Online learning","questions":["What are the main advantages of learning online compared with learning in a classroom?","Why do so many people start online courses but never finish them?","Do employers value online qualifications as much as traditional degrees?","Are there any skills that cannot be learned properly online?","How might universities need to change if more people choose to study online?"]},"usefulPhrases":["I picked it up mainly through video tutorials.","At first I found it quite overwhelming, but...","What really helped me was...","For instance, there was one exercise where...","Hmm, it's hard to say exactly, but it probably took me a few months to get the hang of it.","If I'm honest, I didn't expect it to be so...","Looking back, I'd say..."]},{"id":"p2-03","topic":"technology","placement":false,"cue":"Describe a website that you find especially useful.","bullets":["what the website is","how you found out about it","what information or services it offers"],"finalBullet":"and explain why you find it so useful.","part3":{"theme":"The internet and information","questions":["How do people decide whether information they find online is reliable?","Has the internet made people better informed, or simply more confused?","Should schools teach children how to judge online sources? How could they do this?","Why do some websites become very popular while others quickly disappear?","Will printed reference books such as dictionaries still exist in the future?"]},"usefulPhrases":["It's a site I check pretty much every day.","A colleague recommended it to me when I was...","The thing that makes it stand out is...","Just last week, for example, I needed to...","It's hard to put into words, but...","I'd say it probably saves me a few hours a week."]},{"id":"p2-04","topic":"education","placement":false,"cue":"Describe a teacher who had a strong influence on you.","bullets":["who this teacher was","what subject he or she taught you","what his or her lessons were like"],"finalBullet":"and explain why this teacher influenced you so much.","part3":{"theme":"Teachers and teaching","questions":["What qualities make someone a good teacher?","Are teachers given enough respect in your country?","Could artificial intelligence ever replace human teachers? Why or why not?","Is it better for teachers to be strict or friendly with their students?","How has the role of the teacher changed now that students can find almost any information online?"]},"usefulPhrases":["The teacher who comes to mind straight away is...","She had a way of making difficult ideas seem simple.","I remember one lesson in particular when...","At the time I didn't really appreciate it, but...","It's partly because..., and partly because...","I suppose what I'm trying to say is..."]},{"id":"p2-05","topic":"work","placement":false,"cue":"Describe a time when you solved a problem at work or in your studies.","bullets":["what the problem was","when and where it happened","how you solved it"],"finalBullet":"and explain how you felt after solving it.","part3":{"theme":"Problem-solving at work","questions":["Why are some people better at solving problems than others?","Can problem-solving be taught at school, or does it only come from experience?","Do people solve problems more effectively on their own or in groups?","Why do some employees avoid telling their managers about problems?","How has technology changed the way companies deal with problems?"]},"usefulPhrases":["This happened about a year ago, when I was working on...","Basically, the problem was that...","Just to give you an idea of how serious it was,...","My first thought was..., but then I realised...","I have to admit I was quite nervous at first.","It turned out that...","To cut a long story short,...","In the end, it all worked out."]},{"id":"p2-06","topic":"work","placement":false,"cue":"Describe a team you were part of that achieved something successful.","bullets":["what the team was","who was in it","what the team achieved"],"finalBullet":"and explain what made the team work well together.","part3":{"theme":"Teamwork","questions":["What are the most common causes of conflict within a team?","Does a team always need a strong leader?","How has remote working affected the way teams cooperate?","Why do some people prefer to work independently rather than in a team?","Should schools put more emphasis on group projects? Why or why not?"]},"usefulPhrases":["The team I'm going to talk about was...","There were five of us, and each person had a different role.","Let me think how best to describe it...","We didn't always agree, of course.","For example, whenever someone got stuck,...","What made the difference, I think, was...","I'd say the main thing I learnt from it was..."]},{"id":"p2-07","topic":"personal","placement":false,"cue":"Describe a goal you would like to achieve in the next few years.","bullets":["what the goal is","when you first decided on it","what you are doing to achieve it"],"finalBullet":"and explain why this goal is important to you.","part3":{"theme":"Ambition and success","questions":["Why do some people set very ambitious goals while others prefer realistic ones?","How important is it for young people to have clear career plans?","Is success today measured mainly in terms of money?","What role should parents play in helping their children set goals?","Why do so many people give up on their goals?"]},"usefulPhrases":["One goal I've had for a while now is...","Well, let me think about how to explain this.","It all started when...","For example, at the moment I'm trying to...","It's easier said than done, though.","If everything goes to plan, I'd like to...","I'm not a hundred per cent sure, but I think...","The main reason it matters to me is that..."]},{"id":"p2-08","topic":"personal","placement":false,"cue":"Describe an important decision you made.","bullets":["what the decision was","when you made it","what options you had at the time"],"finalBullet":"and explain whether you think it was the right decision.","part3":{"theme":"Making decisions","questions":["Do young people today face more difficult decisions than previous generations did?","Should important decisions be made quickly or only after a long period of thought?","Who should young people turn to for advice about their careers?","Why do some people find it so hard to make decisions?","Does having too many choices make life more difficult? Why?"]},"usefulPhrases":["I'd like to talk about the time I decided to...","Well, how can I put it? It wasn't an easy choice.","On the one hand..., but on the other hand...","Let me give you an example of what I mean.","I spent weeks going back and forth about it.","What finally made up my mind was...","I'm not entirely sure, but I'd say...","With hindsight, I think..."]},{"id":"p2-09","topic":"places","placement":false,"cue":"Describe a place where you like to study or work.","bullets":["where it is","what it looks like","when you usually go there"],"finalBullet":"and explain why it helps you to concentrate.","part3":{"theme":"Workplaces and study environments","questions":["What makes a workplace comfortable and productive?","Will working from home become the norm for office workers?","Why do some students prefer to study in cafés rather than libraries?","Should companies design open-plan offices, or give workers private spaces?","How might libraries need to change in the future to remain useful?"]},"usefulPhrases":["The place I have in mind is...","It's nothing special to look at, but...","The atmosphere there is quite...","I tend to go there whenever I need to...","For instance, last week I spent a whole afternoon there working on...","Compared with working at home, it's...","Hmm, how can I put this? I suppose it's a mixture of things."]},{"id":"p2-10","topic":"reading","placement":false,"cue":"Describe a book or an article you read that taught you something useful.","bullets":["what it was about","when and where you read it","why you decided to read it"],"finalBullet":"and explain what you learned from it.","part3":{"theme":"Reading and knowledge","questions":["Why do fewer young people seem to read books for pleasure nowadays?","Is reading short articles online as valuable as reading a whole book?","Should governments do more to encourage reading? How?","How has the way people follow the news changed in recent years?","Do audiobooks offer the same benefits as reading?"]},"usefulPhrases":["It was an article I came across on...","Off the top of my head, I can't remember who wrote it, but...","If I remember correctly, the main idea was that...","For example, it explained how...","What struck me most was...","I'd never really thought about it that way before.","Since then, I've tried to..."]},{"id":"p2-11","topic":"people","placement":false,"cue":"Describe a person you know who is very good at their job.","bullets":["who this person is","what job he or she does","how you know him or her"],"finalBullet":"and explain why you think this person is so good at the job.","part3":{"theme":"Work and job satisfaction","questions":["Which is more important when choosing a job: the salary or job satisfaction?","Why are some people more successful in their careers than others?","Should people be paid according to how hard they work or according to the results they achieve?","Is it better to stay with one company for a long time or to change jobs regularly?","Which jobs do you think deserve more recognition in society?"]},"usefulPhrases":["The person I'd like to describe is...","I've known her for about three years now.","Let me think... what's the best way to describe her?","What impresses me most about him is...","A good example of this is when...","She's the kind of person who...","As far as I know, he...","I'd say she's a natural at it."]},{"id":"p2-12","topic":"personal","placement":false,"cue":"Describe a change in your life that you were happy about.","bullets":["what the change was","when it happened","how your life was different afterwards"],"finalBullet":"and explain why you were happy about this change.","part3":{"theme":"Change and adapting","questions":["Why do some people find it difficult to accept change?","Are older people generally less willing to change than younger people?","What have been the biggest changes in your country over the last few decades?","Is technology changing society too quickly?","How can companies help their employees adapt to changes at work?"]},"usefulPhrases":["The change I'm going to talk about happened when...","Let me see, it must have been about two years ago.","Before that, my life was quite different.","To give you an example,...","It took me a while to get used to it.","The biggest difference was probably that...","I can't say it was easy, but...","Looking back, it was definitely a turning point."]},{"id":"p2-13","topic":"people","placement":false,"cue":"Describe a time when you helped someone.","bullets":["who you helped","what the situation was","how you helped this person"],"finalBullet":"and explain how you felt about helping him or her.","part3":{"theme":"Helping others","questions":["Are people less willing to help strangers than they were in the past?","Why do some people choose to do voluntary work?","Should schools require students to do some kind of community service?","Is it mainly the government's responsibility or individuals' responsibility to help people in need?","How can technology make it easier for people to help each other?"]},"usefulPhrases":["This was back when I was at university.","A friend of mine was having trouble with...","Just to give you an example of how stressed she was,...","So what I did was...","It wasn't a big deal really, but...","I remember feeling quite proud, actually.","If I remember rightly, it was...","It made me realise that..."]},{"id":"p2-14","topic":"science","placement":false,"cue":"Describe an invention that you think has changed the world.","bullets":["what the invention is","when you first heard about it or used it","how people use it"],"finalBullet":"and explain why you think it has been so important.","part3":{"theme":"Inventions and progress","questions":["Which inventions of the last hundred years have had the greatest impact on everyday life?","Do all new inventions make life better? Can you think of any that have caused problems?","Should governments fund scientific research, or should this be left to private companies?","Why do some countries produce more inventions than others?","What kinds of inventions will the world need most in the future?"]},"usefulPhrases":["Hmm, there are so many to choose from, but I think I'll go for...","It's hard to imagine life without it.","Before it existed, people had to...","It's used for all sorts of things, from... to...","Some people would argue that..., but personally I think...","I might be wrong, but I'd guess...","In a nutshell,..."]},{"id":"p2-15","topic":"events","placement":false,"cue":"Describe an event you attended that was very well organised.","bullets":["what the event was","where and when it took place","who organised it"],"finalBullet":"and explain why you think it was so well planned.","part3":{"theme":"Planning and organisation","questions":["Why is careful planning so important for large public events?","Do people today plan their lives more carefully than people did in the past?","What skills does someone need to be a good event organiser?","Are there any disadvantages to planning everything in advance?","How has technology changed the way people organise events?"]},"usefulPhrases":["The event I'm thinking of was a conference I went to last year.","Right from the start, you could tell that...","Everything ran like clockwork.","Just to give you one example,...","Apparently, they had been planning it for months.","If I had to pick one thing, it would be..."]}]},"grammar":[{"id":"g01","title":"Articles: a, an, the and no article","forSkill":"both","why":"Arabic has a definite article (al-) but no written indefinite article, and it uses al- with general and abstract nouns where English uses no article at all. As a result, Arabic speakers often drop a/an ('I am developer') and add 'the' before general ideas ('The technology changes our lives').","rule":["Use a/an with a singular countable noun mentioned for the first time or meaning 'one of many': a developer, an online course.","Use the when the listener or reader knows which one you mean: it was mentioned before, there is only one, or a phrase identifies it (the app I use at work).","Use no article with plural and uncountable nouns when you mean them in general: Technology changes quickly. Children need exercise.","A singular countable noun can never stand alone: write a/the/my/this computer, never just computer.","Use the with superlatives, ordinal numbers and decades: the highest figure, the second year, the 1990s.","In Task 1, measured quantities take the: the number of, the proportion of, the percentage of, the rate of."],"ar":"في اللغة العربية أداة تعريف واحدة هي «ال»، ولا توجد أداة تنكير مكتوبة، إذ يدل التنوين على النكرة. لذلك ينسى كثير من المتعلمين العرب كتابة a أو an قبل الاسم المفرد المعدود، فيقولون I am developer بدلاً من I am a developer. ومن جهة أخرى، تستخدم العربية «ال» مع الأسماء العامة والمجردة، فنقول: «التكنولوجيا تغيّر حياتنا» و«التعليم مهم». أما في الإنجليزية فالاسم غير المعدود أو الجمع إذا قُصد به المعنى العام يأتي بلا أداة: Technology changes our lives و Education is important. استخدم the فقط عندما يكون المقصود شيئاً محدداً يعرفه القارئ، مثل: the education system in my country. والقاعدة الذهبية: الاسم المفرد المعدود لا يقف وحده أبداً، بل يحتاج إلى a أو the أو كلمة مثل my أو this.","examples":[{"wrong":"I work as frontend developer in a software company.","right":"I work as a frontend developer in a software company.","note":"Jobs are singular countable nouns, so they need a/an after 'work as' and 'be': She is an engineer."},{"wrong":"The technology has changed the way people communicate.","right":"Technology has changed the way people communicate.","note":"Technology in general takes no article. Use 'the' only for a specific technology: the technology used in electric cars."},{"wrong":"The graph shows number of people who used public transport.","right":"The graph shows the number of people who used public transport.","note":"'The number of', 'the proportion of' and 'the percentage of' always take 'the'."},{"wrong":"In my opinion, the children should learn the programming at school.","right":"In my opinion, children should learn programming at school.","note":"Children in general and school subjects take no article."},{"wrong":"Unemployment rate reached highest level in 2015.","right":"The unemployment rate reached its highest level in 2015.","note":"A specific rate needs 'the', and a superlative needs 'the' or a possessive such as 'its'."},{"wrong":"Most of the people in my city use the cars to get to work.","right":"Most people in my city use cars to get to work.","note":"'Most people' means people in general. 'Most of the people' needs a specific group: most of the people at the meeting."}],"exercise":[{"q":"My brother is ____ engineer at a large energy company.","options":["a","the","an","no article"],"answer":2,"explain":"Engineer is a singular countable noun that begins with a vowel sound, so it needs 'an'. It is the first mention and means 'one of many engineers', so 'the' is wrong.","explainAr":"كلمة engineer اسم مفرد معدود يبدأ بصوت متحرك، لذلك نستخدم an. ولا نستخدم the لأن المقصود مهندس من بين مهندسين كثيرين، وليس مهندساً محدداً."},{"q":"____ is one of the most important factors in a country's development.","options":["Education","The education","Educations","The educations"],"answer":0,"explain":"Education is used here in a general, abstract sense, so it takes no article. It is also uncountable, so it has no plural form.","explainAr":"المقصود هنا التعليم بشكل عام، والاسم المجرد العام لا يأخذ أداة تعريف في الإنجليزية، رغم أننا نقول «التعليم» بأل في العربية. كما أن الكلمة غير معدودة فلا تُجمع."},{"q":"The chart compares ____ of households with internet access in four countries.","options":["percentage","a percentage","some percentage","the percentage"],"answer":3,"explain":"'The percentage of' refers to a specific measured figure, so it always takes 'the'. This pattern appears in almost every Task 1 report.","explainAr":"عبارة the percentage of تشير إلى رقم محدد يمكن قياسه، لذلك تأتي دائماً مع the، وهي من أكثر العبارات استخداماً في المهمة الأولى من الكتابة."},{"q":"I downloaded ____ app last month, but ____ app keeps crashing.","options":["the / an","an / the","an / an","the / the"],"answer":1,"explain":"The first mention introduces a new app, so it takes 'an'. The second mention refers to the same app, which the listener now knows, so it takes 'the'.","explainAr":"في المرة الأولى نذكر التطبيق لأول مرة فنستخدم an، وفي المرة الثانية نتحدث عن التطبيق نفسه الذي أصبح معروفاً للسامع فنستخدم the."},{"q":"Which sentence is correct?","options":["Smartphone has become essential part of modern life.","The smartphone has become an essential part of the modern life.","Smartphones have become an essential part of modern life.","The smartphones have become essential part of modern life."],"answer":2,"explain":"'Smartphones' in general takes no article, 'part' is singular and countable so it needs 'an', and 'modern life' in general takes no article. The second option is wrong only because of 'the modern life'.","explainAr":"كلمة smartphones بمعنى الهواتف الذكية عموماً لا تحتاج إلى أداة، وكلمة part مفرد معدود فتحتاج إلى an، وعبارة modern life بمعناها العام لا تأخذ the. أما الخيار الثاني فخطؤه الوحيد هو the modern life."}]},{"id":"g02","title":"Do not drop 'be' or auxiliary verbs","forSkill":"both","why":"Arabic nominal sentences such as 'الطقس حار' or 'أنا مبرمج' have no verb, and Arabic questions are formed without an auxiliary. This leads to sentences like 'The weather very hot' or 'Why you chose this job?', which examiners notice immediately in both Speaking and Writing.","rule":["Every English clause needs a verb. When there is no other verb, use be: The weather is hot. My job is challenging.","Use be before adjectives, nouns, places and -ing forms: She is a designer. The office is near the station. Prices are rising.","Passive verbs need be: The data was collected in 2020, not The data collected in 2020.","Questions in the present simple and past simple need do, does or did: Why did you choose this job? Where does she work?","Negatives also need an auxiliary: I don't agree, not I not agree.","Keep be after 'there' and inside relative clauses: There are many reasons. People who are unemployed need support."],"ar":"الجملة الاسمية في العربية لا تحتاج إلى فعل، فنقول «الطقس حارّ» و«هي مبرمجة» دون أي فعل. أما في الإنجليزية فلا بد لكل جملة من فعل، فإذا لم يوجد فعل آخر نستخدم فعل الكون be بصيغته المناسبة: am أو is أو are أو was أو were، فنقول: The weather is hot و She is a programmer. كذلك تُكوَّن الأسئلة في العربية بإضافة «هل» أو أداة استفهام فقط، بينما تحتاج الإنجليزية إلى فعل مساعد مثل do أو does أو did في المضارع البسيط والماضي البسيط، فنقول: Why did you choose this job? وليس Why you chose this job? ويحتاج النفي أيضاً إلى فعل مساعد: I don't think so. ويُعدّ حذف هذه الأفعال من أكثر الأخطاء التي يلاحظها الممتحن، لأنه يؤثر مباشرة في درجة الدقة النحوية.","examples":[{"wrong":"My hometown very crowded in summer.","right":"My hometown is very crowded in summer.","note":"'Crowded' is an adjective and cannot act as a verb, so 'is' is required."},{"wrong":"Why you decided to study computer science?","right":"Why did you decide to study computer science?","note":"A past simple question needs 'did' + the base form of the verb."},{"wrong":"Nowadays many young people interested in working abroad.","right":"Nowadays many young people are interested in working abroad.","note":"'Interested' is an adjective, so it needs 'are' before it."},{"wrong":"The number of tourists increasing every year.","right":"The number of tourists is increasing every year.","note":"The continuous form is be + -ing; the -ing form alone is not a verb."},{"wrong":"The survey conducted in five cities.","right":"The survey was conducted in five cities.","note":"Without 'was', the sentence says the survey did the conducting. The passive needs be + past participle."},{"wrong":"I not like working late at night.","right":"I don't like working late at night.","note":"Present simple negatives need 'don't' or 'doesn't' + base form."}],"exercise":[{"q":"The cost of living in big cities ____ much higher than in rural areas.","options":["(no word)","are","is","be"],"answer":2,"explain":"The sentence has no other verb, so it needs be. The subject is 'the cost', which is singular, so 'is' is correct, not 'are'.","explainAr":"لا يوجد في الجملة فعل آخر، لذلك نحتاج إلى فعل be. والفاعل هو the cost وهو مفرد، فنستخدم is وليس are."},{"q":"Choose the correct question.","options":["Where you work now?","Where you are work now?","Where does you work now?","Where do you work now?"],"answer":3,"explain":"A present simple question needs the auxiliary 'do' (with I, you, we, they) followed by the base form of the main verb.","explainAr":"السؤال في المضارع البسيط يحتاج إلى الفعل المساعد do مع you، ثم الفعل الأساسي في صيغته المجردة. أما does فتُستخدم مع he وshe وit فقط."},{"q":"Many new apartments ____ near the city centre last year.","options":["were built","built","was built","have built"],"answer":0,"explain":"Apartments cannot build anything, so the passive is needed: be + past participle. The subject is plural and the time is finished (last year), so 'were built' is correct.","explainAr":"الشقق لا تقوم بالبناء، لذلك نحتاج إلى المبني للمجهول: be مع التصريف الثالث. والفاعل جمع والزمن ماضٍ منتهٍ (last year)، فالصحيح were built."},{"q":"I think online courses ____ useful for people who work full-time.","options":["(no word)","are","is","do"],"answer":1,"explain":"'Useful' is an adjective, so the clause needs be. 'Courses' is plural, so the verb is 'are'.","explainAr":"كلمة useful صفة، فالجملة تحتاج إلى فعل be، والفاعل courses جمع، لذلك نستخدم are."},{"q":"She ____ agree with the new policy, so she wrote to her manager.","options":["not","wasn't","didn't","no"],"answer":2,"explain":"'Agree' is a main verb, so the past negative is 'didn't' + base form. 'Wasn't agree' wrongly mixes be with a main verb.","explainAr":"الفعل agree فعل أساسي، لذلك يكون النفي في الماضي بـ didn't ثم الفعل المجرد. أما wasn't agree فخطأ لأنه يجمع بين be وفعل أساسي."}]},{"id":"g03","title":"Present perfect or past simple?","forSkill":"both","why":"Arabic uses one past form (الفعل الماضي) for finished events and for past events connected to the present, so learners often say 'I live here since 2015' or 'I have finished university two years ago'. Choosing the right tense matters in Speaking Parts 1 and 2 and in Task 1 descriptions.","rule":["Use the past simple for finished actions at a finished time: I joined the company in 2021. The figure fell in 2010.","Never use the present perfect with a finished time expression such as yesterday, last year, in 2019, ago or when I was a child.","Use the present perfect for situations that started in the past and continue now, usually with for or since: I have worked here for three years.","Use the present perfect for life experience and recent changes with a present result: I have never used that app. Prices have risen sharply.","Since + a point in time (since 2020, since I graduated); for + a length of time (for six months).","In Task 1, use the past simple for data about past years; use the present perfect only when the period reaches the present: Since 2010, the number has doubled."],"ar":"في العربية نستخدم الفعل الماضي للتعبير عن أي حدث سابق، سواء انتهى أم ما زال أثره ممتداً إلى الآن. أما الإنجليزية فتفرّق بين زمنين: الماضي البسيط (past simple) لحدث انتهى في وقت محدد منتهٍ، مثل I graduated in 2019، والمضارع التام (present perfect) لحدث بدأ في الماضي وما زال مستمراً، أو لتجربة في الحياة دون ذكر وقتها، مثل I have worked as a developer for four years. ومن الأخطاء الشائعة قول I work here since 2020 ترجمةً لعبارة «أعمل هنا منذ 2020»، والصواب I have worked here since 2020. وتذكّر أن الكلمات الدالة على وقت منتهٍ، مثل yesterday وlast year وago، لا تأتي مع المضارع التام أبداً.","examples":[{"wrong":"I work as a developer since 2021.","right":"I have worked as a developer since 2021.","note":"A situation that started in the past and continues now needs the present perfect with 'since'."},{"wrong":"I have finished my degree two years ago.","right":"I finished my degree two years ago.","note":"'Ago' marks a finished time, so only the past simple is possible."},{"wrong":"I have learnt to drive when I was eighteen.","right":"I learnt to drive when I was eighteen.","note":"A 'when' clause about a finished period requires the past simple."},{"wrong":"Since 2010, the use of public transport increased steadily.","right":"Since 2010, the use of public transport has increased steadily.","note":"'Since' + a past point connected to now requires the present perfect."},{"wrong":"In 2005, the population has reached two million.","right":"In 2005, the population reached two million.","note":"Task 1 data for a specific past year uses the past simple."},{"wrong":"I know my best friend for ten years.","right":"I have known my best friend for ten years.","note":"'Know' is a state verb, so it cannot be continuous; use the present perfect simple."}],"exercise":[{"q":"I ____ in this flat since I moved to the city in 2022.","options":["live","have lived","lived","am living"],"answer":1,"explain":"The situation started in 2022 and continues now, and the sentence uses 'since', so the present perfect is required.","explainAr":"بدأ السكن في عام 2022 وما زال مستمراً حتى الآن، والجملة تحتوي على since، لذلك نستخدم المضارع التام have lived."},{"q":"The company ____ its first mobile app in 2018.","options":["has launched","has been launching","launches","launched"],"answer":3,"explain":"'In 2018' is a finished time, so the past simple is the only correct choice.","explainAr":"عبارة in 2018 تدل على وقت منتهٍ، لذلك لا يصح إلا الماضي البسيط launched."},{"q":"____ you ever ____ a presentation in English?","options":["Did / give","Do / give","Have / given","Have / gave"],"answer":2,"explain":"A question about life experience with 'ever' uses the present perfect: have + past participle (given, not gave).","explainAr":"السؤال عن تجربة في الحياة باستخدام ever يكون بالمضارع التام: have ثم التصريف الثالث given، وليس التصريف الثاني gave."},{"q":"Between 1990 and 2000, the number of cars in the city ____.","options":["doubled","has doubled","have doubled","is doubling"],"answer":0,"explain":"The period 1990 to 2000 is finished, so the past simple is used. 'Have doubled' is also wrong because 'the number' is singular.","explainAr":"الفترة من 1990 إلى 2000 انتهت، لذلك نستخدم الماضي البسيط. كما أن have doubled خطأ لأن الفاعل the number مفرد."},{"q":"Which sentence is correct?","options":["I have met my manager for the first time last Monday.","I met my manager for the first time last Monday.","I have been meeting my manager last Monday.","I meet my manager for the first time last Monday."],"answer":1,"explain":"'Last Monday' is a finished time, so the past simple 'met' is correct. The present perfect cannot be used with it.","explainAr":"عبارة last Monday تدل على وقت منتهٍ، فالصحيح الماضي البسيط met، ولا يجوز استخدام المضارع التام معها."}]},{"id":"g04","title":"Subject-verb agreement and plural nouns","forSkill":"both","why":"In Arabic, plurals of things often take a singular feminine verb (الشركات تنمو), and nouns after numbers from eleven upwards are singular (عشرون عاماً). Transferred into English, this produces errors such as 'The companies grows', 'five year' and 'she work', which are very noticeable in speech.","rule":["In the present simple, add -s to the verb after he, she, it and singular nouns: The app helps users. My sister works in a bank.","Plural nouns take plural verbs, whether they refer to people or things: Prices are rising. The figures show...","After any number above one and after many, several, a few, both and various, use a plural noun: three years, many reasons, several countries.","The verb agrees with the head noun, not the nearest noun: The number of students is increasing. One of the main reasons is cost.","Everyone, each and every take a singular verb: Everyone has a phone. Each country has its own system.","People and police are plural without -s: People are worried, not People is worried."],"ar":"في العربية يتفق الفعل مع الفاعل بطريقة مختلفة، فجمع غير العاقل يُعامل غالباً معاملة المفرد المؤنث، فنقول «الأسعار ترتفع» و«الشركات تنمو». أما في الإنجليزية فكل جمع يحتاج إلى فعل جمع، سواء كان لإنسان أو لشيء: Prices are rising. كذلك يجب إضافة s إلى الفعل في المضارع البسيط مع المفرد الغائب (he وshe وit): She works from home. ومن الأخطاء الشائعة نسيان s الجمع بعد الأعداد، لأن العربية تستخدم التمييز المفرد بعد الأعداد من أحد عشر فما فوق، فنقول «عشرون عاماً». أما في الإنجليزية فكل عدد أكبر من واحد يحتاج إلى اسم جمع: twenty years. وانتبه إلى أن الفعل يتفق مع الاسم الأساسي في الفاعل لا مع أقرب اسم إليه، فنقول: The number of cars is increasing.","examples":[{"wrong":"My brother work for a telecommunications company.","right":"My brother works for a telecommunications company.","note":"A singular subject in the present simple needs -s on the verb."},{"wrong":"The number of people who shop online have increased.","right":"The number of people who shop online has increased.","note":"The head noun is 'number' (singular), not 'people'."},{"wrong":"I have been learning English for five year.","right":"I have been learning English for five years.","note":"Every number above one needs a plural noun."},{"wrong":"One of the biggest problem are traffic congestion.","right":"One of the biggest problems is traffic congestion.","note":"Pattern: one of the + plural noun + singular verb."},{"wrong":"There is many reasons why people move to cities.","right":"There are many reasons why people move to cities.","note":"After 'there', the verb agrees with the noun that follows it."},{"wrong":"Every students have a laptop at my university.","right":"Every student has a laptop at my university.","note":"'Every' takes a singular noun and a singular verb."}],"exercise":[{"q":"The figures for 2020 ____ that sales fell sharply.","options":["shows","is showing","show","has shown"],"answer":2,"explain":"The subject is 'the figures', which is plural, so the verb is 'show'. 'For 2020' does not change the subject.","explainAr":"الفاعل هو the figures وهو جمع، لذلك يأتي الفعل show بدون s. وعبارة for 2020 لا تغيّر الفاعل."},{"q":"Each of the four countries ____ a different approach to recycling.","options":["has","have","are having","were having"],"answer":0,"explain":"The head of the subject is 'each', which is singular, so the verb is 'has', even though 'countries' comes just before it.","explainAr":"الكلمة الأساسية في الفاعل هي each وهي مفردة، لذلك نستخدم has، حتى لو جاءت كلمة countries الجمع قبل الفعل مباشرة."},{"q":"The quality of the services in my area ____ improved a lot recently.","options":["have","are","were","has"],"answer":3,"explain":"The head noun is 'quality' (singular), so the auxiliary is 'has'. 'Services' and 'area' are not the subject.","explainAr":"الاسم الأساسي في الفاعل هو quality وهو مفرد، لذلك نستخدم has. أما services وarea فليستا الفاعل."},{"q":"My manager usually ____ the team meeting on Monday mornings.","options":["lead","leads","leading","are leading"],"answer":1,"explain":"A habit with a singular subject in the present simple needs -s: 'leads'.","explainAr":"الجملة تصف عادة، والفاعل مفرد غائب، لذلك يأخذ الفعل في المضارع البسيط s فيصبح leads."},{"q":"Which phrase is correct?","options":["two hundreds students","two hundred student","two hundred students","two hundreds student"],"answer":2,"explain":"'Hundred' takes no -s after a number, but the noun that follows must be plural: two hundred students.","explainAr":"كلمة hundred لا تأخذ s بعد العدد، لكن الاسم الذي بعدها يجب أن يكون جمعاً، بخلاف العربية التي نقول فيها «مئتا طالب» بالمفرد."}]},{"id":"g05","title":"Countable and uncountable nouns","forSkill":"both","why":"Many nouns that have plurals in Arabic, such as معلومات, نصائح, أبحاث and معدات, are uncountable in English. Learners therefore write 'informations', 'researches' or 'an advice', which lowers accuracy scores in both Writing and Speaking.","rule":["Uncountable nouns have no plural and never take a/an: information, advice, research, equipment, knowledge, evidence, feedback, software, furniture, traffic, progress, accommodation.","Use a singular verb with uncountable nouns: The information is useful. The equipment was expensive.","To count them, use a unit word or a countable synonym: a piece of advice, an item of equipment, a study (not a research).","Use much, little and a large amount of with uncountable nouns; use many, few and a large number of with countable plurals.","Some nouns change m
