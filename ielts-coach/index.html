-dependent suburbs combine to create an obesogenic environment.","col":["an obesogenic environment","obesogenic lifestyles"],"fam":"obesity (n), obese (adj)","ar":"مُسبِّب للسمنة (بيئة تشجّع على زيادة الوزن)","bank":2},{"w":"juvenile delinquency","pos":"noun","lvl":3,"topic":"society","def":"crime and bad behaviour committed by young people who are not yet legally adults","ex":"After-school programmes that keep teenagers busy have been linked to a reduction in juvenile delinquency.","col":["prevent juvenile delinquency","the causes of juvenile delinquency"],"fam":"juvenile (adj/n), delinquent (n/adj)","ar":"جنوح الأحداث","bank":2},{"w":"credentialism","pos":"noun","lvl":3,"topic":"education","def":"the tendency to judge people mainly by their formal qualifications rather than by their actual skills","ex":"Credentialism forces young people to collect ever more certificates simply to compete for jobs that once required none.","col":["the rise of credentialism","critics of credentialism"],"fam":"credential (n), credentials (n pl)","ar":"النزعة إلى تقديس الشهادات (الحكم على الناس بمؤهلاتهم الرسمية)","bank":2},{"w":"nanny state","pos":"noun","lvl":3,"topic":"health","def":"a disapproving, informal term for a government that interferes too much in people's personal choices, for example about health","ex":"Opponents of bans on sugary drinks describe them as an example of the nanny state telling adults how to live.","col":["accuse the government of creating a nanny state","nanny state policies"],"fam":"nanny (n)","ar":"دولة الوصاية (حكومة تتدخل بإفراط في خيارات الأفراد)","bank":2},{"w":"custodial sentence","pos":"noun","lvl":3,"topic":"society","def":"a punishment in which a court sends someone to prison","ex":"For non-violent offenders, community-based punishments may be more effective than custodial sentences.","col":["receive a custodial sentence","a non-custodial sentence"],"fam":"custody (n)","ar":"حكم بالسجن؛ عقوبة سالبة للحرية","bank":2},{"w":"inculcate","pos":"verb","lvl":3,"topic":"education","def":"to fix ideas, principles or habits firmly in someone's mind by repeating them often","ex":"Schools that inculcate a respect for evidence prepare students well for life in a democratic society.","col":["inculcate values","inculcate a sense of responsibility in sb"],"fam":"inculcation (n)","ar":"يغرس؛ يرسّخ (فكرة أو مبدأ بالتكرار)","bank":2},{"w":"psychosomatic","pos":"adjective","lvl":3,"topic":"health","def":"describing physical symptoms that are caused or made worse by mental factors such as stress or worry","ex":"Headaches and stomach pains before exams are often psychosomatic, reflecting the pressure that students feel.","col":["psychosomatic symptoms","a psychosomatic illness"],"fam":"psychology (n), somatic (adj)","ar":"نفسي جسدي (أعراض جسدية ذات منشأ نفسي)","bank":2},{"w":"unruly","pos":"adjective","lvl":3,"topic":"education","def":"difficult to control and behaving badly","ex":"Teachers in overcrowded classrooms may spend more time managing unruly pupils than actually teaching.","col":["unruly pupils","unruly behaviour","an unruly class"],"fam":"unruliness (n)","ar":"مشاغب؛ جامح","bank":2}],"linking":{"linking":[{"function":"Adding a point","items":[{"phrase":"Furthermore,","use":"To add a second, often stronger, point that supports the same argument; best at the start of a sentence in formal writing.","ex":"Public libraries give everyone free access to books. Furthermore, they offer a quiet place to study for students who live in crowded homes.","ar":"علاوة على ذلك،","note":"Always followed by a comma. Use it once or twice per essay at most; a chain of adding words at the start of every sentence looks mechanical and lowers your Coherence and Cohesion score."},{"phrase":"Moreover,","use":"To add a further point that builds on and strengthens the one you have just made; very formal.","ex":"Cycling to work saves money on fuel and parking. Moreover, it builds exercise into a busy daily routine.","ar":"فضلاً عن ذلك،","note":"Many Arabic speakers start almost every sentence with Moreover as a translation of كما أن or وأيضاً. Examiners notice this overuse. Keep it for a point that genuinely strengthens the previous one, and avoid it in Speaking, where it sounds unnatural."},{"phrase":"In addition,","use":"To introduce another point of equal importance to the previous one.","ex":"Remote villages often lack hospitals. In addition, poor roads make it difficult for patients to reach the nearest town.","ar":"بالإضافة إلى ذلك،","note":"Write In addition, with a comma, or In addition to + noun or -ing. Avoid the wordy In addition to that, at the start of a sentence. Wrong: In addition to raise taxes. Right: In addition to raising taxes, the government could..."},{"phrase":"Not only ... but also ...","use":"To emphasise that there are two advantages or problems, the second one often more surprising.","ex":"Learning a musical instrument not only improves concentration but also teaches children patience.","ar":"ليس فقط ... بل أيضاً ...","note":"When Not only begins the sentence, invert the subject and auxiliary: Not only does exercise improve health, but it also reduces stress. Keep both halves grammatically parallel."},{"phrase":"What is more,","use":"To add a further, often more persuasive, point; slightly less formal than Moreover, so it works in both writing and speaking.","ex":"Online courses are usually cheaper than campus degrees. What is more, students can study at their own pace.","ar":"وفوق ذلك،","note":"Do not shorten it to What more, which is incorrect. In Speaking, the contracted form What's more sounds natural and fluent."},{"phrase":"Another key factor is","use":"To introduce a new main idea in a topic sentence, usually at the start of a body paragraph, without relying on a linking adverb.","ex":"Another key factor is the cost of housing, which has risen far faster than wages in most large cities.","ar":"ومن العوامل المهمة الأخرى","note":"A clear topic sentence like this is stronger than starting a paragraph with Also,. As a sentence opener, Also is informal; place also before the main verb instead: It also reduces traffic."},{"phrase":"as well as","use":"To join two nouns or -ing forms inside one sentence, adding the second item to the first.","ex":"Volunteering develops communication skills as well as a sense of responsibility.","ar":"إلى جانب؛ وكذلك","note":"After as well as, use a noun or an -ing form, not a full clause: as well as improving fitness, not as well as it improves fitness. It is not used as a sentence opener followed by a comma."}]},{"function":"Contrasting and conceding","items":[{"phrase":"However,","use":"To introduce a point that contrasts with the previous sentence.","ex":"Many people believe that homework improves results. However, too much of it can leave children exhausted and unmotivated.","ar":"ومع ذلك، / غير أنّ","note":"However links two sentences, not two clauses joined by a comma. Wrong: Fees are high, however many students still apply. Right: Fees are high. However, many students still apply. Or use a semicolon: Fees are high; however, many students still apply."},{"phrase":"On the other hand,","use":"To present the opposite side of an issue after describing one side, often paired with On the one hand.","ex":"Living in a big city offers excellent job opportunities. On the other hand, the cost of living can be extremely high.","ar":"من ناحية أخرى، (لعرض الجانب المقابل)","note":"Use it only for a genuine contrast between two sides. A very common error is to use it simply to add another point, because من ناحية أخرى in Arabic is often used that way. If the second sentence supports the first, use Furthermore or In addition instead."},{"phrase":"Although / Even though","use":"To join a concession and a main clause in one sentence; Even though is more emphatic.","ex":"Although technology has made communication easier, many people feel lonelier than ever.","ar":"على الرغم من أنّ / مع أنّ","note":"Do not add but to the main clause. Wrong: Although it is expensive, but it is worth it. Right: Although it is expensive, it is worth it. This error comes from the Arabic pattern مع أنّ ... إلا أنّ."},{"phrase":"Despite / In spite of","use":"To show contrast using a noun or an -ing form rather than a full clause.","ex":"Despite the high cost of living, the capital continues to attract young graduates.","ar":"على الرغم من (+ اسم)","note":"Follow it with a noun, a pronoun, an -ing form, or the fact that + clause. Wrong: Despite it is expensive. Right: Despite being expensive, or Despite the fact that it is expensive. Never write Despite of."},{"phrase":"Whereas / While","use":"To compare two contrasting facts or groups in one sentence; useful in both Task 1 and Task 2.","ex":"Whereas older people tend to read printed newspapers, younger readers mostly get their news from social media.","ar":"بينما / في حين أنّ","note":"When whereas or while begins the sentence, put a comma between the two clauses. While can also mean during the time that, so make sure the contrast is clear."},{"phrase":"Nevertheless,","use":"To say that something is still true even though there is a strong point against it; more formal than However.","ex":"Nuclear power produces dangerous waste. Nevertheless, some experts see it as essential for cutting carbon emissions.","ar":"ومع ذلك؛ وبالرغم من ذلك","note":"Use it after admitting a strong opposing point. It works best at the start of a sentence followed by a comma and is rarely used in everyday speech."},{"phrase":"Admittedly, ... but ...","use":"To concede that the opposing view has some truth before returning to your own argument; very effective in opinion essays.","ex":"Admittedly, school uniforms can be expensive for some families, but they reduce the pressure on children to wear fashionable clothes.","ar":"لا بدّ من الاعتراف بأنّ ... لكنّ ...","note":"One of the best ways to show a balanced, mature argument. Keep the concession short and make the counter-argument that follows longer and stronger."},{"phrase":"That said,","use":"To introduce a contrasting point after something you have just stated; semi-formal and very natural in speaking.","ex":"I really enjoy living in the city. That said, I would like to move somewhere quieter when I have children.","ar":"ومع ذلك؛ ورغم ما قيل","note":"Ideal in Speaking Parts 1 and 3 for showing both sides of your opinion. Always followed by a comma."}]},{"function":"Cause and effect","items":[{"phrase":"As a result,","use":"To introduce the result of the situation described in the previous sentence.","ex":"Many factories have moved to automated production. As a result, demand for unskilled labour has fallen.","ar":"ونتيجة لذلك،","note":"Do not confuse the sentence linker As a result, (with a comma) with the preposition as a result of + noun: As a result of the new law, smoking rates fell."},{"phrase":"Consequently,","use":"A more formal way of introducing a logical result.","ex":"The town has no reliable bus service. Consequently, most residents depend on their cars.","ar":"وبالتالي،","note":"Formal, so better in writing than in speaking. There is no form Consequently of; the prepositional phrase is as a consequence of."},{"phrase":"lead to / result in","use":"Verbs that link a cause (the subject) to its effect (the object), helping you avoid repeating because.","ex":"Long working hours can lead to stress, and prolonged stress may result in serious health problems.","ar":"يؤدي إلى","note":"Both are followed by a noun or -ing form, not a clause: lead to people losing their jobs, not lead to people lose their jobs. Do not write lead to that. Do not confuse result in (cause to effect) with result from (effect from cause)."},{"phrase":"due to / owing to","use":"Prepositions that introduce the cause of something; owing to is slightly more formal.","ex":"Owing to rising rents, many small shops in the city centre have closed.","ar":"بسبب؛ نظراً لـ","note":"Follow them with a noun phrase, not a full clause. Wrong: due to people are busy. Right: due to people's busy lifestyles, or due to the fact that people are busy."},{"phrase":"Therefore,","use":"To introduce a logical conclusion or a recommendation that follows from what you have said.","ex":"Children copy the adults around them. Therefore, parents need to model healthy eating habits.","ar":"لذلك؛ ومن ثمّ","note":"It can also go inside a clause: It is therefore essential that... Because it is an adverb, it cannot join two sentences with only a comma; use a full stop or a semicolon before it."},{"phrase":"This is largely because","use":"To explain the main reason behind a trend or claim you have just stated, while hedging slightly.","ex":"Fewer young people are buying homes. This is largely because property prices have risen much faster than salaries.","ar":"ويعود ذلك في الأساس إلى أنّ","note":"A good way to develop an idea. Avoid starting a sentence with Because and stopping after one clause, which creates a fragment: Because prices are high. (incomplete sentence)."},{"phrase":"stem from","use":"To say that a problem originates in a particular cause; formal and precise.","ex":"Many health problems in later life stem from habits formed in childhood.","ar":"ينبع من؛ ينشأ عن","note":"Use it in the active voice: Problems stem from poverty. Not: Problems are stemmed from poverty."},{"phrase":"which in turn","use":"To show a chain of causes, in which one effect causes another.","ex":"Better public transport reduces traffic, which in turn improves air quality in city centres.","ar":"وهو ما يؤدي بدوره إلى","note":"Excellent for extending an idea in depth, which examiners reward under Task Response. Put a comma before which."}]},{"function":"Giving examples","items":[{"phrase":"For example,","use":"To introduce a specific example that supports your general point.","ex":"Some jobs are impossible to do from home. For example, nurses and bus drivers must be physically present at work.","ar":"على سبيل المثال،","note":"At the start of a sentence it is followed by a comma and a complete sentence with a verb. Wrong: For example, nurses and bus drivers. (no verb)"},{"phrase":"For instance,","use":"Another way to introduce an example; it can also be placed in the middle of a sentence between commas.","ex":"Small changes can make a big difference to health. Taking the stairs instead of the lift, for instance, adds regular exercise to the working day.","ar":"على سبيل المثال؛ مثلاً","note":"Alternate For example and For instance to avoid repetition. In formal essays, write the words in full rather than using the abbreviation e.g."},{"phrase":"such as","use":"To give one or more examples inside a sentence, directly after a general noun.","ex":"Outdoor activities such as hiking and cycling help people to reduce stress.","ar":"مثل","note":"No comma after such as. In formal writing it is preferred to like for giving examples. Never start a new sentence with Such as."},{"phrase":"A case in point is","use":"To introduce a particularly clear example that proves your point; sounds sophisticated.","ex":"Investment in cycling can transform a city. A case in point is the town of Harbridge, where new bike lanes have replaced two lanes of traffic.","ar":"وخير مثال على ذلك","note":"Use it for one strong, specific example. It is followed by a noun phrase, for example A case in point is the way..."},{"phrase":"To illustrate this,","use":"To introduce an example that explains your point in more detail.","ex":"False information can spread very quickly online. To illustrate this, a single misleading post about a health remedy can reach thousands of people within hours.","ar":"ولتوضيح ذلك،","note":"Formal and suitable for Task 2. Follow it with a complete sentence."},{"phrase":"notably / particularly","use":"To single out one important example from a larger group.","ex":"Several sectors, notably tourism and hospitality, depend heavily on seasonal workers.","ar":"ولا سيما؛ خصوصاً","note":"Usually placed between commas or directly before the example. Do not begin a sentence with Especially, followed by a comma; that use is incorrect."},{"phrase":"like","use":"To give examples in informal speech, especially in the Speaking test.","ex":"At weekends I usually do outdoor activities like jogging or playing football.","ar":"مثل (في الكلام غير الرسمي)","note":"Fine in Speaking, but such as is better in Writing Task 2. Avoid using like as a filler at the start of sentences in the Speaking test."}]},{"function":"Clarifying and rephrasing","items":[{"phrase":"In other words,","use":"To explain the same idea more simply or more directly.","ex":"The council plans to pedestrianise the city centre. In other words, cars will no longer be allowed in the main shopping streets.","ar":"بعبارة أخرى،","note":"Use it to clarify, not to repeat the same words. It works equally well in speaking and writing."},{"phrase":"That is to say,","use":"To make a statement more precise or explain exactly what you mean; formal.","ex":"The scheme targets young offenders, that is to say, people under eighteen who have committed a crime.","ar":"أي؛ بمعنى","note":"Formal, so avoid overusing it. The abbreviation i.e. means the same but should be written out in full in essays."},{"phrase":"To put it another way,","use":"To repeat an idea in different words so that it is easier to understand.","ex":"The service is free at the point of use. To put it another way, patients do not pay when they see a doctor.","ar":"بتعبير آخر،","note":"Common in speaking too. One rephrase is enough; do not stack several clarifying phrases together."},{"phrase":"namely","use":"To name the specific things you have just referred to in general terms.","ex":"The plan addresses two major problems, namely traffic congestion and air pollution.","ar":"وهما؛ ألا وهي","note":"Usually follows a comma and introduces the exact items. It is not used to start a new sentence."},{"phrase":"By this I mean","use":"To explain a term or idea you have just used, especially in speaking.","ex":"I think schools should teach more life skills. By this I mean things like cooking, managing money and filling in forms.","ar":"وأقصد بذلك","note":"Very useful in Speaking Part 3 to extend your answers. In formal essays, This means that... is a more neutral alternative."},{"phrase":"In fact,","use":"To add information that strengthens or corrects what was just said, often with a more exact or surprising detail.","ex":"Learning languages is not only for children. In fact, many adults learn faster because they are better at organising their study.","ar":"في الواقع؛ بل إنّ","note":"Do not use In fact simply to add a point; it should introduce something stronger or more accurate than the previous statement. In speaking, Actually works in a similar way."},{"phrase":"What this means is that","use":"To explain the practical consequence or meaning of a fact.","ex":"The population is ageing rapidly. What this means is that more resources will be needed for elderly care.","ar":"ومعنى ذلك أنّ","note":"Natural in both speaking and writing. Use it once in an answer rather than repeatedly."}]},{"function":"Sequencing and structuring an essay","items":[{"phrase":"This essay will argue that","use":"To state your position clearly at the end of the introduction (the thesis statement).","ex":"This essay will argue that the benefits of studying abroad far outweigh the drawbacks.","ar":"سيبيّن هذا المقال أنّ","note":"Avoid opening the introduction with Nowadays, or In this modern era, followed by a vague general statement, a very common habit among Arabic speakers. Paraphrase the question directly instead, then give your position."},{"phrase":"Firstly,","use":"To introduce the first of several points, usually at the start of a body paragraph.","ex":"Firstly, cities with good public transport tend to have lower levels of air pollution.","ar":"أولاً،","note":"Do not confuse Firstly with At first, which means at the beginning, before a change: At first I disliked the city, but now I love it."},{"phrase":"Secondly,","use":"To introduce the second point in a sequence.","ex":"Secondly, studying abroad helps young people to become more independent.","ar":"ثانياً،","note":"Using Firstly, Secondly and Finally in every paragraph can look mechanical. At Band 7, vary them with topic sentences such as A further benefit is..."},{"phrase":"Finally,","use":"To introduce the last point in a list or the last body paragraph.","ex":"Finally, a shorter working week could give parents more time with their children.","ar":"وأخيراً،","note":"Do not confuse Finally with At last (after a long wait) or At the end (of a particular period or place). Finally does not mean In conclusion, so do not use it to begin your conclusion."},{"phrase":"On the one hand, ... On the other hand, ...","use":"To structure a discussion by presenting two opposing views.","ex":"On the one hand, tourism creates jobs. On the other hand, it can damage local cultures and the environment.","ar":"من ناحية ... ومن ناحية أخرى ...","note":"The second sentence must contrast with the first. Do not write On the other hand when there is no opposing idea; use the pair to frame two genuinely different sides."},{"phrase":"Turning to","use":"To move to a new aspect of the topic, often at the start of a new paragraph.","ex":"Turning to the disadvantages, the most serious is the cost to taxpayers.","ar":"وبالانتقال إلى","note":"Followed by a noun phrase and a comma. It signals paragraph structure clearly, which supports Coherence and Cohesion."},{"phrase":"With regard to / As for","use":"To introduce the topic you are going to discuss next.","ex":"As for the environmental impact, the new airport would greatly increase noise levels in nearby villages.","ar":"أمّا عن؛ فيما يخصّ","note":"With regard to is formal and As for is neutral. The standard form is with regard to; avoid with regards to in formal essays."},{"phrase":"The main reason why ... is that ...","use":"To introduce the central argument in the topic sentence of a body paragraph.","ex":"The main reason why many people move to cities is that rural areas offer few well-paid jobs.","ar":"السبب الرئيسي في ... هو أنّ ...","note":"Avoid the redundant The reason is because...; write The reason is that..."}]},{"function":"Expressing opinion","items":[{"phrase":"In my view,","use":"To give your personal opinion in a formal, concise way.","ex":"In my view, governments should invest more in public transport than in new roads.","ar":"في رأيي؛ من وجهة نظري","note":"Do not combine two opinion markers: In my opinion, I think... is redundant. Never write According to me, which is not correct English."},{"phrase":"I would argue that","use":"To present your opinion as a reasoned position; slightly tentative and academic.","ex":"I would argue that free university education is an investment rather than a cost.","ar":"أرى أنّ؛ يمكنني القول إنّ","note":"Works well in the introduction and conclusion of an opinion essay."},{"phrase":"I firmly believe that","use":"To state a strong opinion clearly.","ex":"I firmly believe that every child should learn to swim at primary school.","ar":"أؤمن إيماناً راسخاً بأنّ","note":"Agree and believe are verbs, so write I agree and I believe. Arabic speakers sometimes write I am agree, which is incorrect."},{"phrase":"From my perspective,","use":"To introduce your personal viewpoint, suggesting that others may see the issue differently.","ex":"From my perspective, working from home has made me more productive.","ar":"من منظوري","note":"From my point of view is also correct. Avoid For my opinion and In my point of view, which are incorrect."},{"phrase":"I agree to a certain extent","use":"To show partial agreement in an opinion essay, often leading to a balanced and nuanced answer.","ex":"I agree to a certain extent that advertising aimed at children should be restricted, but a complete ban would be unrealistic.","ar":"أتفق إلى حدّ ما","note":"If you choose partial agreement, explain clearly which part you accept and which you reject, and keep the same position all the way to the conclusion."},{"phrase":"It seems to me that","use":"To give an opinion in a softer, less direct way; especially natural in Speaking Part 3.","ex":"It seems to me that young people today are under more pressure than previous generations.","ar":"يبدو لي أنّ","note":"A useful alternative to I think when speaking. Avoid It seems for me."},{"phrase":"I am inclined to think that","use":"To express a careful, slightly tentative opinion.","ex":"I am inclined to think that online shopping will never fully replace traditional stores.","ar":"أميل إلى الاعتقاد بأنّ","note":"Sounds thoughtful and academic. Always followed by a full clause."}]},{"function":"Generalising and hedging","items":[{"phrase":"Generally speaking,","use":"To introduce a statement that is true in most cases but not all.","ex":"Generally speaking, people who exercise regularly sleep better.","ar":"بشكل عام؛ عموماً","note":"Followed by a comma. It helps you avoid overgeneralising, which weakens an argument in Task 2."},{"phrase":"tend to","use":"To say that something usually happens, without claiming that it always does.","ex":"Young people tend to adopt new technology much faster than their grandparents.","ar":"يميل إلى؛ غالباً ما","note":"Followed by the base form of a verb: tend to spend, not tend to spending. One of the simplest ways to soften a claim."},{"phrase":"It could be argued that","use":"To present a view that some people hold, or an idea you want to suggest carefully.","ex":"It could be argued that social media has made people more aware of global issues.","ar":"قد يُقال إنّ؛ يمكن القول إنّ","note":"Impersonal and academic. Very useful for presenting the opposing view before you respond to it."},{"phrase":"to some extent","use":"To show that something is partly, but not completely, true.","ex":"To some extent, the rise in obesity reflects changes in the type of work people do.","ar":"إلى حدّ ما","note":"Can begin or end a sentence. The noun is extent; to some extend is a common spelling mistake."},{"phrase":"In most cases,","use":"To limit a claim to the majority of situations.","ex":"In most cases, students who have part-time jobs learn to manage their time more effectively.","ar":"في معظم الحالات،","note":"A safer alternative to always or all, which make an argument easy to challenge."},{"phrase":"may / might / can","use":"Modal verbs that make a claim less absolute and more academic.","ex":"Banning cars from city centres may reduce pollution, but it might also hurt local businesses.","ar":"قد؛ ربما؛ يمكن أن","note":"Avoid absolute words such as always, never, all people and everyone. Writing Everyone knows that... is an overgeneralisation that weakens your position."},{"phrase":"It is widely believed that","use":"To report a common view without saying exactly who holds it.","ex":"It is widely believed that learning a second language improves memory.","ar":"يُعتقد على نطاق واسع أنّ","note":"A passive reporting structure typical of academic writing. Avoid the clumsy It is believed by many people that..."},{"phrase":"arguably","use":"To say that a statement can be supported by good reasons, although some people may disagree.","ex":"Clean drinking water is arguably the most important public health achievement in history.","ar":"من المرجّح القول إنّ؛ يمكن القول إنّ","note":"Usually placed before the word it modifies or at the start of a sentence. It lets you make a strong claim while still hedging it."}]},{"function":"Concluding","items":[{"phrase":"In conclusion,","use":"To begin the final paragraph of an essay and summarise your position.","ex":"In conclusion, although technology has some drawbacks in the classroom, its benefits outweigh them when it is used wisely.","ar":"في الختام،","note":"Use it once, at the start of the last paragraph. Do not write At the end, or In the end, as a translation of في النهاية; In the end means finally, after a long process, not in summary."},{"phrase":"To conclude,","use":"An alternative to In conclusion with the same meaning.","ex":"To conclude, governments and individuals must share responsibility for reducing waste.","ar":"ختاماً،","note":"Do not introduce new arguments in the conclusion; restate your opinion and summarise your main reasons."},{"phrase":"To sum up,","use":"To summarise your main points briefly; slightly less formal, so also suitable in speaking.","ex":"To sum up, both parents and schools play a vital role in teaching children good manners.","ar":"خلاصة القول،","note":"Acceptable in essays, but avoid informal versions such as All in all, and do not write To summarise everything above."},{"phrase":"On balance,","use":"To give your final judgement after weighing up both sides of an argument.","ex":"On balance, I believe that the advantages of working from home outweigh the disadvantages.","ar":"بعد الموازنة بين الجانبين،","note":"Ideal for discussion and advantages/disadvantages essays, where you still need to give a clear final opinion."},{"phrase":"All things considered,","use":"To give a conclusion after considering all the facts.","ex":"All things considered, a gradual increase in the retirement age seems the most realistic solution.","ar":"بعد أخذ جميع الأمور بعين الاعتبار،","note":"Followed by a comma. Slightly less formal than On balance, so it also works well in speaking."},{"phrase":"For the reasons mentioned above,","use":"To link your final opinion back to the arguments in your body paragraphs.","ex":"For the reasons mentioned above, I am convinced that school sport should remain compulsory.","ar":"للأسباب المذكورة آنفاً،","note":"A neat way to show logical progression. Keep the final sentence short and clear."},{"phrase":"Overall,","use":"In Task 1, to introduce the overview of the main trends; in Task 2, to begin a final summarising sentence.","ex":"Overall, the proportion of students studying online rose steadily, while campus enrolment declined.","ar":"بشكل عام؛ إجمالاً","note":"In Task 1, a clear overview beginning with Overall, is essential for Band 7 in Task Achievement. Give the main trends only, with no detailed figures."}]},{"function":"Describing data (Task 1 trends and comparisons)","items":[{"phrase":"rose sharply / increased dramatically","use":"To describe a fast, large upward movement on a graph.","ex":"The number of visitors to Lindale Museum rose sharply from 20,000 in 2015 to 65,000 in 2020.","ar":"ارتفع بشكل حادّ","note":"Use by for the size of the change and to for the final figure: rose by 45,000 to 65,000. Wrong: increased with 10%. Right: increased by 10%."},{"phrase":"declined gradually / fell steadily","use":"To describe a slow, continuous downward movement.","ex":"Meanwhile, the proportion of households with a landline telephone declined gradually, reaching 30% by the end of the period.","ar":"انخفض تدريجياً","note":"Rise, fall and decline are intransitive here: The number rose, not The number was risen. For variety, use noun forms: There was a gradual decline in..."},{"phrase":"peaked at","use":"To give the highest point reached on a graph.","ex":"Sales of electric bicycles peaked at 12,000 units in 2022 before falling slightly.","ar":"بلغ ذروته عند","note":"Write peaked at 12,000 or reached a peak of 12,000. Peaked to is incorrect."},{"phrase":"levelled off / remained stable","use":"To describe a period when a figure stopped changing after rising or falling.","ex":"After several years of growth, the unemployment rate in Norland levelled off at around 5%.","ar":"استقرّ عند مستوى معيّن","note":"British spelling is levelled, with a double l. Remained stable and stayed constant are useful alternatives."},{"phrase":"fluctuated between ... and ...","use":"To describe a figure that went up and down irregularly.","ex":"The price of coffee beans fluctuated between £3 and £5 per kilo throughout the decade.","ar":"تذبذب بين ... و ...","note":"Give the range rather than describing every small change; the examiner wants the general pattern."},{"phrase":"accounted for / made up","use":"To describe what proportion of a total a category represents, especially in pie charts.","ex":"Transport accounted for almost a third of household spending in Velmont, while food made up just 15%.","ar":"شكّل؛ استحوذ على (نسبة من المجموع)","note":"Use the active form: Transport accounted for 30%, not Transport was accounted for 30%. Use the number of with countable nouns (people, cars) and the amount of with uncountable nouns (money, energy)."},{"phrase":"twice as many ... as","use":"To compare two figures as a multiple.","ex":"In 2020, twice as many students studied business as engineering at Corwick University.","ar":"ضعف عدد ... مقارنةً بـ","note":"Use many with countable nouns and much with uncountable nouns: three times as much energy as. Double the number of... is another option."},{"phrase":"compared with / in comparison with","use":"To compare figures for two categories, countries or years.","ex":"Spending on health rose to 18% in Velmont, compared with only 9% in neighbouring Delbria.","ar":"مقارنةً بـ","note":"Compare like with like: the figure for men was higher than that for women, not higher than women."}]}],"collocations":[{"topic":"technology","items":[{"c":"rapid technological advances","ex":"Rapid technological advances have transformed the way people shop, bank and communicate.","ar":"التطورات التكنولوجية المتسارعة"},{"c":"become increasingly reliant on","ex":"Students have become increasingly reliant on search engines and rarely open printed reference books.","ar":"يصبح معتمداً بشكل متزايد على"},{"c":"a double-edged sword","ex":"Social media is a double-edged sword: it connects distant friends but can also spread misinformation.","ar":"سلاح ذو حدّين"},{"c":"cutting-edge technology","ex":"The new hospital is equipped with cutting-edge technology for detecting cancer at an early stage.","ar":"أحدث التقنيات؛ تكنولوجيا متطورة"},{"c":"bridge the digital divi 'use strict';
/* ---------- small helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const paras = (s) => String(s ?? '').trim().split(/\n{2,}/).map((p) => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((x, y) => x + y, 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const wordCount = (s) => (String(s ?? '').trim().match(/\S+/g) || []).filter((w) => /[A-Za-z0-9]/.test(w)).length;
const clone = (o) => JSON.parse(JSON.stringify(o));
const plural = (n, w, p = w + 's') => `${n} ${n === 1 ? w : p}`;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ---------- dates (local calendar days as YYYY-MM-DD) ---------- */
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const today = () => ymd();
const fmtDate = (s, o = { weekday: 'short', day: 'numeric', month: 'short' }) => parseYmd(s).toLocaleDateString('en-GB', o);
const fmtLong = (s) => fmtDate(s, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtFull = (s) => fmtDate(s, { day: 'numeric', month: 'long', year: 'numeric' });
const dow = (s) => parseYmd(s).getDay();
const DOW_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const fmtClock = (sec) => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60); return `${pad(m)}:${pad(sec % 60)}`; };
const fmtMins = (min) => { min = Math.round(min); if (min < 60) return `${min} min`; const h = Math.floor(min / 60); const m = min % 60; return m ? `${h} h ${m} min` : `${h} h`; };

/* ---------- IELTS bands ---------- */
const SKILLS = ['L', 'R', 'W', 'S'];
const SKILL_NAME = { L: 'Listening', R: 'Reading', W: 'Writing', S: 'Speaking' };
const roundHalf = (x) => Math.round(x * 2 + 1e-9) / 2;          // overall band: .25 -> .5, .75 -> next whole
const floorHalf = (x) => Math.floor(x * 2 + 1e-9) / 2;          // strict: round down to the half band
const fmtBand = (b) => (b == null || Number.isNaN(b) ? '–' : (Math.round(b * 2) / 2).toFixed(1));
function overallBand(b) {
  const v = SKILLS.map((k) => b[k]).filter((x) => x != null);
  return v.length === 4 ? roundHalf(sum(v) / 4) : null;
}
// Approximate public raw-score conversion tables (Academic Reading, Listening), out of 40.
const READING_TABLE = [[39, 9], [37, 8.5], [35, 8], [33, 7.5], [30, 7], [27, 6.5], [23, 6], [19, 5.5], [15, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3], [4, 2.5], [2, 2], [1, 1], [0, 0]];
const LISTENING_TABLE = [[39, 9], [37, 8.5], [35, 8], [32, 7.5], [30, 7], [26, 6.5], [23, 6], [18, 5.5], [16, 5], [13, 4.5], [11, 4], [8, 3.5], [6, 3], [4, 2.5], [2, 2], [1, 1], [0, 0]];
function rawToBand(skill, correct, total, adjust = 0) {
  if (!total) return null;
  const scaled = Math.round((correct / total) * 40);
  const table = skill === 'L' ? LISTENING_TABLE : READING_TABLE;
  let band = 0;
  for (const [min, b] of table) if (scaled >= min) { band = b; break; }
  // A single short set is easier than a full 40-question paper: subtract the difficulty adjustment.
  return clamp(band + adjust, 0, 9);
}

/* ---------- answer checking ---------- */
const normAns = (s) => String(s ?? '').toLowerCase()
  .replace(/[’‘`]/g, "'").replace(/[£$€]/g, '').replace(/[.,;:!?"()]/g, '')
  .replace(/-/g, ' ').replace(/\s+/g, ' ').trim()
  .replace(/^(the|a|an) /, '');
function isRightText(given, answer) {
  const alts = Array.isArray(answer) ? answer : [answer];
  const g = normAns(given);
  return g.length > 0 && alts.some((a) => normAns(a) === g);
}

/* ---------- state + persistence ----------
   The whole study record lives in S. It is cached in localStorage for instant load and saved
   remotely: inside Claude to the learner's private db subtree, and on the hosted site to the
   learner's account through this site's API. */
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch { /* storage blocked */ } },
};
const LS_CORE = 'b7.core.v1';
const LS_SRS = 'b7.srs.v1';
const LS_DOC = 'b7.doc.';

function defaultState() {
  return {
    v: 1,
    updatedAt: 0,
    profile: {
      startDate: today(),
      examDate: '2026-12-12',
      finalDate: '2027-07-31',
      target: 7,
      minTarget: 6.5,
      dailyMinutes: 105,
      lightDay: 5,
      mockDay: 6,
      newWords: 6,
      ttsRate: 1,
      autoArabic: false,
      readQuestions: true,
    },
    placement: null,           // {status, step, results:{R,L,W,S}, bands:{}, date}
    scores: [],                // {id, ts, date, skill, band, kind, ref, raw, label}
    days: {},                  // date -> {tasks:[...], week}
    weekEst: {},               // week -> frozen estimates used to plan that week
    studySec: {},              // date -> seconds of active study
    done: {},                  // 'reading:r01' -> {date, score, total, band}
    qstats: {},                // question type -> {c, t}
    journal: [],               // writing/speaking attempts (summary; full text in att_ docs)
    lastCrit: {},              // 'W' / 'S' -> weakest criterion of the latest feedback
    vocab: { cursor: 0, newDate: '', newCount: 0 },
    grammar: {},               // g01 -> {score, total, date}
    mocks: {},                 // week -> mock record
    gen: [],                   // summaries of AI-generated practice items
    account: '',               // the hosted-site account this copy belongs to
  };
}

let S = defaultState();
let LOADED_AT = { core: 0, srs: 0 };   // timestamps of the local copy as it was when the page opened
let SRS = { updatedAt: 0, cards: {} };   // word -> {due, ivl, ease, reps, lapses}
const DOCS = {};                           // id -> loaded attempt / generated item

function mergeDefaults(base, saved) {
  const out = { ...base, ...saved };
  out.profile = { ...base.profile, ...(saved.profile || {}) };
  out.vocab = { ...base.vocab, ...(saved.vocab || {}) };
  return out;
}

function loadLocal() {
  const core = LS.get(LS_CORE);
  if (core && core.v === 1) S = mergeDefaults(defaultState(), core);
  const srs = LS.get(LS_SRS);
  if (srs && srs.cards) SRS = srs;
  LOADED_AT = { core: S.updatedAt || 0, srs: SRS.updatedAt || 0 };
}

/* ---------- remote storage ----------
   Two backends share one sync path:
   - 'claude': inside Claude, the artifact's private db subtree for this viewer.
   - 'server': on the hosted site (Vercel), this site's own API, after the learner signs in.
   Reads may happen before reconciling; writes start only once Cloud.ready is true, so a fresh
   device never overwrites progress saved elsewhere. */
const Cloud = { kind: null, db: null, uid: null, user: null, ready: false, status: 'connecting', error: '' };
const writers = {};

function cloudPath(id) { return `data/users/${Cloud.uid}/${id}`; }
function api(path, opts = {}) {
  return fetch(path, { credentials: 'same-origin', cache: 'no-store', ...opts, headers: { 'content-type': 'application/json', 'x-band-seven': '1', ...(opts.headers || {}) } });
}
const Remote = {
  async get(id) {
    if (Cloud.kind === 'claude') { const snap = await Cloud.db.doc(cloudPath(id)).get(); return snap.exists ? clone(snap.data()) : null; }
    if (Cloud.kind === 'server') {
      const r = await api(`/api/data?doc=${encodeURIComponent(id)}`);
      if (r.status === 404) return null;
      if (!r.ok) throw { code: r.status === 401 ? 'signed_out' : 'unavailable' };
      return r.json();
    }
    return null;
  },
  async set(id, data) {
    if (Cloud.kind === 'claude') return Cloud.db.doc(cloudPath(id)).set(data);
    if (Cloud.kind === 'server') {
      const body = JSON.stringify(data);
      const r = await api(`/api/data?doc=${encodeURIComponent(id)}`, { method: 'PUT', body, keepalive: body.length < 60000 });
      if (!r.ok) throw { code: r.status === 401 ? 'signed_out' : r.status === 413 ? 'invalid_argument' : 'unavailable' };
    }
    return undefined;
  },
  async del(id) {
    if (Cloud.kind === 'claude') return Cloud.db.doc(cloudPath(id)).delete();
    if (Cloud.kind === 'server') await api(`/api/data?doc=${encodeURIComponent(id)}`, { method: 'DELETE' });
    return undefined;
  },
};

function cloudWrite(id, getData) {
  if (!Cloud.ready) return;
  const w = writers[id] || (writers[id] = { busy: false, dirty: false, get: null });
  w.get = getData;
  if (w.busy) { w.dirty = true; return; }
  const run = async () => {
    w.busy = true; w.dirty = false;
    let attempt = 0;
    for (;;) {
      try {
        await Remote.set(id, w.get());
        Cloud.error = '';
        break;
      } catch (e) {
        if (e?.code === 'unavailable' && attempt++ < 1) { await sleep(800 + Math.random() * 1200); continue; }
        if (e?.code === 'signed_out') { Cloud.ready = false; Cloud.user = null; Cloud.status = 'signed-out'; Cloud.error = 'You were signed out. Sign in again to keep saving to your account.'; }
        else if (e?.code === 'quota_exceeded') Cloud.error = 'Your saved data is full. Delete old attempts in Settings.';
        else if (e?.code === 'invalid_argument') Cloud.error = 'This record could not be saved (too large).';
        else Cloud.error = 'Saving to your account failed; your progress is kept on this device and will be saved again later.';
        updateSyncBadge();
        break;
      }
    }
    w.busy = false;
    if (w.dirty) run();
  };
  run();
}
async function waitForWrites(ms = 4000) {
  const end = Date.now() + ms;

}

/* Debounce with flush(): the hosted site batches writes more (each write costs a storage operation). */
function debounced(fn, msFn) {

  const d = () => { clearTimeout(t); t = setTimeout(() => { t = null; fn(); }, msFn()); };
  d.flush = () => { if (t) { clearTimeout(t); t = null; fn(); } };
  return d;
}
const pushCore = debounced(() => cloudWrite('core', () => ({ type: 'core', ...clone(S) })), () => (Cloud.kind === 'server' ? 4000 : 1200));
const pushSrs = debounced(() => cloudWrite('srs', () => ({ type: 'srs', ...clone(SRS) })), () => (Cloud.kind === 'server' ? 6000 : 1500));
function flushWrites() { pushCore.flush(); pushSrs.flush(); }

function save({ cloud = true } = {}) {
  S.updatedAt = Date.now();
  LS.set(LS_CORE, S);
  if (cloud) pushCore();
}
function saveSrs() {
  SRS.updatedAt = Date.now();
  LS.set(LS_SRS, SRS);
  pushSrs();
}
function saveDoc(id, data) {
  DOCS[id] = data;
  LS.set(LS_DOC + id, Cloud.ready ? { ...data, synced: true } : data);
  cloudWrite(id, () => ({ ...clone(data), type: data.type || 'att' }));
}
async function loadDoc(id) {
  if (DOCS[id]) return DOCS[id];
  const local = LS.get(LS_DOC + id);
  if (local) { DOCS[id] = local; return local; }
  if (Cloud.kind) {
    try {
      const d = await Remote.get(id);
      if (d) { DOCS[id] = d; LS.set(LS_DOC + id, d); return d; }
    } catch { /* fall through */ }
  }
  return null;
}
function deleteDoc(id) {

  if (Cloud.ready) Remote.del(id).catch(() => {});
}

/* Merge what the account holds with this device's copy. The newer side wins; the device's copy
   counts as newer only if it changed before this page opened (so a fresh device never wins). */
function reconcile(core, srs) {
  let changed = false;
  if (core) {
    delete core.type;
    if ((core.updatedAt || 0) > LOADED_AT.core) { S = mergeDefaults(defaultState(), core); LS.set(LS_CORE, S); changed = true; }
    else if ((S.updatedAt || 0) > (core.updatedAt || 0)) pushCore();
  } else if (S.updatedAt) pushCore();
  if (srs) {
    delete srs.type;
    if ((srs.updatedAt || 0) > LOADED_AT.srs) { SRS = { updatedAt: srs.updatedAt, cards: srs.cards || {} }; LS.set(LS_SRS, SRS); changed = true; }
    else if ((SRS.updatedAt || 0) > (srs.updatedAt || 0)) pushSrs();
  } else if (SRS.updatedAt) pushSrs();
  // Attempts saved on this device before the account connected.
  S.journal.forEach((j) => { const d = LS.get(LS_DOC + j.id); if (d && !d.synced) { d.synced = true; LS.set(LS_DOC + j.id, d); cloudWrite(j.id, () => ({ ...d, type: 'att' })); } });
  return changed;
}

async function cloudInit() {
  if (window.claude?.use) return claudeInit();
  if (/^https?:$/.test(location.protocol)) return serverInit();
  Cloud.status = 'local'; updateSyncBadge();
  return undefined;
}
async function claudeInit() {
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { Cloud.status = 'local'; updateSyncBadge(); return; }
    Cloud.kind = 'claude'; Cloud.db = db; Cloud.uid = id;
    const base = `data/users/${id}`;
    const [core, srs, gens] = await Promise.all([
      Remote.get('core'), Remote.get('srs'),
      db.collection(base).where('type', '==', 'gen').get().catch(() => null),
    ]);
    Cloud.ready = true;
    const changed = reconcile(core, srs);
    if (gens && !gens.empty) gens.docs.forEach((d) => { if (!DOCS[d.id]) { DOCS[d.id] = clone(d.data()); LS.set(LS_DOC + d.id, DOCS[d.id]); } });
    Cloud.status = 'cloud';
    updateSyncBadge();
    if (changed) onDataReplaced();
  } catch (e) {
    Cloud.kind = null; Cloud.ready = false;
    Cloud.status = 'local';
    Cloud.error = e?.code === 'revoked' ? '' : 'Could not reach your Claude account; saving on this device.';
    updateSyncBadge();
  }
}
async function serverInit() {
  let r;
  try { r = await api('/api/auth'); } catch { Cloud.status = 'local'; updateSyncBadge(); return; }
  if (r.status === 401) { Cloud.kind = 'server'; Cloud.status = 'signed-out'; updateSyncBadge(); rerenderIfIdle(); return; }
  const data = r.ok ? await r.json().catch(() => null) : null;
  if (!data || !data.user) { Cloud.status = 'local'; updateSyncBadge(); return; }   // no account API on this host
  await connectAccount(data.user);
}
/* After sign-in or sign-up: load the account's progress and decide what to keep. */
async function connectAccount(user, { interactive = false } = {}) {
  Cloud.kind = 'server'; Cloud.user = user; Cloud.status = 'connecting'; updateSyncBadge();
  let core = null, srs = null;
  try { [core, srs] = await Promise.all([Remote.get('core'), Remote.get('srs')]); }
  catch { Cloud.status = 'signed-out'; Cloud.user = null; Cloud.error = 'Could not load your account. Try signing in again.'; updateSyncBadge(); return; }
  const deviceHasOtherProgress = S.account !== user.email && (S.scores.length > 0 || Object.keys(S.done).length > 0 || Object.keys(SRS.cards).length > 0);
  const finish = (useDevice) => {
    if (useDevice) { LOADED_AT = { core: Number.MAX_SAFE_INTEGER, srs: Number.MAX_SAFE_INTEGER }; }
    Cloud.ready = true;
    const changed = reconcile(core, srs);
    LOADED_AT = { core: S.updatedAt || 0, srs: SRS.updatedAt || 0 };
    if (S.account !== user.email) { S.account = user.email; save(); }
    if (useDevice) { save(); saveSrs(); }
    Cloud.status = 'cloud'; Cloud.error = '';
    updateSyncBadge();
    if (changed || interactive) onDataReplaced();
  };
  if (core && deviceHasOtherProgress && interactive) {
    confirmModal({
      title: 'Which progress should your account keep?',
      body: `<p>Your account already has saved progress, and this device also has progress that is not in your account.</p><p style="margin-top:8px">Keep the account’s progress (recommended), or replace it with what is on this device.</p>`,
      ok: 'Keep my account’s progress', cancel: 'Use this device’s progress',
      onOk: () => finish(false),
      onCancel: () => finish(true),

}
async function signOut() {

  await waitForWrites();

  Object.keys(DOCS).forEach((k) => { delete DOCS[k]; });
  try { Object.keys(localStorage).filter((k) => k.startsWith(LS_DOC) || k.startsWith('b7.draft')).forEach((k) => localStorage.removeItem(k)); } catch { /* storage blocked */ }
  S = defaultState(); SRS = { updatedAt: 0, cards: {} };
  LOADED_AT = { core: 0, srs: 0 };
  Cloud.user = null; Cloud.ready = false; Cloud.status = 'signed-out'; Cloud.error = '';
  updateSyncBadge();
}

function updateSyncBadge() {
  const el = $('#sync');
  if (!el) return;
  const signedIn = Cloud.kind === 'server' && Cloud.user;
  const map = {
    connecting: ['', 'Connecting…', 'Checking for your saved progress'],
    cloud: ['cloud', 'Saved', signedIn ? `Progress is saved to your account (${Cloud.user.email})` : 'Progress is saved privately to your Claude account'],
    local: ['local', 'This device', 'Progress is saved in this browser only'],
    'signed-out': ['local out', 'Sign in', 'Sign in or create an account to save your progress on every device'],
  };
  const [cls, label, title] = map[Cloud.status] || map.local;
  el.className = `sync ${cls}`;
  el.title = Cloud.error || title;
  el.innerHTML = `<span>${esc(label)}</span>`;
}

/* ---------- study-time tracking (active, visible, recently-interacted time only) ---------- */
const Study = { lastInput: Date.now(), active: false, tick: null };
function studyStart() { Study.active = true; Study.lastInput = Date.now(); }
function studyStop() { Study.active = false; }
function initStudyTimer() {
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach((ev) => window.addEventListener(ev, () => { Study.lastInput = Date.now(); }, { passive: true, capture: true }));
  Study.tick = setInterval(() => {
    if (!Study.active || document.hidden) return;
    const idle = Date.now() - Study.lastInput > 150000 && !(RUN && RUN.keepAlive && RUN.keepAlive());
    if (idle) return;
    const d = today();
    S.studySec[d] = (S.studySec[d] || 0) + 15;
    LS.set(LS_CORE, S);
  }, 15000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); flushWrites(); } });
  window.addEventListener('pagehide', () => flushWrites());
}

/* ---------- Claude (sample capability) ---------- */
const AI = { fn: null, state: 'loading' };   // state: loading | ready | absent | denied | disabled

async function aiInit() {
  if (!window.claude?.use) { AI.state = 'absent'; return; }

const aiReady = () => AI.state === 'ready';

function aiErrorText(e) {
  switch (e?.code) {

async function aiJson(prompt, { tier = 'default', onText, signal, cache } = {}) {
  if (!AI.fn) throw { code: 'absent' };

const DESCRIPTORS_WRITING = `
TASK ACHIEVEMENT (Task 1)
8: covers all requirements; clearly presents, highlights and illustrates key features; occasional minor slips.
7: covers the requirements; a clear overview of main trends/differences/stages; key features clearly highlighted but could be extended.
6: addresses the requirements; an overview is attempted; key features adequately covered but some details irrelevant, inappropriate or inaccurate.
5: generally addresses the task; recounts detail mechanically with no clear overview; key features not adequately covered; may have inaccurate data.
4: attempts the task but does not cover all key features; confuses features with detail.
TASK RESPONSE (Task 2)
8: sufficiently addresses all parts; well-developed response with relevant, extended and supported ideas.
7: addresses all parts; a clear position throughout; main ideas extended and supported, but may over-generalise or supporting ideas may lack focus.
6: addresses all parts though some more fully than others; a relevant position although conclusions may become unclear or repetitive; some main ideas inadequately developed or unclear.

8: sequences information and ideas logically; manages all aspects of cohesion well; paragraphing sufficient and appropriate.

LEXICAL RESOURCE
8: wide range used fluently and flexibly to convey precise meanings; skilful use of uncommon items with only occasional inaccuracies in word choice and collocation.

5: limited range, minimally adequate; may make noticeable errors in spelling or word formation that may cause some difficulty for the reader.
GRAMMATICAL RANGE AND ACCURACY
8: wide range of structures; the majority of sentences are error-free; only very occasional errors or inappropriacies.
7: a variety of complex structures; frequent error-free sentences; good control of grammar and punctuation but may make a few errors.
6: a mix of simple and complex sentence forms; some errors in grammar and punctuation but they rarely reduce communication.
5: only a limited range of structures; attempts complex sentences but these tend to be less accurate than simple ones; frequent grammatical errors and faulty punctuation.`;

const DESCRIPTORS_SPEAKING = `
FLUENCY AND COHERENCE
8: speaks fluently with only occasional repetition or self-correction; hesitation is usually content-related; develops topics coherently and appropriately.
7: speaks at length without noticeable effort or loss of coherence; may show language-related hesitation, repetition or self-correction; uses a range of connectives and discourse markers with some flexibility.

LEXICAL RESOURCE
8: wide resource used readily and flexibly; uses less common and idiomatic vocabulary skilfully with occasional inaccuracies; paraphrases effectively.

6: wide enough vocabulary to discuss topics at length and make meaning clear despite inappropriacies; generally paraphrases successfully.

8: wide range of structures flexibly; produces a majority of error-free sentences with only occasional inappropriacies or basic/non-systematic errors.
7: uses a range of complex structures with some flexibility; frequently produces error-free sentences, though some grammatical mistakes persist.

function genReadingPrompt({ level, topic }) {

- headings: "options":[{"key":"i","text":"heading"},...] (2+ more headings than questions); questions prompt "Paragraph B", answer "iv"
- matching_info: "options": the paragraph letters [{"key":"A","text":"Paragraph A"},...]; prompt = information; answer = letter
- mcq: each question has its own "options":[{"key":"A","text":"..."},{"key":"B",...},{"key":"C",...},{"key":"D",...}], answer a key
- gap: group "wordLimit":"NO MORE THAN TWO WORDS"; prompt contains ____ exactly once; answer = array of accepted strings, the first copied word for word from the passage
- summary_bank: group "title" and "options" word bank (3+ more than questions); prompt contains ____; answer = option key
- sentence_endings: group "options" endings (2+ more than questions); prompt = sentence beginning; answer = key

Reply with only JSON:
{"title":"...","level":${level},"topic":"${topic}","paragraphs":[{"label":"A","text":"..."}],"groups":[{"type":"...","instructions":"IELTS-style instruction","title":"optional","wordLimit":"only for gap","options":[...],"questions":[...]}]}`;
}

function genListeningPrompt({ section }) {
  const what = {
    1: 'Section 1: a conversation between two people in an everyday social context (e.g. booking, enquiring, registering) with form or note completion and multiple choice',
    2: 'Section 2: a monologue in an everyday social context (e.g. a talk about local facilities or an event) with multiple choice and matching',
    3: 'Section 3: a conversation between two or three people in an academic context (students and a tutor discussing an assignment) with multiple choice and matching',
    4: 'Section 4: an academic lecture with note completion',
  }[section];
  return `Write ONE original IELTS Listening ${what}. It will be read aloud by text-to-speech. Everything must be original (fictional names and places). British spelling in questions.

Requirements: script 550-750 words; exactly 10 questions numbered 1-10 in script order; genuine IELTS distractors (a speaker corrects a detail, an option is suggested then rejected). Speakers: "N" is the narrator (accent en-GB) who introduces the section, gives reading time with {"pause": 20, "label": "Look at questions 1 to 5"} items, and ends with "That is the end of section ${section}." Other speakers use accents from en-AU, en-US, en-IE, en-NZ, en-CA, en-IN, en-ZA, en-GB. In the script write numbers, dates and spellings as spoken ("two hundred and forty pounds", "K, A, R, I, M"); in answers write them normally with alternatives (["240", "£240"]). Each script line under 300 characters. Every question has an explanation quoting the speaker's words.

Group shapes:
- gap: group "title", "wordLimit":"ONE WORD AND/OR A NUMBER" (or NO MORE THAN TWO WORDS); prompt contains ____ exactly once; answer = array of accepted strings
- mcq: each question has own "options":[{"key":"A","text":"..."},{"key":"B",...},{"key":"C",...}], answer key
- matching_features: group "options":[{"key":"A","text":"..."},...] (more options than questions); prompt = item; answer key

Reply with only JSON:
{"title":"...","section":${section},"topic":"...","speakers":{"N":{"role":"Narrator","accent":"en-GB","voice":"female"},"A":{"role":"...","accent":"en-AU","voice":"male"}},"script":[{"s":"N","t":"..."},{"pause":20,"label":"..."},{"s":"A","t":"..."}],"groups":[{"type":"...","instructions":"...","title":"optional","wordLimit":"for gap","options":[...],"questions":[{"n":1,"prompt":"...","answer":"...","explanation":"..."}]}]}`;
}

/* Light structural check for AI-generated practice items before they are shown. */
function checkGenerated(item, kind) {
  const problems = [];
  if (!item || typeof item !== 'object') return ['No item returned.'];
  if (!item.title) problems.push('missing title');
  if (kind === 'reading' && (!Array.isArray(item.paragraphs) || item.paragraphs.length < 4)) problems.push('too few paragraphs');
  if (kind === 'listening' && (!Array.isArray(item.script) || item.script.length < 6)) problems.push('script missing');
  if (!Array.isArray(item.groups) || !item.groups.length) problems.push('no questions');
  let n = 0;
  (item.groups || []).forEach((g) => {
    if (!QTYPES[g.type]) problems.push(`unsupported question type ${g.type}`);
    (g.questions || []).forEach((q) => {
      n += g.type === 'mcq_multi' ? (q.count || 2) : 1;
      if (q.answer == null && !q.answers) problems.push(`question ${q.n} has no answer`);
      const keys = (q.options || g.options || []).map((o) => o.key);
      if (['mcq', 'headings', 'matching_info', 'matching_features', 'sentence_endings', 'summary_bank'].includes(g.type) && !keys.includes(q.answer)) problems.push(`question ${q.n} answer is not an option`);
    });
  });
  if (n < 8) problems.push('fewer than 8 questions');
  return problems;
}

/* ---------- text-to-speech ---------- */
const ACCENT_NAME = { 'en-GB': 'British', 'en-US': 'American', 'en-AU': 'Australian', 'en-IE': 'Irish', 'en-NZ': 'New Zealand', 'en-IN': 'Indian', 'en-ZA': 'South African', 'en-CA': 'Canadian' };
const FEMALE_RX = /female|woman|samantha|karen|moira|tessa|fiona|victoria|allison|ava|susan|serena|kate|catherine|veena|zira|hazel|libby|sonia|natasha|martha|nicky|joanna|salli|kimberly|kendra|ivy|emma|amy|olivia|aria|jenny|michelle|clara|isla|neerja|leah|molly|emily|sara|zoe|nora|heera|tina|grandma/i;
const MALE_RX = /\bmale\b|daniel|alex\b|fred|oliver|arthur|rishi|aaron|gordon|lee\b|tom\b|david|mark\b|george|ryan|william|thomas|guy|brian|matthew|justin|joey|russell|liam|connor|mitchell|prabhat|ravi|luke|noah|eric|grandpa|reed|rocko|eddy/i;

const TTS = {
  ok: typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  voices: [],
  init() {
    if (!this.ok) return;
    const load = () => { this.voices = speechSynthesis.getVoices().filter((v) => /^en([-_]|$)/i.test(v.lang)); };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch { speechSynthesis.onvoiceschanged = load; }
  },
  gender(v) { return FEMALE_RX.test(v.name) ? 'female' : MALE_RX.test(v.name) ? 'male' : null; },
  quality(v) { return (/natural|neural|premium|enhanced|online/i.test(v.name) ? 3 : 0) + (/google|microsoft|apple/i.test(v.name) ? 1 : 0) + (v.localService ? 1 : 0); },
  pick(accent, gender, avoid = []) {
    const lang = String(accent || 'en-GB').toLowerCase();
    const vl = (v) => v.lang.replace('_', '-').toLowerCase();
    let pool = this.voices.filter((v) => vl(v) === lang);
    const exact = pool.length > 0;
    if (!pool.length) pool = this.voices.filter((v) => vl(v) === 'en-gb');
    if (!pool.length) pool = this.voices;
    let c = pool.filter((v) => this.gender(v) === gender && !avoid.includes(v));
    if (!c.length) c = pool.filter((v) => !avoid.includes(v) && this.gender(v) !== (gender === 'male' ? 'female' : 'male'));
    if (!c.length) c = pool.filter((v) => !avoid.includes(v));
    if (!c.length) c = pool;
    c = [...c].sort((a, b) => this.quality(b) - this.quality(a));
    const voice = c[0] || null;
    const vg = voice ? this.gender(voice) : null;
    // Shift pitch when we could not find the right gender, so two speakers still sound different.
    const pitch = !voice ? 1 : vg === gender ? 1 : vg ? (gender === 'male' ? 0.75 : 1.25) : (gender === 'male' ? 0.88 : 1.12);
    return { voice, exact, pitch, accent };
  },
  speak(text, { accent = 'en-GB', gender = 'female', rate = 1 } = {}) {
    if (!this.ok) return Promise.resolve();
    speechSynthesis.cancel();
    const cast = this.pick(accent, gender);
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      if (cast.voice) u.voice = cast.voice;
      u.lang = cast.voice ? cast.voice.lang : accent;
      u.rate = rate; u.pitch = cast.pitch;
      u.onend = resolve; u.onerror = resolve;
      TTS._keep = u;
      speechSynthesis.speak(u);
    });
  },
  stop() { if (this.ok) speechSynthesis.cancel(); },
};

/* Plays a listening script line by line, with narrator reading-time pauses. */
class ScriptPlayer {
  constructor(section, { rate = 1, onLine, onPause, onEnd, onState } = {}) {
    this.sec = section; this.rate = rate;
    this.onLine = onLine || (() => {}); this.onPause = onPause || (() => {});
    this.onEnd = onEnd || (() => {}); this.onState = onState || (() => {});
    this.idx = 0; this.token = 0; this.state = 'idle'; this.timer = null; this.pauseLeft = 0;
    this.cast = {};
    const used = [];
    Object.entries(section.speakers || {}).forEach(([k, sp]) => {
      const c = TTS.pick(sp.accent, sp.voice, used);
      if (c.voice) used.push(c.voice);
      this.cast[k] = { ...c, role: sp.role, gender: sp.voice };
    });
  }
  castList() {
    return Object.entries(this.cast).map(([, c]) => ({
      role: c.role, accent: ACCENT_NAME[c.accent] || c.accent,
      voice: c.voice ? c.voice.name : 'device default', exact: c.exact,
    }));
  }
  play(from) {
    if (!TTS.ok) return;
    if (from != null) this.idx = from;
    this.token++;
    speechSynthesis.cancel();
    this.state = 'playing'; this.onState(this.state);
    this._step(this.token);
  }
  _step(tok) {
    if (tok !== this.token) return;
    const script = this.sec.script;
    if (this.idx >= script.length) { this.state = 'ended'; this.onState(this.state); this.onEnd(); return; }
    const item = script[this.idx];
    if (item.pause != null) {
      this.pauseLeft = this.pauseLeft > 0 ? this.pauseLeft : item.pause;
      this.onPause(this.pauseLeft, item.label || 'Reading time', this.idx);
      clearInterval(this.timer);
      this.timer = setInterval(() => {
        if (tok !== this.token) { clearInterval(this.timer); return; }
        this.pauseLeft -= 1;
        this.onPause(this.pauseLeft, item.label || 'Reading time', this.idx);
        if (this.pauseLeft <= 0) { clearInterval(this.timer); this.pauseLeft = 0; this.idx++; this._step(tok); }
      }, 1000);
      return;
    }
    const c = this.cast[item.s] || this.cast.N || TTS.pick('en-GB', 'female');
    const u = new SpeechSynthesisUtterance(item.t);
    if (c.voice) u.voice = c.voice;
    u.lang = c.voice ? c.voice.lang : (c.accent || 'en-GB');
    u.rate = this.rate; u.pitch = c.pitch || 1;
    u.onend = () => { if (tok === this.token) { this.idx++; this._step(tok); } };
    u.onerror = (e) => { if (tok !== this.token || e.error === 'interrupted' || e.error === 'canceled') return; this.idx++; this._step(tok); };
    this.current = u;
    this.onLine(item, this.idx, c);
    speechSynthesis.speak(u);
  }
  pause() {
    if (this.state !== 'playing') return;
    this.token++; clearInterval(this.timer); speechSynthesis.cancel();
    this.state = 'paused'; this.onState(this.state);
  }
  resume() { if (this.state === 'paused') this.play(); }
  stop() {
    this.token++; clearInterval(this.timer); this.pauseLeft = 0;
    if (TTS.ok) speechSynthesis.cancel();
    this.state = 'idle'; this.idx = 0; this.onState(this.state);
  }
  skipPause() { if (this.pauseLeft > 0) { this.pauseLeft = 1; } }
}

/* ---------- speech recognition (live transcript) ---------- */
const SRClass = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
const Rec = {
  supported: !!SRClass,
  blocked: false,           // set once the browser or the viewer refuses the microphone
  rec: null, active: false, finalText: '',
  start({ onText, onFail }) {
    if (!SRClass || this.blocked) { onFail && onFail('unsupported'); return false; }
    this.finalText = ''; this.active = true;
    const make = () => {
      const r = new SRClass();
      r.lang = 'en-GB'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
      r.onresult = (e) => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          if (res.isFinal) this.finalText += res[0].transcript.trim() + ' ';
          else interim += res[0].transcript;
        }
        onText(this.finalText, interim);
      };
      r.onerror = (e) => {
        if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) {
          this.blocked = true; this.active = false; onFail && onFail(e.error);
        }
      };
      r.onend = () => {
        // Chrome ends after silence; restart while the candidate is still "speaking".
        if (this.active && !this.blocked) { try { this.rec = make(); this.rec.start(); } catch { /* ignore */ } }
      };
      return r;
    };
    try { this.rec = make(); this.rec.start(); return true; } catch { this.blocked = true; this.active = false; onFail && onFail('start-failed'); return false; }
  },
  stop() { this.active = false; try { this.rec && this.rec.stop(); } catch { /* ignore */ } return this.finalText.trim(); },
};

/* ---------- Writing Task 1 charts (SVG/HTML from JSON specs) ---------- */
const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
const ON_SERIES = ['#ffffff', '#ffffff', '#13202f', '#13202f', '#13202f', '#ffffff'];

function niceStep(span, count = 5) {
  const raw = span / count;
  const mag = 10 ** Math.floor(Math.log10(raw || 1));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
const fmtNum = (v) => (v == null ? '–' : Number.isInteger(v) ? String(v) : String(+v.toFixed(2)));
function wrapLabel(text, maxChars) {
  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  words.forEach((w) => { if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if (cur) lines.push(cur);
  return lines.slice(0, 3);
}
function legendHtml(series, kind) {
  if (series.length < 2) return '';
  return `<div class="legend">${series.map((s, i) => `<span><i class="${kind === 'line' ? 'line' : ''}" style="background:${SERIES[i]}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function dataTableHtml(headers, rows) {
  return `<details><summary class="small">Show the data as a table</summary><div class="table-wrap"><table class="data-table"><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}

function axisFrame({ W, H, m, yMin, yMax, unit, yLabel }) {
  const step = niceStep(yMax - yMin, 5);
  const top = Math.ceil(yMax / step - 1e-9) * step;
  const y = (v) => m.t + (H - m.t - m.b) * (1 - (v - yMin) / (top - yMin));
  let g = '';
  for (let v = yMin; v <= top + 1e-9; v += step) {
    const yy = y(v).toFixed(1);
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${m.l - 8}" y="${yy}" text-anchor="end" dominant-baseline="middle" font-size="12">${fmtNum(+v.toFixed(4))}${unit === '%' ? '%' : ''}</text>`;
  }
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(yMin)}" y2="${y(yMin)}" stroke="var(--axis)" stroke-width="1"/>`;
  if (yLabel) g += `<text x="4" y="12" font-size="12" class="axis-label">${esc(yLabel)}</text>`;
  return { g, y, top };
}

const compactChart = () => typeof window !== 'undefined' && window.innerWidth < 640;
function lineChart(c) {
  const cp = compactChart();
  const W = cp ? 360 : 640, H = cp ? 280 : 360, m = { l: cp ? 44 : 56, r: cp ? 12 : 20, t: 28, b: 36 };
  const yMin = c.yMin ?? 0;
  const { g, y } = axisFrame({ W, H, m, yMin, yMax: c.yMax, unit: c.unit, yLabel: c.yLabel });
  const n = c.xLabels.length;
  const x = (i) => m.l + (W - m.l - m.r) * (n === 1 ? 0.5 : i / (n - 1));
  let s = g;
  const maxLabels = cp ? 5 : 8;
  const every = n > maxLabels + 1 ? Math.ceil(n / maxLabels) : 1;
  c.xLabels.forEach((lab, i) => { if (i % every === 0 || i === n - 1) s += `<text x="${x(i)}" y="${H - m.b + 20}" text-anchor="middle" font-size="12">${esc(lab)}</text>`; });
  c.series.forEach((ser, si) => {
    let d = ''; let pen = false;
    ser.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `; pen = true; });
    s += `<path d="${d}" fill="none" stroke="${SERIES[si]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    ser.values.forEach((v, i) => { if (v != null) s += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${SERIES[si]}" stroke="var(--sheet)" stroke-width="2"><title>${esc(ser.name)}, ${esc(c.xLabels[i])}: ${fmtNum(v)}${c.unit === '%' ? '%' : ''}</title></circle>`; });
  });
  const rows = c.xLabels.map((lab, i) => [lab, ...c.series.map((ser) => fmtNum(ser.values[i]) + (c.unit === '%' && ser.values[i] != null ? '%' : ''))]);
  return `<div class="chart">${c.title ? `<div class="chart-title">${esc(c.title)}</div>` : ''}${legendHtml(c.series, 'line')}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title || 'Line graph')}">${s}</svg>${dataTableHtml(['', ...c.series.map((x2) => x2.name)], rows)}</div>`;
}

function barPath(x, y, w, h, r = 4) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}
function barChart(c) {
  const cp = compactChart();
  const W = cp ? 360 : 640, H = cp ? 320 : 380, m = { l: cp ? 44 : 56, r: cp ? 8 : 16, t: 28, b: 64 };
  const { g, y } = axisFrame({ W, H, m, yMin: 0, yMax: c.yMax, unit: c.unit, yLabel: c.yLabel });
  const n = c.categories.length, k = c.series.length;
  const band = (W - m.l - m.r) / n;
  const bw = Math.min(cp ? 16 : 24, (band * 0.76 - (k - 1) * 2) / k);
  const gw = bw * k + (k - 1) * 2;
  let s = g;
  c.categories.forEach((cat, ci) => {
    const x0 = m.l + band * ci + (band - gw) / 2;
    c.series.forEach((ser, si) => {
      const v = ser.values[ci]; if (v == null) return;
      const top = y(v), base = y(0);
      s += `<path d="${barPath(x0 + si * (bw + 2), top, bw, base - top)}" fill="${SERIES[si]}"><title>${esc(cat)}, ${esc(ser.name)}: ${fmtNum(v)}${c.unit === '%' ? '%' : ''}</title></path>`;
    });
    wrapLabel(cat, Math.max(6, Math.floor(band / (cp ? 6 : 7)))).forEach((line, li) => {
      s += `<text x="${m.l + band * ci + band / 2}" y="${H - m.b + 18 + li * 13}" text-anchor="middle" font-size="${cp ? 10.5 : 12}">${esc(line)}</text>`;
    });
  });
  const rows = c.categories.map((cat, i) => [cat, ...c.series.map((ser) => fmtNum(ser.values[i]) + (c.unit === '%' && ser.values[i] != null ? '%' : ''))]);
  return `<div class="chart">${c.title ? `<div class="chart-title">${esc(c.title)}</div>` : ''}${legendHtml(c.series, 'bar')}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title || 'Bar chart')}">${s}</svg>${dataTableHtml(['', ...c.series.map((x2) => x2.name)], rows)}</div>`;
}

function pieChart(c) {
  const one = (p) => {
    const R = 90, C = 100; let a0 = -Math.PI / 2; let s = '';
    const total = sum(p.slices.map((x) => x.value)) || 100;
    p.slices.forEach((sl, i) => {
      const a1 = a0 + (sl.value / total) * Math.PI * 2;
      const large = a1 - a0 > Math.PI ? 1 : 0;
      const p0 = [C + R * Math.cos(a0), C + R * Math.sin(a0)], p1 = [C + R * Math.cos(a1), C + R * Math.sin(a1)];
      s += `<path d="M${C},${C} L${p0[0].toFixed(2)},${p0[1].toFixed(2)} A${R},${R} 0 ${large} 1 ${p1[0].toFixed(2)},${p1[1].toFixed(2)} Z" fill="${SERIES[i % 6]}" stroke="var(--sheet)" stroke-width="2"><title>${esc(sl.label)}: ${fmtNum(sl.value)}%</title></path>`;
      if (sl.value >= 7) {
        const mid = (a0 + a1) / 2;
        s += `<text x="${(C + R * 0.62 * Math.cos(mid)).toFixed(1)}" y="${(C + R * 0.62 * Math.sin(mid)).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" style="fill:${ON_SERIES[i % 6]}">${fmtNum(sl.value)}%</text>`;
      }
      a0 = a1;
    });
    return `<div class="pie-one"><div class="chart-title">${esc(p.title || '')}</div><svg viewBox="0 0 200 200" style="max-width:220px" role="img" aria-label="${esc(p.title || 'Pie chart')}">${s}</svg>
      <div class="pie-legend">${p.slices.map((sl, i) => `<span><i style="background:${SERIES[i % 6]}"></i>${esc(sl.label)}<b class="mono">${fmtNum(sl.value)}%</b></span>`).join('')}</div></div>`;
  };
  return `<div class="chart">${c.title ? `<div class="chart-title">${esc(c.title)}</div>` : ''}<div class="pies">${c.pies.map(one).join('')}</div></div>`;
}

function tableChart(c) {
  return `<div class="chart">${c.title ? `<div class="chart-title">${esc(c.title)}</div>` : ''}<div class="table-wrap"><table class="data-table"><thead><tr>${c.columns.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.rows.map((r) => `<tr>${r.map((v, i) => (i === 0 ? `<th>${esc(v)}</th>` : `<td>${esc(v)}</td>`)).join('')}</tr>`).join('')}</tbody></table></div>${c.note ? `<div class="xs faint">${esc(c.note)}</div>` : ''}</div>`;
}

function processChart(c) {
  const steps = c.steps.map((st, i) => `<div class="p-step"><b>Stage ${i + 1}</b><span><strong>${esc(st.label)}</strong></span>${st.detail ? `<span class="faint">${esc(st.detail)}</span>` : ''}</div>`);
  return `<div class="chart">${c.title ? `<div class="chart-title">${esc(c.title)}</div>` : ''}<div class="process">${steps.join('<span class="p-arrow" aria-hidden="true">→</span>')}${c.cyclic ? '<span class="p-arrow" title="returns to stage 1">↻ back to stage 1</span>' : ''}</div></div>`;
}

function mapChart(c) {
  const one = (mp) => {
    let s = '<rect class="frame" x="0" y="0" width="100" height="100" rx="1"/>';
    const order = { road: 0, path: 1, water: 2, green: 3, sports: 4, parking: 5, building: 6 };
    const feats = [...mp.features].sort((a, b) => (order[a.kind] ?? 9) - (order[b.kind] ?? 9));
    feats.forEach((f) => { s += `<rect class="${esc(f.kind)}" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="${f.kind === 'building' ? 0.6 : 0.3}"><title>${esc(f.label)}</title></rect>`; });
    feats.forEach((f) => {
      if (!f.label) return;
      const vertical = (f.kind === 'road' || f.kind === 'path') && f.h > f.w * 2;
      const fs = 3.2;
      const width = vertical ? f.h : f.w;
      const lines = wrapLabel(f.label, Math.max(4, Math.floor(width / (fs * 0.55))));
      const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
      const tspans = lines.map((ln, i) => `<tspan x="${vertical ? 0 : cx}" dy="${i === 0 ? -(lines.length - 1) * fs * 0.55 : fs * 1.1}">${esc(ln)}</tspan>`).join('');
      s += vertical
        ? `<text transform="translate(${cx} ${cy}) rotate(-90)" text-anchor="middle" dominant-baseline="middle" font-size="${fs}">${tspans}</text>`
        : `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}">${tspans}</text>`;
    });

  };
  return `<div class="chart">${c.title ? `<div class="chart-title">${esc(c.title)}</div>` : ''}<div class="maps">${c.maps.map(one).join('')}</div></div>`;
}

function renderChart(c) {
